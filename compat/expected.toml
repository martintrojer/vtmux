# Expected regress outcome per test (cargo xtask regress).
#   status = "pass"  must pass; a failure fails the run
#   status = "xfail" must fail; a pass fails the run until flipped (--update)
#   status = "skip"  not run
# xfail and skip need a reason (link optional). flaky = true: may pass or fail
# without failing the run; reported separately. Adding an xfail or skip is a
