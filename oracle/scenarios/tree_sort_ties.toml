# choose-tree sort ties and the -s / -f views over three sessions created
# in one second, out of name order: -O creation sorts sessions by creation
# time (microseconds in tmux, sort_session_cmp), not by whole seconds with
# the name tie-break; list-sessions -O creation likewise. Windows with one
# name and panes with one title keep index order on ties, -r or not.
name = "tree_sort_ties"
size = [60, 20]
steps = [
  { run = ["new", "-d", "-s", "ccc", "-n", "same", "-x", "60", "-y", "19", "cat -"] },
  { run = ["set", "-g", "status-right", "R"] },
  { run = ["set", "-g", "automatic-rename", "off"] },
  { run = ["neww", "-d", "-t", "ccc:3", "-n", "same", "cat -"] },
  { run = ["neww", "-d", "-t", "ccc:1", "-n", "same", "cat -"] },
  { run = ["splitw", "-d", "-t", "ccc:1", "cat -"] },
  { run = ["splitw", "-d", "-t", "ccc:1", "cat -"] },
  { run = ["new", "-d", "-s", "aaa", "-n", "zz", "-x", "60", "-y", "19", "cat -"] },
  { run = ["neww", "-d", "-t", "aaa:1", "-n", "zz", "cat -"] },
  { run = ["new", "-d", "-s", "bbb", "-n", "mm", "-x", "60", "-y", "19", "cat -"] },
  { run = ["select-pane", "-t", "%0", "-T", "t"] },
  { run = ["select-pane", "-t", "%1", "-T", "t"] },
  { run = ["select-pane", "-t", "%2", "-T", "t"] },
  { run = ["select-pane", "-t", "%3", "-T", "t"] },
  { run = ["select-pane", "-t", "%4", "-T", "t"] },
  { run = ["select-pane", "-t", "%5", "-T", "t"] },
  { run = ["select-pane", "-t", "%6", "-T", "t"] },
  { run = ["select-pane", "-t", "%7", "-T", "u"] },
  { run = ["ls", "-O", "creation", "-F", "#{session_name}"] },
  { run = ["ls", "-O", "creation", "-r", "-F", "#{session_name}"] },
  { attach = { session = "bbb" } },
  { screen = {} },
  { run = ["choose-tree", "-t", "bbb:0.0", "-N", "-F", "#{window_name}#{pane_id}"] },
  { settle = { react = true } },
  { screen = {} },
  { keys = "q" },
  { settle = { react = true } },
  { run = ["choose-tree", "-t", "bbb:0.0", "-N", "-O", "name", "-F", "#{window_name}#{pane_id}"] },
  { settle = { react = true } },
  { screen = {} },
  { keys = "q" },
  { settle = { react = true } },
  { run = ["choose-tree", "-t", "bbb:0.0", "-N", "-O", "name", "-r", "-F", "#{window_name}#{pane_id}"] },
  { settle = { react = true } },
  { screen = {} },
  { keys = "q" },
  { settle = { react = true } },
  { run = ["choose-tree", "-t", "bbb:0.0", "-N", "-O", "size", "-F", "#{window_name}#{pane_id}"] },
  { settle = { react = true } },
  { screen = {} },
  { keys = "q" },
  { settle = { react = true } },
  { run = ["choose-tree", "-t", "bbb:0.0", "-N", "-O", "activity", "-F", "#{window_name}#{pane_id}"] },
  { settle = { react = true } },
  { screen = {} },
  { keys = "q" },
  { settle = { react = true } },
  { run = ["choose-tree", "-t", "bbb:0.0", "-N", "-O", "creation", "-r", "-F", "#{window_name}#{pane_id}"] },
  { settle = { react = true } },
  { screen = {} },
  { keys = "q" },
  { settle = { react = true } },
  { run = ["choose-tree", "-t", "bbb:0.0", "-N", "-O", "z", "-r", "-F", "#{window_name}#{pane_id}"] },
  { settle = { react = true } },
  { screen = {} },
  { keys = "q" },
  { settle = { react = true } },
  { run = ["choose-tree", "-t", "bbb:0.0", "-Ns", "-O", "name", "-r"] },
  { settle = { react = true } },
  { screen = {} },
  { keys = "OOOO" },
  { screen = {} },
  { keys = "q" },
  { settle = { react = true } },
  { run = ["choose-tree", "-t", "bbb:0.0", "-Ns", "-f", "#{==:#{pane_title},t}"] },
  { settle = { react = true } },
  { screen = {} },
  { keys = "jjl" },
  { screen = {} },
  { keys = "q" },
  { settle = { react = true } },
  { run = ["choose-tree", "-t", "bbb:0.0", "-Nw", "-f", "#{==:#{window_name},same}", "-O", "name"] },
  { settle = { react = true } },
  { screen = {} },
  { keys = "q" },
  { settle = { react = true } },
  { run = ["choose-tree", "-t", "bbb:0.0", "-Ns", "-f", "#{==:#{session_name},nope}"] },
  { settle = { react = true } },
  { screen = {} },
  { keys = "q" },
  { settle = { react = true } },
]
