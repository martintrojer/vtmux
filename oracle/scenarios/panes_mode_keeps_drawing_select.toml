name = "panes_mode_keeps_drawing_select"
size = [60, 20]
steps = [
  { run = ["new", "-d", "-s", "a", "-n", "w", "-x", "60", "-y", "19", "cat"] },
  { run = ["set", "-g", "status-right", ""] },
  { run = ["splitw", "-h", "-t", "a", "cat"] },
  { attach = { session = "a" } },
  { run = ["display-panes", "-d", "0", "-t", "%0"] },
  { settle = { react = true } },
  { run = ["select-pane", "-t", "%1"] },
  { settle = { react = true } },
  { screen = {} },
  { run = ["display", "-p", "-t", "a", "#{pane_id} #{pane_mode} #{window_zoomed_flag}"] },
  { run = ["display", "-p", "-t", "%1", "#{pane_id} #{pane_mode} #{window_zoomed_flag}"] },
  { run = ["kill-pane", "-t", "%0"] },
  { settle = { react = true } },
  { screen = {} },
  { run = ["display", "-p", "-t", "a", "#{pane_id} #{pane_mode} #{window_zoomed_flag}"] },
  { run = ["display-panes", "-d", "0", "-t", "%1"] },
  { settle = { react = true } },
  { screen = {} },
  { keys = "0" },
  { settle = { react = true } },
  { screen = {} },
  { run = ["display", "-p", "-t", "a", "#{pane_id} #{pane_mode} #{window_zoomed_flag}"] },
]
