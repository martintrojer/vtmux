# Session groups (session.c session_group_*, cmd-new-session.c:143-160, 313-327): new-session -t a session (the group takes its name), a member (joins its group) or a name no session has (a group of one, even an invalid session name); generated names after the group's name; -t with a command or window name refused; the group formats; kill-session of one member leaves the rest grouped, the last member keeps a group of one; kill-session -g takes the whole group; the hooks in the order tmux fires them.
name = "group_new_session"
steps = [
  { run = ["new", "-d", "-s", "a", "-n", "w0", "-x", "80", "-y", "24", "cat"] },
  { run = ["neww", "-d", "-t", "a:1", "-n", "w1", "cat"] },
  { run = ["set", "-g", "@log", ""] },
  { run = ["set", "-g", "automatic-rename", "off"] },
  { run = ["set-hook", "-g", "session-added-to-group", "set -gaF @log '[add #{hook_session_name} #{hook_group} #{hook_group_size}]'"] },
  { run = ["set-hook", "-g", "session-removed-from-group", "set -gaF @log '[rm #{hook_session_name} #{hook_group} #{hook_group_size}]'"] },
  { run = ["set-hook", "-g", "window-linked", "set -gaF @log '[lnk #{hook_session_name}:#{hook_window_index} #{hook_window}]'"] },
  { run = ["set-hook", "-g", "window-unlinked", "set -gaF @log '[unl #{hook_session_name}:#{hook_window_index} #{hook_window}]'"] },
  { run = ["set-hook", "-g", "session-created", "set -gaF @log '[sc #{hook_session_name}]'"] },
  { run = ["set-hook", "-g", "session-closed", "set -gaF @log '[cl #{hook_session_name}]'"] },
  { run = ["new", "-d", "-t", "a", "-x", "80", "-y", "24"] },
  { run = ["new", "-d", "-t", "a-1", "-s", "b"] },
  { run = ["new", "-d", "-t", "a", "-s", "c", "cat"] },
  { run = ["new", "-d", "-t", "a", "-s", "c", "-n", "x"] },
  { run = ["new", "-d", "-t", "a", "-s", "b"] },
  { run = ["show", "-gv", "@log"] },
  { run = ["set", "-g", "@log", ""] },
  { run = ["ls"] },
  { run = ["ls", "-F", "#{session_name} g=#{session_grouped} n=#{session_group} sz=#{session_group_size} l=#{session_group_list} at=#{session_group_attached} ma=#{session_group_many_attached} al=#{session_group_attached_list} w=#{session_windows} cur=#{window_index}"] },
  { run = ["lsw", "-a", "-F", "#{session_name}:#{window_index} #{window_id} #{window_name} [#{window_flags}] linked=#{window_linked} n=#{window_linked_sessions} list=#{window_linked_sessions_list}"] },
  { run = ["display", "-p", "-t", "b", "#{session_name} #{session_grouped} #{session_group} #{last_window_index}"] },
  { run = ["new", "-d", "-t", "nosuch", "-s", "n1"] },
  { run = ["new", "-d", "-t", "nosuch"] },
  { run = ["new", "-d", "-t", "bad:name", "-s", "n2"] },
  { run = ["new", "-d", "-t", "n1", "-s", "n3"] },
  { run = ["ls", "-F", "#{session_name} g=#{session_grouped} n=#{session_group} sz=#{session_group_size} l=#{session_group_list} at=#{session_group_attached} ma=#{session_group_many_attached} al=#{session_group_attached_list} w=#{session_windows} cur=#{window_index}"] },
  { run = ["kill-session", "-t", "a"] },
  { run = ["show", "-gv", "@log"] },
  { run = ["set", "-g", "@log", ""] },
  { run = ["ls", "-F", "#{session_name} g=#{session_grouped} n=#{session_group} sz=#{session_group_size} l=#{session_group_list} at=#{session_group_attached} ma=#{session_group_many_attached} al=#{session_group_attached_list} w=#{session_windows} cur=#{window_index}"] },
  { run = ["lsw", "-a", "-F", "#{session_name}:#{window_index} #{window_id} #{window_name} [#{window_flags}] linked=#{window_linked} n=#{window_linked_sessions} list=#{window_linked_sessions_list}"] },
  { run = ["kill-session", "-t", "b"] },
  { run = ["ls", "-F", "#{session_name} g=#{session_grouped} n=#{session_group} sz=#{session_group_size} l=#{session_group_list} at=#{session_group_attached} ma=#{session_group_many_attached} al=#{session_group_attached_list} w=#{session_windows} cur=#{window_index}"] },
  { run = ["new", "-d", "-t", "a-1", "-s", "d"] },
  { run = ["kill-session", "-g", "-t", "d"] },
  { run = ["show", "-gv", "@log"] },
  { run = ["ls", "-F", "#{session_name} g=#{session_grouped} n=#{session_group} sz=#{session_group_size} l=#{session_group_list} at=#{session_group_attached} ma=#{session_group_many_attached} al=#{session_group_attached_list} w=#{session_windows} cur=#{window_index}"] },
  { run = ["kill-session", "-g", "-t", "n2"] },
  { run = ["ls", "-F", "#{session_name} g=#{session_grouped} n=#{session_group} sz=#{session_group_size} l=#{session_group_list} at=#{session_group_attached} ma=#{session_group_many_attached} al=#{session_group_attached_list} w=#{session_windows} cur=#{window_index}"] },
  { run = ["kill-server"] },
]
