# choose-tree flags: -s and -w start on sessions or windows collapsed, -O name -r, -K and -F, -f with a filter that matches a pane and with one that matches nothing, -h, -Z zooming and unzooming, -k killing the pane on exit, -O with an unknown order.
name = "tree_flags"
size = [60, 16]
steps = [
  { run = ["new", "-d", "-s", "aaa", "-n", "w0", "-x", "60", "-y", "15", "cat"] },
  { run = ["set", "-g", "status-right", "R"] },
  { run = ["neww", "-d", "-t", "aaa:1", "-n", "w1", "cat"] },
  { run = ["splitw", "-d", "-t", "aaa:1", "cat"] },
  { run = ["new", "-d", "-s", "bbb", "-n", "x0", "-x", "60", "-y", "15", "cat"] },
  { run = ["neww", "-d", "-t", "bbb:1", "-n", "x1", "cat"] },
  { run = ["new", "-d", "-s", "ccc", "-n", "y0", "-x", "60", "-y", "15", "cat"] },
  { run = ["select-pane", "-t", "%0", "-T", "t0"] },
  { run = ["select-pane", "-t", "%1", "-T", "t1"] },
  { run = ["select-pane", "-t", "%2", "-T", "t2"] },
  { run = ["select-pane", "-t", "%3", "-T", "t3"] },
  { run = ["select-pane", "-t", "%4", "-T", "t4"] },
  { run = ["select-pane", "-t", "%5", "-T", "t5"] },
  { attach = { session = "aaa" } },
  { screen = {} },
  { run = ["choose-tree", "-t", "aaa:0.0", "-Ns"] },
  { settle = { react = true } },
  { screen = {} },
  { keys = "q" },
  { settle = { react = true } },
  { run = ["choose-tree", "-t", "aaa:0.0", "-Nw", "-O", "name", "-r"] },
  { settle = { react = true } },
  { screen = {} },
  { keys = "q" },
  { settle = { react = true } },
  { run = ["choose-tree", "-t", "aaa:0.0", "-N", "-K", "#{?#{e|<:#{line},3},#{a:#{e|+:120,#{line}}},}", "-F", "#{session_name}/#{window_name}/#{pane_title}"] },
  { settle = { react = true } },
  { screen = {} },
  { keys = "q" },
  { settle = { react = true } },
  { run = ["choose-tree", "-t", "aaa:0.0", "-N", "-f", "#{==:#{pane_title},t2}"] },
  { settle = { react = true } },
  { screen = {} },
  { keys = "q" },
  { settle = { react = true } },
  { run = ["choose-tree", "-t", "aaa:0.0", "-N", "-f", "#{==:#{pane_title},none}"] },
  { settle = { react = true } },
  { screen = {} },
  { keys = "q" },
  { settle = { react = true } },
  { run = ["choose-tree", "-t", "aaa:0.0", "-N", "-h", "-f", "#{==:#{pane_title},t0}"] },
  { settle = { react = true } },
  { screen = {} },
  { keys = "q" },
  { settle = { react = true } },
  { run = ["choose-tree", "-t", "aaa:0.0", "-N", "-O", "bogus"] },
  { run = ["splitw", "-d", "-t", "aaa:0", "cat"] },
  { run = ["choose-tree", "-t", "aaa:0.0", "-NZ"] },
  { settle = { react = true } },
  { run = ["display", "-p", "#{window_zoomed_flag}"] },
  { screen = {} },
  { keys = "q" },
  { settle = { react = true } },
  { run = ["display", "-p", "#{window_zoomed_flag}"] },
  { run = ["choose-tree", "-Nk", "-t", "aaa:0.1"] },
  { settle = { react = true } },
  { run = ["display", "-p", "-t", "aaa:0.1", "#{pane_mode}"] },
  { run = ["send-keys", "-t", "aaa:0.1", "q"] },
  { settle = { react = true } },
  { run = ["list-panes", "-t", "aaa:0", "-F", "#{pane_id}"] },
  { screen = {} },
]
