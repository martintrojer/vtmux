name = "options_formats"
steps = [
  { run = ["new", "-d", "-s", "a", "cat"] },
  { run = ["set", "-g", "@x", "value"] },
  { run = ["set", "-g", "@fmt", "#{@x}:#S"] },
  { run = ["display", "-p", "#{@x}|#{E:@fmt}|#{status-left}"] },
  { run = ["set", "-gF", "@out", "#{E:@fmt}|#{history-limit}|#{mouse}"] },
  { run = ["show", "-gv", "@out"] },
  { run = ["set", "-gF", "status-left", "#{@x} x"] },
  { run = ["display", "-p", "#{status-left}"] },
  { run = ["show", "-g", "-F", "#{option_name}:#{option_value}:#{option_is_string}", "status-left"] },
  { run = ["set", "-g", "@x", "updated"] },
  { run = ["display", "-p", "#{E:@fmt}"] },
  { run = ["set", "-g", "@#{@x}", "formatted name"] },
  { run = ["show", "-gv", "@updated"] },
  { run = ["show", "-A", "-F", "#{option_name}:#{option_is_parent}:#{option_value}", "status"] },
  { run = ["show", "-g", "-F", "#{option_name}:#{option_is_hook}:#{option_has_value}", "after-select-pane"] },
]
