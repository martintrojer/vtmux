name = "alt_screen_history_clears"
size = [80, 24]
# ED3, clear-history and RIS under the alternate screen, with resizes before
# it ends: ED3 and clear-history clear the primary history (input.c, the grid
# the screens share; grid_clear_history), RIS (screen_write_reset) keeps the
# alternate screen, and the primary comes back resized once from its old size
# (screen.c screen_alternate_off). capa: capture-pane -a reads the saved screen
# as wide as the pane is now (cmd-capture-pane.c, grid_string_cells with the
# pane's sx).
steps = [
  { run = ["new", "-d", "-s", "init", "-n", "w", "-x", "80", "-y", "8", "cat", "-"] },
  { run = ["set", "-g", "status", "off"] },
  { run = ["new", "-d", "-s", "ed3", "-n", "w", "-x", "80", "-y", "10", "sh", "-c", "i=10; while [ $i -lt 40 ]; do printf '%sxxxxxxxxxx\\015\\012' $i; i=$((i+1)); done; printf '\\033[?1049h\\033[Hvim\\033[3J'; tmux wait-for -S ed3-p0; tmux wait-for ed3-go1; printf '\\033[?1049l'; tmux wait-for -S ed3-p1; exec cat -"] },
  { wait_for = "ed3-p0" },
  { run = ["display", "-p", "-t", "ed3:", "#{history_size} #{cursor_x},#{cursor_y} #{alternate_on}"] },
  { run = ["capture-pane", "-p", "-S", "-", "-t", "ed3:"] },
  { run = ["wait-for", "-S", "ed3-go1"] },
