# previous-prompt/next-prompt [-o] (window_copy_cursor_prompt) over the
# lines OSC 133 marked (input_osc_133: A/N/P without k=s start a prompt,
# C starts output): a shell like the owner's zsh (133;A in PROMPT, 133;C
# at preexec, an empty command, a continuation line) and the full
# A/B/C/D form with a C on the prompt's own line. Last, the owner's
# M-Up/M-Down bindings typed on an attached client.
name = "copy_search_prompts"
size = [40, 10]
steps = [
  { run = ["new", "-d", "-s", "a", "-n", "w", "-x", "40", "-y", "9", "sh", "-c", "a() { printf '\\033]133;A\\007~ > '; }; printf 'motd\\n'; a; printf 'echo hi\\n\\033]133;C\\007hi\\n'; a; printf 'true\\n\\033]133;C\\007'; a; printf 'long\\n\\033]133;C\\007l1\\nl2\\n'; a; printf 'multi \\\\\\n> cont\\n\\033]133;C\\007m\\n'; a; tmux wait-for -S ready; exec cat"] },
  { wait_for = "ready" },
  { run = ["select-pane", "-t", "%0", "-T", "t"] },
  { run = ["copy-mode", "-t", "a"] },
  { run = ["send-keys", "-t", "a", "-X", "history-top"] },
  { run = ["send-keys", "-t", "a", "-X", "next-prompt"] },
  { run = ["display", "-p", "-t", "a", "[#{copy_cursor_x},#{copy_cursor_y}] [#{scroll_position}] [#{copy_cursor_line}]"] },
  { run = ["send-keys", "-t", "a", "-X", "next-prompt"] },
  { run = ["display", "-p", "-t", "a", "[#{copy_cursor_x},#{copy_cursor_y}] [#{scroll_position}] [#{copy_cursor_line}]"] },
