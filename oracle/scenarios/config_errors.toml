name = "config_errors"
size = [60, 8]
# Errors in config files, with the file and line (cmd-parse.y, cfg.c
# load_cfg, cmd-queue.c cmdq_error): a run of bad lines, each reported after
# the ones before it ran; the parse errors that stop a whole file (an
# unterminated quote, %if without %endif, a stray %endif, an open brace, a
# stray brace), which run nothing; several files in one source-file, a
# missing file, -q, -n and -v. After the config has finished (cfg_finished)
# the errors go to show-messages as `message: file:line: text`. A startup
# config's errors reach a control client as `%config-error` lines
# (cfg_show_causes); for an attached terminal client they go to view mode
# (D-009, not done for config causes), so no scenario attaches one. Line numbers count
# lines of the file, also after a %if.
steps = [
  { run = ["new", "-d", "-s", "a", "-n", "w", "cat"] },
  { run = ["set-buffer", "-b", "b-bad.conf", "set -g @one 1\nset -g nosuchopt 1\nset -g @two 2\nset -g status-interval notanumber\nbind -n nosuchkey x\nbind-key -T nosuchtab y display\nset -g @three 3\nif-shell 'true' 'set -g nosuchopt2 x'\nrun-shell 'exit 3'\n%if \"1\"\nset -g @four 4\ndisplay-message -p \"ok-after\"\n%endif\nset-hook -g nosuchhook 'display -p x'\nswitch-client -t nosuchsession\nset -g @five 5\n"] },
  { run = ["save-buffer", "-b", "b-bad.conf", "bad.conf"] },
  { run = ["set-buffer", "-b", "b-parse.conf", "set -g @p1 1\nnosuchcmd arg\nset -g @p2 2\n"] },
  { run = ["save-buffer", "-b", "b-parse.conf", "parse.conf"] },
  { run = ["set-buffer", "-b", "b-parse0.conf", "set -g @r1 1\nbind -n F8\nset -g @r2 2\n"] },
  { run = ["save-buffer", "-b", "b-parse0.conf", "parse0.conf"] },
  { run = ["set-buffer", "-b", "b-parse2.conf", "set -g @q1 1\n%if 1\nset -g @q2 2\nset -g @five \"unterminated\n"] },
  { run = ["save-buffer", "-b", "b-parse2.conf", "parse2.conf"] },
  { run = ["set-buffer", "-b", "b-syn.conf", "set -g @s1 1\nset -g @s2 'abc\nset -g @s3 3\n"] },
  { run = ["save-buffer", "-b", "b-syn.conf", "syn.conf"] },
  { run = ["set-buffer", "-b", "b-syn2.conf", "set -g @t1 1\n%if 1\nset -g @t2 2\n"] },
  { run = ["save-buffer", "-b", "b-syn2.conf", "syn2.conf"] },
  { run = ["set-buffer", "-b", "b-syn3.conf", "set -g @u1 1\n%endif\nset -g @u2 2\n"] },
  { run = ["save-buffer", "-b", "b-syn3.conf", "syn3.conf"] },
  { run = ["set-buffer", "-b", "b-syn4.conf", "set -g @v1 1\nbind -n F8 { display -p a\nset -g @v2 2\n"] },
  { run = ["save-buffer", "-b", "b-syn4.conf", "syn4.conf"] },
  { run = ["set-buffer", "-b", "b-syn5.conf", "set -g @w1 1\ndisplay -p \"x\" }\n"] },
  { run = ["save-buffer", "-b", "b-syn5.conf", "syn5.conf"] },
  { run = ["set-buffer", "-b", "b-ok.conf", "set -g @ok1 1\nset -g @ok2 2\n"] },
  { run = ["save-buffer", "-b", "b-ok.conf", "ok.conf"] },
  { run = ["source-file", "bad.conf"] },
  { run = ["show", "-g", "@one"] },
  { run = ["show", "-g", "@two"] },
  { run = ["show", "-g", "@three"] },
  { run = ["show", "-g", "@four"] },
  { run = ["show", "-g", "@five"] },
  { run = ["source-file", "-n", "bad.conf"] },
  { run = ["source-file", "-nv", "bad.conf"] },
  { run = ["source-file", "-v", "bad.conf"] },
  { run = ["source-file", "parse.conf"] },
  { run = ["show", "-g", "@p1"] },
  { run = ["source-file", "parse0.conf"] },
  { run = ["show", "-g", "@r1"] },
  { run = ["source-file", "parse2.conf"] },
  { run = ["show", "-g", "@q1"] },
  { run = ["source-file", "syn.conf"] },
  { run = ["show", "-g", "@s1"] },
  { run = ["source-file", "syn2.conf"] },
  { run = ["show", "-g", "@t1"] },
  { run = ["source-file", "syn3.conf"] },
  { run = ["show", "-g", "@u1"] },
  { run = ["source-file", "syn4.conf"] },
  { run = ["show", "-g", "@v1"] },
  { run = ["source-file", "syn5.conf"] },
  { run = ["show", "-g", "@w1"] },
  { run = ["source-file", "ok.conf", "bad.conf", "nosuch.conf", "parse.conf"] },
  { run = ["source-file", "nosuch.conf"] },
  { run = ["source-file", "-q", "nosuch.conf"] },
  { run = ["source-file", "*.conf"] },
  { run = ["source-file", "-q", "nosuch*.conf"] },
  { run = ["source-file", "."] },
  { run = ["source-file"] },
  { run = ["source-file", "-F", "#{d:current_file}x"] },
  { run = ["run-shell", "tmux show-messages | sed -e 's/^[^ ]* //' -e 's/client-[0-9]* //' | grep -v 'show-messages' | grep -v '^command: \\(set-buffer\\|save-buffer\\|run-shell\\)'"] },
  { run = ["kill-server"] },
  { run = ["new", "-d", "-s", "boot", ";", "set-buffer", "-b", "c", "set -g @one 1\nset -g nosuchopt 1\nset -g @two 2\nset -g status-interval notanumber\nbind -n nosuchkey x\nbind-key -T nosuchtab y display\nset -g @three 3\nif-shell 'true' 'set -g nosuchopt2 x'\nrun-shell 'exit 3'\n%if \"1\"\nset -g @four 4\ndisplay-message -p \"ok-after\"\n%endif\nset-hook -g nosuchhook 'display -p x'\nswitch-client -t nosuchsession\nset -g @five 5\n"] },
  { run = ["save-buffer", "-b", "c", "start-bad.conf"] },
  { run = ["set-buffer", "-b", "c", "set -g @p1 1\nnosuchcmd arg\nset -g @p2 2\n"] },
  { run = ["save-buffer", "-b", "c", "start-parse.conf"] },
  { run = ["kill-server"] },
  { control = { argv = ["-f", "start-bad.conf", "new", "-s", "a", "-n", "w", "cat"], id = "c1" } },
  { control_send = { id = "c1", line = "display-message -p ready" } },
  { control_wait = { id = "c1", until = "ready" } },
  { control_send = { id = "c1", line = "show-options -g @one" } },
  { control_wait = { id = "c1", until = "%end" } },
  { control_close = { id = "c1" } },
  { run = ["has", "-t", "a"] },
]
