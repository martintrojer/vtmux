# Every search kind (window_copy_cmd_search_*): regex and text, both
# directions, again/reverse, incremental, an invalid regex dropping the
# marks, wrap-search off and on, -F, the pane's last search carried into
# the next copy mode, wide characters and a match across a wrapped line,
# with emacs then vi keys.
name = "copy_search_kinds"
size = [40, 10]
steps = [
  { run = ["new", "-d", "-s", "a", "-n", "w", "-x", "40", "-y", "9", "sh", "-c", "printf 'alpha\\nbeta\\ngamma\\ndelta\\nAlpha gamma\\n日本語 x 日本\\n'; i=0; while [ $i -lt 12 ]; do echo filler$i; i=$((i+1)); done; printf '%038dlo''ng tail\\n' 0; tmux wait-for -S ready; exec cat"] },
  { wait_for = "ready" },
  { run = ["select-pane", "-t", "%0", "-T", "t"] },
  { run = ["set", "-g", "copy-mode-position-format", "#[align=right][#{copy_position}/#{copy_position_limit}]#{?search_timed_out, (timed out),#{?search_count, (#{search_count}#{?search_count_partial,+,} results),}}"] },
  { attach = { session = "a" } },
  { run = ["copy-mode", "-t", "a"] },
  { run = ["send-keys", "-t", "a", "-X", "history-top"] },
  { run = ["send-keys", "-t", "a", "-X", "search-forward", "beta"] },
  { run = ["display", "-p", "-t", "a", "[#{search_present}] [#{search_count}#{?search_count_partial,+,}] [#{search_match}] [#{copy_cursor_x},#{copy_cursor_y}] [#{scroll_position}]"] },
  { run = ["send-keys", "-t", "a", "-X", "search-again"] },
  { run = ["display", "-p", "-t", "a", "[#{search_present}] [#{search_count}#{?search_count_partial,+,}] [#{search_match}] [#{copy_cursor_x},#{copy_cursor_y}] [#{scroll_position}]"] },
  { run = ["send-keys", "-t", "a", "-X", "search-again"] },
  { run = ["display", "-p", "-t", "a", "[#{search_present}] [#{search_count}#{?search_count_partial,+,}] [#{search_match}] [#{copy_cursor_x},#{copy_cursor_y}] [#{scroll_position}]"] },
  { run = ["send-keys", "-t", "a", "-X", "search-reverse"] },
  { run = ["display", "-p", "-t", "a", "[#{search_present}] [#{search_count}#{?search_count_partial,+,}] [#{search_match}] [#{copy_cursor_x},#{copy_cursor_y}] [#{scroll_position}]"] },
  { run = ["send-keys", "-t", "a", "-X", "search-forward", "["] },
  { run = ["display", "-p", "-t", "a", "[#{search_present}] [#{search_count}#{?search_count_partial,+,}] [#{search_match}] [#{copy_cursor_x},#{copy_cursor_y}] [#{scroll_position}]"] },
  { run = ["send-keys", "-t", "a", "-X", "search-backward", "a$"] },
  { run = ["display", "-p", "-t", "a", "[#{search_present}] [#{search_count}#{?search_count_partial,+,}] [#{search_match}] [#{copy_cursor_x},#{copy_cursor_y}] [#{scroll_position}]"] },
  { run = ["send-keys", "-t", "a", "-X", "search-backward-text", "A"] },
  { run = ["display", "-p", "-t", "a", "[#{search_present}] [#{search_count}#{?search_count_partial,+,}] [#{search_match}] [#{copy_cursor_x},#{copy_cursor_y}] [#{scroll_position}]"] },
  { run = ["send-keys", "-t", "a", "-X", "search-forward-text", "a.p"] },
  { run = ["display", "-p", "-t", "a", "[#{search_present}] [#{search_count}#{?search_count_partial,+,}] [#{search_match}] [#{copy_cursor_x},#{copy_cursor_y}] [#{scroll_position}]"] },
  { run = ["send-keys", "-t", "a", "-X", "search-forward", "a.p"] },
  { run = ["display", "-p", "-t", "a", "[#{search_present}] [#{search_count}#{?search_count_partial,+,}] [#{search_match}] [#{copy_cursor_x},#{copy_cursor_y}] [#{scroll_position}]"] },
  { run = ["send-keys", "-t", "a", "-X", "search-backward", "^g"] },
  { run = ["display", "-p", "-t", "a", "[#{search_present}] [#{search_count}#{?search_count_partial,+,}] [#{search_match}] [#{copy_cursor_x},#{copy_cursor_y}] [#{scroll_position}]"] },
  { run = ["send-keys", "-t", "a", "-N", "2", "-X", "search-again"] },
  { run = ["display", "-p", "-t", "a", "[#{search_present}] [#{search_count}#{?search_count_partial,+,}] [#{search_match}] [#{copy_cursor_x},#{copy_cursor_y}] [#{scroll_position}]"] },
  { run = ["send-keys", "-t", "a", "-X", "search-forward", "(ALP|gam)ha?"] },
  { run = ["display", "-p", "-t", "a", "[#{search_present}] [#{search_count}#{?search_count_partial,+,}] [#{search_match}] [#{copy_cursor_x},#{copy_cursor_y}] [#{scroll_position}]"] },
  { run = ["send-keys", "-t", "a", "-X", "cursor-left"] },
  { run = ["display", "-p", "-t", "a", "[#{search_present}] [#{search_count}#{?search_count_partial,+,}] [#{search_match}] [#{copy_cursor_x},#{copy_cursor_y}] [#{scroll_position}]"] },
  { run = ["send-keys", "-t", "a", "-X", "search-forward-incremental", "=ga"] },
  { run = ["display", "-p", "-t", "a", "[#{search_present}] [#{search_count}#{?search_count_partial,+,}] [#{search_match}] [#{copy_cursor_x},#{copy_cursor_y}] [#{scroll_position}]"] },
  { run = ["send-keys", "-t", "a", "-X", "search-forward-incremental", "=gam"] },
  { run = ["display", "-p", "-t", "a", "[#{search_present}] [#{search_count}#{?search_count_partial,+,}] [#{search_match}] [#{copy_cursor_x},#{copy_cursor_y}] [#{scroll_position}]"] },
  { run = ["send-keys", "-t", "a", "-X", "search-forward-incremental", "=gx"] },
  { run = ["display", "-p", "-t", "a", "[#{search_present}] [#{search_count}#{?search_count_partial,+,}] [#{search_match}] [#{copy_cursor_x},#{copy_cursor_y}] [#{scroll_position}]"] },
  { run = ["send-keys", "-t", "a", "-X", "search-backward-incremental", "-be"] },
  { run = ["display", "-p", "-t", "a", "[#{search_present}] [#{search_count}#{?search_count_partial,+,}] [#{search_match}] [#{copy_cursor_x},#{copy_cursor_y}] [#{scroll_position}]"] },
  { run = ["send-keys", "-t", "a", "-X", "search-backward-incremental", "-"] },
  { run = ["display", "-p", "-t", "a", "[#{search_present}] [#{search_count}#{?search_count_partial,+,}] [#{search_match}] [#{copy_cursor_x},#{copy_cursor_y}] [#{scroll_position}]"] },
  { run = ["set", "-g", "wrap-search", "off"] },
  { run = ["send-keys", "-t", "a", "-X", "history-bottom"] },
  { run = ["send-keys", "-t", "a", "-X", "search-forward", "alpha"] },
  { run = ["display", "-p", "-t", "a", "[#{search_present}] [#{search_count}#{?search_count_partial,+,}] [#{search_match}] [#{copy_cursor_x},#{copy_cursor_y}] [#{scroll_position}]"] },
  { run = ["send-keys", "-t", "a", "-X", "search-backward", "delta"] },
  { run = ["display", "-p", "-t", "a", "[#{search_present}] [#{search_count}#{?search_count_partial,+,}] [#{search_match}] [#{copy_cursor_x},#{copy_cursor_y}] [#{scroll_position}]"] },
  { run = ["send-keys", "-t", "a", "-X", "search-backward", "delta"] },
  { run = ["display", "-p", "-t", "a", "[#{search_present}] [#{search_count}#{?search_count_partial,+,}] [#{search_match}] [#{copy_cursor_x},#{copy_cursor_y}] [#{scroll_position}]"] },
  { run = ["set", "-g", "wrap-search", "on"] },
  { run = ["send-keys", "-t", "a", "-X", "search-forward", "delta"] },
  { run = ["display", "-p", "-t", "a", "[#{search_present}] [#{search_count}#{?search_count_partial,+,}] [#{search_match}] [#{copy_cursor_x},#{copy_cursor_y}] [#{scroll_position}]"] },
  { run = ["send-keys", "-t", "a", "-X", "cancel"] },
  { run = ["display", "-p", "-t", "a", "[#{pane_search_string}]"] },
  { run = ["copy-mode", "-t", "a"] },
  { run = ["display", "-p", "-t", "a", "[#{search_present}] [#{search_count}#{?search_count_partial,+,}] [#{search_match}] [#{copy_cursor_x},#{copy_cursor_y}] [#{scroll_position}]"] },
  { run = ["send-keys", "-t", "a", "-X", "search-again"] },
  { run = ["display", "-p", "-t", "a", "[#{search_present}] [#{search_count}#{?search_count_partial,+,}] [#{search_match}] [#{copy_cursor_x},#{copy_cursor_y}] [#{scroll_position}]"] },
  { run = ["send-keys", "-t", "a", "-F", "-X", "search-backward", "#{pane_search_string}"] },
  { run = ["display", "-p", "-t", "a", "[#{search_present}] [#{search_count}#{?search_count_partial,+,}] [#{search_match}] [#{copy_cursor_x},#{copy_cursor_y}] [#{scroll_position}]"] },
  { run = ["send-keys", "-t", "a", "-X", "search-forward", "日本"] },
  { run = ["display", "-p", "-t", "a", "[#{search_present}] [#{search_count}#{?search_count_partial,+,}] [#{search_match}] [#{copy_cursor_x},#{copy_cursor_y}] [#{scroll_position}]"] },
  { run = ["setw", "-g", "mode-keys", "vi"] },
  { run = ["send-keys", "-t", "a", "-X", "history-top"] },
  { run = ["send-keys", "-t", "a", "-X", "search-forward", "a"] },
  { run = ["display", "-p", "-t", "a", "[#{search_present}] [#{search_count}#{?search_count_partial,+,}] [#{search_match}] [#{copy_cursor_x},#{copy_cursor_y}] [#{scroll_position}]"] },
  { run = ["send-keys", "-t", "a", "-X", "search-again"] },
  { run = ["display", "-p", "-t", "a", "[#{search_present}] [#{search_count}#{?search_count_partial,+,}] [#{search_match}] [#{copy_cursor_x},#{copy_cursor_y}] [#{scroll_position}]"] },
  { run = ["send-keys", "-t", "a", "-X", "search-reverse"] },
  { run = ["display", "-p", "-t", "a", "[#{search_present}] [#{search_count}#{?search_count_partial,+,}] [#{search_match}] [#{copy_cursor_x},#{copy_cursor_y}] [#{scroll_position}]"] },
  { run = ["send-keys", "-t", "a", "-X", "cursor-down"] },
  { run = ["display", "-p", "-t", "a", "[#{search_present}] [#{search_count}#{?search_count_partial,+,}] [#{search_match}] [#{copy_cursor_x},#{copy_cursor_y}] [#{scroll_position}]"] },
  { run = ["send-keys", "-t", "a", "-N", "3", "-X", "search-again"] },
  { run = ["display", "-p", "-t", "a", "[#{search_present}] [#{search_count}#{?search_count_partial,+,}] [#{search_match}] [#{copy_cursor_x},#{copy_cursor_y}] [#{scroll_position}]"] },
  { run = ["send-keys", "-t", "a", "-X", "search-backward", "al.h"] },
  { run = ["display", "-p", "-t", "a", "[#{search_present}] [#{search_count}#{?search_count_partial,+,}] [#{search_match}] [#{copy_cursor_x},#{copy_cursor_y}] [#{scroll_position}]"] },
  { run = ["send-keys", "-t", "a", "-X", "search-forward", "日本"] },
  { run = ["display", "-p", "-t", "a", "[#{search_present}] [#{search_count}#{?search_count_partial,+,}] [#{search_match}] [#{copy_cursor_x},#{copy_cursor_y}] [#{scroll_position}]"] },
  { run = ["send-keys", "-t", "a", "-X", "search-forward", "long"] },
  { settle = { react = true } },
  { run = ["display", "-p", "-t", "a", "[#{search_present}] [#{search_count}#{?search_count_partial,+,}] [#{search_match}] [#{copy_cursor_x},#{copy_cursor_y}] [#{scroll_position}]"] },
  { screen = {} },
  { run = ["send-keys", "-t", "a", "-X", "cancel"] },
]
