name = "copy_position_under_floating"
size = [60, 16]
# Copy mode's position indicator ([0/0], right-aligned on line 0) half
# under a floating pane moved off the window's left edge. tmux's
# screen_write_fast_copy (screen-write.c:667-717), which format_draw
# writes through, stops at the first cell a floating pane hides, so the
# visible end of the indicator ("0]") never reaches the mode's screen and
# tmux draws blanks there (D-044); vtmux draws it. Plain pane text there
# shows on both.
steps = [
  { run = ["new", "-d", "-s", "a", "-n", "w", "-x", "60", "-y", "15", "cat", "-"] },
  { run = ["set", "-g", "status-right", "x"] },
  { run = ["selectp", "-t", "%0", "-T", "t"] },
  { run = ["splitw", "-h", "-t", "a", "cat", "-"] },
  { run = ["selectp", "-t", "%1", "-T", "t"] },
  { run = ["newp", "-d", "-t", "a", "-X", "8", "-Y", "4", "-x", "32", "-y", "5", "cat", "-"] },
  { run = ["selectp", "-t", "%2", "-T", "t"] },
  { run = ["selectp", "-t", "%0"] },
  { attach = { session = "a" } },
  { run = ["movep", "-t", "%2", "-X", "-4", "-Y", "0"] },
  { settle = { react = true } },
  { run = ["lsp", "-F", "#{pane_id} #{pane_left},#{pane_top} #{pane_width}x#{pane_height}"] },
  { screen = {} },
  { run = ["copy-mode", "-t", "%0"] },
  { settle = { react = true } },
  { divergence = { id = "D-044", expect = { kind = "screen", rows = ["\\e[37m\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\\e[30m\\e[43m0]\\e[33m\\e[49m\u2502\\e[39m", "                           \\e[37m\u2502\\e[39m  \\e[33m\u2502\\e[39m", "                           \\e[37m\u2502\\e[39m  \\e[33m\u2502\\e[39m", "                           \\e[37m\u2502\\e[39m  \\e[33m\u2502\\e[39m", "\\e[37m\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\\e[39m  \\e[33m\u2502\\e[39m", "                              \\e[33m\u2502\\e[39m", "                              \\e[33m\u2502\\e[39m", "                              \\e[33m\u2502\\e[39m", "                              \\e[37m\u2502\\e[39m", "                              \\e[37m\u2502\\e[39m", "                              \\e[37m\u2502\\e[39m", "                              \\e[37m\u2502\\e[39m", "                              \\e[37m\u2502\\e[39m", "                              \\e[37m\u2502\\e[39m", "                              \\e[37m\u2502\\e[39m", "\\e[30m\\e[42m[a] \\e[4m0:w*\\e[0m\\e[42m                                                   \\e[30mx"], cursor = [0, 0] } } },
  { screen = {} },
  { run = ["send", "-X", "-t", "%0", "cancel"] },
  { keys = "abcdefghijklmnopqrstuvwxyz0123" },
  { settle = {} },
  { screen = {} },
]
