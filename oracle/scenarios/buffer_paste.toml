name = "buffer_paste"
size = [80, 24]
# paste-buffer into a pane that reports each input line (cmd-paste-buffer.c):
# LF to CR, -r, -s, -S (no vis encoding), -p with and without ?2004, -d,
# input-off panes and errors. `end` is sent after each paste, so the
# program's reply is deterministic.
steps = [
  { run = ["new", "-d", "-s", "a", "-x", "40", "-y", "10", "sh", "-c", "stty -echo; tmux wait-for -S ready; while read -r l; do printf 'got:%s\\n' \"$(printf %s \"$l\" | tr '\\033' '@')\"; [ \"$l\" = mode ] && printf '\\033[?2004h' && tmux wait-for -S fed; [ \"$l\" = end ] && tmux wait-for -S fed; done; exec cat"] },
  { wait_for = "ready" },
  { run = ["set-buffer", "-b", "p", "one\ntwo\n"] },
  { run = ["paste-buffer", "-b", "p", "-t", "%0"] },
  { run = ["send-keys", "-t", "%0", "-l", "end\r"] },
  { wait_for = "fed" },
  { run = ["capture-pane", "-p", "-t", "%0"] },
  { run = ["paste-buffer", "-r", "-b", "p", "-t", "%0"] },
  { run = ["send-keys", "-t", "%0", "-l", "end\r"] },
  { wait_for = "fed" },
  { run = ["paste-buffer", "-s", "|", "-b", "p", "-t", "%0"] },
  { run = ["send-keys", "-t", "%0", "-l", "\rend\r"] },
  { wait_for = "fed" },
  { run = ["paste-buffer", "-s", "XX", "-b", "p", "-t", "%0"] },
  { run = ["send-keys", "-t", "%0", "-l", "\rend\r"] },
  { wait_for = "fed" },
  { run = ["set-buffer", "-b", "p", "a\u001b[31m\u007fb\\c\u00e9\n"] },
  { run = ["paste-buffer", "-b", "p", "-t", "%0"] },
  { run = ["send-keys", "-t", "%0", "-l", "end\r"] },
  { wait_for = "fed" },
  { run = ["paste-buffer", "-S", "-b", "p", "-t", "%0"] },
  { run = ["send-keys", "-t", "%0", "-l", "end\r"] },
  { wait_for = "fed" },
  { run = ["capture-pane", "-p", "-t", "%0"] },
  { run = ["paste-buffer", "-p", "-b", "p", "-t", "%0"] },
  { run = ["send-keys", "-t", "%0", "-l", "end\r"] },
  { wait_for = "fed" },
  { run = ["send-keys", "-t", "%0", "-l", "mode\r"] },
  { wait_for = "fed" },
  { run = ["paste-buffer", "-p", "-d", "-b", "p", "-t", "%0"] },
  { run = ["send-keys", "-t", "%0", "-l", "\rend\r"] },
  { wait_for = "fed" },
  { run = ["show-buffer", "-b", "p"] },
  { run = ["capture-pane", "-p", "-t", "%0"] },
  { run = ["paste-buffer", "-b", "p", "-t", "%0"] },
  { run = ["paste-buffer", "-t", "%0"] },
  { run = ["paste-buffer", "-t", "%9"] },
  { run = ["set-buffer", "x\n"] },
  { run = ["select-pane", "-d", "-t", "%0"] },
  { run = ["paste-buffer", "-d", "-t", "%0"] },
  { run = ["list-buffers"] },
]
