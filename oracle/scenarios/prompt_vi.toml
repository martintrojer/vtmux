# status-keys vi (prompt.c prompt_translate_key): insert mode types,
# Escape enters command mode (cursor back one, message-command-style
# drawn), h l 0 $ w b e x X D i a A I S and history k/j, Enter runs; q
# cancels. A long input scrolls to keep the cursor in view
# (prompt_layout).
name = "prompt_vi"
size = [30, 6]
steps = [
  { run = ["new", "-d", "-s", "a", "-n", "w", "-x", "30", "-y", "5", "cat"] },
  { run = ["set", "-g", "status-keys", "vi"] },
  { attach = { session = "a" } },
  { keys = "\u0002:" },
  { settle = {} },
  { keys = "set -g @v foo-bar baz" },
  { screen = {} },
  { keys = "\u001b" },
  { screen = {} },
  { keys = "0" },
  { screen = {} },
  { keys = "www" },
  { screen = {} },
  { keys = "e" },
  { screen = {} },
  { keys = "bb" },
  { screen = {} },
  { keys = "x" },
  { screen = {} },
  { keys = "iQ" },
  { screen = {} },
  { keys = "\u001b$" },
  { screen = {} },
  { keys = "X" },
  { screen = {} },
  { keys = "hhD" },
  { screen = {} },
  { keys = "A!" },
  { screen = {} },
  { keys = "\r" },
  { settle = {} },
  { run = ["show", "-gv", "@v"] },
  { keys = "\u0002:" },
  { settle = {} },
  { keys = "\u001bk" },
  { screen = {} },
  { keys = "Sdisplay" },
  { screen = {} },
  { keys = "\u001bq" },
  { screen = {} },
  { keys = "\u0002:" },
  { settle = {} },
  { keys = "abcdefghijklmnopqrstuvwxyz0123456789" },
  { screen = {} },
  { keys = "\u001b0" },
  { screen = {} },
  { keys = "\u0003" },
  { screen = {} },
]
