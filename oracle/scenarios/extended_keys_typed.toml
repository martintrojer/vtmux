name = "extended_keys_typed"
size = [120, 8]
# CSI-u (\e[k;mu) and xterm (\e[27;m;k~) keys typed at an attached client
# (tty-keys.c tty_keys_extended_key: shift lost on printable keys, S-Tab
# becomes BTab, the erase character becomes BSpace, bad ones fall through),
# re-encoded for panes whose program asked for modifyOtherKeys none/1/2
# (input-keys.c), then the same keys through send-keys -K, which runs them
# through the client's key handling (cmd-send-keys.c:75-90): a root binding,
# the prefix table and the pane. The pane shows its input through cat -v;
# `LC_ALL=C cat -v`: BSD cat prints a multibyte character as it is in a
# UTF-8 locale, GNU cat in M- notation in any. A pane waits for the reply to
# a DSR sent after its mode request, so the request has been parsed when it
# signals.
steps = [
  { run = ["set", "-g", "extended-keys", "on", ";", "set", "-g", "status-right", "", ";", "new", "-d", "-s", "a", "-n", "w0", "-x", "120", "-y", "7", "sh", "-c", "stty raw -echo opost onlcr; printf '\\033[5n'; dd bs=1 count=4 of=/dev/null 2>/dev/null; tmux wait-for -S rdy; LC_ALL=C exec cat -v"] },
  { wait_for = "rdy" },
  { run = ["select-pane", "-t", "a:w0", "-T", "tw0"] },
  { run = ["neww", "-d", "-n", "w1", "sh", "-c", "stty raw -echo opost onlcr; printf '\\033[>4;1m\\033[5n'; dd bs=1 count=4 of=/dev/null 2>/dev/null; tmux wait-for -S rdy; LC_ALL=C exec cat -v"] },
  { wait_for = "rdy" },
  { run = ["select-pane", "-t", "a:w1", "-T", "tw1"] },
  { run = ["neww", "-d", "-n", "w2", "sh", "-c", "stty raw -echo opost onlcr; printf '\\033[>4;2m\\033[5n'; dd bs=1 count=4 of=/dev/null 2>/dev/null; tmux wait-for -S rdy; LC_ALL=C exec cat -v"] },
  { wait_for = "rdy" },
  { run = ["select-pane", "-t", "a:w2", "-T", "tw2"] },
  { run = ["bind", "-n", "F5", "set", "-ga", "@k", "F5,"] },
  { run = ["bind", "-n", "C-S-a", "set", "-ga", "@k", "CSa,"] },
  { run = ["bind", "-n", "M-a", "set", "-ga", "@k", "Ma,"] },
  { run = ["bind", "-n", "C-a", "set", "-ga", "@k", "Ca,"] },
  { run = ["bind", "-n", "BTab", "set", "-ga", "@k", "BTab,"] },
  { run = ["bind", "-n", "C-Enter", "set", "-ga", "@k", "CEnter,"] },
  { run = ["bind", "-n", "C-S-Left", "set", "-ga", "@k", "CSLeft,"] },
  { run = ["set", "-g", "@k", ""] },
  { attach = { session = "a" } },
  { run = ["set", "-g", "extended-keys", "on"] },
  { run = ["respawn-pane", "-k", "-t", "a:w0"] },
  { wait_for = "rdy" },
  { run = ["display", "-p", "-t", "a:w0", "on #{pane_key_mode}"] },
  { run = ["selectw", "-t", "a:w0"] },
  { settle = { react = true } },
  { keys = "\u001b[97;5u \u001b[97;2u \u001b[97;6u \u001b[97;3u \u001b[13;2u \u001b[13;5u \u001b[9;5u \u001b[9;2u \u001b[49;5u \u001b[233;5u \u001b[127;5u \u001b[27;5u \u001b[105;5u \u001b[120;8u \u001b[27;5;97~ \u001b[27;2;65~ \u001b[1;2A \u001b[97;1u \u001b[97u \u001b[99999999u \u001b[57344;5u \r" },
  { settle = {} },
  { screen = {} },
