name = "history_limit_live_zero"
# A pane made with history-limit 0 has no GRID_HISTORY (grid.c:381-382) and
# never gets history, whatever the limit becomes. A pane made with a limit
# keeps history for good: lowered to 0 it is emptied, and scrolling then
# leaves the one row grid_collect_history(gd, 0) lets in per line.
steps = [
  { run = ["new", "-d", "-s", "z", "cat"] },
  { run = ["set", "-g", "history-limit", "0"] },
  { run = ["new", "-d", "-s", "n", "-x", "80", "-y", "24", "sh", "-c", "stty -echo; seq 1 100; tmux wait-for -S n1; read x; seq 1 100; tmux wait-for -S n2; exec cat"] },
  { run = ["set", "-g", "history-limit", "500"] },
  { run = ["new", "-d", "-s", "h", "-x", "80", "-y", "24", "sh", "-c", "stty -echo; seq 1 100; tmux wait-for -S h1; read x; seq 1 100; tmux wait-for -S h2; exec cat"] },
  { wait_for = "n1" },
  { wait_for = "h1" },
  { run = ["display", "-p", "-t", "n", "#{history_size}/#{history_limit}"] },
  { run = ["display", "-p", "-t", "h", "#{history_size}/#{history_limit}"] },
  { run = ["set", "-g", "history-limit", "300"] },
  { run = ["display", "-p", "-t", "n", "#{history_size}/#{history_limit}"] },
  { run = ["display", "-p", "-t", "h", "#{history_size}/#{history_limit}"] },
  { run = ["set", "-g", "history-limit", "0"] },
  { run = ["display", "-p", "-t", "h", "#{history_size}/#{history_limit}"] },
  { run = ["capture-pane", "-p", "-S", "-", "-t", "h"] },
  { feed = { pane = "%1", bytes = "\r" } },
  { feed = { pane = "%2", bytes = "\r" } },
  { wait_for = "n2" },
  { wait_for = "h2" },
  { run = ["display", "-p", "-t", "n", "#{history_size}/#{history_limit}"] },
  { run = ["display", "-p", "-t", "h", "#{history_size}/#{history_limit}"] },
  { run = ["capture-pane", "-p", "-S", "-", "-t", "h"] },
]
