# mouse_word, mouse_line and mouse_hyperlink (format.c
# format_cb_mouse_word, format_grid_word, format_grid_line,
# format_grid_hyperlink) from click bindings (each click is a down, a
# second or a triple click): a word follows a wrapped line both ways
# and ends at word-separators (the global session option), a space, a
# tab or a blank; on a separator it is the word after it; past the end
# of the line there is none. A line is the grid line, not joined with
# the next. A link is found from a wide character's second column. In
# copy mode, the view's (window_copy_get_word, window_copy_get_line).
# Clicks come about 200 ms apart, so whether one is a down, a second or
# a triple click depends on load; all three are bound alike, and the
# default DoubleClick1Pane bindings (key-bindings.c:520, 608), which
# enter or leave copy mode when the 300 ms click timer
# (server_client_click_timer) runs out after a second click, are
# unbound, so no click changes the mode.
name = "format_mouse_word"
size = [20, 10]
steps = [
  { run = ["new", "-d", "-s", "a", "-n", "w", "-x", "20", "-y", "9", "sh", "-c", 'printf "ab cdefghijklmnopq-rs-tu\n\344\270\255x\tq\n\033]8;;http://w/\033\\\\\344\270\255\344\270\255\033]8;;\033\\\\ t\n"; tmux wait-for -S r; exec cat'] },
  { wait_for = "r" },
  { run = ["set", "-g", "status-right", "R"] },
  { run = ["set", "-g", "mouse", "on"] },
  { run = ["select-pane", "-t", "a", "-T", "p0"] },
  { run = ["bind", "-n", "MouseDown1Pane", "set", "-gF", "@m", "[#{mouse_word}] [#{mouse_line}] [#{mouse_hyperlink}] #{mouse_x},#{mouse_y}"] },
  { run = ["bind", "-n", "SecondClick1Pane", "set", "-gF", "@m", "[#{mouse_word}] [#{mouse_line}] [#{mouse_hyperlink}] #{mouse_x},#{mouse_y}"] },
  { run = ["bind", "-n", "TripleClick1Pane", "set", "-gF", "@m", "[#{mouse_word}] [#{mouse_line}] [#{mouse_hyperlink}] #{mouse_x},#{mouse_y}"] },
  { run = ["unbind", "-n", "DoubleClick1Pane"] },
  { run = ["unbind", "-T", "copy-mode", "DoubleClick1Pane"] },
  { attach = { session = "a" } },
  { settle = { quiet_ms = 500 } },
  { keys = "\u001b[<0;1;1M" },
  { settle = {} },
  { run = ["show", "-gv", "@m"] },
  { keys = "\u001b[<0;3;1M" },
  { settle = {} },
  { run = ["show", "-gv", "@m"] },
  { keys = "\u001b[<0;2;2M" },
  { settle = {} },
  { run = ["show", "-gv", "@m"] },
  { keys = "\u001b[<0;20;1M" },
  { settle = {} },
  { run = ["show", "-gv", "@m"] },
  { run = ["set", "-g", "word-separators", "-"] },
  { keys = "\u001b[<0;20;1M" },
  { settle = {} },
  { run = ["show", "-gv", "@m"] },
  { keys = "\u001b[<0;5;2M" },
  { settle = {} },
  { run = ["show", "-gv", "@m"] },
  { run = ["set", "-gu", "word-separators"] },
  { keys = "\u001b[<0;2;3M" },
  { settle = {} },
  { run = ["show", "-gv", "@m"] },
  { keys = "\u001b[<0;10;3M" },
  { settle = {} },
  { run = ["show", "-gv", "@m"] },
  { keys = "\u001b[<0;2;4M" },
  { settle = {} },
  { run = ["show", "-gv", "@m"] },
  { keys = "\u001b[<0;6;4M" },
  { settle = {} },
  { run = ["show", "-gv", "@m"] },
  { keys = "\u001b[<0;10;8M" },
  { settle = {} },
  { run = ["show", "-gv", "@m"] },
  { run = ["bind", "-T", "copy-mode", "MouseDown1Pane", "set", "-gF", "@m", "[#{mouse_word}] [#{mouse_line}] [#{mouse_hyperlink}] #{mouse_x},#{mouse_y}"] },
  { run = ["bind", "-T", "copy-mode", "SecondClick1Pane", "set", "-gF", "@m", "[#{mouse_word}] [#{mouse_line}] [#{mouse_hyperlink}] #{mouse_x},#{mouse_y}"] },
  { run = ["bind", "-T", "copy-mode", "TripleClick1Pane", "set", "-gF", "@m", "[#{mouse_word}] [#{mouse_line}] [#{mouse_hyperlink}] #{mouse_x},#{mouse_y}"] },
  { run = ["copy-mode", "-t", "a"] },
  { settle = { react = true } },
  { keys = "\u001b[<0;2;4M" },
  { settle = {} },
  { run = ["show", "-gv", "@m"] },
  { keys = "\u001b[<0;3;1M" },
  { settle = {} },
  { run = ["show", "-gv", "@m"] },
  # The clicks left the pane in copy mode. copy_cursor_hyperlink: the
  # cell under copy mode's cursor.
  { run = ["display", "-p", "-t", "a", "#{pane_mode}"] },
  { run = ["send", "-t", "a", "-X", "top-line"] },
  { run = ["send", "-t", "a", "-X", "cursor-down"] },
  { run = ["send", "-t", "a", "-X", "cursor-down"] },
  { run = ["send", "-t", "a", "-X", "cursor-down"] },
  { run = ["send", "-t", "a", "-X", "start-of-line"] },
  { run = ["display", "-p", "-t", "a", "[#{copy_cursor_hyperlink}] #{copy_cursor_x},#{copy_cursor_y}"] },
  { run = ["send", "-t", "a", "-X", "cursor-right"] },
  { run = ["display", "-p", "-t", "a", "[#{copy_cursor_hyperlink}] #{copy_cursor_x},#{copy_cursor_y}"] },
  { run = ["send", "-t", "a", "-X", "end-of-line"] },
  { run = ["display", "-p", "-t", "a", "[#{copy_cursor_hyperlink}] #{copy_cursor_x},#{copy_cursor_y}"] },
]
