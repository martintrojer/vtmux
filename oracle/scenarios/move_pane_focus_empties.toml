name = "move_pane_focus_empties"
steps = [
  { run = ["new", "-d", "-s", "a", "-x", "80", "-y", "24", "cat", "-"] },
  { run = ["set", "-g", "focus-events", "on"] },
  { run = ["neww", "-t", "a:1", "cat", "-"] },
  { run = ["movep", "-d", "-b", "-f", "-h", "-s", "a:1", "-t", "a:0"] },
  { run = ["lsw", "-t", "a", "-F", "#{window_index} #{window_active} #{window_panes} #{window_layout}"] },
  { run = ["lsp", "-a", "-F", "#{session_name}:#{window_index}.#{pane_index} #{pane_active} #{pane_width}x#{pane_height} #{pane_left},#{pane_top}"] },
]
