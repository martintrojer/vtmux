name = "panes_select_swap"
steps = [
  { run = ["new", "-d", "-s", "a", "-n", "w", "-x", "80", "-y", "24", "cat"] },
  { run = ["new", "-d", "-s", "b", "-n", "bw", "-x", "80", "-y", "24", "cat"] },
  { run = ["selectl", "-t", "a", "bogus"] },
  { run = ["selectl", "-t", "a", "{\"V\":3}"] },
  { run = ["splitw", "-d", "-t", "a", "cat"] },
  { run = ["splitw", "-d", "-t", "a", "cat"] },
  { run = ["selectl", "-t", "a", "even-horizontal"] },
  { run = ["display", "-p", "-t", "a", "#{window_layout}"] },
  { run = ["selectl", "-t", "a", "-o"] },
  { run = ["display", "-p", "-t", "a", "#{window_layout}"] },
  { run = ["nextl", "-t", "a"] },
  { run = ["prevl", "-t", "a"] },
  { run = ["prevl", "-t", "a"] },
  { run = ["display", "-p", "-t", "a", "#{window_layout}"] },
  { run = ["selectl", "-t", "a", "-E"] },
  { run = ["selectl", "-t", "a", "main-v"] },
  { run = ["display", "-p", "-t", "a", "#{window_layout}"] },
  { run = ["selectl", "-t", "a", "{\"V\":2,\"L\":{\"t\":\"h\",\"w\":100,\"h\":30,\"x\":0,\"y\":0,\"c\":[{\"t\":\"p\",\"w\":50,\"h\":30,\"x\":0,\"y\":0,\"i\":1},{\"t\":\"v\",\"w\":49,\"h\":30,\"x\":51,\"y\":0,\"c\":[{\"t\":\"p\",\"w\":49,\"h\":15,\"x\":51,\"y\":0,\"a\":true,\"i\":0},{\"t\":\"p\",\"w\":49,\"h\":14,\"x\":51,\"y\":16,\"l\":0,\"i\":2}]}]}}"] },
  { run = ["display", "-p", "-t", "a", "#{window_width}x#{window_height} #{window_layout}"] },
  { run = ["selectl", "-t", "a", "55bb,80x24,0,0{56x24,0,0,0,23x24,57,0[23x12,57,0,1,23x11,57,13,2]}"] },
  { run = ["lsp", "-t", "a", "-F", "#{pane_id} #{pane_width}x#{pane_height} #{pane_left},#{pane_top} #{pane_active}#{pane_last}"] },
  { run = ["selectl", "-t", "a", "55bb,80x24,0,0{56x24,0,0,0,23x24,57,0[23x12,57,0,1,23x11,57,13,3]}"] },
  { run = ["selectl", "-t", "a", "{\"V\":2,\"L\":{\"t\":\"p\",\"w\":80,\"h\":24,\"x\":0,\"y\":0}}"] },
  { run = ["swapp", "-t", "a", "-D"] },
  { run = ["swapp", "-t", "a", "-U"] },
  { run = ["swapp", "-s", "%0", "-t", "%2"] },
  { run = ["swapp", "-d", "-s", "%1", "-t", "%2"] },
  { run = ["lsp", "-t", "a", "-F", "#{pane_index} #{pane_id} #{pane_active}#{pane_last} #{pane_width}x#{pane_height}"] },
  { run = ["splitw", "-d", "-t", "b", "cat"] },
  { run = ["swapp", "-s", "a:0.1", "-t", "b:0.0"] },
  { run = ["lsp", "-a", "-F", "#{session_name}:#{window_index}.#{pane_index} #{pane_id} #{pane_active}#{pane_last} #{pane_width}x#{pane_height}"] },
  { run = ["resizep", "-Z", "-t", "b:0.1"] },
  { run = ["swapp", "-Z", "-t", "b:0.1", "-U"] },
  { run = ["display", "-p", "-t", "b", "#{window_zoomed_flag} #{pane_id}"] },
  { run = ["swapp", "-t", "%9"] },
]
