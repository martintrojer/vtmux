# choose-tree -s while another session's window and then the session go: neither is the client's, so nothing builds the list again (server_client_check_modes needs CLIENT_REDRAWSTATUS on this client); the gone session's row stays and its preview is empty (window_tree_pull_item finds nothing). The terminal answers the device attributes query at once, so no start-timer redraw. refresh-client -S then sets the flag and the list is built again.
name = "tree_preview_kill_session"
size = [80, 30]
steps = [
  { run = ["new", "-d", "-s", "aaa", "-n", "w0", "-x", "80", "-y", "29", "exec cat"] },
  { run = ["set", "-g", "status-right", "R"] },
  { run = ["set", "-g", "status-interval", "0"] },
  { run = ["new", "-d", "-s", "bbb", "-n", "x0", "-x", "80", "-y", "29", "printf 'bee0\\n'; exec cat"] },
  { run = ["neww", "-d", "-t", "bbb:1", "-n", "x1", "printf 'bee1\\n'; exec cat"] },
  { run = ["new", "-d", "-s", "ccc", "-n", "y0", "-x", "80", "-y", "29", "printf 'cee\\n'; exec cat"] },
  { run = ["select-pane", "-t", "%0", "-T", "t0", ";", "select-pane", "-t", "%1", "-T", "t1", ";", "select-pane", "-t", "%2", "-T", "t2", ";", "select-pane", "-t", "%3", "-T", "t3"] },
  { attach = { session = "aaa" } },
  { keys = "\u001b[?62;22c" },
  { screen = {} },
  { run = ["choose-tree", "-s", "-t", "aaa:0.0"] },
  { settle = { react = true } },
  { keys = "j" },
  { screen = {} },
  { run = ["kill-window", "-t", "bbb:1"] },
  { settle = {} },
  { keys = "k" },
  { screen = {} },
  { keys = "j" },
  { screen = {} },
  { run = ["kill-session", "-t", "bbb"] },
  { settle = {} },
  { keys = "k" },
  { screen = {} },
  { keys = "j" },
  { screen = {} },
  { run = ["refresh-client", "-S"] },
  { settle = { react = true } },
  { screen = {} },
  { keys = "j" },
  { screen = {} },
]
