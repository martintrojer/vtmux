name = "winlink_link"
steps = [
  { run = ["new", "-d", "-s", "a", "-n", "w0", "-x", "80", "-y", "24", "cat"] },
  { run = ["neww", "-d", "-t", "a:1", "-n", "w1", "cat"] },
  { run = ["neww", "-d", "-t", "a:2", "-n", "w2", "cat"] },
  { run = ["new", "-d", "-s", "b", "-n", "b0", "-x", "80", "-y", "24", "cat"] },
  { run = ["linkw", "-s", "a:1", "-t", "b:5"] },
  { run = ["lsw", "-a", "-F", "#{session_name}:#{window_index} #{window_id} #{window_name} [#{window_flags}] linked=#{window_linked} n=#{window_linked_sessions} list=#{window_linked_sessions_list}"] },
  { run = ["linkw", "-s", "a:1", "-t", "b:5"] },
  { run = ["linkw", "-s", "a:2", "-t", "b:5"] },
  { run = ["linkw", "-d", "-s", "a:2", "-t", "b:6"] },
  { run = ["lsw", "-a", "-F", "#{session_name}:#{window_index} #{window_id} #{window_name} [#{window_flags}] linked=#{window_linked} n=#{window_linked_sessions} list=#{window_linked_sessions_list}"] },
  { run = ["linkw", "-k", "-s", "a:2", "-t", "b:5"] },
  { run = ["lsw", "-a", "-F", "#{session_name}:#{window_index} #{window_id} #{window_name} [#{window_flags}] linked=#{window_linked} n=#{window_linked_sessions} list=#{window_linked_sessions_list}"] },
  { run = ["display", "-p", "-t", "b", "#{session_name}:#{window_index} #{window_id}"] },
  { run = ["linkw", "-s", "a:0", "-t", "b"] },
  { run = ["lsw", "-a", "-F", "#{session_name}:#{window_index} #{window_id} #{window_name} [#{window_flags}] linked=#{window_linked} n=#{window_linked_sessions} list=#{window_linked_sessions_list}"] },
  { run = ["linkw", "-a", "-s", "a:0", "-t", "b:0"] },
  { run = ["lsw", "-a", "-F", "#{session_name}:#{window_index} #{window_id} #{window_name} [#{window_flags}] #{window_panes}"] },
  { run = ["linkw", "-b", "-d", "-s", "a:1", "-t", "b:0"] },
  { run = ["lsw", "-a", "-F", "#{session_name}:#{window_index} #{window_id} #{window_name} [#{window_flags}] #{window_panes}"] },
  { run = ["linkw", "-k", "-d", "-s", "a:0", "-t", "b:0"] },
  { run = ["lsw", "-a", "-F", "#{session_name}:#{window_index} #{window_id} #{window_name} [#{window_flags}] #{window_panes}"] },
  { run = ["linkw", "-s", "a:9", "-t", "b:7"] },
  { run = ["linkw", "-s", "nosuch:0", "-t", "b:7"] },
  { run = ["linkw", "-s", "a:0", "-t", "nosuch:7"] },
  { run = ["linkw", "-s", "a:0", "-t", "a:0.1"] },
  { run = ["linkw", "-s", "a:1"] },
  { run = ["lsw", "-a", "-F", "#{session_name}:#{window_index} #{window_id} #{window_name} [#{window_flags}] #{window_panes}"] },
  { run = ["rename-window", "-t", "a:1", "shared"] },
  { run = ["lsw", "-a", "-F", "#{session_name}:#{window_index} #{window_id} #{window_name} [#{window_flags}] linked=#{window_linked} n=#{window_linked_sessions} list=#{window_linked_sessions_list}"] },
  { run = ["kill-window", "-t", "b:5"] },
  { run = ["lsw", "-a", "-F", "#{session_name}:#{window_index} #{window_id} #{window_name} [#{window_flags}] linked=#{window_linked} n=#{window_linked_sessions} list=#{window_linked_sessions_list}"] },
  { run = ["ls", "-F", "#{session_name} #{session_windows} #{session_many_attached}"] },
  { run = ["linkw", "-s", "a:0", "-t", "b:20"] },
  { run = ["linkw", "-s", "a:1", "-t", "b:21"] },
  { run = ["kill-window", "-a", "-t", "a:2"] },
  { run = ["lsw", "-a", "-F", "#{session_name}:#{window_index} #{window_id} #{window_name} [#{window_flags}] linked=#{window_linked} n=#{window_linked_sessions} list=#{window_linked_sessions_list}"] },
  { run = ["kill-window", "-t", "a:1"] },
  { run = ["lsw", "-a", "-F", "#{session_name}:#{window_index} #{window_id} #{window_name} [#{window_flags}] linked=#{window_linked} n=#{window_linked_sessions} list=#{window_linked_sessions_list}"] },
  { run = ["ls", "-F", "#{session_name} #{session_windows} #{session_many_attached}"] },
  { run = ["kill-session", "-t", "a"] },
  { run = ["lsw", "-a", "-F", "#{session_name}:#{window_index} #{window_id} #{window_name} [#{window_flags}] linked=#{window_linked} n=#{window_linked_sessions} list=#{window_linked_sessions_list}"] },
  { run = ["ls", "-F", "#{session_name} #{session_windows} #{session_many_attached}"] },
  { run = ["kill-server"] },
]
