name = "attach_from_binding"
size = [40, 6]
steps = [
  { run = ["new", "-d", "-s", "s1", "-n", "w", "-x", "40", "-y", "6", "sh", "-c", "exec cat"] },
  { run = ["new", "-d", "-s", "s2", "-n", "w", "-x", "40", "-y", "6", "sh", "-c", "exec cat"] },
  { run = ["select-pane", "-t", "s1", "-T", "t"] },
  { run = ["select-pane", "-t", "s2", "-T", "t"] },
  { run = ["set", "-g", "status-right", "R"] },
  { run = ["bind", "a", "attach -t s2 ; set -g @e after"] },
  { run = ["bind", "n", "new -s s3 -n w 'exec cat' ; set -g @n after"] },
  { attach = { session = "s1" } },
  { screen = {} },
  { keys = "\u0002a" },
  { screen = {} },
  { keys = "\u0002n" },
  { settle = {} },
  { screen = {} },
  { run = ["list-clients", "-F", "#{client_session}"] },
  { run = ["list-sessions", "-F", "#{session_name}"] },
  { run = ["show", "-gv", "@e"] },
  { run = ["show", "-gv", "@n"] },
]
