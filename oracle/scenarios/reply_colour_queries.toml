name = "reply_colour_queries"
size = [60, 14]
# A pane's colour, clipboard and theme queries answered without a client
# terminal (input.c input_osc_4/10/11/12/52, input_report_current_theme):
# OSC 10/11 from window-style (a client's reported colour is the fallback,
# none here), OSC 4 from what the program set or `pane-colours`, OSC 12 from
# what it set or `cursor-colour`, OSC 52 from the top buffer under
# `set-clipboard on` + `get-clipboard buffer` only, DSR 996 guessed from the
# background. Each reply is read raw and printed through `cat -v`, one per
# line; a query with no answer prints an empty line after the 1 s timeout.
steps = [
  { run = ["new", "-d", "-s", "a", "-n", "w", "-x", "60", "-y", "14", "cat"] },
  { run = ["set", "-g", "window-style", "fg=#102030,bg=white"] },
  { run = ["set", "-g", "pane-colours[5]", "#0a0b0c"] },
  { run = ["set", "-g", "cursor-colour", "#a0b0c0"] },
  { run = ["set", "-s", "set-clipboard", "on"] },
  { run = ["set", "-s", "get-clipboard", "buffer"] },
  { run = ["set-buffer", "Hello"] },
  { run = ["display", "-p", "-t", "%0", "#{pane_fg} #{pane_bg}"] },
  { run = ["respawn-pane", "-k", "-t", "%0", "sh", "-c", "stty raw -echo min 0 time 10; q() { printf \"$1\"; dd bs=1 count=64 2>/dev/null | cat -v; printf '\\r\\n'; }; q '\\033]10;?\\007'; q '\\033]11;?\\033\\\\'; q '\\033]4;5;?\\007'; q '\\033]4;7;#ff8000\\033]4;7;?\\007'; q '\\033]12;?\\007'; q '\\033]12;green\\033]12;?\\033\\\\'; q '\\033]52;c;?\\007'; q '\\033[?996n'; q '\\033]11;#000000\\007\\033[?996n'; printf 'fg=%s\\r\\n' \"$(tmux display -p -t %0 '#{pane_fg} #{pane_bg}')\"; tmux wait-for -S ready; exec cat"] },
  { wait_for = "ready" },
  { run = ["capture-pane", "-p", "-t", "%0"] },
  { run = ["set", "-s", "get-clipboard", "off"] },
  { run = ["respawn-pane", "-k", "-t", "%0", "sh", "-c", "stty raw -echo min 0 time 10; q() { printf \"$1\"; dd bs=1 count=64 2>/dev/null | cat -v; printf '\\r\\n'; }; q '\\033]52;c;?\\007'; q '\\033]4;9;?\\007'; tmux wait-for -S ready; exec cat"] },
  { wait_for = "ready" },
  { run = ["capture-pane", "-p", "-t", "%0"] },
]
