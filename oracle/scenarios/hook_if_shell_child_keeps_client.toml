name = "hook_if_shell_child_keeps_client"
# cmdq_insert_after gives the inserted items the client of the item they
# follow (cmd-queue.c:332-349): the commands if-shell -F inserts while a
# hook's command runs keep the client that command borrowed
# (cmd-if-shell.c:87-100), so after switch-client moves the other client
# to c the child still sees a's client. The next hook item has no client
# and borrows again: the best session is now c, so c's client.
size = [80, 24]
steps = [
  { run = ["new", "-d", "-s", "a", "-n", "w0", "-x", "80", "-y", "24", "sh", "-c", "stty echo echoctl; printf '\\033[?1004h'; tmux wait-for -S p0; exec cat -"] },
  { wait_for = "p0" },
  { run = ["splitw", "-d", "-t", "a:0", "sh", "-c", "stty echo echoctl; printf '\\033[?1004h'; tmux wait-for -S p1; exec cat -"] },
  { wait_for = "p1" },
  { run = ["new", "-d", "-s", "b", "-n", "w2", "sh", "-c", "stty echo echoctl; printf '\\033[?1004h'; tmux wait-for -S p2; exec cat -"] },
  { wait_for = "p2" },
  { run = ["new", "-d", "-s", "c", "-n", "w3", "sh", "-c", "stty echo echoctl; printf '\\033[?1004h'; tmux wait-for -S p3; exec cat -"] },
  { wait_for = "p3" },
  { run = ["set", "-g", "status-right", "x"] },
  { run = ["set", "-g", "focus-events", "on"] },
  { run = ["set", "-g", "@log", ""] },
  { attach = { session = "b", id = "cb" } },
  { attach = { session = "a" } },
  { run = ["run-shell", '''tmux set-hook -g pane-focus-out "if -F '##{==:##{@done},}' { set -g @done 1 ; switchc -n -c $(tmux lsc -t b -F '##{client_name}') ; set -agF @log '|child:##{hook_pane}:##{client_session}' }"'''] },
  { run = ["set-hook", "-g", "pane-focus-in", "set -agF @log '|next:#{hook_pane}:#{client_session}'"] },
  { settle = {} },
  { run = ["selectp", "-t", "a:0.1"] },
  { run = ["show", "-gv", "@log"] },
  { run = ["lsc", "-F", "#{client_session}"] },
  { run = ["kill-server"] },
]
