# display-popup close rules and exit status (popup.c:430-505): without -E
# the popup stays after its job exits and Escape or C-c closes it; -E
# closes when the job exits; -EE only when it exits 0; -k closes on any
# key once the job is gone. The command waits until the popup closes, and
# a command client exits with the job's status (128 + SIGHUP when closed
# while running, popup.c:613); a CLI display-popup blocks, so it runs in
# a run-shell -b job here and its status goes to an option.
# With a popup open, display-popup changes its title, styles, lines and
# rules and starts no job (popup_modify); with another overlay up it does
# nothing. Keys go to the popup, not the key tables (M-f reaches cat).
# A popup larger than the client, or under 3x3 with a border,
# is not shown and the command returns at once.
name = "popup_close"
size = [40, 12]
steps = [
  { run = ["new", "-d", "-s", "a", "-n", "w", "-x", "40", "-y", "11", "cat"] },
  { run = ["set", "-g", "status-right", "R"] },
  { run = ["set", "-s", "escape-time", "0"] },
  { run = ["bind", "-n", "M-a", "display-popup", "-w", "20", "-h", "5", "-x", "1", "-y", "5", "printf DONE"] },
  { run = ["bind", "-n", "M-b", "display-popup", "-k", "-w", "20", "-h", "5", "-x", "1", "-y", "5", "printf K"] },
  { run = ["bind", "-n", "M-c", "display-popup", "-E", "-w", "20", "-h", "5", "-x", "1", "-y", "5", "stty -echo; tmux wait-for -S up; exec cat"] },
  { run = ["bind", "-n", "M-d", "display-popup", "-EE", "-w", "20", "-h", "5", "-x", "1", "-y", "5", "printf THREE; exit 3"] },
  { run = ["bind", "-n", "M-e", "display-popup", "-T", "one", "-w", "20", "-h", "5", "-x", "1", "-y", "5", "tmux wait-for -S up; exec cat"] },
  { run = ["bind", "-n", "M-g", "display-popup", "-w", "41", "-h", "4", "printf BIG"] },
  { run = ["bind", "-n", "M-h", "display-popup", "-w", "2", "-h", "4", "printf SMALL"] },
  { run = ["bind", "-n", "M-i", "display-popup", "-B", "-w", "1", "-h", "1", "printf ONE"] },
  { run = ["bind", "-n", "M-j", "display-popup", "-E", "-w", "20", "-h", "5", "-x", "1", "-y", "5", "tmux wait-for -S up; read x; exit 7"] },
  { run = ["bind", "-n", "M-k", "display-popup", "-E", "-w", "20", "-h", "5", "-x", "1", "-y", "5", "stty raw -echo; tmux wait-for -S up; exec cat -v"] },
  { attach = { session = "a" } },
  { keys = "\u001ba" },
  { screen = {} },
  { keys = "x" },
  { screen = {} },
  { keys = "\u0003" },
  { screen = {} },
  { keys = "\u001bb" },
  { screen = {} },
  { keys = "x" },
  { screen = {} },
  { keys = "\u001bc" },
  { wait_for = "up" },
  { keys = "hello" },
  { settle = {} },
  { keys = "\u001b" },
  { screen = {} },
  { keys = "\r\u0004" },
  { screen = {} },
  { keys = "\u001bd" },
  { screen = {} },
  { keys = "\u001b" },
  { screen = {} },
  { keys = "\u001be" },
  { wait_for = "up" },
  { screen = {} },
  { keys = "\u001bf" },
  { screen = {} },
  { run = ["display-popup", "-T", "two", "-b", "double", "-S", "fg=red", "-w", "8", "-h", "3", "printf SECOND"] },
  { settle = { react = true } },
  { screen = {} },
  { run = ["display-popup", "-N", "-B"] },
  { settle = { react = true } },
  { screen = {} },
  { run = ["display-popup", "-C"] },
  { settle = { react = true } },
  { screen = {} },
  { keys = "\u001bg" },
  { screen = {} },
  { keys = "\u001bh" },
  { screen = {} },
  { keys = "\u001bi" },
  { screen = {} },
  { run = ["display-popup", "-C"] },
  { settle = { react = true } },
  { run = ["display-popup", "-w", "41", "printf BIG"] },
  { run = ["display-popup", "-w", "2", "printf SMALL"] },
  { run = ["display-popup", "-w", "0", "printf ZERO"] },
  { run = ["display-popup", "-h", "x%", "printf PCT"] },
  { run = ["display-popup", "-b", "bogus", "printf BOGUS"] },
  { run = ["display-popup", "-c", "nope", "printf NOPE"] },
  { run = ["run-shell", "-b", "tmux display-popup -E 'tmux wait-for -S up; exit 5'; tmux set -g @rc $?; tmux wait-for -S rc"] },
  { wait_for = "up" },
  { screen = {} },
  { wait_for = "rc" },
  { run = ["show", "-gv", "@rc"] },
  { run = ["run-shell", "-b", "tmux display-popup -EE 'tmux wait-for -S up; exit 4'; tmux set -g @rc $?; tmux wait-for -S rc"] },
  { wait_for = "up" },
  { settle = {} },
  { keys = "\u001b" },
  { wait_for = "rc" },
  { run = ["show", "-gv", "@rc"] },
  { run = ["run-shell", "-b", "tmux display-popup 'tmux wait-for -S up; exec cat'; tmux set -g @rc $?; tmux wait-for -S rc"] },
  { wait_for = "up" },
  { run = ["display-popup", "-C"] },
  { wait_for = "rc" },
  { run = ["show", "-gv", "@rc"] },
  { keys = "\u001bj" },
  { wait_for = "up" },
  { keys = "\r" },
  { settle = { react = true } },
  { screen = {} },
  { keys = "\u001bk" },
  { wait_for = "up" },
  { keys = "a\u001b[A\u0002\u0001" },
  { screen = {} },
  { run = ["display-popup", "-C"] },
  { settle = { react = true } },
  { screen = {} },
]
