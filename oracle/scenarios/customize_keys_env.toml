# customize-mode keys and environments (the selected empty Note line is not screened: vtmux erases its trailing space without the selection's foreground, a compositor difference): Enter on a key table adds a key (an unknown key and a missing command refused); a binding's Command set through its prompt (a bad command refused), its Note, its Repeat toggled; u unsets the binding; d resets a changed default binding; the Session Environment: Enter sets a variable, S sets it globally, Enter on the section adds one (NAME=value, a bad one refused, -NAME a removal), u unsets one; the global and session previews.
name = "customize_keys_env"
size = [80, 24]
steps = [
  { run = ["new", "-d", "-s", "aaa", "-n", "w0", "-x", "80", "-y", "23", "exec cat"] },
  { run = ["set", "-g", "status-right", "R"] },
  { run = ["set", "-g", "display-time", "0"] },
  { run = ["select-pane", "-t", "%0", "-T", "t0"] },
  { attach = { session = "aaa" } },
  { screen = {} },
  { run = ["customize-mode", "-t", "aaa:0.0", "-f", "#{m:User*,#{key}}"] },
  { settle = { react = true } },
  { keys = "jjjjjjjjjjj" },
  { screen = {} },
  { keys = "\r" },
  { screen = {} },
  { keys = "User0 display-message hello\r" },
  { screen = {} },
  { run = ["list-keys", "-T", "root", "User0"] },
  { keys = "\rNoSuchKey x\r" },
  { screen = {} },
  { keys = "\rUser1\r" },
  { screen = {} },
  { keys = "lj" },
  { screen = {} },
  { keys = "lj" },
  { screen = {} },
  { keys = "s" },
  { screen = {} },
  { keys = "\u0015display-message changed\r" },
  { screen = {} },
  { keys = "js" },
  { keys = "my note\r" },
  { screen = {} },
  { keys = "j" },
  { screen = {} },
  { keys = "s" },
  { screen = {} },
  { run = ["list-keys", "-T", "root", "User0"] },
  { run = ["list-keys", "-N", "-T", "root", "User0"] },
  { keys = "kk" },
  { screen = {} },
  { keys = "s\u0015not-a-command\r" },
  { screen = {} },
  { run = ["list-keys", "-T", "root", "User0"] },
  { keys = "ku" },
  { screen = {} },
  { keys = "y" },
  { screen = {} },
  { run = ["list-keys", "-T", "root", "User0"] },
  { keys = "q" },
  { settle = { react = true } },
  { run = ["bind", "-T", "prefix", "c", "display-message", "C"] },
  { run = ["customize-mode", "-t", "aaa:0.0", "-f", "#{==:#{key},c}"] },
  { settle = { react = true } },
  { keys = "\u001b+jjjjjjjjjjj" },
  { screen = {} },
  { keys = "d" },
  { screen = {} },
  { keys = "y" },
  { screen = {} },
  { run = ["list-keys", "-T", "prefix", "c"] },
  { keys = "q" },
  { settle = { react = true } },
  { run = ["setenv", "-t", "aaa", "CM_A", "one"] },
  { run = ["setenv", "-g", "CM_A", "g"] },
  { run = ["setenv", "-h", "-g", "CM_H", "hid"] },
  { run = ["customize-mode", "-t", "aaa:0.0", "-f", "#{m:CM_*,#{environment_name}}"] },
  { settle = { react = true } },
  { keys = "\u001b+" },
  { screen = {} },
  { keys = "jjjjjj" },
  { screen = {} },
  { keys = "j" },
  { screen = {} },
  { keys = "jj" },
  { screen = {} },
  { keys = "\r" },
  { screen = {} },
  { keys = "\u0015two\r" },
  { screen = {} },
  { run = ["showenv", "-t", "aaa", "CM_A"] },
  { keys = "S" },
  { screen = {} },
  { keys = "\u0015gg\r" },
  { screen = {} },
  { run = ["showenv", "-g", "CM_A"] },
  { keys = "k\r" },
  { screen = {} },
  { keys = "CM_B=bee\r" },
  { screen = {} },
  { keys = "\rnoequals\r" },
  { screen = {} },
  { keys = "\r-CM_C\r" },
  { screen = {} },
  { run = ["showenv", "-t", "aaa", "CM_B"] },
  { run = ["showenv", "-t", "aaa", "CM_C"] },
  { keys = "jj" },
  { screen = {} },
  { keys = "ju" },
  { screen = {} },
  { keys = "y" },
  { screen = {} },
  { run = ["showenv", "-t", "aaa", "CM_A"] },
  { keys = "q" },
  { screen = {} },
]
