# Pane prompts from the default copy-mode (emacs) bindings
# (key-bindings.c:566-643). C-s / C-r are incremental (-i,
# prompt.c prompt_key `changed:`): every edit runs
# search-forward/backward-incremental with a direction prefix, so the
# matches highlight as you type; C-s / C-r again search on (an empty line
# brings back #{pane_search_string}, prompt.c:1469-1490); an arrow key
# ends the prompt (prompt_check_move, PROMPT_KEY_MOVE) and moves; Enter
# closes without searching again. M-1..M-9 repeat counts (-N), g goto
# line, f F t T jumps. A top status puts the pane prompt on the pane's
# first line (screen-redraw.c:1640-1643).
name = "prompt_pane_emacs"
size = [40, 8]
steps = [
  { run = ["new", "-d", "-s", "a", "-n", "w", "-x", "40", "-y", "7", "sh", "-c", "i=1; while [ $i -le 12 ]; do echo \"line$i foo bar\"; i=$((i+1)); done; tmux wait-for -S ready; exec cat"] },
  { wait_for = "ready" },
  { run = ["select-pane", "-t", "%0", "-T", "t"] },
  { run = ["set", "-g", "status-right", "R"] },
  { run = ["set", "-g", "copy-mode-position-format", "#[align=right][#{copy_position}/#{copy_position_limit}]#{?search_count, (#{search_count} results),}"] },
  { attach = { session = "a" } },
  { run = ["copy-mode", "-t", "a"] },
  { settle = { react = true } },
  { keys = "\u0012" },
  { screen = {} },
  { keys = "l" },
  { screen = {} },
  { keys = "ine1" },
  { screen = {} },
  { run = ["display", "-p", "-t", "a", "[#{copy_cursor_x},#{copy_cursor_y}] [#{pane_search_string}]"] },
  { keys = "0" },
  { screen = {} },
  { keys = "\u007f" },
  { screen = {} },
  { keys = "\u0012" },
  { screen = {} },
  { keys = "\u0013" },
  { screen = {} },
  { keys = "\r" },
  { screen = {} },
  { run = ["display", "-p", "-t", "a", "[#{copy_cursor_x},#{copy_cursor_y}] [#{pane_search_string}]"] },
  { run = ["show-prompt-history", "-T", "search"] },
  { keys = "\u0013" },
  { screen = {} },
  { keys = "\u0013" },
  { screen = {} },
  { keys = "\u001b[B" },
  { screen = {} },
  { run = ["display", "-p", "-t", "a", "[#{copy_cursor_x},#{copy_cursor_y}] [#{pane_search_string}]"] },
  { keys = "\u0012" },
  { settle = {} },
  { keys = "bar" },
  { screen = {} },
  { keys = "\u0007" },
  { screen = {} },
  { run = ["display", "-p", "-t", "a", "[#{copy_cursor_x},#{copy_cursor_y}] [#{pane_search_string}]"] },
  { keys = "\u001b3" },
  { screen = {} },
  { keys = "\u001b[A" },
  { screen = {} },
  { run = ["display", "-p", "-t", "a", "[#{copy_cursor_x},#{copy_cursor_y}] [#{scroll_position}]"] },
  { keys = "g" },
  { screen = {} },
  { keys = "1\r" },
  { screen = {} },
  { run = ["display", "-p", "-t", "a", "[#{copy_cursor_x},#{copy_cursor_y}] [#{scroll_position}]"] },
  { keys = "\u0001f" },
  { settle = {} },
  { keys = "b" },
  { settle = {} },
  { run = ["display", "-p", "-t", "a", "[#{copy_cursor_x},#{copy_cursor_y}]"] },
  { keys = "F" },
  { settle = {} },
  { keys = "o" },
  { settle = {} },
  { run = ["display", "-p", "-t", "a", "[#{copy_cursor_x},#{copy_cursor_y}]"] },
  { keys = "t" },
  { settle = {} },
  { keys = "r" },
  { settle = {} },
  { run = ["display", "-p", "-t", "a", "[#{copy_cursor_x},#{copy_cursor_y}]"] },
  { keys = "T" },
  { settle = {} },
  { keys = "i" },
  { settle = {} },
  { run = ["display", "-p", "-t", "a", "[#{copy_cursor_x},#{copy_cursor_y}]"] },
  { run = ["set", "-g", "status-position", "top"] },
  { keys = "g" },
  { screen = {} },
  { keys = "\u0003" },
  { screen = {} },
  { run = ["set", "-g", "status-position", "bottom"] },
  { run = ["split-window", "-h", "-t", "a", "cat"] },
  { run = ["copy-mode", "-t", "%0"] },
  { run = ["select-pane", "-t", "%0"] },
  { keys = "\u0013" },
  { screen = {} },
  { keys = "foo" },
  { screen = {} },
  { run = ["select-pane", "-t", "%1"] },
  { settle = { react = true } },
  { screen = {} },
  { keys = "o" },
  { screen = {} },
  { keys = "\r" },
  { screen = {} },
  { run = ["send-keys", "-t", "%0", "-X", "cancel"] },
  { settle = { react = true } },
  { screen = {} },
]
