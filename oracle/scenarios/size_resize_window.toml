name = "size_resize_window"
size = [50, 15]
steps = [
  { run = ["new", "-d", "-s", "a", "-n", "w", "-x", "80", "-y", "24", "sh", "-c", "n=0; trap 'n=$((n+1)); printf W$n.' WINCH; printf \"P \"; sleep 100000 & while :; do wait; done"] },
  { run = ["select-pane", "-t", "a", "-T", "t"] },
  { run = ["set", "-g", "status-format[0]", ""] },
  { run = ["new-window", "-d", "-t", "a:1", "-n", "x", "sh", "-c", "n=0; trap 'n=$((n+1)); printf W$n.' WINCH; printf \"P \"; sleep 100000 & while :; do wait; done"] },
  { attach = { session = "a" } },
  { screen = {} },
  { run = ["list-windows", "-t", "a", "-F", "#{window_index} #{window_width}x#{window_height} m=#{window_manual_width},#{window_manual_height} #{window-size}"] },
  { run = ["resize-window", "-t", "a:0", "-x", "30", "-y", "10"] },
  { screen = {} },
  { run = ["list-windows", "-t", "a", "-F", "#{window_index} #{window_width}x#{window_height} m=#{window_manual_width},#{window_manual_height} #{window-size}"] },
  { run = ["resize-window", "-t", "a:0", "-L", "5"] },
  { run = ["resize-window", "-t", "a:0", "-R"] },
  { run = ["resize-window", "-t", "a:0", "-U", "3"] },
  { run = ["list-windows", "-t", "a", "-F", "#{window_index} #{window_width}x#{window_height} m=#{window_manual_width},#{window_manual_height} #{window-size}"] },
  { run = ["resize-window", "-t", "a:0", "-D", "20"] },
  { screen = {} },
  { run = ["list-windows", "-t", "a", "-F", "#{window_index} #{window_width}x#{window_height} m=#{window_manual_width},#{window_manual_height} #{window-size}"] },
  { run = ["resize-window", "-t", "a:0", "-A"] },
  { run = ["resize-window", "-t", "a:1", "-a"] },
  { run = ["list-windows", "-t", "a", "-F", "#{window_index} #{window_width}x#{window_height} m=#{window_manual_width},#{window_manual_height} #{window-size}"] },
  { resize = [60, 20] },
  { screen = {} },
  { run = ["list-windows", "-t", "a", "-F", "#{window_index} #{window_width}x#{window_height} m=#{window_manual_width},#{window_manual_height} #{window-size}"] },
  { run = ["set-window-option", "-t", "a:0", "window-size", "latest"] },
  { screen = {} },
  { run = ["list-windows", "-t", "a", "-F", "#{window_index} #{window_width}x#{window_height} m=#{window_manual_width},#{window_manual_height} #{window-size}"] },
  { run = ["capture-pane", "-p", "-t", "a:0"] },
  { run = ["resize-window", "-t", "a:0", "-x", "0"] },
  { run = ["resize-window", "-t", "a:0", "-y", "10001"] },
  { run = ["resize-window", "-t", "a:0", "0"] },
  { run = ["resize-window", "-t", "a:0", "-L", "x"] },
]
