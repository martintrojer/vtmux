# choose-tree preview at a second client size, 50x24: one window or pane per strip (the current one in the middle), < and > at both ends, -NN big preview, -h hiding the mode's pane from its window's strip, the preview format and style options.
name = "tree_preview_narrow"
size = [50, 24]
steps = [
  { run = ["new", "-d", "-s", "aaa", "-n", "w0", "-x", "50", "-y", "23", 'printf zero\\n; exec cat'] },
  { run = ["set", "-g", "status-right", "R"] },
  { run = ["neww", "-d", "-t", "aaa:1", "-n", "w1", 'printf one\\n; exec cat'] },
  { run = ["splitw", "-d", "-t", "aaa:1", "printf \"\\033[31mred\\033[0m\\n\"; exec cat"] },
  { run = ["neww", "-d", "-t", "aaa:2", "-n", "w2", "exec cat"] },
  { run = ["splitw", "-d", "-t", "aaa:2", "exec cat"] },
  { run = ["splitw", "-d", "-h", "-t", "aaa:2", "printf \"wide \\344\\270\\226\\n\"; exec cat"] },
  { run = ["neww", "-d", "-t", "aaa:3", "-n", "w3", "exec cat"] },
  { run = ["splitw", "-d", "-t", "aaa:3", "exec cat"] },
  { run = ["splitw", "-d", "-t", "aaa:3", "exec cat"] },
  { run = ["splitw", "-d", "-t", "aaa:3", 'printf four\\n; exec cat'] },
  { run = ["new", "-d", "-s", "bbb", "-n", "x0", "-x", "50", "-y", "23", "exec cat"] },
  { run = ["neww", "-d", "-t", "bbb:1", "-n", "x1", 'printf xone\\n; exec cat'] },
  { run = ["neww", "-d", "-t", "bbb:2", "-n", "x2", 'printf xtwo\\n; exec cat'] },
  { run = ["neww", "-d", "-t", "bbb:3", "-n", "x3", "exec cat"] },
  { run = ["neww", "-d", "-t", "bbb:4", "-n", "x4", "exec cat"] },
  { run = ["select-window", "-t", "bbb:2"] },
  { run = ["new", "-d", "-s", "ccc", "-n", "y0", "-x", "50", "-y", "23", "exec cat"] },
  { run = ["select-pane", "-t", "%0", "-T", "t0", ";", "select-pane", "-t", "%1", "-T", "t1", ";", "select-pane", "-t", "%2", "-T", "t2", ";", "select-pane", "-t", "%3", "-T", "t3", ";", "select-pane", "-t", "%4", "-T", "t4", ";", "select-pane", "-t", "%5", "-T", "t5", ";", "select-pane", "-t", "%6", "-T", "t6", ";", "select-pane", "-t", "%7", "-T", "t7", ";", "select-pane", "-t", "%8", "-T", "t8", ";", "select-pane", "-t", "%9", "-T", "t9", ";", "select-pane", "-t", "%10", "-T", "t10", ";", "select-pane", "-t", "%11", "-T", "t11", ";", "select-pane", "-t", "%12", "-T", "t12", ";", "select-pane", "-t", "%13", "-T", "t13", ";", "select-pane", "-t", "%14", "-T", "t14", ";", "select-pane", "-t", "%15", "-T", "t15"] },
  { attach = { session = "aaa" } },
  { screen = {} },
  { run = ["choose-tree", "-s", "-t", "aaa:0.0"] },
  { settle = { react = true } },
  { screen = {} },
  { keys = "j" },
  { screen = {} },
  { keys = "<" },
  { screen = {} },
  { keys = "<<" },
  { screen = {} },
  { keys = ">>>>" },
  { screen = {} },
  { keys = "kl" },
  { screen = {} },
  { keys = "jjj" },
  { screen = {} },
  { keys = ">" },
  { screen = {} },
  { keys = "q" },
  { settle = { react = true } },
  { run = ["choose-tree", "-NN", "-t", "aaa:0.0"] },
  { settle = { react = true } },
  { screen = {} },
  { keys = "jjj" },
  { screen = {} },
  { keys = "q" },
  { settle = { react = true } },
  { run = ["select-window", "-t", "aaa:1"] },
  { settle = { react = true } },
  { run = ["choose-tree", "-h", "-w", "-t", "aaa:1.0"] },
  { settle = { react = true } },
  { screen = {} },
  { keys = "q" },
  { settle = { react = true } },
  { run = ["select-window", "-t", "aaa:0"] },
  { settle = { react = true } },
  { run = ["set", "-g", "tree-mode-preview-format", "#{?pane_format,P#{pane_index},W#{window_name}-#{session_name}}"] },
  { run = ["set", "-g", "tree-mode-preview-style", "fg=yellow,bold"] },
  { run = ["set", "-g", "tree-mode-border-style", "fg=cyan,bg=blue"] },
  { run = ["choose-tree", "-s", "-t", "aaa:0.0"] },
  { settle = { react = true } },
  { screen = {} },
  { keys = "jl" },
  { screen = {} },
  { run = ["set", "-g", "tree-mode-preview-format", ""] },
  { keys = "j" },
  { screen = {} },
]
