name = "copy_resize"
size = [40, 10]
steps = [
  { run = ["new", "-d", "-s", "a", "-n", "w", "-x", "40", "-y", "9", "sh", "-c", "i=1; while [ $i -le 30 ]; do echo line$i; i=$((i+1)); done; echo 'aaaaaaaaaabbbbbbbbbbccccccccccddddddddddeeeeeeeeee'; tmux wait-for -S ready; tmux wait-for go; i=0; while [ $i -lt 5 ]; do echo new$i; i=$((i+1)); done; tmux wait-for -S done; exec cat"] },
  { wait_for = "ready" },
  { run = ["select-pane", "-t", "%0", "-T", "t"] },
  { run = ["set", "-g", "copy-mode-position-format", "#[align=right][#{copy_position}/#{copy_position_limit}]"] },
  { attach = { session = "a" } },
  { run = ["copy-mode", "-t", "a"] },
  { run = ["send-keys", "-t", "a", "-X", "page-up"] },
  { run = ["send-keys", "-t", "a", "-X", "cursor-up"] },
  { run = ["display", "-p", "-t", "%0", "[#{scroll_position}] [#{copy_cursor_x},#{copy_cursor_y}] [#{copy_position}/#{copy_position_limit}] [#{copy_cursor_line}]"] },
  { run = ["splitw", "-d", "-v", "-t", "%0", "cat"] },
  { settle = { react = true } },
  { run = ["display", "-p", "-t", "%0", "[#{scroll_position}] [#{copy_cursor_x},#{copy_cursor_y}] [#{copy_position}/#{copy_position_limit}] [#{copy_cursor_line}]"] },
  { screen = {} },
  { run = ["kill-pane", "-t", "%1"] },
  { settle = { react = true } },
  { run = ["display", "-p", "-t", "%0", "[#{scroll_position}] [#{copy_cursor_x},#{copy_cursor_y}] [#{copy_position}/#{copy_position_limit}] [#{copy_cursor_line}]"] },
  { screen = {} },
  { resize = [30, 8] },
  { screen = {} },
  { run = ["display", "-p", "-t", "%0", "[#{scroll_position}] [#{copy_cursor_x},#{copy_cursor_y}] [#{copy_position}/#{copy_position_limit}] [#{copy_cursor_line}]"] },
  { resize = [40, 10] },
  { settle = {} },
  { run = ["send-keys", "-t", "%0", "-X", "scroll-up"] },
  { run = ["send-keys", "-t", "%0", "-X", "scroll-down"] },
  { settle = { react = true } },
  { screen = {} },
  { run = ["display", "-p", "-t", "%0", "[#{scroll_position}] [#{copy_cursor_x},#{copy_cursor_y}] [#{copy_position}/#{copy_position_limit}] [#{copy_cursor_line}]"] },
  { run = ["send-keys", "-t", "%0", "-X", "cancel"] },
  { run = ["copy-mode", "-t", "%0"] },
  { run = ["send-keys", "-t", "%0", "-X", "cursor-up"] },
  { run = ["send-keys", "-t", "%0", "-X", "cursor-left"] },
  { run = ["display", "-p", "-t", "%0", "[#{scroll_position}] [#{copy_cursor_x},#{copy_cursor_y}] [#{copy_position}/#{copy_position_limit}] [#{copy_cursor_line}]"] },
  { resize = [25, 10] },
  { screen = {} },
  { run = ["display", "-p", "-t", "%0", "[#{scroll_position}] [#{copy_cursor_x},#{copy_cursor_y}] [#{copy_position}/#{copy_position_limit}] [#{copy_cursor_line}]"] },
  { resize = [40, 10] },
  { settle = {} },
  { run = ["send-keys", "-t", "%0", "-X", "scroll-up"] },
  { run = ["send-keys", "-t", "%0", "-X", "scroll-down"] },
  { settle = { react = true } },
  { screen = {} },
  { run = ["display", "-p", "-t", "%0", "[#{scroll_position}] [#{copy_cursor_x},#{copy_cursor_y}] [#{copy_position}/#{copy_position_limit}] [#{copy_cursor_line}]"] },
  { run = ["send-keys", "-t", "%0", "-X", "cancel"] },
  { run = ["copy-mode", "-t", "%0"] },
  { run = ["wait-for", "-S", "go"] },
  { wait_for = "done" },
  { run = ["display", "-p", "-t", "%0", "[#{scroll_position}] [#{copy_cursor_x},#{copy_cursor_y}] [#{copy_position}/#{copy_position_limit}] [#{copy_cursor_line}]"] },
  { screen = {} },
  { run = ["splitw", "-d", "-h", "-t", "%0", "cat"] },
  { settle = { react = true } },
  { run = ["display", "-p", "-t", "%0", "[#{scroll_position}] [#{copy_cursor_x},#{copy_cursor_y}] [#{copy_position}/#{copy_position_limit}] [#{copy_cursor_line}]"] },
  { screen = {} },
  { run = ["send-keys", "-t", "%0", "-X", "history-bottom"] },
  { run = ["display", "-p", "-t", "%0", "[#{scroll_position}] [#{copy_cursor_x},#{copy_cursor_y}] [#{copy_position}/#{copy_position_limit}] [#{copy_cursor_line}]"] },
  { run = ["send-keys", "-t", "%0", "-X", "cancel"] },
  { settle = { react = true } },
  { screen = {} },
]
