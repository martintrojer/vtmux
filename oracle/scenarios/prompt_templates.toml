# command-prompt (cmd-command-prompt.c): -p prompts with -I inputs
# (format-expanded, prompt.c prompt_create), two prompts filling %1 and
# %2, -1 taking one key, -N taking digits until a non-digit accepts it and
# the key goes on to the key tables (prompt.c:1242-1249), -k naming a key,
# -e cancelling on BSpace when empty, -l keeping a comma in the prompt,
# the default `(name)` prompt, and -b not waiting. Keys after the one that
# opens a prompt are in their own write (prompt_key_order).
name = "prompt_templates"
size = [40, 6]
steps = [
  { run = ["new", "-d", "-s", "a", "-n", "w", "-x", "40", "-y", "5", "cat"] },
  { run = ["set", "-g", "status-right", "R"] },
  { run = ["bind", "-n", "M-a", "command-prompt", "-p", "name,val", "-I", "#{window_name},v", "set -g @%1 '%2'"] },
  { run = ["bind", "-n", "M-s", "command-prompt", "-1", "-p", "key?", "set -g @one '%%'"] },
  { run = ["bind", "-n", "M-n", "command-prompt", "-N", "-p", "num", "-I", "4", "set -g @num '%%'"] },
  { run = ["bind", "-n", "M-k", "command-prompt", "-k", "-p", "press", "set -g @key '%%'"] },
  { run = ["bind", "-n", "M-e", "command-prompt", "-e", "-I", "x", "set -g @e '%%'"] },
  { run = ["bind", "-n", "M-l", "command-prompt", "-l", "-p", "a,b", "set -g @l '%%'"] },
  { run = ["bind", "-n", "M-r", "command-prompt", "rename-window '%%'"] },
  { run = ["bind", "-n", "j", "set", "-g", "@after", "yes"] },
  { attach = { session = "a" } },
  { keys = "\u001ba" },
  { screen = {} },
  { keys = "1\r" },
  { screen = {} },
  { keys = "x'y\r" },
  { screen = {} },
  { run = ["show", "-gv", "@w1"] },
  { keys = "\u001bs" },
  { screen = {} },
  { keys = "Q" },
  { screen = {} },
  { run = ["show", "-gv", "@one"] },
  { keys = "\u001bn" },
  { screen = {} },
  { keys = "2" },
  { screen = {} },
  { keys = "j" },
  { screen = {} },
  { run = ["show", "-gv", "@num"] },
  { run = ["show", "-gv", "@after"] },
  { keys = "\u001bk" },
  { screen = {} },
  { keys = "\u001b[1;5A" },
  { screen = {} },
  { run = ["show", "-gv", "@key"] },
  { keys = "\u001be" },
  { screen = {} },
  { keys = "\u007f\u007f" },
  { screen = {} },
  { run = ["show", "-gqv", "@e"] },
  { keys = "\u001bl" },
  { screen = {} },
  { keys = "z\r" },
  { settle = {} },
  { run = ["show", "-gv", "@l"] },
  { keys = "\u001br" },
  { screen = {} },
  { keys = "nm\r" },
  { screen = {} },
  { run = ["command-prompt", "-b", "-t", "/dev/null", "ls"] },
  { run = ["command-prompt", "-T", "nope", "ls"] },
]
