name = "reflow_cells_used"
size = [10, 8]
# grid_reflow (grid.c) measures an unwrapped line by its cellused: the cells
# written to it, which an erase does not lower (grid_set_cell, grid_clear).
# Background cells past them stay on a line that fits the new width
# (grid_reflow_move) and go when it splits (grid_reflow_split) or joins
# (grid_reflow_join); a cursor past them goes to their end
# (grid_wrap_position). Each scene draws on 20x8, then a 10x8 client attaches
# (status off) and the window follows it. CLI scenes at the end resize with
# resize-window: an erased continuation (D-006's 5X scene), ECH over a whole
# line, and widening back, where tmux still has the cells past the narrow
# width (D-036).
steps = [
  { run = ["new", "-d", "-s", "init", "-n", "w", "-x", "10", "-y", "8", "cat", "-"] },
  { run = ["set", "-g", "status", "off"] },
  # bgel: EL 0 with a background after ab: cellused 2, one row that keeps its background to the width
  { run = ["new", "-d", "-s", "bgel", "-n", "w", "-x", "20", "-y", "8", "sh", "-c", "printf 'ab\\033[41m\\033[K\\033[0m\\r\\nnext'; tmux wait-for -S bgel; exec cat"] },
  { wait_for = "bgel" },
  { attach = { session = "bgel", id = "bgel" } },
  { run = ["display", "-p", "-t", "bgel:", "#{history_size} #{cursor_x},#{cursor_y} #{pane_width}"] },
  { run = ["capture-pane", "-p", "-e", "-S", "-", "-t", "bgel:"] },
  { screen = { id = "bgel" } },
  # bgelmid: the background from column 8 over written cells: cellused 15 splits, the second row five red blanks. capture without -e (the trailing escape follows tmux's cellsize, D-027) and no screen (tmux 3.8 draws one red cell of the five in its grid)
  { run = ["new", "-d", "-s", "bgelmid", "-n", "w", "-x", "20", "-y", "8", "sh", "-c", "printf 'abcdefghijklmno\\033[8G\\033[41m\\033[K\\033[0m\\r\\nnext'; tmux wait-for -S bgelmid; exec cat"] },
  { wait_for = "bgelmid" },
  { attach = { session = "bgelmid", id = "bgelmid" } },
  { run = ["display", "-p", "-t", "bgelmid:", "#{history_size} #{cursor_x},#{cursor_y} #{pane_width}"] },
  { run = ["capture-pane", "-p", "-S", "-", "-t", "bgelmid:"] },
  # bgdch: DCH with a background: grid_move_cells counts the moved-to cells (sx - n), not the red ones after
  { run = ["new", "-d", "-s", "bgdch", "-n", "w", "-x", "20", "-y", "8", "sh", "-c", "printf 'abcdefghijklmno\\033[3G\\033[41m\\033[5P\\033[0m\\r\\nnext'; tmux wait-for -S bgdch; exec cat"] },
  { wait_for = "bgdch" },
  { attach = { session = "bgdch", id = "bgdch" } },
  { run = ["display", "-p", "-t", "bgdch:", "#{history_size} #{cursor_x},#{cursor_y} #{pane_width}"] },
  { run = ["capture-pane", "-p", "-e", "-S", "-", "-t", "bgdch:"] },
  { screen = { id = "bgdch" } },
  # bgich: ICH counts up to the end of the line
  { run = ["new", "-d", "-s", "bgich", "-n", "w", "-x", "20", "-y", "8", "sh", "-c", "printf 'abcdefgh\\033[3G\\033[41m\\033[4@\\033[0m\\r\\nnext'; tmux wait-for -S bgich; exec cat"] },
  { wait_for = "bgich" },
  { attach = { session = "bgich", id = "bgich" } },
  { run = ["display", "-p", "-t", "bgich:", "#{history_size} #{cursor_x},#{cursor_y} #{pane_width}"] },
  { run = ["capture-pane", "-p", "-e", "-S", "-", "-t", "bgich:"] },
  { screen = { id = "bgich" } },
  # bgech: ECH with a background after ab: as EL
  { run = ["new", "-d", "-s", "bgech", "-n", "w", "-x", "20", "-y", "8", "sh", "-c", "printf 'ab\\033[41m\\033[10X\\033[0m\\r\\nnext'; tmux wait-for -S bgech; exec cat"] },
  { wait_for = "bgech" },
  { attach = { session = "bgech", id = "bgech" } },
  { run = ["display", "-p", "-t", "bgech:", "#{history_size} #{cursor_x},#{cursor_y} #{pane_width}"] },
  { run = ["capture-pane", "-p", "-e", "-S", "-", "-t", "bgech:"] },
  { screen = { id = "bgech" } },
  # bgwide: a wide character, then EL with a background
  { run = ["new", "-d", "-s", "bgwide", "-n", "w", "-x", "20", "-y", "8", "sh", "-c", "printf 'ab\\344\\270\\200cd\\033[41m\\033[K\\033[0m\\r\\nnext'; tmux wait-for -S bgwide; exec cat"] },
  { wait_for = "bgwide" },
  { attach = { session = "bgwide", id = "bgwide" } },
  { run = ["display", "-p", "-t", "bgwide:", "#{history_size} #{cursor_x},#{cursor_y} #{pane_width}"] },
  { run = ["capture-pane", "-p", "-e", "-S", "-", "-t", "bgwide:"] },
  { screen = { id = "bgwide" } },
  # bgwidesplit: a wide character on a line that splits, the background after its cellused. No screen: tmux's split moves the wide character's padding cell to the next row and draws it as a blank
  { run = ["new", "-d", "-s", "bgwidesplit", "-n", "w", "-x", "20", "-y", "8", "sh", "-c", "printf 'abcdefgh\\344\\270\\200ijk\\033[41m\\033[K\\033[0m\\r\\nnext'; tmux wait-for -S bgwidesplit; exec cat"] },
  { wait_for = "bgwidesplit" },
  { attach = { session = "bgwidesplit", id = "bgwidesplit" } },
  { run = ["display", "-p", "-t", "bgwidesplit:", "#{history_size} #{cursor_x},#{cursor_y} #{pane_width}"] },
  { run = ["capture-pane", "-p", "-e", "-S", "-", "-t", "bgwidesplit:"] },
  # bgwideedge: a wide character that no longer fits the first row
  { run = ["new", "-d", "-s", "bgwideedge", "-n", "w", "-x", "20", "-y", "8", "sh", "-c", "printf 'abcdefghi\\344\\270\\200\\033[41m\\033[K\\033[0m\\r\\nnext'; tmux wait-for -S bgwideedge; exec cat"] },
  { wait_for = "bgwideedge" },
  { attach = { session = "bgwideedge", id = "bgwideedge" } },
  { run = ["display", "-p", "-t", "bgwideedge:", "#{history_size} #{cursor_x},#{cursor_y} #{pane_width}"] },
  { run = ["capture-pane", "-p", "-e", "-S", "-", "-t", "bgwideedge:"] },
  { screen = { id = "bgwideedge" } },
  # bgcursor: the cursor past the cells the line used goes to their end (grid_wrap_position)
  { run = ["new", "-d", "-s", "bgcursor", "-n", "w", "-x", "20", "-y", "8", "sh", "-c", "printf 'ab\\033[41m\\033[K\\033[0m\\033[15G'; tmux wait-for -S bgcursor; exec cat"] },
  { wait_for = "bgcursor" },
  { attach = { session = "bgcursor", id = "bgcursor" } },
  { run = ["display", "-p", "-t", "bgcursor:", "#{history_size} #{cursor_x},#{cursor_y} #{pane_width}"] },
  { run = ["capture-pane", "-p", "-e", "-S", "-", "-t", "bgcursor:"] },
  { screen = { id = "bgcursor" } },
  # bgpast: text past the new width and a background after it: the second row has no background
  { run = ["new", "-d", "-s", "bgpast", "-n", "w", "-x", "20", "-y", "8", "sh", "-c", "printf 'abcdefghijklm\\033[41m\\033[K\\033[0m\\r\\nnext'; tmux wait-for -S bgpast; exec cat"] },
  { wait_for = "bgpast" },
  { attach = { session = "bgpast", id = "bgpast" } },
  { run = ["display", "-p", "-t", "bgpast:", "#{history_size} #{cursor_x},#{cursor_y} #{pane_width}"] },
  { run = ["capture-pane", "-p", "-e", "-S", "-", "-t", "bgpast:"] },
  { screen = { id = "bgpast" } },
  # erased: written cells erased with the default background still count: a blank second row
  { run = ["new", "-d", "-s", "erased", "-n", "w", "-x", "20", "-y", "8", "sh", "-c", "printf 'abcdefghijklmno\\033[4G\\033[K\\r\\nnext'; tmux wait-for -S erased; exec cat"] },
  { wait_for = "erased" },
  { attach = { session = "erased", id = "erased" } },
  { run = ["display", "-p", "-t", "erased:", "#{history_size} #{cursor_x},#{cursor_y} #{pane_width}"] },
  { run = ["capture-pane", "-p", "-e", "-S", "-", "-t", "erased:"] },
  { screen = { id = "erased" } },
  # bged: ED 2 with a background, then ab: the cleared lines used no cells, one row each
  { run = ["new", "-d", "-s", "bged", "-n", "w", "-x", "20", "-y", "8", "sh", "-c", "printf '\\033[41m\\033[2J\\033[0m\\033[Hab\\r\\nnext'; tmux wait-for -S bged; exec cat"] },
  { wait_for = "bged" },
  { attach = { session = "bged", id = "bged" } },
  { run = ["display", "-p", "-t", "bged:", "#{history_size} #{cursor_x},#{cursor_y} #{pane_width}"] },
  { run = ["capture-pane", "-p", "-e", "-S", "-", "-t", "bged:"] },
  { screen = { id = "bged" } },
  # ech5: 10x6, a wrapped line whose continuation ECH erased 5 cells: they join it, 15 cells on 14 columns
  { run = ["new", "-d", "-s", "ech5", "-n", "w", "-x", "10", "-y", "6", "sh", "-c", "printf 'x\\r\\naaaaaaaaaabbbbb\\r\\nccc\\033[3;1H\\033[5X\\033[6;1H'; tmux wait-for -S ech5; exec cat"] },
  { wait_for = "ech5" },
  { run = ["resize-window", "-t", "ech5", "-x", "14"] },
  { run = ["display", "-p", "-t", "ech5:", "#{history_size} #{cursor_x},#{cursor_y}"] },
  { run = ["capture-pane", "-p", "-e", "-S", "-", "-t", "ech5:"] },
  # echline: ECH over a whole continuation from its start is a line clear (grid_clear_lines): the line above unwraps
  { run = ["new", "-d", "-s", "echline", "-n", "w", "-x", "10", "-y", "6", "sh", "-c", "printf 'x\\r\\naaaaaaaaaabbbbb\\r\\nccc\\033[3;1H\\033[10X\\033[6;1H'; tmux wait-for -S echline; exec cat"] },
  { wait_for = "echline" },
  { run = ["resize-window", "-t", "echline", "-x", "14"] },
  { run = ["display", "-p", "-t", "echline:", "#{history_size} #{cursor_x},#{cursor_y}"] },
  { run = ["capture-pane", "-p", "-e", "-S", "-", "-t", "echline:"] },
  # grow: 20x8, narrowed to 10 and widened back: tmux keeps the red cells past column 10 (cellsize), vtmux has them to column 10 (D-036)
  { run = ["new", "-d", "-s", "grow", "-n", "w", "-x", "20", "-y", "8", "sh", "-c", "printf 'ab\\033[41m\\033[K\\033[0m\\r\\nnext'; tmux wait-for -S grow; exec cat"] },
  { wait_for = "grow" },
  { run = ["resize-window", "-t", "grow", "-x", "10"] },
  { run = ["display", "-p", "-t", "grow:", "#{history_size} #{cursor_x},#{cursor_y}"] },
  { run = ["capture-pane", "-p", "-e", "-S", "-", "-t", "grow:"] },
  { run = ["resize-window", "-t", "grow", "-x", "20"] },
  { run = ["display", "-p", "-t", "grow:", "#{history_size} #{cursor_x},#{cursor_y}"] },
  { divergence = { id = "D-036", expect = { kind = "cli", stdout = "ab\u001b[41m        \u001b[49m\nnext\n\n\n\n\n\n\n", stderr = "", exit = 0 } } },
  { run = ["capture-pane", "-p", "-e", "-S", "-", "-t", "grow:"] },
]
