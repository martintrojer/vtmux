name = "status_msg_display"
size = [40, 6]
steps = [
  { run = ["new", "-d", "-s", "a", "-n", "w", "cat"] },
  { run = ["select-pane", "-t", "a", "-T", "t"] },
  { run = ["set", "-g", "status-right", "R #{pane_title}"] },
  { attach = { session = "a" } },
  { screen = {} },
  { run = ["display-message", "-t", "a", "hello #{session_name}"] },
  { screen = {} },
  { settle = { quiet_ms = 1000 } },
  { screen = {} },
  { run = ["set", "-g", "message-style", "bg=red,fg=white"] },
  { run = ["display-message", "-t", "a", "#[fg=blue]styled## #[bg=green]x"] },
  { screen = {} },
  { settle = { quiet_ms = 1000 } },
  { run = ["set", "-g", "message-style", "bg=blue,width=10,align=right"] },
  { run = ["display-message", "-t", "a", "right"] },
  { screen = {} },
  { settle = { quiet_ms = 1000 } },
  { run = ["set", "-g", "message-style", "bg=blue,width=50%,align=centre,fill=cyan"] },
  { run = ["display-message", "-t", "a", "mid"] },
  { screen = {} },
  { settle = { quiet_ms = 1000 } },
  { run = ["set", "-g", "message-format", "<#{message}> #{session_name}"] },
  { run = ["display-message", "-d", "300", "-t", "a", "fmt"] },
  { screen = {} },
  { settle = { quiet_ms = 500 } },
  { screen = {} },
]
