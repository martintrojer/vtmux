name = "osc8_to_clients"
size = [40, 10]
# A client whose terminal has the hyperlinks feature (terminal-features,
# tty-features.c:96-109: Hls) is given each cell's link as tmux words it
# (tty.c tty_hyperlink): OSC 8 with the link's external id, tmuxN
# (hyperlinks.c hyperlinks_put: one for each link without an id=, one for a
# URI and id= however often written, so a link wrapped over two lines is one
# link), and OSC 8 with neither where it ends. The observer's capture shows
# each linked cell's id and URI. Copy mode draws the pane's links with the
# same ids (window_copy_init shares the pane's hyperlinks), here ones that
# scrolled into history before any client drew them.
steps = [
  { run = ["new", "-d", "-s", "a", "-n", "w", "-x", "40", "-y", "9", "sh", "-c", '''printf '\033]8;;file://h/t/a.txt\033\\a.txt\033]8;;\033\\  \033]8;;file://h/t/b\033\\b\033]8;;\033\\\n\033]8;id=x;http://e/\033\\one\033]8;;\033\\ mid \033]8;id=x;http://e/\033\\two\033]8;;\033\\\n\033]8;;http://w/\033\\WWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWW\033]8;;\033\\\n'; i=0; while [ $i -lt 8 ]; do echo; i=$((i+1)); done; printf END; tmux wait-for -S p; exec cat -'''] },
  { run = ["set", "-g", "status-right", "R"] },
  { run = ["set", "-g", "copy-mode-position-format", "#[align=right]P#{scroll_position}"] },
  { run = ["set", "-g", "terminal-features[9]", "xterm*:hyperlinks"] },
  { wait_for = "p" },
  { attach = { session = "a" } },
  { screen = {} },
  { run = ["copy-mode", "-t", "a"] },
  { run = ["send", "-t", "a", "-X", "history-top"] },
  { settle = { react = true } },
  { screen = {} },
  { run = ["send", "-t", "a", "-X", "cancel"] },
  { settle = { react = true } },
  { screen = {} },
]
