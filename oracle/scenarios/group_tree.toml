# Session groups attached and in choose-tree (window-tree.c:434-457, cmd-choose-tree.c:1139): two clients on two members of one group, each with its own current window on screen; the group_attached formats; new-window in one member shows on the other client's status line; choose-tree lists only the starting session of its own group and the first member of any other group, with the "(group NAME: LIST)" session text; -G lists every member; kill-session of the session a client is on moves it to another (detach-on-destroy off).
name = "group_tree"
size = [60, 16]
steps = [
  { run = ["new", "-d", "-s", "aaa", "-n", "w0", "-x", "60", "-y", "15", "exec cat"] },
  { run = ["set", "-g", "status-right", "R"] },
  { run = ["set", "-g", "automatic-rename", "off"] },
  { run = ["neww", "-d", "-t", "aaa:1", "-n", "w1", "exec cat"] },
  { run = ["new", "-d", "-t", "aaa", "-s", "bbb"] },
  { run = ["new", "-d", "-t", "aaa", "-s", "ccc"] },
  { run = ["new", "-d", "-s", "ddd", "-n", "x0", "-x", "60", "-y", "15", "exec cat"] },
  { run = ["new", "-d", "-t", "ddd", "-s", "eee"] },
  { run = ["new", "-d", "-s", "fff", "-n", "y0", "-x", "60", "-y", "15", "exec cat"] },
  { run = ["select-pane", "-t", "aaa:0.0", "-T", "t0", ";", "select-pane", "-t", "aaa:1.0", "-T", "t1", ";", "select-pane", "-t", "ddd:0.0", "-T", "t2", ";", "select-pane", "-t", "fff:0.0", "-T", "t3"] },
  { run = ["select-window", "-t", "bbb:1"] },
  { attach = { session = "aaa" } },
  { attach = { session = "bbb", id = "b" } },
  { screen = {} },
  { screen = { id = "b" } },
  { run = ["ls", "-F", "#{session_name} a=#{session_attached} ga=#{session_group_attached} gm=#{session_group_many_attached} n=#{session_group_size} l=#{session_group_list} cur=#{window_index}"] },
  { run = ["lsc", "-F", "#{client_session}"] },
  { run = ["neww", "-d", "-t", "ccc:5", "-n", "w5", "exec cat"] },
  { run = ["select-pane", "-t", "ccc:5.0", "-T", "t4"] },
  { settle = { react = true } },
  { screen = {} },
  { screen = { id = "b" } },
  { run = ["choose-tree", "-t", "bbb:1.0", "-s"] },
  { settle = { react = true } },
  { screen = { id = "b" } },
  { keys_to = { id = "b", keys = "q" } },
  { settle = { react = true } },
  { run = ["choose-tree", "-G", "-t", "bbb:1.0", "-s"] },
  { settle = { react = true } },
  { screen = { id = "b" } },
  { keys_to = { id = "b", keys = "q" } },
  { settle = { react = true } },
  { run = ["choose-tree", "-t", "aaa:0.0", "-s", "-N"] },
  { settle = { react = true } },
  { screen = {} },
  { keys = "q" },
  { settle = { react = true } },
  { run = ["set", "-g", "detach-on-destroy", "off"] },
  { run = ["kill-session", "-t", "aaa"] },
  { settle = { react = true } },
  { screen = {} },
  { run = ["lsc", "-F", "#{client_session}"] },
  { run = ["ls", "-F", "#{session_name} a=#{session_attached} ga=#{session_group_attached} gm=#{session_group_many_attached} n=#{session_group_size} l=#{session_group_list}"] },
  { run = ["kill-server"] },
]
