name = "title_apc_allow_set_title"
size = [40, 6]
# An APC sets the pane's title as OSC 2 does (input.c `input_exit_apc`): BEL
# and the other C0 controls inside it are ignored, CAN ends and dispatches
# it. With `allow-set-title` off neither OSC 0, OSC 2 nor an APC changes it
# (input.c:2725-2731, 2803-2809). Each step's output is followed by DSR 5,
# whose reply the program reads before it signals, so the server has parsed
# it all.
steps = [
  { run = ["new", "-d", "-s", "a", "-x", "40", "-y", "6", "sh", "-c", "stty raw -echo min 1 time 20; s() { printf \"$1\\033[5n\"; dd bs=1 count=4 >/dev/null 2>&1; tmux wait-for -S \"r$2\"; tmux wait-for \"g$2\"; }; s '\\033_one\\033\\\\' 1; s '\\033]2;two\\007\\033]0;two\\007\\033_three\\033\\\\' 2; s '\\033_fo\\007ur\\030' 3; s '\\033_\\033\\\\' 4; exec cat"] },
  { wait_for = "r1" },
  { run = ["display", "-p", "-t", "%0", "#{pane_title}"] },
  { run = ["set", "-g", "allow-set-title", "off"] },
  { run = ["wait-for", "-S", "g1"] },
  { wait_for = "r2" },
  { run = ["display", "-p", "-t", "%0", "#{pane_title}"] },
  { run = ["set", "-g", "allow-set-title", "on"] },
  { run = ["wait-for", "-S", "g2"] },
  { wait_for = "r3" },
  { run = ["display", "-p", "-t", "%0", "#{pane_title}"] },
  { run = ["wait-for", "-S", "g3"] },
  { wait_for = "r4" },
  { run = ["display", "-p", "-t", "%0", "#{pane_title}"] },
  { run = ["capture-pane", "-p", "-t", "%0"] },
  { run = ["wait-for", "-S", "g4"] },
]
