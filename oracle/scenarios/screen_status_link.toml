name = "screen_status_link"
size = [40, 10]
steps = [
  { run = ["new", "-d", "-s", "a", "-n", "w", "-x", "40", "-y", "9", "cat"] },
  { run = ["splitw", "-h", "-t", "%0", "cat"] },
  { run = ["select-pane", "-t", "%0", "-T", "t"] },
  { run = ["select-pane", "-t", "%1", "-T", "t"] },
  { run = ["set", "-w", "-t", "a", "pane-border-status", "top"] },
  { run = ["set", "-w", "-t", "a", "pane-border-format", "#[link=http://x]a            b"] },
  { attach = { session = "a" } },
  { screen = {} },
  { run = ["set", "-w", "-t", "a", "pane-border-format", "a#[link=http://x]            #[nolink]b"] },
  { screen = {} },
  { run = ["set", "-w", "-t", "a", "pane-border-lines", "spaces"] },
  { run = ["set", "-w", "-t", "a", "pane-border-format", "#[fg=red]a#[link=http://x]            #[nolink]            b"] },
  { screen = {} },
]
