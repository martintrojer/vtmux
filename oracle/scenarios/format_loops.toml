name = "format_loops"
# S W P L loops (two-client sorting is pinned by crates/vtmux-core/tests/loop_cases.sh), sort letters, the all,active form, window neighbours and the no-session abort.
steps = [
  { run = ["-f", "/dev/null", "new", "-d", "-s", "zeta", "-n", "charlie", "-x", "80", "-y", "24", "cat", ";",
           "new", "-d", "-s", "alpha", "-n", "w", "cat", ";",
           "new", "-d", "-s", "mike", "-n", "w", "cat", ";",
           "new-window", "-d", "-t", "zeta:2", "-n", "bravo", "cat", ";",
           "new-window", "-d", "-t", "zeta:4", "-n", "delta", "cat", ";",
           "split-window", "-d", "-h", "-t", "zeta:2.0", "cat", ";",
           "split-window", "-d", "-b", "-h", "-t", "zeta:2.0", "cat", ";",
           "select-window", "-t", "zeta:2", ";",
           "set", "-w", "-t", "zeta:4", "@tag", "d4"] },
  { run = ["select-pane", "-t", "%0", "-T", "t0"] },
  { run = ["select-pane", "-t", "%3", "-T", "t3"] },
  { run = ["select-pane", "-t", "%5", "-T", "t5"] },
  { run = ["select-pane", "-t", "%6", "-T", "t6"] },
  { run = ["select-pane", "-t", "%5"] },
  { control = { argv = ["attach", "-t", "zeta"], id = "c1" } },
  { run = ["display", "-p", "-t", "zeta:", "#{S:#{session_name}/#{session_id} }|#{S/n:#{session_name} }|#{S/nr:#{session_name} }|#{S/ir:#{session_name} }"] },
  { run = ["display", "-p", "-t", "zeta:", "#{S:#{session_name},[#{session_name}]}|#{S:#{loop_index}#{loop_last_flag},}"] },
  { run = ["display", "-p", "-t", "zeta:", "#{W:#{window_index}#{window_name}#{window_before_active}#{window_after_active}n#{next_window_index}#{next_@tag}p#{prev_window_index}|}"] },
  { run = ["display", "-p", "-t", "zeta:", "#{W/n:#{window_name} }|#{W/r:#{window_name} }|#{W:#{window_name},[#{window_name}]}"] },
  { run = ["display", "-p", "-t", "zeta:2", "#{P:#{pane_id}.#{pane_index}.#{pane_title} }|#{P/i:#{pane_id} }|#{P/r:#{pane_id} }|#{P:#{pane_id},[#{pane_id}]}"] },
  { run = ["display", "-p", "-t", "zeta:", "#{L:#{client_session}#{loop_index}#{loop_last_flag} }|#{L/nr:#{session_name}}|#{S:#{session_name},[#{session_name}]}"] },
  { run = ["set", "-gF", "@out", "#{S:#{W:#{session_name}.#{window_index}#{P:#{pane_id}}} }"] },
  { run = ["show", "-gv", "@out"] },
  { control_close = { id = "c1" } },
  { run = ["kill-server"] },
  { run = ["-f", "/dev/null", "start-server", ";", "set", "-g", "exit-empty", "off", ";", "set", "-gF", "@out", "X#{W:x}Y#{S:y}"] },
  { run = ["show", "-gv", "@out"] },
  { run = ["kill-server"] },
]
