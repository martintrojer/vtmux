name = "respawn_reinit_modes"
# respawn-pane resets the screen's modes to cursor and wrap (screen_reinit, screen.c:117, spawn.c:329):
# the cursor blinking, the very visible cursor and theme updates go and the tab stops are the default
# ones again (screen_reset_tabs); the cursor shape a program set stays.
steps = [
  { run = ["new", "-d", "-s", "a", "-n", "w", "-x", "80", "-y", "24", "sh", "-c", "printf '\\033[?12h\\033[34l\\033[?2031h\\033[3g\\033[1 q\\033[?2004h'; tmux wait-for -S one; exec cat -"] },
  { wait_for = "one" },
  { run = ["select-pane", "-t", "a:w", "-T", "t"] },
  { run = ["display", "-p", "-t", "a:w", "#{cursor_blinking}|#{cursor_very_visible}|#{cursor_shape}|#{bracket_paste_flag}|#{pane_private_modes}|#{pane_tabs}"] },
  { run = ["respawn-pane", "-k", "-t", "a:w", "sh", "-c", "tmux wait-for -S two; exec cat -"] },
  { wait_for = "two" },
  { run = ["display", "-p", "-t", "a:w", "#{cursor_blinking}|#{cursor_very_visible}|#{cursor_shape}|#{bracket_paste_flag}|#{pane_private_modes}|#{pane_tabs}"] },
]
