name = "client_flags_control"
steps = [
  { run = ["new", "-d", "-s", "a", "-n", "w", "-x", "80", "-y", "24", "cat"] },
  { run = ["new", "-d", "-s", "b", "-n", "w", "-x", "80", "-y", "24", "cat"] },
  { control = { argv = ["attach", "-t", "a"], id = "c1" } },
  { control_send = { id = "c1", line = "display -p 'f=#{client_flags} ro=#{client_readonly}'" } },
  { control_wait = { id = "c1", until = "%end" } },
  { control_send = { id = "c1", line = "refresh-client -f new-layouts,wait-exit,pause-after=5,bogus" } },
  { control_wait = { id = "c1", until = "%end" } },
  { control_send = { id = "c1", line = "display -p 'f=#{client_flags}'" } },
  { control_wait = { id = "c1", until = "%end" } },
  { control_send = { id = "c1", line = "refresh-client -F '!new-layouts,!pause-after,ignore-size,no-detach-on-destroy'" } },
  { control_wait = { id = "c1", until = "%end" } },
  { control_send = { id = "c1", line = "display -p 'f=#{client_flags}'" } },
  { control_wait = { id = "c1", until = "%end" } },
  { control_send = { id = "c1", line = "refresh-client -f read-only" } },
  { control_wait = { id = "c1", until = "%end" } },
  { control_send = { id = "c1", line = "refresh-client -f '!read-only'" } },
  { control_wait = { id = "c1", until = "%end" } },
  { control_send = { id = "c1", line = "display -p 'f=#{client_flags} ro=#{client_readonly}'" } },
  { control_wait = { id = "c1", until = "%end" } },
  { control_send = { id = "c1", line = "switch-client -r" } },
  { control_wait = { id = "c1", until = "%end" } },
  { control_send = { id = "c1", line = "display -p 'f=#{client_flags} ro=#{client_readonly}'" } },
  { control_wait = { id = "c1", until = "%end" } },
  { control_send = { id = "c1", line = "switch-client -r" } },
  { control_wait = { id = "c1", until = "%end" } },
  { control_send = { id = "c1", line = "display -p 'f=#{client_flags} ro=#{client_readonly}'" } },
  { control_wait = { id = "c1", until = "%end" } },
  { control_send = { id = "c1", line = "refresh-client -C 100,50" } },
  { control_wait = { id = "c1", until = "%end" } },
  { control_send = { id = "c1", line = "ls -F 's=#{window_width}x#{window_height}'" } },
  { control_wait = { id = "c1", until = "%end" } },
  { control_send = { id = "c1", line = "refresh-client -C @0:40x10" } },
  { control_wait = { id = "c1", until = "%end" } },
  { control_send = { id = "c1", line = "ls -F 's=#{window_width}x#{window_height}'" } },
  { control_wait = { id = "c1", until = "%end" } },
  { control_send = { id = "c1", line = "refresh-client -C @0:" } },
  { control_wait = { id = "c1", until = "%end" } },
  { control_send = { id = "c1", line = "ls -F 's=#{window_width}x#{window_height}'" } },
  { control_wait = { id = "c1", until = "%end" } },
  { control_send = { id = "c1", line = "refresh-client -C 0x5" } },
  { control_wait = { id = "c1", until = "%error" } },
  { control_send = { id = "c1", line = "refresh-client -C nonsense" } },
  { control_wait = { id = "c1", until = "%error" } },
  { control_send = { id = "c1", line = "refresh-client -A '%0:pause'" } },
  { control_wait = { id = "c1", until = "%end" } },
  { control_send = { id = "c1", line = "refresh-client -A '%0:continue'" } },
  { control_wait = { id = "c1", until = "%end" } },
  { control_send = { id = "c1", line = "refresh-client -S" } },
  { control_wait = { id = "c1", until = "%end" } },
  { control_send = { id = "c1", line = "refresh-client -t nosuch" } },
  { control_wait = { id = "c1", until = "%error" } },
  { control_send = { id = "c1", line = "switch-client -c nosuch -t b" } },
  { control_wait = { id = "c1", until = "%error" } },
  { control_send = { id = "c1", line = "switch-client -F -t b" } },
  { control_wait = { id = "c1", until = "%end" } },
  { control_send = { id = "c1", line = "display -p '#{client_session}'" } },
  { control_wait = { id = "c1", until = "%end" } },
  { control_close = { id = "c1" } },
]
