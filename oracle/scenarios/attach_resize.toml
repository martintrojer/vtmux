name = "attach_resize"
size = [40, 10]
steps = [
  { run = ["new", "-d", "-s", "a", "-n", "w", "sh", "-c", "printf '\\033]2;t\\033\\\\'; exec cat"] },
  { attach = { session = "a" } },
  { settle = {} },
  { run = ["display", "-p", "-t", "a", "#{pane_width}x#{pane_height}"] },
  { resize = [60, 12] },
  { settle = {} },
  { run = ["display", "-p", "-t", "a", "#{pane_width}x#{pane_height}"] },
  { keys = "\u0002d" },
  { settle = {} },
]
