# customize-mode `e` (window-customize.c window_customize_start_edit, spawn.c spawn_editor): the current option's value goes to `editor file`, which runs over the screen nine tenths of its size while the mode shows WAITING FOR EDITOR and takes only q, Escape and C-c; once the editor exits 0 the file (less one newline) is the option's new value. The editor here signals `opened`, waits for `go`, then appends `-new` to the file. A key binding's Command too, then q leaves the mode. The editor runs in a modal floating pane (oracle editor_modal_pane pins it); screens are of the mode before and after. The mode's redraw after `e` settles before `go`, so the `settle { react }` after `go` waits for the redraw the editor's exit brings (the README's *Races under load*: a busy host can take longer than the quiet time to finish the editor).
name = "customize_edit"
size = [80, 24]
steps = [
  { run = ["new", "-d", "-s", "a", "-n", "w", "-x", "80", "-y", "23", "exec cat"] },
  { run = ["set", "-g", "status-right", "R"] },
  { run = ["select-pane", "-t", "%0", "-T", "t0"] },
  { run = ["set", "-g", "@cm", "old"] },
  { run = ["set", "-g", "editor", "sh -c 'tmux wait-for -S opened; tmux wait-for go; printf \"%s\\n\" \"$(cat \"$1\")-new\" >\"$1\"' x"] },
  { run = ["bind-key", "-T", "prefix", "User2", "display-message old"] },
  { attach = { session = "a" } },
  { screen = {} },
  { run = ["customize-mode", "-t", "a:0.0", "-f", "#{==:#{option_name},@cm}"] },
  { settle = { react = true } },
  { keys = "j" },
  { keys = "\u001b[C" },
  { keys = "j" },
  { screen = {} },
  { keys = "e" },
  { wait_for = "opened" },
  { settle = {} },
  { run = ["wait-for", "-S", "go"] },
  { settle = { react = true } },
  { screen = {} },
  { run = ["show", "-gv", "@cm"] },
  { run = ["display", "-p", "-t", "a:0.0", "#{pane_in_mode}"] },
  { keys = "q" },
  { settle = { react = true } },
  { run = ["display", "-p", "-t", "a:0.0", "#{pane_in_mode}"] },
  { run = ["customize-mode", "-t", "a:0.0", "-f", "#{==:#{key},User2}"] },
  { settle = { react = true } },
  { keys = "jjjjjjjjjj" },
  { keys = "\u001b[C" },
  { keys = "j" },
  { keys = "\u001b[C" },
  { keys = "j" },
  { screen = {} },
  { keys = "e" },
  { wait_for = "opened" },
  { settle = {} },
  { run = ["wait-for", "-S", "go"] },
  { settle = { react = true } },
  { screen = {} },
  { run = ["list-keys", "-T", "prefix", "User2"] },
  { keys = "q" },
  { settle = { react = true } },
  { screen = {} },
]
