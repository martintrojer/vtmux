name = "join_pane_focus_reports"
# Joining or moving the focused last pane of a window with focus-events on
# (an attached, focused client on session a). tmux checks the focus where
# the state changes, synchronously: window_lost_pane leaves the source
# window with no active pane, window_set_active_pane (window.c:755-791)
# looks at the moved pane while the session still shows the source window
# (focus out), then session_select (session.c:505-524) looks at it again
# in the window now shown (focus in), cmd-join-pane.c:520-536. Each pane
# program asks for focus reports (?1004h) and the tty echoes them (^[[I,
# ^[[O); the hooks append to @log. join-pane and move-pane, with and
# without -d, same-session and cross-session, and a join that empties
# another session.
size = [80, 24]
steps = [
  { run = ["new", "-d", "-s", "a", "-n", "w0", "-x", "80", "-y", "24", "sh", "-c", "stty echo echoctl; printf '\\033[?1004h'; tmux wait-for -S p0; exec cat -"] },
  { wait_for = "p0" },
  { run = ["new", "-d", "-s", "b", "-n", "b0", "sh", "-c", "stty echo echoctl; printf '\\033[?1004h'; tmux wait-for -S p1; exec cat -"] },
  { wait_for = "p1" },
  { run = ["set", "-g", "status-right", "x"] },
  { run = ["set", "-g", "focus-events", "on"] },
  { run = ["set", "-g", "@log", ""] },
  { run = ["set-hook", "-g", "pane-focus-in", "set -agF @log '|#{hook}:#{hook_pane}'"] },
  { run = ["set-hook", "-g", "pane-focus-out", "set -agF @log '|#{hook}:#{hook_pane}'"] },
  { run = ["set-hook", "-g", "window-pane-changed", "set -agF @log '|#{hook}:#{hook_pane}'"] },
  { run = ["set-hook", "-g", "session-window-changed", "set -agF @log '|#{hook}:#{hook_session_name}:#{hook_window_index}'"] },
  { run = ["set-hook", "-g", "pane-moved", "set -agF @log '|#{hook}:#{hook_pane}'"] },
  { attach = { session = "a" } },
  { settle = {} },
  { run = ["show", "-gv", "@log"] },
  { run = ["set", "-g", "@log", ""] },
  { run = ["neww", "-t", "a:1", "-n", "sA", "sh", "-c", "stty echo echoctl; printf '\\033[?1004h'; tmux wait-for -S sA; exec cat -"] },
  { wait_for = "sA" },
  { run = ["set", "-g", "@log", ""] },
  { run = ["joinp", "-s", "a:1", "-t", "a:0"] },
  { run = ["show", "-gv", "@log"] },
  { run = ["set", "-g", "@log", ""] },
  { run = ["neww", "-t", "a:1", "-n", "sF", "sh", "-c", "stty echo echoctl; printf '\\033[?1004h'; tmux wait-for -S sF; exec cat -"] },
  { wait_for = "sF" },
  { run = ["set", "-g", "@log", ""] },
  { run = ["movep", "-b", "-f", "-h", "-s", "a:1", "-t", "a:0"] },
  { run = ["show", "-gv", "@log"] },
  { run = ["set", "-g", "@log", ""] },
  { run = ["neww", "-t", "a:1", "-n", "sB", "sh", "-c", "stty echo echoctl; printf '\\033[?1004h'; tmux wait-for -S sB; exec cat -"] },
  { wait_for = "sB" },
  { run = ["set", "-g", "@log", ""] },
  { run = ["movep", "-d", "-s", "a:1", "-t", "a:0"] },
  { run = ["show", "-gv", "@log"] },
  { run = ["set", "-g", "@log", ""] },
  { run = ["neww", "-t", "a:1", "-n", "sC", "sh", "-c", "stty echo echoctl; printf '\\033[?1004h'; tmux wait-for -S sC; exec cat -"] },
  { wait_for = "sC" },
  { run = ["set", "-g", "@log", ""] },
  { run = ["joinp", "-s", "a:1", "-t", "b:0"] },
  { run = ["show", "-gv", "@log"] },
  { run = ["set", "-g", "@log", ""] },
  { run = ["neww", "-t", "a:1", "-n", "sD", "sh", "-c", "stty echo echoctl; printf '\\033[?1004h'; tmux wait-for -S sD; exec cat -"] },
  { wait_for = "sD" },
  { run = ["set", "-g", "@log", ""] },
  { run = ["joinp", "-d", "-s", "a:1", "-t", "b:0"] },
  { run = ["show", "-gv", "@log"] },
  { run = ["set", "-g", "@log", ""] },
  { run = ["new", "-d", "-s", "c", "-n", "c0", "sh", "-c", "stty echo echoctl; printf '\\033[?1004h'; tmux wait-for -S sE; exec cat -"] },
  { wait_for = "sE" },
  { run = ["set", "-g", "@log", ""] },
  { run = ["joinp", "-s", "c:0", "-t", "a:0"] },
  { run = ["show", "-gv", "@log"] },
  { run = ["set", "-g", "@log", ""] },
  { run = ["lsp", "-a", "-F", "#{session_name}:#{window_index}.#{pane_index} #{pane_id} #{pane_active}"] },
  { run = ["send-keys", "-t", "%0", "zz"] },
  { wait_pane = { pane = "%0", has = "zz" } },
  { run = ["capture-pane", "-p", "-t", "%0"] },
  { run = ["send-keys", "-t", "%1", "zz"] },
  { wait_pane = { pane = "%1", has = "zz" } },
  { run = ["capture-pane", "-p", "-t", "%1"] },
  { run = ["send-keys", "-t", "%2", "zz"] },
  { wait_pane = { pane = "%2", has = "zz" } },
  { run = ["capture-pane", "-p", "-t", "%2"] },
  { run = ["send-keys", "-t", "%3", "zz"] },
  { wait_pane = { pane = "%3", has = "zz" } },
  { run = ["capture-pane", "-p", "-t", "%3"] },
  { run = ["send-keys", "-t", "%4", "zz"] },
  { wait_pane = { pane = "%4", has = "zz" } },
  { run = ["capture-pane", "-p", "-t", "%4"] },
  { run = ["send-keys", "-t", "%5", "zz"] },
  { wait_pane = { pane = "%5", has = "zz" } },
  { run = ["capture-pane", "-p", "-t", "%5"] },
  { run = ["send-keys", "-t", "%6", "zz"] },
  { wait_pane = { pane = "%6", has = "zz" } },
  { run = ["capture-pane", "-p", "-t", "%6"] },
  { run = ["send-keys", "-t", "%7", "zz"] },
  { wait_pane = { pane = "%7", has = "zz" } },
  { run = ["capture-pane", "-p", "-t", "%7"] },
  { run = ["kill-server"] },
]
