# window-size over a session group (resize.c clients_calculate_size: a client counts for every window its session has, so a group shares sizes): two clients of different sizes (30x8, 50x12) on two members of a group; smallest, largest and latest for the window both show; then client b selects window 1, which takes the smaller client a's size though a does not show it.
name = "group_resize"
size = [50, 12]
steps = [
  { run = ["new", "-d", "-s", "a", "-n", "w0", "-x", "50", "-y", "12", "exec cat"] },
  { run = ["set", "-g", "status-right", "R"] },
  { run = ["neww", "-d", "-t", "a:1", "-n", "w1", "exec cat"] },
  { run = ["new", "-d", "-t", "a", "-s", "b"] },
  { run = ["select-pane", "-t", "a:0.0", "-T", "t0", ";", "select-pane", "-t", "a:1.0", "-T", "t1"] },
  { run = ["set", "-g", "window-size", "smallest"] },
  { attach = { session = "a" } },
  { attach = { session = "b", id = "b" } },
  { resize = [30, 8] },
  { settle = { react = true } },
  { run = ["lsw", "-a", "-F", "#{session_name}:#{window_index} #{window_width}x#{window_height}"] },
  { screen = { id = "b" } },
  { run = ["set", "-g", "window-size", "largest"] },
  { settle = { react = true } },
  { run = ["lsw", "-a", "-F", "#{session_name}:#{window_index} #{window_width}x#{window_height}"] },
  { screen = {} },
  { run = ["set", "-g", "window-size", "latest"] },
  { keys_to = { id = "b", keys = "x" } },
  { settle = { react = true } },
  { run = ["lsw", "-a", "-F", "#{session_name}:#{window_index} #{window_width}x#{window_height}"] },
  { run = ["set", "-g", "window-size", "smallest"] },
  { run = ["select-window", "-t", "b:1"] },
  { settle = { react = true } },
  { run = ["lsw", "-a", "-F", "#{session_name}:#{window_index} #{window_width}x#{window_height}"] },
  { screen = { id = "b" } },
  { run = ["kill-server"] },
]
