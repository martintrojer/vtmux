name = "progress_bar"
size = [40, 8]
# OSC 9;4 progress bars (input.c input_osc_9, screen.c screen_set_progress_bar):
# a state 0-4 and a progress 0-100 kept by a state given without one and by
# indeterminate; malformed ones change nothing. #{pane_pb_state} and
# #{pane_pb_progress} read it, and the status line redraws at once
# (input_set_progress_bar). Each redraw passes the active pane's bar of the
# client's current window to a terminal with Spb, the progressbar feature
# (server-client.c server_client_set_progress_bar, tty.c tty_set_progress_bar):
# client b has it, the first client does not. RIS keeps the bar, a respawn
# hides it (spawn.c screen_reinit). Each input ends with a marker the screen
# waits for, so the bar is set before anything reads it.
steps = [
  { run = ["new", "-d", "-s", "a", "-n", "w", "-x", "40", "-y", "7", "sh", "-c", "stty -echo; tmux wait-for -S up; exec cat -"] },
  { run = ["set", "-g", "status-right", "#{pane_pb_state}:#{pane_pb_progress}"] },
  { run = ["select-pane", "-t", "a:w", "-T", "t"] },
  { wait_for = "up" },
  { run = ["display", "-p", "#{pane_pb_state}|#{pane_pb_progress}"] },
  { attach = { session = "a" } },
  { run = ["set", "-s", "terminal-features[9]", "xterm*:progressbar"] },
  { attach = { session = "a", id = "b" } },
  { run = ["lsc", "-F", "#{?#{m:*progressbar*,#{client_termfeatures}},bar,none}"] },
  { feed = { pane = "%0", bytes = "\u001b]9;4;1;50\u001b\\m1\r" } },
  { wait_screen = { has = ["m1"] } },
  { wait_screen = { id = "b", has = ["m1"] } },
  { run = ["display", "-p", "#{pane_pb_state}|#{pane_pb_progress}"] },
  { progress = {} },
  { progress = { id = "b" } },
  { screen = { id = "b" } },
  { feed = { pane = "%0", bytes = "\u001b]9;4;3;70\u001b\\m2\r" } },
  { wait_screen = { id = "b", has = ["m2"] } },
  { run = ["display", "-p", "#{pane_pb_state}|#{pane_pb_progress}"] },
  { progress = { id = "b" } },
  { feed = { pane = "%0", bytes = "\u001b]9;4;5;1\u001b\\\u001b]9;4;1;7x\u001b\\\u001b]9;4;0\u001b\\m3\r" } },
  { wait_screen = { id = "b", has = ["m3"] } },
  { run = ["display", "-p", "#{pane_pb_state}|#{pane_pb_progress}"] },
  { progress = { id = "b" } },
  { screen = { id = "b" } },
  { feed = { pane = "%0", bytes = "\u001b]9;4;2;0050\u0007m4\r" } },
  { wait_screen = { id = "b", has = ["m4"] } },
  { run = ["display", "-p", "#{pane_pb_state}|#{pane_pb_progress}"] },
  { progress = { id = "b" } },
  { feed = { pane = "%0", bytes = "\u001b]9;4;1;\u001b\\m5\r" } },
  { wait_screen = { id = "b", has = ["m5"] } },
  { run = ["display", "-p", "#{pane_pb_state}|#{pane_pb_progress}"] },
  { progress = { id = "b" } },
  { feed = { pane = "%0", bytes = "\u001b]09;4;4;100\u001b\\m6\r" } },
  { wait_screen = { id = "b", has = ["m6"] } },
  { run = ["display", "-p", "#{pane_pb_state}|#{pane_pb_progress}"] },
  { progress = { id = "b" } },
  { screen = { id = "b" } },
  { feed = { pane = "%0", bytes = "\u001bcm7\r" } },
  { wait_screen = { id = "b", has = ["m7"] } },
  { run = ["display", "-p", "#{pane_pb_state}|#{pane_pb_progress}"] },
  { progress = { id = "b" } },
  { run = ["neww", "-n", "v", "cat", "-"] },
  { run = ["select-pane", "-t", "a:v", "-T", "tv"] },
  { settle = { react = true } },
  { run = ["display", "-p", "#{pane_pb_state}|#{pane_pb_progress}"] },
  { progress = { id = "b" } },
  { screen = { id = "b" } },
  { run = ["select-window", "-t", "a:w"] },
  { settle = { react = true } },
  { progress = { id = "b" } },
  { run = ["splitw", "-t", "a:w", "cat", "-"] },
  { run = ["select-pane", "-t", "a:w.1", "-T", "t2"] },
  { settle = { react = true } },
  { run = ["display", "-p", "#{pane_pb_state}|#{pane_pb_progress}"] },
  { progress = { id = "b" } },
  { run = ["select-pane", "-t", "a:w.0"] },
  { settle = { react = true } },
  { progress = { id = "b" } },
  { screen = { id = "b" } },
  { progress = {} },
  { run = ["respawn-pane", "-k", "-t", "%0", "sh", "-c", "stty -echo; tmux wait-for -S up2; exec cat -"] },
  { wait_for = "up2" },
  { run = ["display", "-p", "-t", "%0", "#{pane_pb_state}|#{pane_pb_progress}"] },
  { settle = { react = true } },
  { progress = { id = "b" } },
  { screen = { id = "b" } },
]
