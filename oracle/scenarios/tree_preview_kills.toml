# choose-tree while panes, windows and sessions go: the list is built again only by window_tree_update, which runs for a client whose status is to be redrawn (server_client_check_modes, server-client.c:2462-2478), or by the mode's own keys and commands. Killing a pane of a window that is not the client's current one redraws nothing on this client (server_kill_pane -> server_redraw_window), so the list keeps the gone pane while the preview (drawn from the live window) does not; the terminal answers its device attributes query at once, so tty_start_timer_callback's redraw (tty.c:311-324) never comes. A key draws the screen again but does not build the list; a kill from the mode (x y) does (window_tree_command_done).
name = "tree_preview_kills"
size = [80, 30]
steps = [
  { run = ["new", "-d", "-s", "aaa", "-n", "w0", "-x", "80", "-y", "29", "exec cat"] },
  { run = ["set", "-g", "status-right", "R"] },
  { run = ["set", "-g", "status-interval", "0"] },
  { run = ["neww", "-d", "-t", "aaa:1", "-n", "w1", "exec cat"] },
  { run = ["splitw", "-d", "-t", "aaa:1", "exec cat"] },
  { run = ["splitw", "-d", "-t", "aaa:1", "exec cat"] },
  { run = ["splitw", "-d", "-t", "aaa:1", "exec cat"] },
  { run = ["splitw", "-d", "-t", "aaa:1", "exec cat"] },
  { run = ["select-layout", "-t", "aaa:1", "tiled"] },
  { run = ["new", "-d", "-s", "bbb", "-n", "x0", "-x", "80", "-y", "29", "exec cat"] },
  { run = ["neww", "-d", "-t", "bbb:1", "-n", "x1", "exec cat"] },
  { run = ["select-pane", "-t", "%0", "-T", "t0", ";", "select-pane", "-t", "%1", "-T", "t1", ";", "select-pane", "-t", "%2", "-T", "t2", ";", "select-pane", "-t", "%3", "-T", "t3", ";", "select-pane", "-t", "%4", "-T", "t4", ";", "select-pane", "-t", "%5", "-T", "t5", ";", "select-pane", "-t", "%6", "-T", "t6", ";", "select-pane", "-t", "%7", "-T", "t7"] },
  { attach = { session = "aaa" } },
  { keys = "\u001b[?62;22c" },
  { screen = {} },
  { run = ["choose-tree", "-Z", "-t", "aaa:0.0"] },
  { settle = { react = true } },
  { keys = "jj>>" },
  { screen = {} },
  { run = ["kill-pane", "-t", "%5"] },
  { run = ["kill-pane", "-t", "%4"] },
  { settle = { react = true } },
  { screen = {} },
  { keys = "<<<<" },
  { screen = {} },
  { keys = "l" },
  { screen = {} },
  { keys = "j" },
  { screen = {} },
  { keys = "i" },
  { screen = {} },
  { run = ["kill-pane", "-t", "%2"] },
  { settle = {} },
  { keys = "i" },
  { screen = {} },
  { run = ["kill-window", "-t", "aaa:1"] },
  { settle = {} },
  { keys = "G" },
  { screen = {} },
  { run = ["kill-session", "-t", "bbb"] },
  { settle = {} },
  { keys = "k" },
  { screen = {} },
  { keys = "x" },
  { screen = {} },
  { keys = "y" },
  { screen = {} },
]
