# The default bindings, prefix = (choose-buffer -Z) and prefix D (choose-client -Z), from a key press, zoomed (their default formats show times, so no screens of them); choose-client's help screen; -h hiding the mode's own pane from the preview (the last pane instead); Enter on another client detaching it (detach-client -t with its name); d on the current client. 44 columns: the help box fits, the box title with the tty name does not.
name = "choose_keys"
size = [44, 34]
steps = [
  { run = ["new", "-d", "-s", "aaa", "-n", "w0", "-x", "44", "-y", "33", "exec cat"] },
  { run = ["new", "-d", "-s", "bbb", "-n", "x0", "-x", "44", "-y", "33", "exec cat"] },
  { run = ["set", "-g", "status-right", "R"] },
  { run = ["set", "-g", "tree-mode-selection-style", "bold"] },
  { run = ["splitw", "-d", "-t", "aaa:0", "exec cat"] },
  { run = ["select-pane", "-t", "%0", "-T", "t0"] },
  { run = ["select-pane", "-t", "%1", "-T", "t1"] },
  { run = ["select-pane", "-t", "%2", "-T", "t2"] },
  { run = ["set-buffer", "-b", "k1", "key buffer"] },
  { attach = { session = "aaa" } },
  { screen = {} },
  { keys = "\u0002=" },
  { settle = {} },
  { run = ["display", "-p", "#{window_zoomed_flag} #{pane_mode}"] },
  { keys = "q" },
  { settle = {} },
  { run = ["display", "-p", "#{window_zoomed_flag} #{pane_in_mode}"] },
  { attach = { session = "bbb", id = "b" } },
  { screen = { id = "b" } },
  { feed = { pane = "%0", bytes = "pane zero" } },
  { feed = { pane = "%1", bytes = "pane one" } },
  { feed = { pane = "%2", bytes = "pane two" } },
  { run = ["select-pane", "-t", "%2"] },
  { run = ["select-pane", "-t", "%0"] },
  { settle = { react = true } },
  { keys = "\u0002D" },
  { settle = {} },
  { run = ["display", "-p", "#{window_zoomed_flag} #{pane_mode}"] },
  { keys = "q" },
  { settle = {} },
  { run = ["display", "-p", "#{window_zoomed_flag} #{pane_in_mode}"] },
  { run = ["choose-client", "-Z", "-O", "creation", "-t", "aaa:0.0", "-F", "#{client_session}"] },
  { settle = { react = true } },
  { screen = {} },
  { keys = "\u001bOP" },
  { screen = {} },
  { keys = "q" },
  { screen = {} },
  { keys = "q" },
  { settle = { react = true } },
  { run = ["choose-client", "-Zh", "-O", "creation", "-t", "aaa:0.0", "-F", "#{client_session}"] },
  { settle = { react = true } },
  { screen = {} },
  { keys = "j\r" },
  { screen = {} },
  { screen = { id = "b" } },
  { run = ["list-clients", "-F", "#{client_session}"] },
  { attach = { session = "bbb", id = "c" } },
  { screen = { id = "c" } },
  { run = ["choose-client", "-O", "creation", "-t", "aaa:0.0", "-F", "#{client_session}"] },
  { settle = { react = true } },
  { keys = "d" },
  { screen = {} },
  { screen = { id = "c" } },
  { run = ["list-clients", "-F", "#{client_session}"] },
]
