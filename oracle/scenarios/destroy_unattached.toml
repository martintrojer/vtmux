# server_check_unattached (server-fn.c:529-560): run after every client leaves (server_client_lost, server-client.c:565), command clients included, and after a client changes session (server_client_set_session, server-client.c:479). A session nobody is attached to goes when destroy-unattached says so: on always, keep-last unless it is the last of its group, keep-group unless it is alone in its group, in name order. tmux walks its session tree while it removes from it, so a pass that destroys a session can skip the next one (D-051).
name = "destroy_unattached"
size = [40, 6]
steps = [
  { run = ["new", "-d", "-s", "base", "-n", "w", "-x", "40", "-y", "5", "cat", "-"] },
  { run = ["set", "-g", "exit-empty", "off"] },
  { run = ["set", "-g", "status-right", "R"] },
  { run = ["set", "-g", "@log", ""] },
  { run = ["set-hook", "-g", "session-closed", "set -gaF @log '[#{hook_session_name}]'"] },
  { run = ["new", "-d", "-s", "a", "-n", "w", "-x", "40", "-y", "5", "cat", "-"] },
  { run = ["set", "-t", "a", "destroy-unattached", "on"] },
  { run = ["ls", "-F", "#{session_name}"] },
  { run = ["show", "-gv", "@log"] },
  { run = ["new", "-d", "-s", "x", "-n", "w", "-x", "40", "-y", "5", "cat", "-"] },
  { run = ["new", "-d", "-s", "y", "-t", "x"] },
  { run = ["new", "-d", "-s", "z", "-t", "x"] },
  { run = ["new", "-d", "-s", "solo", "-n", "w", "-x", "40", "-y", "5", "cat", "-"] },
  { run = ["set", "-g", "destroy-unattached", "keep-last"] },
  { divergence = { id = "D-051", expect = { kind = "cli", stdout = "base\nsolo\nz\n", stderr = "", exit = 0 } } },
  { run = ["ls", "-F", "#{session_name}"] },
  { divergence = { id = "D-051", expect = { kind = "cli", stdout = "[a][x][y]\n", stderr = "", exit = 0 } } },
  { run = ["show", "-gv", "@log"] },
  { run = ["set", "-g", "destroy-unattached", "off"] },
  { run = ["kill-session", "-a", "-t", "base"] },
  { run = ["set", "-g", "@log", ""] },
  { run = ["set", "-g", "destroy-unattached", "keep-last"] },
  { run = ["new", "-d", "-s", "p", "-n", "w", "-x", "40", "-y", "5", "cat", "-"] },
  { run = ["new", "-d", "-s", "q", "-t", "p"] },
  { run = ["ls", "-F", "#{session_name}"] },
  { run = ["new", "-d", "-s", "solo", "-n", "w", "-x", "40", "-y", "5", "cat", "-"] },
  { run = ["set", "-g", "destroy-unattached", "keep-group"] },
  { run = ["ls", "-F", "#{session_name}"] },
  { run = ["show", "-gv", "@log"] },
  { run = ["set", "-g", "destroy-unattached", "off"] },
  { run = ["new", "-d", "-s", "c", "-n", "w", "-x", "40", "-y", "5", "cat", "-"] },
  { run = ["new", "-d", "-s", "d", "-n", "w", "-x", "40", "-y", "5", "cat", "-"] },
  { attach = { session = "c" } },
  { settle = {} },
  { run = ["set", "-t", "c", "destroy-unattached", "on"] },
  { run = ["ls", "-F", "#{session_name} #{session_attached}"] },
  { keys = "\u0002:" },
  { settle = {} },
  { keys = "switch-client -t d\r" },
  { settle = { react = true } },
  { run = ["ls", "-F", "#{session_name} #{session_attached}"] },
  { run = ["show", "-gv", "@log"] },
  { screen = {} },
  { run = ["set", "-t", "d", "destroy-unattached", "on"] },
  { run = ["ls", "-F", "#{session_name} #{session_attached}"] },
  { keys = "\u0002d" },
  { settle = { react = true } },
  { run = ["ls", "-F", "#{session_name}"] },
  { run = ["show", "-gv", "@log"] },
  { run = ["kill-server"] },
]
