name = "status_geom_noncurrent"
size = [40, 10]
steps = [
  { run = ["new", "-d", "-s", "a", "-n", "w", "sh", "-c", "n=0; trap 'n=$((n+1)); printf W$n.' WINCH; printf \"P \"; sleep 100000 & while :; do wait; done"] },
  { run = ["select-pane", "-t", "a", "-T", "t"] },
  { run = ["set", "-g", "status-format[0]", ""] },
  { run = ["new-window", "-d", "-t", "a:1", "-n", "x", "sh", "-c", "n=0; trap 'n=$((n+1)); printf W$n.' WINCH; printf \"P \"; sleep 100000 & while :; do wait; done"] },
  { attach = { session = "a" } },
  { screen = {} },
  { run = ["list-windows", "-t", "a", "-F", "#{window_index} #{window_width}x#{window_height}"] },
  { run = ["set", "-g", "status", "off"] },
  { screen = {} },
  { run = ["list-windows", "-t", "a", "-F", "#{window_index} #{window_width}x#{window_height}"] },
  { run = ["set", "-g", "status", "3"] },
  { run = ["set", "-g", "status-format[1]", ""] },
  { run = ["set", "-g", "status-format[2]", ""] },
  { screen = {} },
  { run = ["list-windows", "-t", "a", "-F", "#{window_index} #{window_width}x#{window_height}"] },
  { run = ["capture-pane", "-p", "-t", "a:1"] },
  { run = ["select-window", "-t", "a:1"] },
  { run = ["select-pane", "-t", "a:1", "-T", "t"] },
  { screen = {} },
  { run = ["list-windows", "-t", "a", "-F", "#{window_index} #{window_width}x#{window_height}"] },
  { run = ["capture-pane", "-p", "-t", "a:1"] },
  { run = ["capture-pane", "-p", "-t", "a:0"] },
]
