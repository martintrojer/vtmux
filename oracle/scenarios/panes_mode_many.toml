name = "panes_mode_many"
size = [80, 24]
steps = [
  { run = ["new", "-d", "-s", "a", "-n", "w", "-x", "80", "-y", "23", "cat"] },
  { run = ["set", "-g", "status-right", ""] },
  { run = ["splitw", "-h", "-t", "a", "cat"] },
  { run = ["splitw", "-v", "-t", "%1", "cat"] },
  { run = ["splitw", "-v", "-t", "%0", "cat"] },
  { run = ["splitw", "-h", "-t", "%3", "cat"] },
  { run = ["splitw", "-h", "-t", "%2", "cat"] },
  { run = ["splitw", "-v", "-t", "%2", "cat"] },
  { run = ["splitw", "-v", "-t", "%4", "cat"] },
  { run = ["splitw", "-h", "-t", "%5", "cat"] },
  { run = ["splitw", "-v", "-t", "%6", "cat"] },
  { run = ["splitw", "-h", "-t", "%7", "cat"] },
  { run = ["splitw", "-v", "-t", "%8", "cat"] },
  { run = ["select-layout", "-t", "a", "even-vertical"] },
  { attach = { session = "a" } },
  { settle = { react = true } },
  { run = ["display-panes", "-d", "0", "-t", "%0"] },
  { settle = { react = true } },
  { screen = {} },
  { keys = "k" },
  { settle = { react = true } },
  { run = ["display", "-p", "-t", "a", "#{pane_id} #{pane_index} #{pane_mode}"] },
  { run = ["select-layout", "-t", "a", "tiled"] },
  { settle = { react = true } },
  { run = ["display-panes", "-d", "0", "-t", "%0"] },
  { settle = { react = true } },
  { screen = {} },
  { keys = "q" },
  { settle = { react = true } },
]
