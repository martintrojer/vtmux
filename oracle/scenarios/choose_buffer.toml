# choose-buffer: no buffers (no mode, nothing printed), one buffer with the preview, several (a multi-line one, a long one, one with a tab and a wide character) through the sort orders (O, r), preview off and big (v), the help screen, Enter and p pasting, d deleting, tagging and D deleting the tagged, P pasting the tagged, the mode ending with the last buffer.
name = "choose_buffer"
size = [80, 24]
steps = [
  { run = ["new", "-d", "-s", "aaa", "-n", "w0", "-x", "80", "-y", "23", "exec cat"] },
  { run = ["set", "-g", "status-right", "R"] },
  { run = ["select-pane", "-t", "%0", "-T", "t0"] },
  { attach = { session = "aaa" } },
  { screen = {} },
  { run = ["choose-buffer", "-t", "aaa:0.0"] },
  { run = ["display", "-p", "-t", "aaa:0.0", "#{pane_in_mode}"] },
  { run = ["set-buffer", "-b", "one", "first buffer"] },
  { run = ["choose-buffer", "-t", "aaa:0.0", "-F", "#{buffer_name}=#{buffer_size}"] },
  { settle = { react = true } },
  { screen = {} },
  { keys = "q" },
  { settle = { react = true } },
  { run = ["set-buffer", "-b", "multi", "line one\nline two\n\tthird\u00e9\u4e2d"] },
  { run = ["set-buffer", "-b", "long", "0123456789abcdefghijklmnopqrstuvwxyz0123456789abcdefghijklmnopqrstuvwxyz"] },
  { run = ["set-buffer", "-b", "a", "x"] },
  { run = ["choose-buffer", "-t", "aaa:0.0", "-F", "#{buffer_name}=#{buffer_size}:#{buffer_sample}"] },
  { settle = { react = true } },
  { screen = {} },
  { keys = "j" },
  { screen = {} },
  { keys = "O" },
  { screen = {} },
  { keys = "O" },
  { screen = {} },
  { keys = "r" },
  { screen = {} },
  { keys = "O" },
  { screen = {} },
  { keys = "v" },
  { screen = {} },
  { keys = "v" },
  { screen = {} },
  { keys = "k" },
  { screen = {} },
  { keys = "v" },
  { resize = [80, 34] },
  { settle = { react = true } },
  { keys = "\u001bOP" },
  { screen = {} },
  { keys = "q" },
  { screen = {} },
  { keys = "q" },
  { resize = [80, 24] },
  { settle = { react = true } },
  { run = ["choose-buffer", "-t", "aaa:0.0", "-O", "name"] },
  { settle = { react = true } },
  { keys = "j\r" },
  { screen = {} },
  { run = ["display", "-p", "-t", "aaa:0.0", "#{pane_in_mode}"] },
  { run = ["choose-buffer", "-t", "aaa:0.0", "-O", "name", "-F", "#{buffer_name}"] },
  { settle = { react = true } },
  { keys = "d" },
  { screen = {} },
  { run = ["list-buffers", "-F", "#{buffer_name}"] },
  { keys = "GD" },
  { screen = {} },
  { keys = "ggtjt" },
  { screen = {} },
  { keys = "D" },
  { screen = {} },
  { run = ["list-buffers", "-F", "#{buffer_name}"] },
  { keys = "d" },
  { settle = { react = true } },
  { run = ["display", "-p", "-t", "aaa:0.0", "#{pane_in_mode}"] },
  { run = ["list-buffers", "-F", "#{buffer_name}"] },
  { screen = {} },
  { run = ["set-buffer", "-b", "p1", "AA"] },
  { run = ["set-buffer", "-b", "p2", "BB"] },
  { run = ["set-buffer", "-b", "p3", "CC"] },
  { run = ["choose-buffer", "-t", "aaa:0.0", "-O", "name", "-F", "#{buffer_name}"] },
  { settle = { react = true } },
  { keys = "tjt" },
  { screen = {} },
  { keys = "P" },
  { screen = {} },
  { run = ["display", "-p", "-t", "aaa:0.0", "#{pane_in_mode}"] },
  { run = ["choose-buffer", "-t", "aaa:0.0", "-O", "name", "-F", "#{buffer_name}"] },
  { settle = { react = true } },
  { keys = "jp" },
  { screen = {} },
]
