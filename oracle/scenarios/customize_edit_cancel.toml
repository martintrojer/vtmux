# customize-mode `e` when the edit goes nowhere (window-customize.c window_customize_key, window_customize_edit_close_cb, spawn.c spawn_editor_finish): an editor that exits non-zero changes nothing; an option unset while its editor runs is not set again; keys typed while the editor runs go to the editor, not the mode; `send-keys q` to the mode's pane while it runs leaves the mode, and what that editor writes afterwards goes nowhere; a flag option is not edited (no editor starts). Each editor signals `opened`, waits for `go` and exits at once after writing. tmux leaves the waiting box on the screen after an editor that failed until the next key redraws the mode (window_customize_edit_close_cb draws nothing then); vtmux redraws at once, so the screen is taken after a key. vtmux runs the editor in a popup, tmux in a modal floating pane (D-028): no screen is taken while one runs.
name = "customize_edit_cancel"
size = [80, 24]
steps = [
  { run = ["new", "-d", "-s", "a", "-n", "w", "-x", "80", "-y", "23", "exec cat"] },
  { run = ["set", "-g", "status-right", "R"] },
  { run = ["select-pane", "-t", "%0", "-T", "t0"] },
  { run = ["set", "-g", "@cm", "old"] },
  { attach = { session = "a" } },
  { run = ["set", "-g", "editor", "sh -c 'tmux wait-for -S opened; tmux wait-for go; printf bad >\"$1\"; exit 1' x"] },
  { run = ["customize-mode", "-t", "a:0.0", "-f", "#{==:#{option_name},@cm}"] },
  { settle = { react = true } },
  { keys = "j" },
  { keys = "\u001b[C" },
  { keys = "j" },
  { keys = "e" },
  { wait_for = "opened" },
  { run = ["wait-for", "-S", "go"] },
  { settle = { react = true, quiet_ms = 500 } },
  { run = ["show", "-gv", "@cm"] },
  { keys = "k" },
  { keys = "j" },
  { screen = {} },
  { run = ["set", "-g", "editor", "sh -c 'tmux wait-for -S opened; tmux wait-for go; printf edited >\"$1\"' x"] },
  { keys = "e" },
  { wait_for = "opened" },
  { run = ["set", "-gu", "@cm"] },
  { run = ["wait-for", "-S", "go"] },
  { settle = { react = true, quiet_ms = 500 } },
  { run = ["show", "-gv", "@cm"] },
  { run = ["display", "-p", "-t", "a:0.0", "#{pane_in_mode}"] },
  { run = ["set", "-g", "@cm", "old"] },
  { keys = "q" },
  { settle = { react = true } },
  { run = ["customize-mode", "-t", "a:0.0", "-f", "#{==:#{option_name},@cm}"] },
  { settle = { react = true } },
  { keys = "j" },
  { keys = "\u001b[C" },
  { keys = "j" },
  { keys = "e" },
  { wait_for = "opened" },
  { run = ["send-keys", "-t", "a:0.0", "q"] },
  { run = ["display", "-p", "-t", "a:0.0", "#{pane_in_mode}"] },
  { run = ["wait-for", "-S", "go"] },
  { settle = { react = true, quiet_ms = 500 } },
  { run = ["show", "-gv", "@cm"] },
  { screen = {} },
  { run = ["set", "-g", "editor", "sh -c 'tmux set -g @started 1' x"] },
  { run = ["customize-mode", "-t", "a:0.0", "-f", "#{==:#{option_name},mouse}"] },
  { settle = { react = true } },
  { keys = "j" },
  { keys = "\u001b[C" },
  { keys = "j" },
  { keys = "e" },
  { settle = { react = true, quiet_ms = 500 } },
  { screen = {} },
  { run = ["show", "-gqv", "@started"] },
  { keys = "q" },
  { settle = { react = true } },
  { screen = {} },
]
