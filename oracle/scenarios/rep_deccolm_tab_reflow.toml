name = "rep_deccolm_tab_reflow"
size = [14, 8]
# Three emulator corners. REP repeats only a character printed right before
# it: any control, escape or control sequence tmux knows, or the start of a
# string, clears INPUT_LAST (input.c input_c0_dispatch, input_esc_dispatch,
# input_csi_dispatch, input_enter_osc, INPUT_CSI_REP), one it does not know
# leaves it. DECCOLM set or reset homes the cursor (origin-relative) and
# clears the screen in the current background, into history under
# scroll-on-clear (input_csi_dispatch_sm_private, _rm_private,
# screen_write_clearscreen). A reflow measures a TAB cell by its width and
# each of its padding cells by one more (grid_reflow, grid_reflow_split,
# grid_reflow_join): a tab that does not fit moves whole, and one that fits
# by its cells but not by that measure splits after its first columns.
# The tab scenes draw on 20 columns; the 14x8 client (status off) narrows
# them, resize-window widens them back.
steps = [
  { run = ["new", "-d", "-s", "init", "-n", "w", "-x", "14", "-y", "8", "cat", "-"] },
  { run = ["set", "-g", "status", "off"] },
  # rep: after SGR, CR, BEL, DECSC, an OSC and a REP nothing repeats; after a UTF-8 character, an unknown ESC or CSI it does
  { run = ["new", "-d", "-s", "rep", "-n", "w", "-x", "14", "-y", "8", "sh", "-c", "printf 'ab\\033[31m\\033[3bz\\033[m\\r\\nab\\r\\033[3bz\\r\\nab\\007\\033[3bz\\r\\nab\\0337\\033[3bz\\r\\nab\\033]2;t\\007\\033[3bz\\r\\nab\\033[2b\\033[2bz\\r\\na\\303\\251\\033[2bz\\r\\nab\\033A\\033[1x\\033[2bz'; tmux wait-for -S rep; exec cat"] },
  { wait_for = "rep" },
  { attach = { session = "rep", id = "rep" } },
  { run = ["capture-pane", "-p", "-t", "rep:"] },
  { screen = { id = "rep" } },
  # deccolm: two lines scroll into history, X at the top left
  { run = ["new", "-d", "-s", "deccolm", "-n", "w", "-x", "14", "-y", "8", "sh", "-c", "printf 'l0\\r\\nl1\\033[3;5H\\033[?3hX'; tmux wait-for -S deccolm; exec cat"] },
  { wait_for = "deccolm" },
  { attach = { session = "deccolm", id = "deccolm" } },
  { run = ["display", "-p", "-t", "deccolm:", "#{history_size} #{cursor_x},#{cursor_y}"] },
  { run = ["capture-pane", "-p", "-S", "-", "-t", "deccolm:"] },
  { screen = { id = "deccolm" } },
  # deccolmbg: reset, in a blue background, under origin mode in a region from row 2
  { run = ["new", "-d", "-s", "deccolmbg", "-n", "w", "-x", "14", "-y", "8", "sh", "-c", "printf 'l0\\r\\nl1\\033[2;5r\\033[?6h\\033[44m\\033[?3l\\033[mX'; tmux wait-for -S deccolmbg; exec cat"] },
  { wait_for = "deccolmbg" },
  { attach = { session = "deccolmbg", id = "deccolmbg" } },
  { run = ["display", "-p", "-t", "deccolmbg:", "#{history_size} #{cursor_x},#{cursor_y}"] },
  { run = ["capture-pane", "-p", "-e", "-S", "-", "-t", "deccolmbg:"] },
  { screen = { id = "deccolmbg" } },
  # deccolmalt: on the alternate screen, no history
  { run = ["new", "-d", "-s", "deccolmalt", "-n", "w", "-x", "14", "-y", "8", "sh", "-c", "printf 'l0\\033[?1049hab\\r\\ncd\\033[?3hX'; tmux wait-for -S deccolmalt; exec cat"] },
  { wait_for = "deccolmalt" },
  { attach = { session = "deccolmalt", id = "deccolmalt" } },
  { run = ["display", "-p", "-t", "deccolmalt:", "#{history_size} #{cursor_x},#{cursor_y}"] },
  { screen = { id = "deccolmalt" } },
  # tabmove: a tab of 4 after 12 characters does not fit 14 columns: it moves whole with Z
  { run = ["new", "-d", "-s", "tabmove", "-n", "w", "-x", "20", "-y", "8", "sh", "-c", "printf 'abcdefghijkl\\tZ\\r\\nnext'; tmux wait-for -S tabmove; exec cat"] },
  { wait_for = "tabmove" },
  { attach = { session = "tabmove", id = "tabmove" } },
  { run = ["display", "-p", "-t", "tabmove:", "#{history_size} #{cursor_x},#{cursor_y} #{pane_width}"] },
  { run = ["capture-pane", "-p", "-S", "-", "-t", "tabmove:"] },
  { screen = { id = "tabmove" } },
  # tabsplit: ab, a tab of 6, c: 9 cells, 14 to tmux's reflow, so the line splits on 12 columns after the tab's fifth column
  { run = ["new", "-d", "-s", "tabsplit", "-n", "w", "-x", "20", "-y", "8", "sh", "-c", "printf 'ab\\tc'; tmux wait-for -S tabsplit; exec cat"] },
  { wait_for = "tabsplit" },
  { run = ["resize-window", "-t", "tabsplit", "-x", "12"] },
  { run = ["display", "-p", "-t", "tabsplit:", "#{history_size} #{cursor_x},#{cursor_y}"] },
  { run = ["capture-pane", "-p", "-S", "-", "-t", "tabsplit:"] },
  { run = ["resize-window", "-t", "tabsplit", "-x", "20"] },
  { run = ["display", "-p", "-t", "tabsplit:", "#{history_size} #{cursor_x},#{cursor_y}"] },
  { run = ["capture-pane", "-p", "-S", "-", "-t", "tabsplit:"] },
  # tabjoin: the moved tab joins its line again when widened
  { run = ["new", "-d", "-s", "tabjoin", "-n", "w", "-x", "20", "-y", "8", "sh", "-c", "printf 'abcdefghijkl\\tZ\\r\\nnext'; tmux wait-for -S tabjoin; exec cat"] },
  { wait_for = "tabjoin" },
  { run = ["resize-window", "-t", "tabjoin", "-x", "14"] },
  { run = ["resize-window", "-t", "tabjoin", "-x", "20"] },
  { run = ["display", "-p", "-t", "tabjoin:", "#{history_size} #{cursor_x},#{cursor_y}"] },
  { run = ["capture-pane", "-p", "-S", "-", "-t", "tabjoin:"] },
]
