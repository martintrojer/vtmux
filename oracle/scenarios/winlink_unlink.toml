name = "winlink_unlink"
steps = [
  { run = ["new", "-d", "-s", "a", "-n", "w0", "-x", "80", "-y", "24", "cat"] },
  { run = ["neww", "-d", "-t", "a:1", "-n", "w1", "cat"] },
  { run = ["neww", "-d", "-t", "a:2", "-n", "w2", "cat"] },
  { run = ["new", "-d", "-s", "b", "-n", "b0", "-x", "80", "-y", "24", "cat"] },
  { run = ["unlinkw", "-t", "a:1"] },
  { run = ["unlinkw", "-t", "a:9"] },
  { run = ["unlinkw", "-t", "nosuch:0"] },
  { run = ["linkw", "-s", "a:1", "-t", "b:5"] },
  { run = ["unlinkw", "-t", "b:5"] },
  { run = ["lsw", "-a", "-F", "#{session_name}:#{window_index} #{window_id} #{window_name} [#{window_flags}] linked=#{window_linked} n=#{window_linked_sessions} list=#{window_linked_sessions_list}"] },
  { run = ["linkw", "-s", "a:1", "-t", "b:5"] },
  { run = ["unlinkw", "-t", "a:1"] },
  { run = ["lsw", "-a", "-F", "#{session_name}:#{window_index} #{window_id} #{window_name} [#{window_flags}] linked=#{window_linked} n=#{window_linked_sessions} list=#{window_linked_sessions_list}"] },
  { run = ["linkw", "-s", "a:2", "-t", "b:6"] },
  { run = ["unlinkw", "-k", "-t", "a:2"] },
  { run = ["lsw", "-a", "-F", "#{session_name}:#{window_index} #{window_id} #{window_name} [#{window_flags}] linked=#{window_linked} n=#{window_linked_sessions} list=#{window_linked_sessions_list}"] },
  { run = ["unlinkw", "-k", "-t", "a:1"] },
  { run = ["lsw", "-a", "-F", "#{session_name}:#{window_index} #{window_id} #{window_name} [#{window_flags}] linked=#{window_linked} n=#{window_linked_sessions} list=#{window_linked_sessions_list}"] },
  { run = ["unlinkw", "-k", "-t", "b:0"] },
  { run = ["lsw", "-a", "-F", "#{session_name}:#{window_index} #{window_id} #{window_name} [#{window_flags}] linked=#{window_linked} n=#{window_linked_sessions} list=#{window_linked_sessions_list}"] },
  { run = ["ls", "-F", "#{session_name} #{session_windows} #{session_many_attached}"] },
  { run = ["unlinkw", "-k", "-t", "b:5"] },
  { run = ["lsw", "-a", "-F", "#{session_name}:#{window_index} #{window_id} #{window_name} [#{window_flags}] linked=#{window_linked} n=#{window_linked_sessions} list=#{window_linked_sessions_list}"] },
  { run = ["ls", "-F", "#{session_name} #{session_windows} #{session_many_attached}"] },
  { run = ["unlinkw", "-k", "-t", "a:0"] },
  { run = ["ls", "-F", "#{session_name} #{session_windows} #{session_many_attached}"] },
  { run = ["kill-server"] },
]
