name = "status_geom_top"
size = [40, 8]
steps = [
  { run = ["new", "-d", "-s", "a", "-n", "w", "sh", "-c", "printf '$ '; exec cat"] },
  { run = ["select-pane", "-t", "a", "-T", "t"] },
  { run = ["splitw", "-h", "-t", "a", "sh", "-c", "printf 'R '; exec cat"] },
  { run = ["select-pane", "-t", "a", "-T", "t"] },
  { run = ["set", "-g", "status-position", "top"] },
  { attach = { session = "a" } },
  { screen = {} },
  { keys = "hello" },
  { settle = {} },
  { screen = {} },
  { run = ["set", "-g", "status-format[1]", ""] },
  { run = ["set", "-g", "status", "2"] },
  { settle = { react = true } },
  { screen = {} },
  { run = ["display", "-p", "-t", "a", "#{window_height} #{pane_height}"] },
  { run = ["set", "-g", "status-position", "bottom"] },
  { settle = { react = true } },
  { screen = {} },
]
