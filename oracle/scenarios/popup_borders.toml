# display-popup border lines (options-table.c:81-83): popup-border-lines
# and -b in each of the 7 values, -B, a title (-T, expanded at the
# command) over the top line, and popup-style / popup-border-style
# expanded as formats at every draw (popup.c:96-135), with -s / -S over
# their colours. The PTY is the box's inside (stty size).
name = "popup_borders"
size = [40, 12]
steps = [
  { run = ["new", "-d", "-s", "a", "-n", "w", "-x", "40", "-y", "11", "cat"] },
  { run = ["set", "-g", "status-right", "R"] },
  { run = ["set", "-s", "escape-time", "0"] },
  { run = ["set", "-g", "@fg", "red"] },
  { run = ["bind", "-n", "M-a", "display-popup", "-w", "16", "-h", "5", "-x", "1", "-y", "5", "stty size; exec cat"] },
  { run = ["bind", "-n", "M-b", "display-popup", "-b", "double", "-w", "16", "-h", "5", "-x", "1", "-y", "5", "exec cat"] },
  { run = ["bind", "-n", "M-c", "display-popup", "-b", "heavy", "-w", "16", "-h", "5", "-x", "1", "-y", "5", "exec cat"] },
  { run = ["bind", "-n", "M-d", "display-popup", "-b", "simple", "-w", "16", "-h", "5", "-x", "1", "-y", "5", "exec cat"] },
  { run = ["bind", "-n", "M-e", "display-popup", "-b", "rounded", "-w", "16", "-h", "5", "-x", "1", "-y", "5", "exec cat"] },
  { run = ["bind", "-n", "M-f", "display-popup", "-b", "padded", "-w", "16", "-h", "5", "-x", "1", "-y", "5", "exec cat"] },
  { run = ["bind", "-n", "M-g", "display-popup", "-b", "none", "-w", "16", "-h", "5", "-x", "1", "-y", "5", "stty size; exec cat"] },
  { run = ["bind", "-n", "M-h", "display-popup", "-B", "-w", "16", "-h", "5", "-x", "1", "-y", "5", "stty size; exec cat"] },
  { run = ["bind", "-n", "M-i", "display-popup", "-T", "#{session_name}:#[fg=blue]x", "-w", "16", "-h", "5", "-x", "1", "-y", "5", "exec cat"] },
  { run = ["bind", "-n", "M-j", "display-popup", "-T", "a-very-long-title-here", "-w", "10", "-h", "4", "-x", "1", "-y", "5", "exec cat"] },
  { run = ["bind", "-n", "M-k", "display-popup", "-s", "bg=blue", "-S", "fg=yellow,bold", "-w", "16", "-h", "5", "-x", "1", "-y", "5", "printf 'X\\033[31mR\\033[42mG\\033[0m'; exec cat"] },
  { attach = { session = "a" } },
  { keys = "\u001ba" },
  { screen = {} },
  { run = ["display-popup", "-C"] },
  { settle = { react = true } },
  { keys = "\u001bb" },
  { screen = {} },
  { run = ["display-popup", "-C"] },
  { settle = { react = true } },
  { keys = "\u001bc" },
  { screen = {} },
  { run = ["display-popup", "-C"] },
  { settle = { react = true } },
  { keys = "\u001bd" },
  { screen = {} },
  { run = ["display-popup", "-C"] },
  { settle = { react = true } },
  { keys = "\u001be" },
  { screen = {} },
  { run = ["display-popup", "-C"] },
  { settle = { react = true } },
  { keys = "\u001bf" },
  { screen = {} },
  { run = ["display-popup", "-C"] },
  { settle = { react = true } },
  { keys = "\u001bg" },
  { screen = {} },
  { run = ["display-popup", "-C"] },
  { settle = { react = true } },
  { keys = "\u001bh" },
  { screen = {} },
  { run = ["display-popup", "-C"] },
  { settle = { react = true } },
  { run = ["set", "-g", "popup-border-lines", "heavy"] },
  { keys = "\u001ba" },
  { screen = {} },
  { run = ["display-popup", "-C"] },
  { settle = { react = true } },
  { run = ["set", "-g", "popup-border-lines", "single"] },
  { keys = "\u001bi" },
  { screen = {} },
  { run = ["display-popup", "-C"] },
  { settle = { react = true } },
  { keys = "\u001bj" },
  { screen = {} },
  { run = ["display-popup", "-C"] },
  { settle = { react = true } },
  { run = ["set", "-g", "popup-style", "fg=#{@fg},bg=green"] },
  { run = ["set", "-g", "popup-border-style", "fg=#{@fg},bg=cyan"] },
  { keys = "\u001bk" },
  { screen = {} },
  { run = ["set", "-g", "@fg", "magenta"] },
  { settle = { react = true } },
  { screen = {} },
  { run = ["display-popup", "-C"] },
  { settle = { react = true } },
