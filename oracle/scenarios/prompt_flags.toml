# command-prompt -N (digits; a non-digit accepts and goes on; keypad
# keys typed as characters, prompt.c prompt_keypad_key), -k (key names,
# including F1 and C-Space), -e, and -C (no freeze) against the default
# freeze.
name = "prompt_flags"
size = [40, 6]
steps = [
  { run = ["new", "-d", "-s", "a", "-n", "w", "-x", "40", "-y", "5", "cat"] },
  { run = ["bind", "-n", "M-n", "command-prompt", "-N", "-p", "num", "set -g @num '%%'"] },
  { run = ["bind", "-n", "M-k", "command-prompt", "-k", "-p", "press", "set -g @key '%%'"] },
  { run = ["bind", "-n", "M-e", "command-prompt", "-e", "-p", "e", "set -g @e '%%'"] },
  { run = ["bind", "-n", "M-c", "command-prompt", "-C", "-p", "c", "set -g @c '%%'"] },
  { run = ["bind", "-n", "M-f", "command-prompt", "-p", "f", "set -g @f '%%'"] },
  { attach = { session = "a" } },
  { settle = {} },
  { keys = "\u001bn" },
  { settle = {} },
  { keys = "12" },
  { screen = {} },
  { keys = "\r" },
  { screen = {} },
  { run = ["show", "-gv", "@num"] },
  { keys = "\u001bn" },
  { settle = {} },
  { keys = "x" },
  { screen = {} },
  { run = ["show", "-gv", "@num"] },
  { keys = "\u001bn" },
  { settle = {} },
  { keys = "7\u001b" },
  { settle = {} },
  { keys = "\u0002c" },
  { screen = {} },
  { run = ["show", "-gv", "@num"] },
  { run = ["list-windows", "-F", "#{window_index}"] },
  { keys = "\u001bn" },
  { settle = {} },
  { keys = "\u001b[OB" },
  { settle = {} },
  { keys = "\u001bOp" },
  { screen = {} },
  { run = ["show", "-gv", "@num"] },
  { keys = "\u001bk" },
  { settle = {} },
  { keys = "\u001bx" },
  { settle = {} },
  { run = ["show", "-gv", "@key"] },
  { keys = "\u001bk" },
  { settle = {} },
  { keys = "\u001bOP" },
  { settle = {} },
  { run = ["show", "-gv", "@key"] },
  { keys = "\u001bk" },
  { settle = {} },
  { keys = "\u0000" },
  { settle = {} },
  { run = ["show", "-gv", "@key"] },
  { keys = "\u001bk" },
  { settle = {} },
  { keys = "\r" },
  { screen = {} },
  { run = ["show", "-gv", "@key"] },
  { keys = "\u001bk" },
  { settle = {} },
  { keys = "é" },
  { settle = {} },
  { run = ["show", "-gv", "@key"] },
  { keys = "\u001bk" },
  { settle = {} },
  { keys = "\u001b" },
  { settle = { quiet_ms = 300 } },
  { run = ["show", "-gv", "@key"] },
  { keys = "\u001be" },
  { settle = {} },
  { keys = "a\u007f" },
  { screen = {} },
  { keys = "\u007f" },
  { screen = {} },
  { run = ["show", "-gqv", "@e"] },
  { keys = "\u001bc" },
  { settle = {} },
  { feed = { pane = "%0", bytes = "visible\r" } },
  { screen = {} },
  { keys = "\u0003" },
  { screen = {} },
  { keys = "\u001bf" },
  { settle = {} },
  { feed = { pane = "%0", bytes = "frozen\r" } },
  { screen = {} },
  { keys = "\u0003" },
  { screen = {} },
]
