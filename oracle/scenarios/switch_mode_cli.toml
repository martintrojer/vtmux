# switch-mode from the command line with a client attached (send-keys
# gives the keys to the mode for that client): -s with -F and a custom
# command, Up from the first row wraps to the last and Enter runs the
# command with `%%` the session target; a filter that matches nothing,
# movement over no rows, and Escape running nothing; -w with a filter and
# Down; -Z zooms while the mode is open and unzooms when it goes, but
# leaves a window that was zoomed already; -k kills the pane.
name = "switch_mode_cli"
size = [60, 16]
steps = [
  { run = ["new", "-d", "-s", "alpha", "-n", "main", "-x", "60", "-y", "15", "cat"] },
  { run = ["set", "-g", "status-right", "R"] },
  { run = ["set", "-g", "automatic-rename", "off"] },
  { run = ["select-pane", "-t", "alpha", "-T", "p0"] },
  { run = ["splitw", "-d", "-h", "-t", "alpha:main", "cat"] },
  { run = ["select-pane", "-t", "alpha:main.1", "-T", "p1"] },
  { run = ["neww", "-d", "-t", "alpha:", "-n", "pick-one", "cat"] },
  { run = ["select-pane", "-t", "alpha:1", "-T", "p2"] },
  { run = ["new", "-d", "-s", "bravo", "-n", "pick-two", "-x", "60", "-y", "15", "cat"] },
  { run = ["select-pane", "-t", "bravo", "-T", "p3"] },
  { run = ["new", "-d", "-s", "charlie", "-n", "last", "-x", "60", "-y", "15", "cat"] },
  { run = ["select-pane", "-t", "charlie", "-T", "p4"] },
  { run = ["set", "-g", "@picked", ""] },
  { attach = { session = "alpha" } },
  { run = ["switch-mode", "-s", "-t", "alpha:main.0", "-F", "SESSION #{session_name}", "set-option -g @picked '%%'"] },
  { settle = { react = true } },
  { screen = {} },
  { run = ["send-keys", "-t", "alpha:main.0", "Up"] },
  { settle = { react = true } },
  { screen = {} },
  { run = ["send-keys", "-t", "alpha:main.0", "Enter"] },
  { settle = { react = true } },
  { run = ["show", "-gv", "@picked"] },
  { run = ["display", "-p", "-t", "alpha:main.0", "#{pane_in_mode}"] },
  { run = ["set", "-g", "@picked", "unchanged"] },
  { run = ["switch-mode", "-s", "-t", "alpha:main.0", "-F", "NONE #{session_name}", "set-option -g @picked '%%'"] },
  { run = ["send-keys", "-t", "alpha:main.0", "-l", "no-such"] },
  { run = ["send-keys", "-t", "alpha:main.0", "Up", "Down", "PPage", "NPage", "Home", "End"] },
  { settle = { react = true } },
  { screen = {} },
  { run = ["send-keys", "-t", "alpha:main.0", "Escape"] },
  { settle = { react = true } },
  { run = ["show", "-gv", "@picked"] },
  { run = ["switch-mode", "-w", "-t", "alpha:main.0", "-F", "WINDOW #{session_name}:#{window_name}", "set-option -g @picked '%%'"] },
  { run = ["send-keys", "-t", "alpha:main.0", "-l", "pick"] },
  { settle = { react = true } },
  { screen = {} },
  { run = ["send-keys", "-t", "alpha:main.0", "Down", "Enter"] },
  { settle = { react = true } },
  { run = ["show", "-gv", "@picked"] },
  { run = ["switch-mode", "-Zs", "-t", "alpha:main.0"] },
  { settle = { react = true } },
  { screen = {} },
  { run = ["display", "-p", "-t", "alpha:main", "#{window_zoomed_flag}"] },
  { run = ["send-keys", "-t", "alpha:main.0", "Escape"] },
  { settle = { react = true } },
  { run = ["display", "-p", "-t", "alpha:main", "#{window_zoomed_flag}"] },
  { run = ["resize-pane", "-Z", "-t", "alpha:main.0"] },
  { run = ["switch-mode", "-Zs", "-t", "alpha:main.0"] },
  { run = ["send-keys", "-t", "alpha:main.0", "Escape"] },
  { settle = { react = true } },
  { run = ["display", "-p", "-t", "alpha:main", "#{window_zoomed_flag}"] },
  { run = ["resize-pane", "-Z", "-t", "alpha:main.0"] },
  { run = ["switch-mode", "-ks", "-t", "alpha:main.1"] },
  { run = ["send-keys", "-t", "alpha:main.1", "Escape"] },
  { settle = { react = true } },
  { run = ["list-panes", "-t", "alpha:main", "-F", "#{pane_index} #{pane_title}"] },
  { screen = {} },
]
