name = "panes_split_resize"
steps = [
  { run = ["new", "-d", "-s", "a", "-n", "w", "-x", "80", "-y", "24", "cat"] },
  { run = ["splitw", "-t", "a", "cat"] },
  { run = ["splitw", "-h", "-d", "-P", "cat"] },
  { run = ["splitw", "-v", "-b", "-d", "-l", "3", "-t", "%0", "-P", "-F", "#{pane_id}", "cat"] },
  { run = ["lsp", "-F", "#{pane_index} #{pane_id} #{pane_left},#{pane_top} #{pane_width}x#{pane_height} #{pane_active}#{pane_last}"] },
  { run = ["display", "-p", "#{window_panes} #{window_layout}"] },
  { run = ["splitw", "-l", "abc"] },
  { run = ["splitw", "-p", "200"] },
  { run = ["display", "-p", "-t", "a.{up-of}", "#{pane_id}"] },
  { run = ["display", "-p", "-t", "a.{bottom-right}", "#{pane_id}"] },
  { run = ["display", "-p", "-t", "a.!", "#{pane_id}"] },
  { run = ["selectp", "-L"] },
  { run = ["display", "-p", "#{pane_id}"] },
  { run = ["lastp"] },
  { run = ["display", "-p", "#{pane_id}"] },
  { run = ["resizep", "-t", "%0", "-R", "5"] },
  { run = ["resizep", "-t", "%1", "-y", "30%"] },
  { run = ["resizep", "-x", "abc"] },
  { run = ["resizep", "-U", "99999999999"] },
  { run = ["lsp", "-F", "#{pane_id} #{pane_width}x#{pane_height}"] },
  { run = ["resizep", "-Z"] },
  { run = ["display", "-p", "#{window_zoomed_flag} #{window_flags} #{pane_width}x#{pane_height}"] },
  { run = ["selectp", "-t", "%0"] },
  { run = ["display", "-p", "#{window_zoomed_flag} #{window_flags}"] },
  { run = ["resizep", "-Z"] },
  { run = ["splitw", "-d", "cat"] },
  { run = ["display", "-p", "#{window_zoomed_flag} #{window_panes}"] },
  { run = ["killp", "-t", "%99"] },
  { run = ["killp", "-f", "x"] },
  { run = ["killp", "-a", "-f", "#{==:#{pane_id},%2}"] },
  { divergence = { id = "D-001", expect = { kind = "cli", stdout = "0: [80x3] [history 0/2000,  bytes] %3\n1: [80x6] [history 0/2000,  bytes] %0 (active)\n2: [80x5] [history 0/2000,  bytes] %4\n3: [80x7] [history 0/2000,  bytes] %1\n", stderr = "", exit = 0 } } },
  { run = ["lsp"] },
  { run = ["killp", "-a"] },
  { run = ["lastp"] },
]
