# The empty-area menu (key-bindings.c DEFAULT_EMPTY_MENU) in a window whose
# only pane floats: MouseDown3Empty opens it, New Pane runs
# `new-pane; join-pane`, which makes a floating pane and tiles it.
name = "floating_menu_empty"
size = [80, 24]
steps = [
  { run = ["new", "-d", "-s", "a", "-n", "w", "-x", "80", "-y", "23", "cat", "-"] },
  { run = ["set", "-g", "status-right", "R"] },
  { run = ["set", "-g", "mouse", "on"] },
  { run = ["set", "-g", "default-command", "cat"] },
  { run = ["set", "-g", "automatic-rename", "off"] },
  { run = ["select-pane", "-t", "a", "-T", "p0"] },
  { run = ["break-pane", "-W", "-s", "%0"] },
  { run = ["resize-pane", "-t", "%0", "-x10", "-y4"] },
  { run = ["move-pane", "-t", "%0", "-P", "top-left"] },
  { attach = { session = "a" } },
  { screen = {} },
  { keys = "\u001b[<2;20;8M" },
  { screen = {} },
  { keys = "p" },
  { settle = {} },
  { run = ["select-pane", "-t", "%1", "-T", "p1"] },
  { settle = { react = true } },
  { screen = {} },
  { run = ["list-panes", "-t", "a", "-F", "#{pane_id} f#{pane_floating_flag} #{pane_left},#{pane_top} #{pane_width}x#{pane_height} a#{pane_active}"] },
]
