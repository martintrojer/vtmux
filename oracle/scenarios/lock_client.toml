# lock-client, lock-session, lock-server and lock-after-time (cmd-lock-server.c, server-fn.c server_lock*, session.c session_lock_timer, client.c MSG_LOCK): the lock command runs on the client's terminal (an alternate screen cleared for it) until it exits, the locked client is not listed or counted as attached, pane output is not drawn meanwhile, and the client is redrawn after it; an empty lock-command locks nothing; target errors.
name = "lock_client"
size = [40, 10]
steps = [
  { run = ["lock-server"] },
  { run = ["new", "-d", "-s", "a", "-n", "w", "-x", "40", "-y", "9", "exec cat"] },
  { run = ["new", "-d", "-s", "b", "-n", "v", "-x", "40", "-y", "9", "exec cat"] },
  { run = ["set", "-g", "status-right", "R"] },
  { run = ["set", "-g", "automatic-rename", "off"] },
  { run = ["select-pane", "-t", "a:0.0", "-T", "pa"] },
  { run = ["select-pane", "-t", "b:0.0", "-T", "pb"] },
  { run = ["lock-client"] },
  { run = ["lock-client", "-t", "nosuch"] },
  { run = ["lock-session", "-t", "nosuch"] },
  { run = ["lock-server"] },
  { run = ["set", "-g", "lock-command", "printf 'LOCK %s' ok; read x"] },
  { attach = { session = "a" } },
  { keys = "zebra\r" },
  { screen = {} },
  { run = ["lock-client"] },
  { settle = { react = true } },
  { screen = {} },
  { run = ["lsc"] },
  { run = ["display", "-p", "-t", "a", "#{session_attached}"] },
  { feed = { pane = "%0", bytes = "yak" } },
  { settle = { quiet_ms = 300 } },
  { screen = {} },
  { keys = "\r" },
  { settle = { react = true } },
  { screen = {} },
  { run = ["lsc", "-F", "#{client_session}"] },
  { attach = { session = "b", id = "b" } },
  { screen = { id = "b" } },
  { run = ["lock-session", "-t", "b"] },
  { settle = { react = true } },
  { screen = { id = "b" } },
  { screen = {} },
  { run = ["lsc", "-F", "#{client_session}"] },
  { keys_to = { id = "b", keys = "\r" } },
  { settle = { react = true } },
  { screen = { id = "b" } },
  { run = ["lock-server"] },
  { settle = { react = true } },
  { screen = {} },
  { screen = { id = "b" } },
  { run = ["lsc"] },
  { keys = "\r" },
  { keys_to = { id = "b", keys = "\r" } },
  { settle = { react = true } },
  { screen = {} },
  { screen = { id = "b" } },
  { run = ["set", "-g", "lock-command", ""] },
  { run = ["lock-server"] },
  { run = ["lsc", "-F", "#{client_session}"] },
  { run = ["set", "-g", "lock-command", "printf 'IDLE'; read x"] },
  { run = ["set", "-t", "b", "lock-after-time", "1"] },
  { keys_to = { id = "b", keys = "q" } },
  { settle = { react = true, quiet_ms = 2500 } },
  { screen = { id = "b" } },
  { screen = {} },
  { run = ["lsc", "-F", "#{client_session}"] },
  { run = ["set", "-t", "b", "lock-after-time", "0"] },
  { keys_to = { id = "b", keys = "\r" } },
  { settle = { react = true } },
  { screen = { id = "b" } },
]
