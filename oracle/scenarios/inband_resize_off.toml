name = "inband_resize_off"
size = [60, 12]
# D31 with `vtmux-inband-resize` off, its default, is tmux 3.8's. The pane
# program reads from a raw tty with dd and prints what it read through
# `cat -v`, a line each: DECRQM ?2048 answers 0 (tmux's table has no 2048,
# input.c:1651-1722), `?2048h` is ignored (input_csi_dispatch_sm_private,
# input.c:2022), so after a resize the next byte it reads is the key sent
# after the resize, not a report, and DECRQM still answers 0.
steps = [
  { run = ["new", "-d", "-s", "a", "-x", "60", "-y", "12", "sh", "-c", "stty raw -echo min 1 time 20; q() { printf \"$1\"; dd bs=1 count=$2 2>/dev/null | cat -v; printf '\\r\\n'; }; q '\\033[?2048$p' 11; printf '\\033[?2048h'; tmux wait-for -S set; q '' 1; q '\\033[?2048$p' 11; tmux wait-for -S ready; exec cat"] },
  { wait_for = "set" },
  { run = ["resize-window", "-t", "a", "-x", "50", "-y", "10"] },
  { run = ["send-keys", "-t", "%0", "-l", "Z"] },
  { wait_for = "ready" },
  { run = ["capture-pane", "-p", "-t", "%0"] },
]
