name = "panes_mode_keys"
size = [60, 20]
steps = [
  { run = ["new", "-d", "-s", "a", "-n", "w", "-x", "60", "-y", "19", "cat"] },
  { run = ["set", "-g", "status-right", ""] },
  { run = ["splitw", "-h", "-t", "a", "cat"] },
  { run = ["splitw", "-v", "-t", "%1", "cat"] },
  { attach = { session = "a" } },
  { run = ["display-panes", "-d", "0", "-t", "%0"] },
  { keys = "2" },
  { settle = { react = true } },
  { run = ["display", "-p", "-t", "a", "#{pane_id} #{pane_mode} #{window_zoomed_flag}"] },
  { run = ["display-panes", "-d", "0", "-t", "%2"] },
  { keys = "9" },
  { settle = { react = true } },
  { run = ["display", "-p", "-t", "a", "#{pane_id} #{pane_mode} #{window_zoomed_flag}"] },
  { run = ["display-panes", "-d", "0", "-t", "%2"] },
  { keys = "x" },
  { settle = { react = true } },
  { run = ["display", "-p", "-t", "a", "#{pane_id} #{pane_mode} #{window_zoomed_flag}"] },
  { run = ["display-panes", "-d", "0", "-N", "-t", "%2"] },
  { keys = "x1" },
  { settle = { react = true } },
  { run = ["display", "-p", "-t", "a", "#{pane_id} #{pane_mode} #{window_zoomed_flag}"] },
  { keys = "q" },
  { settle = { react = true } },
  { run = ["display", "-p", "-t", "a", "#{pane_id} #{pane_mode} #{window_zoomed_flag}"] },
  { run = ["set", "-w", "-t", "a", "pane-base-index", "1"] },
  { run = ["display-panes", "-d", "0", "-t", "%2"] },
  { settle = { react = true } },
  { screen = {} },
  { keys = "1" },
  { settle = { react = true } },
  { run = ["display", "-p", "-t", "a", "#{pane_id} #{pane_index} #{pane_mode}"] },
  { run = ["display-panes", "-d", "0", "-t", "%2", "set -g @r \"chose %% [%1]\""] },
  { keys = "3" },
  { settle = { react = true } },
  { run = ["show", "-gv", "@r"] },
  { run = ["display-panes", "-d", "0", "-t", "%2", "set -g @r 'q%%'"] },
  { keys = "1" },
  { settle = { react = true } },
  { run = ["show", "-gv", "@r"] },
  { run = ["display-panes", "-d", "0", "-t", "%2", "set -g @r \"%%%\""] },
  { keys = "2" },
  { settle = { react = true } },
  { run = ["show", "-gv", "@r"] },
  { run = ["display-panes", "-d", "0", "-t", "%2", "set -g @r %2"] },
  { keys = "2" },
  { settle = { react = true } },
  { run = ["show", "-gv", "@r"] },
  { run = ["display-panes", "-d", "0", "-t", "%2", "bogus-command %%"] },
  { keys = "2" },
  { settle = { react = true } },
  { screen = {} },
  { run = ["display-panes", "-d", "0", "-t", "%2", "set -g @r a ; set -g @s %%"] },
  { keys = "2" },
  { settle = { react = true } },
  { run = ["show", "-gv", "@r"] },
  { run = ["show", "-gv", "@s"] },
  { run = ["display-panes", "-d", "0", "-t", "%2", "{ set -g @r blk-%% }"] },
  { keys = "1" },
  { settle = { react = true } },
  { run = ["show", "-gv", "@r"] },
  { run = ["display-panes", "-d", "0", "-t", "%2"] },
  { keys = "a" },
  { settle = { react = true } },
  { run = ["display", "-p", "-t", "a", "#{pane_id} #{pane_mode}"] },
]
