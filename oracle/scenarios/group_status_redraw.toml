# A client of one group member sees the status line of a change made through another: new-window redraws every session of the group (server_redraw_session_group, or server_status_session_group for -d, cmd-new-window.c:166-170), break-pane the status of the source and target groups (cmd-break-pane.c:193-198), swap/link/unlink/move-window the group (server-fn.c:339,350; cmd-swap-window.c:88-91).
name = "group_status_redraw"
size = [50, 6]
steps = [
  { run = ["new", "-d", "-s", "a", "-n", "w0", "-x", "50", "-y", "5", "cat", "-"] },
  { run = ["set", "-g", "status-right", "R"] },
  { run = ["set", "-g", "automatic-rename", "off"] },
  { run = ["new", "-d", "-s", "g", "-t", "a"] },
  { run = ["new", "-d", "-s", "z", "-n", "zw", "cat", "-"] },
  { attach = { session = "a" } },
  { settle = {} },
  { run = ["neww", "-d", "-t", "g", "-n", "w1", "cat", "-"] },
  { settle = { react = true } },
  { screen = {} },
  { run = ["neww", "-t", "g", "-n", "w2", "cat", "-"] },
  { settle = { react = true } },
  { screen = {} },
  { run = ["splitw", "-d", "-t", "g:2", "cat", "-"] },
  { run = ["breakp", "-d", "-s", "g:2.1", "-t", "g:5", "-n", "br"] },
  { settle = { react = true } },
  { screen = {} },
  { run = ["swapw", "-d", "-s", "g:1", "-t", "g:5"] },
  { settle = { react = true } },
  { screen = {} },
  { run = ["linkw", "-d", "-s", "z:0", "-t", "g:7"] },
  { settle = { react = true } },
  { screen = {} },
  { run = ["unlinkw", "-t", "g:7"] },
  { settle = { react = true } },
  { screen = {} },
  { run = ["movew", "-d", "-s", "z:0", "-t", "g:8"] },
  { settle = { react = true } },
  { screen = {} },
  { run = ["renamew", "-t", "g:8", "moved"] },
  { settle = { react = true } },
  { screen = {} },
  { run = ["movew", "-r", "-t", "g"] },
  { settle = { react = true } },
  { screen = {} },
  { run = ["kill-server"] },
]
