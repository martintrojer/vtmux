name = "screen_pane_spaces"
size = [40, 10]
steps = [
  { run = ["new", "-d", "-s", "a", "-n", "w", "-x", "40", "-y", "9", "cat"] },
  { run = ["splitw", "-h", "-t", "%0", "cat"] },
  { run = ["select-pane", "-t", "%0", "-T", "t"] },
  { run = ["select-pane", "-t", "%1", "-T", "t"] },
  { feed = { pane = "%0", bytes = "\u001b[31ma            b\r\n\u001b[32;1m              c\u001b[0m\r\nd\u001b[34m   \u001b[0me" } },
  { attach = { session = "a" } },
  { screen = {} },
]
