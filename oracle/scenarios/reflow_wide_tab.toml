name = "reflow_wide_tab"
# A tab wider than the pane on a reflow (D-040 closed, Ghostty patch 0029).
# tmux's grid_reflow_split (grid.c) moves to the next line before every cell
# for which `width + gc.data.width > sx`, also with nothing on the line yet,
# so a TAB cell wider than the pane at the point a line splits leaves an
# empty line before it, and a line of that one cell (`at` 0) leaves two, the
# line emptied and the one skipped. grid_reflow_join skips empty wrapped
# lines looking for the next cell, and stops at one too wide even for an
# empty line: having consumed nothing it removes nothing, so each empty line
# stays (each later narrowing adds two more; a widening that still does not
# fit the tab too); once it has consumed a line the skipped ones go with it.
# A line tmux fills exactly (`width == sx`, a wide character's padding cell
# counted) joins nothing, so the line after it is split as one of its own.
# Each scene prints, resizes and reads #{history_size}, the cursor and
# capture-pane after each resize.
steps = [
  { run = ["new", "-d", "-s", "init", "-n", "w", "-x", "20", "-y", "6", "cat", "-"] },
  { run = ["set", "-g", "status", "off"] },
  # more: the D-040 line narrowed to 7, 5, 4, widened to 6 (the tab still does not fit) and 20
  { run = ["new", "-d", "-s", "more", "-n", "w", "-x", "20", "-y", "6", "sh", "-c", "printf 'ab\\r\\n\\tcd\\tx'; tmux wait-for -S more; exec cat"] },
  { wait_for = "more" },
  { run = ["resize-window", "-t", "more", "-x", "7"] },
  { run = ["display", "-p", "-t", "more:", "#{history_size} #{cursor_x},#{cursor_y}"] },
  { run = ["capture-pane", "-pJ", "-S", "-", "-t", "more:"] },
  { run = ["capture-pane", "-p", "-S", "-", "-t", "more:"] },
  { run = ["resize-window", "-t", "more", "-x", "5"] },
  { run = ["display", "-p", "-t", "more:", "#{history_size} #{cursor_x},#{cursor_y}"] },
  { run = ["capture-pane", "-pJ", "-S", "-", "-t", "more:"] },
  { run = ["capture-pane", "-p", "-S", "-", "-t", "more:"] },
  { run = ["resize-window", "-t", "more", "-x", "4"] },
  { run = ["display", "-p", "-t", "more:", "#{history_size} #{cursor_x},#{cursor_y}"] },
  { run = ["capture-pane", "-pJ", "-S", "-", "-t", "more:"] },
  { run = ["capture-pane", "-p", "-S", "-", "-t", "more:"] },
  { run = ["resize-window", "-t", "more", "-x", "6"] },
  { run = ["display", "-p", "-t", "more:", "#{history_size} #{cursor_x},#{cursor_y}"] },
  { run = ["capture-pane", "-pJ", "-S", "-", "-t", "more:"] },
  { run = ["capture-pane", "-p", "-S", "-", "-t", "more:"] },
  { run = ["resize-window", "-t", "more", "-x", "20"] },
  { run = ["display", "-p", "-t", "more:", "#{history_size} #{cursor_x},#{cursor_y}"] },
  { run = ["capture-pane", "-pJ", "-S", "-", "-t", "more:"] },
  { run = ["capture-pane", "-p", "-S", "-", "-t", "more:"] },
  # text: a tab after text, where the line splits: one empty row
  { run = ["new", "-d", "-s", "text", "-n", "w", "-x", "20", "-y", "6", "sh", "-c", "printf 'ab\\tc'; tmux wait-for -S text; exec cat"] },
  { wait_for = "text" },
  { run = ["resize-window", "-t", "text", "-x", "5"] },
  { run = ["display", "-p", "-t", "text:", "#{history_size} #{cursor_x},#{cursor_y}"] },
  { run = ["capture-pane", "-pJ", "-S", "-", "-t", "text:"] },
  { run = ["capture-pane", "-p", "-S", "-", "-t", "text:"] },
  { run = ["resize-window", "-t", "text", "-x", "3"] },
  { run = ["display", "-p", "-t", "text:", "#{history_size} #{cursor_x},#{cursor_y}"] },
  { run = ["capture-pane", "-pJ", "-S", "-", "-t", "text:"] },
  { run = ["capture-pane", "-p", "-S", "-", "-t", "text:"] },
  { run = ["resize-window", "-t", "text", "-x", "9"] },
  { run = ["display", "-p", "-t", "text:", "#{history_size} #{cursor_x},#{cursor_y}"] },
  { run = ["capture-pane", "-pJ", "-S", "-", "-t", "text:"] },
  { run = ["capture-pane", "-p", "-S", "-", "-t", "text:"] },
  # two: two tabs, the second wider than the pane after the first
  { run = ["new", "-d", "-s", "two", "-n", "w", "-x", "20", "-y", "6", "sh", "-c", "printf '\\t\\tz'; tmux wait-for -S two; exec cat"] },
  { wait_for = "two" },
  { run = ["resize-window", "-t", "two", "-x", "9"] },
  { run = ["display", "-p", "-t", "two:", "#{history_size} #{cursor_x},#{cursor_y}"] },
  { run = ["capture-pane", "-pJ", "-S", "-", "-t", "two:"] },
  { run = ["capture-pane", "-p", "-S", "-", "-t", "two:"] },
  { run = ["resize-window", "-t", "two", "-x", "5"] },
  { run = ["display", "-p", "-t", "two:", "#{history_size} #{cursor_x},#{cursor_y}"] },
  { run = ["capture-pane", "-pJ", "-S", "-", "-t", "two:"] },
  { run = ["capture-pane", "-p", "-S", "-", "-t", "two:"] },
  { run = ["resize-window", "-t", "two", "-x", "3"] },
  { run = ["display", "-p", "-t", "two:", "#{history_size} #{cursor_x},#{cursor_y}"] },
  { run = ["capture-pane", "-pJ", "-S", "-", "-t", "two:"] },
  { run = ["capture-pane", "-p", "-S", "-", "-t", "two:"] },
  { run = ["resize-window", "-t", "two", "-x", "20"] },
  { run = ["display", "-p", "-t", "two:", "#{history_size} #{cursor_x},#{cursor_y}"] },
  { run = ["capture-pane", "-pJ", "-S", "-", "-t", "two:"] },
  { run = ["capture-pane", "-p", "-S", "-", "-t", "two:"] },
  # hist: the empty rows of a history line are history
  { run = ["new", "-d", "-s", "hist", "-n", "w", "-x", "20", "-y", "6", "sh", "-c", "printf '\\t\\r\\nbb'; tmux wait-for -S hist; exec cat"] },
  { wait_for = "hist" },
  { run = ["resize-window", "-t", "hist", "-x", "8"] },
  { run = ["display", "-p", "-t", "hist:", "#{history_size} #{cursor_x},#{cursor_y}"] },
  { run = ["capture-pane", "-pJ", "-S", "-", "-t", "hist:"] },
  { run = ["capture-pane", "-p", "-S", "-", "-t", "hist:"] },
  { run = ["resize-window", "-t", "hist", "-x", "4"] },
  { run = ["display", "-p", "-t", "hist:", "#{history_size} #{cursor_x},#{cursor_y}"] },
  { run = ["capture-pane", "-pJ", "-S", "-", "-t", "hist:"] },
  { run = ["capture-pane", "-p", "-S", "-", "-t", "hist:"] },
  # joined: a join that consumed a line drops the empty lines it skipped
  { run = ["new", "-d", "-s", "joined", "-n", "w", "-x", "20", "-y", "6", "sh", "-c", "printf '\\t\\t\\t\\033[K\\t\\tga\\t'; tmux wait-for -S joined; exec cat"] },
  { wait_for = "joined" },
  { run = ["resize-window", "-t", "joined", "-x", "5"] },
  { run = ["display", "-p", "-t", "joined:", "#{history_size} #{cursor_x},#{cursor_y}"] },
  { run = ["capture-pane", "-pJ", "-S", "-", "-t", "joined:"] },
  { run = ["capture-pane", "-p", "-S", "-", "-t", "joined:"] },
  { run = ["resize-window", "-t", "joined", "-x", "3"] },
  { run = ["display", "-p", "-t", "joined:", "#{history_size} #{cursor_x},#{cursor_y}"] },
  { run = ["capture-pane", "-pJ", "-S", "-", "-t", "joined:"] },
  { run = ["capture-pane", "-p", "-S", "-", "-t", "joined:"] },
  { run = ["resize-window", "-t", "joined", "-x", "2"] },
  { run = ["display", "-p", "-t", "joined:", "#{history_size} #{cursor_x},#{cursor_y}"] },
  { run = ["capture-pane", "-pJ", "-S", "-", "-t", "joined:"] },
  { run = ["capture-pane", "-p", "-S", "-", "-t", "joined:"] },
  { run = ["resize-window", "-t", "joined", "-x", "5"] },
  { run = ["display", "-p", "-t", "joined:", "#{history_size} #{cursor_x},#{cursor_y}"] },
  { run = ["capture-pane", "-pJ", "-S", "-", "-t", "joined:"] },
  { run = ["capture-pane", "-p", "-S", "-", "-t", "joined:"] },
  # pad: a wide character's padding cell on the next line joins back
  { run = ["new", "-d", "-s", "pad", "-n", "w", "-x", "20", "-y", "6", "sh", "-c", "printf '\\345\\255\\227'; tmux wait-for -S pad; exec cat"] },
  { wait_for = "pad" },
  { run = ["resize-window", "-t", "pad", "-x", "2"] },
  { run = ["display", "-p", "-t", "pad:", "#{history_size} #{cursor_x},#{cursor_y}"] },
  { run = ["capture-pane", "-pJ", "-S", "-", "-t", "pad:"] },
  { run = ["capture-pane", "-p", "-S", "-", "-t", "pad:"] },
  { run = ["resize-window", "-t", "pad", "-x", "3"] },
  { run = ["display", "-p", "-t", "pad:", "#{history_size} #{cursor_x},#{cursor_y}"] },
  { run = ["capture-pane", "-pJ", "-S", "-", "-t", "pad:"] },
  { run = ["capture-pane", "-p", "-S", "-", "-t", "pad:"] },
  # padtab: a padding cell starts a line that splits before a tab
  { run = ["new", "-d", "-s", "padtab", "-n", "w", "-x", "20", "-y", "4", "sh", "-c", "printf 'cabeaaddddb\\thdbfg\\tgaceef\\033[K\\033[2Xec\\t\\t\\345\\255\\227\\345\\255\\227\\t\\t'; tmux wait-for -S padtab; exec cat"] },
  { wait_for = "padtab" },
  { run = ["resize-window", "-t", "padtab", "-x", "5"] },
  { run = ["display", "-p", "-t", "padtab:", "#{history_size} #{cursor_x},#{cursor_y}"] },
  { run = ["capture-pane", "-pJ", "-S", "-", "-t", "padtab:"] },
  { run = ["capture-pane", "-p", "-S", "-", "-t", "padtab:"] },
  { run = ["resize-window", "-t", "padtab", "-x", "2"] },
  { run = ["display", "-p", "-t", "padtab:", "#{history_size} #{cursor_x},#{cursor_y}"] },
  { run = ["capture-pane", "-pJ", "-S", "-", "-t", "padtab:"] },
  { run = ["capture-pane", "-p", "-S", "-", "-t", "padtab:"] },
  # full: a row a padding cell and a letter fill exactly joins no empty line after it
  { run = ["new", "-d", "-s", "full", "-n", "w", "-x", "20", "-y", "7", "sh", "-c", "printf 'gbbgd\\033[Kdhagafahgbhg\\t\\033[2X\\345\\255\\227c\\t\\r\\n\\345\\255\\227dddge\\tgaae\\t\\r\\n\\t\\033[1Xcfegccgbfc'; tmux wait-for -S full; exec cat"] },
  { wait_for = "full" },
  { run = ["resize-window", "-t", "full", "-x", "3"] },
  { run = ["display", "-p", "-t", "full:", "#{history_size} #{cursor_x},#{cursor_y}"] },
  { run = ["capture-pane", "-pJ", "-S", "-", "-t", "full:"] },
  { run = ["capture-pane", "-p", "-S", "-", "-t", "full:"] },
  { run = ["resize-window", "-t", "full", "-x", "2"] },
  { run = ["display", "-p", "-t", "full:", "#{history_size} #{cursor_x},#{cursor_y}"] },
  { run = ["capture-pane", "-pJ", "-S", "-", "-t", "full:"] },
  { run = ["capture-pane", "-p", "-S", "-", "-t", "full:"] },
  { run = ["resize-window", "-t", "full", "-x", "4"] },
  { run = ["display", "-p", "-t", "full:", "#{history_size} #{cursor_x},#{cursor_y}"] },
  { run = ["capture-pane", "-pJ", "-S", "-", "-t", "full:"] },
  { run = ["capture-pane", "-p", "-S", "-", "-t", "full:"] },
]
