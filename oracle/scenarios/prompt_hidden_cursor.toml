# prompt-history-limit trimming, then the prompt cursor while a message
# shows over the prompt and after it goes (server-client.c:2220-2222:
# status_prompt_cursor whenever c->prompt is set; TTY_NOCURSOR stays,
# status.c:401-402), across resizes; status off, status 2 with
# message-line 1, status-position top. The timed message is up for 1.5 s and
# the scenario waits for the screen to show it, then to lose it: a 200 ms one
# expired about when the screen was taken on a loaded host (the README's
# *Races under load*).
name = "prompt_hidden_cursor"
size = [40, 6]
steps = [
  { run = ["new", "-d", "-s", "a", "-n", "w", "-x", "40", "-y", "5", "cat", "-"] },
  { run = ["set", "-g", "status-right", "R"] },
  { run = ["select-pane", "-t", "a", "-T", "t"] },
  { run = ["set", "-g", "prompt-history-limit", "2"] },
  { attach = { session = "a" } },
  { settle = {} },
  { keys = "\u0002:" },
  { settle = {} },
  { keys = "set -g @h 1\r" },
  { settle = {} },
  { keys = "\u0002:" },
  { settle = {} },
  { keys = "set -g @h 2\r" },
  { settle = {} },
  { keys = "\u0002:" },
  { settle = {} },
  { keys = "set -g @h 3\r" },
  { settle = {} },
  { keys = "\u0002:" },
  { settle = {} },
  { keys = "set -g @h 3\r" },
  { settle = {} },
  { run = ["show-prompt-history"] },
  { run = ["set", "-g", "prompt-history-limit", "0"] },
  { keys = "\u0002:" },
  { settle = {} },
  { keys = "set -g @h 4\r" },
  { settle = {} },
  { run = ["show-prompt-history"] },
  { run = ["set", "-g", "prompt-history-limit", "5"] },
  { keys = "\u0002:" },
  { settle = {} },
  { keys = "abc" },
  { settle = {} },
  { run = ["display", "-d", "0", "msg here"] },
  { settle = { react = true } },
  { screen = {} },
  { keys = "d" },
  { screen = {} },
  { run = ["display", "-d", "1500", "short"] },
  { wait_screen = { has = ["short"] } },
  { screen = {} },
  { wait_screen = { lacks = ["short"] } },
  { screen = {} },
  { resize = [30, 6] },
  { screen = {} },
  { keys = "efghijklmnopqrstuvwxyz0123456789" },
  { screen = {} },
  { resize = [50, 4] },
  { screen = {} },
  { keys = "\u0003" },
  { screen = {} },
  { run = ["set", "-g", "status", "off"] },
  { keys = "\u0002:" },
  { screen = {} },
  { keys = "xyz" },
  { screen = {} },
  { keys = "\u0003" },
  { screen = {} },
  { run = ["set", "-g", "status", "2"] },
  { run = ["set", "-g", "message-line", "1"] },
  { keys = "\u0002:" },
  { screen = {} },
  { keys = "\u0003" },
  { settle = {} },
  { run = ["set", "-g", "status-position", "top"] },
  { keys = "\u0002:" },
  { screen = {} },
  { keys = "\u0003" },
  { screen = {} },
]
