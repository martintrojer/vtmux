name = "copy_enter"
size = [40, 10]
steps = [
  { run = ["new", "-d", "-s", "a", "-n", "w", "-x", "40", "-y", "9", "sh", "-c", "i=1; while [ $i -le 20 ]; do echo line$i; i=$((i+1)); done; tmux wait-for -S ready; exec cat"] },
  { wait_for = "ready" },
  { run = ["select-pane", "-t", "%0", "-T", "t"] },
  { run = ["display", "-p", "-t", "a", "[#{pane_in_mode}] [#{pane_mode}] [#{scroll_position}] [#{copy_cursor_x}]"] },
  { run = ["send-keys", "-t", "a", "-X", "cancel"] },
  { attach = { session = "a" } },
  { screen = {} },
  { run = ["copy-mode", "-t", "a"] },
  { run = ["display", "-p", "-t", "a", "[#{pane_in_mode}] [#{pane_mode}] [#{scroll_position}] [#{copy_cursor_x},#{copy_cursor_y}] [#{copy_position}/#{copy_position_limit}] [#{top_line_time}] [#{copy_cursor_line}] [#{selection_present}] [#{search_present}] [#{copy_line_numbers}] #{cursor_x},#{cursor_y} #{history_size}"] },
  { screen = {} },
  { run = ["copy-mode", "-t", "a"] },
  { run = ["display", "-p", "-t", "a", "#{pane_in_mode}"] },
  { run = ["send-keys", "-t", "a", "-X", "nosuch-command"] },
  { run = ["send-keys", "-t", "a", "-X"] },
  { run = ["send-keys", "-t", "a", "-X", "cancel"] },
  { screen = {} },
  { run = ["display", "-p", "-t", "a", "[#{pane_in_mode}] [#{pane_mode}] [#{scroll_position}]"] },
  { keys = "\u0002[" },
  { screen = {} },
  { run = ["display", "-p", "-t", "a", "[#{pane_in_mode}] [#{copy_cursor_x},#{copy_cursor_y}]"] },
  { keys = "q" },
  { screen = {} },
  { run = ["display", "-p", "-t", "a", "#{pane_in_mode}"] },
  { run = ["copy-mode", "-H", "-t", "a"] },
  { screen = {} },
  { run = ["send-keys", "-t", "a", "-X", "toggle-position"] },
  { screen = {} },
  { run = ["set", "-g", "copy-mode-position-format", "#[align=left]<#{copy_position}/#{copy_position_limit}>#[align=right]R"] },
  { run = ["set", "-g", "mode-style", "fg=red,bg=blue,bold"] },
  { run = ["send-keys", "-t", "a", "-X", "page-up"] },
  { screen = {} },
  { run = ["copy-mode", "-q", "-t", "a"] },
  { run = ["display", "-p", "-t", "a", "#{pane_in_mode}"] },
  { run = ["copy-mode", "-u", "-t", "a"] },
  { run = ["display", "-p", "-t", "a", "[#{pane_in_mode}] [#{scroll_position}] [#{copy_cursor_x},#{copy_cursor_y}]"] },
  { screen = {} },
  { run = ["send-keys", "-t", "a", "-X", "cancel"] },
  { run = ["copy-mode", "-e", "-u", "-d", "-t", "a"] },
  { run = ["display", "-p", "-t", "a", "#{pane_in_mode}"] },
  { run = ["copy-mode", "-e", "-u", "-t", "a"] },
  { run = ["send-keys", "-t", "a", "-X", "page-down"] },
  { run = ["display", "-p", "-t", "a", "#{pane_in_mode}"] },
  { screen = {} },
  { run = ["copy-mode", "-S", "-t", "a"] },
  { run = ["display", "-p", "-t", "a", "[#{pane_in_mode}] [#{scroll_position}] [#{copy_cursor_x},#{copy_cursor_y}]"] },
  { run = ["send-keys", "-t", "a", "-X", "cancel"] },
  { run = ["copy-mode", "-k", "-t", "a"] },
  { run = ["splitw", "-d", "-t", "a", "cat"] },
  { run = ["send-keys", "-t", "%0", "-X", "cancel"] },
  { run = ["list-panes", "-t", "a", "-F", "#{pane_id}"] },
]
