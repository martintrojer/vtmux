# The choose-tree screen (on %0, so output goes to %1 and %2 only) is drawn only by mode_tree_draw (from the mode's keys, window_tree_update, resize and prompts): output in a previewed pane does not show until then (capture-pane shows the pane has it). The terminal answers the device attributes query, so no start-timer redraw.
name = "tree_preview_frozen"
size = [80, 30]
steps = [
  { run = ["new", "-d", "-s", "aaa", "-n", "w0", "-x", "80", "-y", "29", "exec cat"] },
  { run = ["set", "-g", "status-right", "R"] },
  { run = ["set", "-g", "status-interval", "0"] },
  { run = ["neww", "-d", "-t", "aaa:1", "-n", "w1", "exec cat"] },
  { run = ["splitw", "-d", "-t", "aaa:1", "exec cat"] },
  { run = ["select-pane", "-t", "%0", "-T", "t0", ";", "select-pane", "-t", "%1", "-T", "t1", ";", "select-pane", "-t", "%2", "-T", "t2"] },
  { attach = { session = "aaa" } },
  { keys = "\u001b[?62;22c" },
  { screen = {} },
  { run = ["choose-tree", "-t", "aaa:0.0"] },
  { settle = { react = true } },
  { keys = "jjj" },
  { screen = {} },
  { feed = { pane = "%1", bytes = "LIVE\r" } },
  { feed = { pane = "%2", bytes = "TWO\r" } },
  { run = ["capture-pane", "-p", "-t", "%1", "-E", "1"] },
  { settle = {} },
  { screen = {} },
  { keys = "k" },
  { screen = {} },
  { feed = { pane = "%2", bytes = "MORE\r" } },
  { settle = {} },
  { screen = {} },
  { keys = "j" },
  { screen = {} },
  { run = ["refresh-client"] },
  { settle = { react = true } },
  { screen = {} },
]
