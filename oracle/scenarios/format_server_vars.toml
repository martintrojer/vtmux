name = "format_server_vars"
# server_sessions, next_session_id, sixel_support, the *_mode_format defaults, and session_format,
# window_format and pane_format by what each format tree describes (format.c format_cb_*_format,
# ft->type from format_defaults): display, list-*, loops, the status line and set-titles.
steps = [
  { run = ["new", "-d", "-s", "a", "-n", "w", "-x", "80", "-y", "24", "cat", "-", ";",
           "new", "-d", "-s", "b", "-n", "w", "cat", "-", ";",
           "new", "-d", "-s", "c", "-n", "w", "cat", "-"] },
  { run = ["select-pane", "-t", "a:w.0", "-T", "t"] },
  { run = ["display", "-p", "#{server_sessions} #{next_session_id} #{sixel_support}"] },
  { run = ["kill-session", "-t", "c"] },
  { run = ["display", "-p", "#{server_sessions} #{next_session_id}"] },
  { run = ["display", "-p", "#{buffer_mode_format}"] },
  { run = ["display", "-p", "#{client_mode_format}"] },
  { run = ["display", "-p", "#{l:#{tree_mode_format}}|#{tree_mode_format}"] },
  { run = ["display", "-p", "-t", "a", "#{session_format}#{window_format}#{pane_format}"] },
  { run = ["display", "-p", "#{S:#{session_format}#{window_format}#{pane_format} }#{W:#{session_format}#{window_format}#{pane_format} }#{P:#{session_format}#{window_format}#{pane_format} }"] },
  { run = ["ls", "-F", "#{session_name} #{session_format}#{window_format}#{pane_format}"] },
  { run = ["lsw", "-a", "-F", "#{session_name} #{session_format}#{window_format}#{pane_format}"] },
  { run = ["lsp", "-a", "-F", "#{session_name} #{session_format}#{window_format}#{pane_format}"] },
  { run = ["lscm", "-F", "#{session_format}#{window_format}#{pane_format}", "kill-server"] },
  { run = ["set", "-g", "status-format[0]", "[#{session_format}#{window_format}#{pane_format}]"] },
  { run = ["set", "-g", "set-titles", "on"] },
  { run = ["set", "-g", "set-titles-string", "<#{session_format}#{window_format}#{pane_format}>"] },
  { attach = { session = "a" } },
  { run = ["lsc", "-F", "#{session_format}#{window_format}#{pane_format}"] },
  { run = ["lsk", "-T", "prefix", "-F", "#{session_format}#{window_format}#{pane_format} #{key_string}", "d"] },
  { screen = {} },
  { title = {} },
]
