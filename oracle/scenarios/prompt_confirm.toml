# confirm-before (cmd-confirm-before.c): the default `Confirm 'name'?
# (y/n)` prompt, y runs the command, n and Escape do not, -c sets the
# key, -y makes Enter confirm, -p sets the prompt, and the default
# prefix-& binding's `kill-window #W?` prompt. Errors: an invalid confirm
# key, an unknown client.
name = "prompt_confirm"
size = [40, 6]
steps = [
  { run = ["new", "-d", "-s", "a", "-n", "w", "-x", "40", "-y", "5", "cat"] },
  { run = ["set", "-g", "status-right", "R"] },
  { run = ["neww", "-d", "-t", "a:1", "-n", "two", "cat"] },
  { run = ["bind", "-n", "M-a", "confirm-before", "set -g @c yes"] },
  { run = ["bind", "-n", "M-x", "confirm-before", "-c", "x", "-p", "Sure?", "set -g @c x"] },
  { run = ["bind", "-n", "M-y", "confirm-before", "-y", "set -g @c enter"] },
  { run = ["bind", "-n", "M-b", "confirm-before", "-b", "set -g @c bg"] },
  { attach = { session = "a" } },
  { keys = "\u001ba" },
  { screen = {} },
  { keys = "n" },
  { screen = {} },
  { run = ["show", "-gqv", "@c"] },
  { keys = "\u001ba" },
  { settle = {} },
  { keys = "y" },
  { screen = {} },
  { run = ["show", "-gqv", "@c"] },
  { keys = "\u001bx" },
  { screen = {} },
  { keys = "y" },
  { settle = {} },
  { run = ["show", "-gqv", "@c"] },
  { keys = "\u001bx" },
  { settle = {} },
  { keys = "x" },
  { settle = {} },
  { run = ["show", "-gqv", "@c"] },
  { keys = "\u001by" },
  { settle = {} },
  { keys = "\r" },
  { settle = {} },
  { run = ["show", "-gqv", "@c"] },
  { keys = "\u001ba" },
  { settle = {} },
  { keys = "\r" },
  { settle = {} },
  { run = ["show", "-gqv", "@c"] },
  { keys = "\u001bb" },
  { settle = {} },
  { keys = "y" },
  { settle = {} },
  { run = ["show", "-gqv", "@c"] },
  { run = ["select-window", "-t", "a:1"] },
  { keys = "\u0002&" },
  { screen = {} },
  { keys = "\u001b" },
  { screen = {} },
  { run = ["list-windows", "-t", "a", "-F", "#{window_index}:#{window_name}"] },
  { keys = "\u0002&" },
  { settle = {} },
  { keys = "y" },
  { screen = {} },
  { run = ["list-windows", "-t", "a", "-F", "#{window_index}:#{window_name}"] },
  { run = ["confirm-before", "-c", "xx", "ls"] },
  { run = ["confirm-before", "-t", "nope", "ls"] },
  { run = ["confirm-before", "-b", "-c", "\u0001", "ls"] },
]
