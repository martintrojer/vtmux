# A press in choose-tree's preview (mode-tree.c mode_tree_key leaves a
# mouse key outside the list to the mode while the preview is on;
# window-tree.c window_tree_mouse): on a session's windows it chooses the
# window under the pointer, on a window's panes the pane; the < and >
# columns scroll the strip; past the last item the last is chosen; the
# info view picks from the strip too; with the preview off nothing
# happens; a right-click in the preview opens mode-tree's menu. Five
# windows at 80 columns: three fit, so the strip scrolls. Each press waits
# out the 300 ms click timer first, so none is a SecondClick
# (server-client.c server_client_check_mouse).
name = "tree_preview_mouse"
size = [80, 24]
steps = [
  { run = ["new", "-d", "-s", "aaa", "-n", "w0", "-x", "80", "-y", "23", "cat", "-"] },
  { run = ["set", "-g", "status-right", "R"] },
  { run = ["set", "-g", "automatic-rename", "off"] },
  { run = ["set", "-g", "mouse", "on"] },
  { run = ["neww", "-d", "-t", "aaa:1", "-n", "w1", "cat", "-"] },
  { run = ["neww", "-d", "-t", "aaa:2", "-n", "w2", "cat", "-"] },
  { run = ["neww", "-d", "-t", "aaa:3", "-n", "w3", "cat", "-"] },
  { run = ["neww", "-d", "-t", "aaa:4", "-n", "w4", "cat", "-"] },
  { run = ["splitw", "-d", "-t", "aaa:1", "cat", "-"] },
  { run = ["splitw", "-d", "-t", "aaa:1", "cat", "-"] },
  { run = ["new", "-d", "-s", "bbb", "-n", "x0", "-x", "80", "-y", "23", "cat", "-"] },
  { run = ["select-pane", "-t", "%0", "-T", "t0"] },
  { run = ["select-pane", "-t", "%1", "-T", "t1"] },
  { run = ["select-pane", "-t", "%2", "-T", "t2"] },
  { run = ["select-pane", "-t", "%3", "-T", "t3"] },
  { run = ["select-pane", "-t", "%4", "-T", "t4"] },
  { run = ["select-pane", "-t", "%5", "-T", "t5"] },
  { run = ["select-pane", "-t", "%6", "-T", "t6"] },
  { run = ["select-pane", "-t", "%7", "-T", "t7"] },
  { run = ["run-shell", "until [ \"$(tmux list-panes -a -F '#{pane_current_command}' | sort -u)\" = cat ]; do :; done"] },
  { attach = { session = "aaa" } },
  { run = ["select-window", "-t", "aaa:0"] },
  { run = ["choose-tree", "-s", "-t", "aaa:0.0"] },
  { settle = { react = true } },
  { settle = { quiet_ms = 400 } },
  { keys = "\u001b[<0;30;15M\u001b[<0;30;15m" },
  { settle = {} },
  { screen = {} },
  { run = ["display", "-p", "#{window_index}.#{pane_index} #{pane_in_mode}"] },
  { run = ["select-window", "-t", "aaa:0"] },
  { run = ["choose-tree", "-s", "-t", "aaa:0.0"] },
  { settle = { react = true } },
  { settle = { quiet_ms = 400 } },
  { keys = "\u001b[<0;78;15M\u001b[<0;78;15m" },
  { screen = {} },
  { settle = { quiet_ms = 400 } },
  { keys = "\u001b[<0;78;15M\u001b[<0;78;15m" },
  { screen = {} },
  { settle = { quiet_ms = 400 } },
  { keys = "\u001b[<0;2;15M\u001b[<0;2;15m" },
  { screen = {} },
  { settle = { quiet_ms = 400 } },
  { keys = "\u001b[<0;40;20M\u001b[<0;40;20m" },
  { settle = {} },
  { screen = {} },
  { run = ["display", "-p", "#{window_index}.#{pane_index} #{pane_in_mode}"] },
  { run = ["select-window", "-t", "aaa:0"] },
  { run = ["choose-tree", "-w", "-t", "aaa:0.0"] },
  { settle = { react = true } },
  { keys = "j" },
  { screen = {} },
  { settle = { quiet_ms = 400 } },
  { keys = "\u001b[<0;60;16M\u001b[<0;60;16m" },
  { settle = {} },
  { screen = {} },
  { run = ["display", "-p", "#{window_index}.#{pane_index} #{pane_in_mode}"] },
  { run = ["select-window", "-t", "aaa:0"] },
  { run = ["choose-tree", "-t", "aaa:0.0"] },
  { settle = { react = true } },
  { settle = { quiet_ms = 400 } },
  { keys = "\u001b[<0;40;20M\u001b[<0;40;20m" },
  { screen = {} },
  { run = ["display", "-p", "#{window_index}.#{pane_index} #{pane_in_mode}"] },
  { keys = "q" },
  { settle = {} },
  { run = ["select-window", "-t", "aaa:0"] },
  { run = ["choose-tree", "-s", "-t", "aaa:0.0"] },
  { settle = { react = true } },
  { keys = "i" },
  { settle = { quiet_ms = 400 } },
  { keys = "\u001b[<0;10;18M\u001b[<0;10;18m" },
  { settle = {} },
  { screen = {} },
  { run = ["display", "-p", "#{window_index}.#{pane_index} #{pane_in_mode}"] },
  { run = ["select-window", "-t", "aaa:0"] },
  { run = ["choose-tree", "-s", "-t", "aaa:0.0"] },
  { settle = { react = true } },
  { keys = "v" },
  { settle = { quiet_ms = 400 } },
  { keys = "\u001b[<0;10;18M\u001b[<0;10;18m" },
  { screen = {} },
  { run = ["display", "-p", "#{window_index}.#{pane_index} #{pane_in_mode}"] },
  { keys = "q" },
  { settle = {} },
  { run = ["select-window", "-t", "aaa:0"] },
  { run = ["choose-tree", "-s", "-t", "aaa:0.0"] },
  { settle = { react = true } },
  { settle = { quiet_ms = 400 } },
  { keys = "\u001b[<2;10;18M\u001b[<2;10;18m" },
  { screen = {} },
]
