name = "control_layout_v1"
# A control client without new-layouts is dumped v1 layouts
# (format.c:874-877 tests ft->client, the client the tree was made for),
# even when it is not attached and so is not the client the formats
# describe. A v1 layout given to select-layout fires window-layout-changed
# a second time (layout-custom.c:717-721), a v2 one does not.
steps = [
  { run = ["new", "-d", "-s", "a", "-n", "w", "-x", "80", "-y", "24", "cat"] },
  { run = ["splitw", "-h", "-t", "a", "cat"] },
  { control = { argv = ["display-message", "-p", "-t", "a:w", "#{window_layout} #{window_visible_layout}"], id = "d1" } },
  { control_close = { id = "d1" } },
  { run = ["display-message", "-p", "-t", "a:w", "#{window_layout}"] },
  { control = { argv = ["attach", "-t", "a"], id = "old" } },
  { control_send = { id = "old", line = "display-message -p -t a:w '#{window_layout}'" } },
  { control_wait = { id = "old", until = "%end" } },
  { run = ["select-layout", "-t", "a:w", "{\"V\":2,\"L\":{\"t\":\"v\",\"w\":80,\"h\":24,\"x\":0,\"y\":0,\"c\":[{\"t\":\"p\",\"w\":80,\"h\":9,\"x\":0,\"y\":0,\"i\":0},{\"t\":\"p\",\"w\":80,\"h\":14,\"x\":0,\"y\":10,\"i\":1}]}}"] },
  { run = ["display-message", "-p", "-t", "a:w", "#{window_layout}"] },
  { control_send = { id = "old", line = "display-message -p marker1" } },
  { control_wait = { id = "old", until = "%end" } },
  { run = ["select-layout", "-t", "a:w", "9295,80x24,0,0[80x11,0,0,0,80x12,0,12,1]"] },
  { control_send = { id = "old", line = "display-message -p marker2" } },
  { control_wait = { id = "old", until = "%end" } },
  { control_close = { id = "old" } },
  { control = { argv = ["display-message", "-p", "-t", "a:w", "#{window_layout}"], id = "d2" } },
  { control_close = { id = "d2" } },
]
