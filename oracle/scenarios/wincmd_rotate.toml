name = "wincmd_rotate"
steps = [
  { run = ["new", "-d", "-s", "a", "-n", "w", "-x", "80", "-y", "24", "cat"] },
  { run = ["new", "-d", "-s", "b", "-n", "bw", "-x", "80", "-y", "24", "cat"] },
  # One pane: nothing moves.
  { run = ["rotatew", "-t", "a"] },
  { run = ["lsp", "-t", "a", "-F", "#{pane_index} #{pane_id} #{pane_active}#{pane_last} #{pane_width}x#{pane_height} #{pane_left},#{pane_top}"] },
  { run = ["splitw", "-d", "-t", "a", "cat"] },
  { run = ["splitw", "-d", "-t", "a", "-h", "cat"] },
  { run = ["splitw", "-d", "-t", "a:0.0", "-l", "3", "cat"] },
  { run = ["lsp", "-t", "a", "-F", "#{pane_index} #{pane_id} #{pane_active}#{pane_last} #{pane_width}x#{pane_height} #{pane_left},#{pane_top}"] },
  { run = ["display", "-p", "-t", "a", "#{window_layout}"] },
  { run = ["rotatew", "-t", "a"] },
  { run = ["lsp", "-t", "a", "-F", "#{pane_index} #{pane_id} #{pane_active}#{pane_last} #{pane_width}x#{pane_height} #{pane_left},#{pane_top}"] },
  { run = ["display", "-p", "-t", "a", "#{window_layout}"] },
  { run = ["rotatew", "-t", "a", "-D"] },
  { run = ["rotatew", "-t", "a", "-D"] },
  { run = ["lsp", "-t", "a", "-F", "#{pane_index} #{pane_id} #{pane_active}#{pane_last} #{pane_width}x#{pane_height} #{pane_left},#{pane_top}"] },
  { run = ["rotatew", "-U", "-t", "a"] },
  { run = ["rotatew", "-D", "-U", "-t", "a"] },
  { run = ["lsp", "-t", "a", "-F", "#{pane_index} #{pane_id} #{pane_active}#{pane_last} #{pane_width}x#{pane_height} #{pane_left},#{pane_top}"] },
  { run = ["selectp", "-t", "a:0.2"] },
  { run = ["rotatew", "-t", "a"] },
  { run = ["lsp", "-t", "a", "-F", "#{pane_index} #{pane_id} #{pane_active}#{pane_last} #{pane_width}x#{pane_height} #{pane_left},#{pane_top}"] },
  { run = ["lastp", "-t", "a"] },
  { run = ["lsp", "-t", "a", "-F", "#{pane_index} #{pane_id} #{pane_active}#{pane_last} #{pane_width}x#{pane_height} #{pane_left},#{pane_top}"] },
  { run = ["selectl", "-t", "a", "main-vertical"] },
  { run = ["rotatew", "-t", "a", "-D"] },
  { run = ["lsp", "-t", "a", "-F", "#{pane_index} #{pane_id} #{pane_active}#{pane_last} #{pane_width}x#{pane_height} #{pane_left},#{pane_top}"] },
  { run = ["display", "-p", "-t", "a", "#{window_layout}"] },
  # Zoom: rotating unzooms, -Z keeps it zoomed on the new active pane.
  { run = ["resizep", "-Z", "-t", "a:0.1"] },
  { run = ["rotatew", "-t", "a"] },
  { run = ["display", "-p", "-t", "a", "#{window_zoomed_flag} #{pane_id}"] },
  { run = ["lsp", "-t", "a", "-F", "#{pane_index} #{pane_id} #{pane_active}#{pane_last} #{pane_width}x#{pane_height} #{pane_left},#{pane_top}"] },
  { run = ["resizep", "-Z", "-t", "a:0.1"] },
  { run = ["rotatew", "-Z", "-t", "a"] },
  { run = ["display", "-p", "-t", "a", "#{window_zoomed_flag} #{pane_id}"] },
  { run = ["lsp", "-t", "a", "-F", "#{pane_index} #{pane_id} #{pane_active}#{pane_last} #{pane_width}x#{pane_height} #{pane_left},#{pane_top}"] },
  { run = ["rotatew", "-Z", "-D", "-t", "a"] },
  { run = ["display", "-p", "-t", "a", "#{window_zoomed_flag} #{pane_id} #{window_layout}"] },
  # Not zoomed: -Z does not zoom.
  { run = ["resizep", "-Z", "-t", "a"] },
  { run = ["rotatew", "-Z", "-t", "b"] },
  { run = ["display", "-p", "-t", "b", "#{window_zoomed_flag}"] },
  { run = ["rotatew", "-t", "nosuch"] },
  { run = ["rotatew", "-t", "a:9"] },
  { run = ["rotatew", "extra"] },
  { run = ["rotatew", "-t", "b:0.1"] },
]
