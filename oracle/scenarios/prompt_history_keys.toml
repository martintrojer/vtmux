# History recall with a draft, C-u C-y, ESC[1~ / ESC[4~ (no such keys with
# TERM=xterm-256color: Meta-[ then "1~"), ESC O H / ESC O F, C-v quoting,
# -l, several prompts with -I, -T search history, the prompt's format
# variables in message-format, and vi status-keys.
name = "prompt_history_keys"
size = [40, 6]
steps = [
  { run = ["new", "-d", "-s", "a", "-n", "w", "-x", "40", "-y", "5", "cat"] },
  { run = ["setb", "pa\u0001ste\nmore"] },
  { run = ["bind", "-n", "M-l", "command-prompt", "-l", "-p", "a,b", "-I", "x,y", "set -g @l '%%'"] },
  { run = ["bind", "-n", "M-m", "command-prompt", "-p", "a,b,c", "-I", "1", "set -g @m '%1-%2-%3'"] },
  { run = ["bind", "-n", "M-t", "command-prompt", "-T", "search", "-p", "s", "set -g @t '%%'"] },
  { attach = { session = "a" } },
  { settle = {} },
  { keys = "\u0002:" },
  { settle = {} },
  { keys = "first" },
  { keys = "\r" },
  { settle = {} },
  { keys = "\u0002:" },
  { settle = {} },
  { keys = "second" },
  { keys = "\r" },
  { settle = {} },
  { keys = "\u0002:" },
  { settle = {} },
  { keys = "draft" },
  { keys = "\u0010" },
  { screen = {} },
  { keys = "XX" },
  { keys = "\u0010" },
  { screen = {} },
  { keys = "\u000e" },
  { screen = {} },
  { keys = "\u000e" },
  { screen = {} },
  { keys = "\u000e" },
  { screen = {} },
  { keys = "\u0010\u0010\u0010\u0010" },
  { screen = {} },
  { keys = "\u0015\u0019" },
  { screen = {} },
  { keys = "\u001b[1~" },
  { screen = {} },
  { keys = "\u001b[4~" },
  { screen = {} },
  { keys = "\u001bOH" },
  { screen = {} },
  { keys = "\u001bOF" },
  { screen = {} },
  { keys = "\u0002\u0002\u0016" },
  { screen = {} },
  { keys = "\u001b[A" },
  { screen = {} },
  { keys = "\u0016\u0009" },
  { screen = {} },
  { keys = "\u0016\u001b" },
  { settle = { quiet_ms = 700 } },
  { screen = {} },
  { keys = "\u0016\u007f" },
  { screen = {} },
  { keys = "\u0003" },
  { keys = "\u001bl" },
  { screen = {} },
  { keys = "\r" },
  { settle = {} },
  { run = ["show", "-gv", "@l"] },
  { keys = "\u001bm" },
  { screen = {} },
  { keys = "\r" },
  { screen = {} },
  { keys = "\r" },
  { screen = {} },
  { keys = "\r" },
  { settle = {} },
  { run = ["show", "-gv", "@m"] },
  { keys = "\u001bt" },
  { settle = {} },
  { keys = "\u001b[A" },
  { screen = {} },
  { keys = "\u0003" },
  { run = ["set", "-g", "message-format", "[#{prompt_type}|#{prompt_flags}|#{prompt_input}|#{command_prompt}]#{message}"] },
  { keys = "\u001bt" },
  { settle = {} },
  { keys = "ab" },
  { screen = {} },
  { keys = "\u0003" },
  { run = ["set", "-g", "status-keys", "vi"] },
  { keys = "\u0002:" },
  { settle = {} },
  { keys = "cd\u001b" },
  { settle = { quiet_ms = 700 } },
  { screen = {} },
  { keys = "q" },
  { screen = {} },
  { run = ["display", "-d", "0", "m #{prompt_type}"] },
  { screen = {} },
]
