# Session groups share windows (session_group_synchronize_from/to, session_group_synchronize1): new-window in one member links it into every member; each member keeps its own current and last window; kill-window of a window that is current in a member moves that member on; link-window, move-window and swap-window between members are refused ("sessions are grouped"); a window linked from outside appears in every member and counts once per group in window_linked_sessions; unlink-window counts the group as one session; renumber-windows renumbers the whole group; kill-window -a from the first member (from a later one tmux reads the target winlink after the first kill freed it, session.c:734-740); killing the last window of the group ends every member.
name = "group_windows"
steps = [
  { run = ["new", "-d", "-s", "a", "-n", "w0", "-x", "80", "-y", "24", "cat", "-"] },
  { run = ["neww", "-d", "-t", "a:1", "-n", "w1", "cat", "-"] },
  { run = ["new", "-d", "-t", "a", "-s", "b"] },
  { run = ["new", "-d", "-t", "b", "-s", "c"] },
  { run = ["neww", "-d", "-t", "b:2", "-n", "w2", "cat", "-"] },
  { run = ["neww", "-t", "c:7", "-n", "w7", "cat", "-"] },
  { run = ["lsw", "-a", "-F", "#{session_name}:#{window_index} #{window_id} #{window_name} [#{window_flags}] linked=#{window_linked} n=#{window_linked_sessions} list=#{window_linked_sessions_list}"] },
  { run = ["select-window", "-t", "c:2"] },
  { run = ["select-window", "-t", "a:1"] },
  { run = ["select-window", "-t", "b:0"] },
  { run = ["select-window", "-t", "b:7"] },
  { run = ["ls", "-F", "#{session_name} cur=#{window_index}"] },
  { run = ["lsw", "-a", "-F", "#{session_name}:#{window_index} #{window_name} [#{window_flags}] #{window_active}"] },
  { run = ["kill-window", "-t", "a:2"] },
  { run = ["ls", "-F", "#{session_name} cur=#{window_index} w=#{session_windows}"] },
  { run = ["lsw", "-a", "-F", "#{session_name}:#{window_index} #{window_name} [#{window_flags}]"] },
  { run = ["last-window", "-t", "b"] },
  { run = ["display", "-p", "-t", "b", "#{window_index}"] },
  { run = ["new", "-d", "-s", "o", "-n", "o0", "-x", "80", "-y", "24", "cat", "-"] },
  { run = ["linkw", "-s", "a:0", "-t", "c:5"] },
  { run = ["linkw", "-d", "-s", "o:0", "-t", "c:5"] },
  { run = ["lsw", "-a", "-F", "#{session_name}:#{window_index} #{window_id} #{window_name} [#{window_flags}] linked=#{window_linked} n=#{window_linked_sessions} list=#{window_linked_sessions_list}"] },
  { run = ["movew", "-s", "a:0", "-t", "c:9"] },
  { run = ["swapw", "-s", "a:0", "-t", "c:7"] },
  { run = ["unlinkw", "-t", "a:7"] },
  { run = ["unlinkw", "-t", "b:5"] },
  { run = ["lsw", "-a", "-F", "#{session_name}:#{window_index} #{window_id} #{window_name} [#{window_flags}] linked=#{window_linked} n=#{window_linked_sessions} list=#{window_linked_sessions_list}"] },
  { run = ["linkw", "-d", "-s", "o:0", "-t", "a:5"] },
  { run = ["movew", "-d", "-s", "o:0", "-t", "a:9"] },
  { run = ["ls", "-F", "#{session_name} cur=#{window_index} w=#{session_windows}"] },
  { run = ["lsw", "-a", "-F", "#{session_name}:#{window_index} #{window_name} [#{window_flags}]"] },
  { run = ["new", "-d", "-s", "p", "-n", "p0", "-x", "80", "-y", "24", "cat", "-"] },
  { run = ["neww", "-d", "-t", "p:1", "-n", "p1", "cat", "-"] },
  { run = ["swapw", "-d", "-s", "p:1", "-t", "b:7"] },
  { run = ["lsw", "-a", "-F", "#{session_name}:#{window_index} #{window_name} [#{window_flags}]"] },
  { run = ["set", "-g", "renumber-windows", "on"] },
  { run = ["kill-window", "-t", "a:1"] },
  { run = ["lsw", "-a", "-F", "#{session_name}:#{window_index} #{window_name} [#{window_flags}]"] },
  { run = ["rename-window", "-t", "b:0", "renamed"] },
  { run = ["kill-window", "-a", "-t", "a:0"] },
  { run = ["lsw", "-a", "-F", "#{session_name}:#{window_index} #{window_name} [#{window_flags}]"] },
  { run = ["kill-window", "-t", "b:0"] },
  { run = ["ls", "-F", "#{session_name} #{session_group} #{session_windows}"] },
  { run = ["kill-server"] },
]
