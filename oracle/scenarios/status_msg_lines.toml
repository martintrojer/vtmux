name = "status_msg_lines"
size = [40, 8]
steps = [
  { run = ["new", "-d", "-s", "a", "-n", "w", "cat"] },
  { run = ["select-pane", "-t", "a", "-T", "t"] },
  { run = ["set", "-g", "status-format[0]", "zero"] },
  { run = ["set", "-g", "status-format[1]", "one"] },
  { run = ["set", "-g", "status-format[2]", "two"] },
  { run = ["set", "-g", "status", "3"] },
  { run = ["set", "-g", "message-style", "bg=red"] },
  { attach = { session = "a" } },
  { screen = {} },
  { run = ["display-message", "-t", "a", "m0"] },
  { settle = { react = true } },
  { screen = {} },
  { settle = { quiet_ms = 1000 } },
  { run = ["set", "-g", "message-line", "1"] },
  { run = ["display-message", "-t", "a", "m1"] },
  { settle = { react = true } },
  { screen = {} },
  { settle = { quiet_ms = 1000 } },
  { run = ["set", "-g", "message-line", "4"] },
  { run = ["display-message", "-t", "a", "m4"] },
  { settle = { react = true } },
  { screen = {} },
  { settle = { quiet_ms = 1000 } },
  { run = ["set", "-g", "status-position", "top"] },
  { run = ["display-message", "-t", "a", "top"] },
  { settle = { react = true } },
  { screen = {} },
  { settle = { quiet_ms = 1000 } },
  { run = ["set", "-g", "status", "off"] },
  { feed = { pane = "%0", bytes = "abc\r" } },
  { settle = {} },
  { run = ["display-message", "-t", "a", "offtop"] },
  { settle = { react = true } },
  { screen = {} },
  { settle = { quiet_ms = 1000 } },
  { run = ["set", "-g", "status-position", "bottom"] },
  { run = ["display-message", "-t", "a", "offbottom"] },
  { settle = { react = true } },
  { screen = {} },
  { settle = { quiet_ms = 1000 } },
  { screen = {} },
]
