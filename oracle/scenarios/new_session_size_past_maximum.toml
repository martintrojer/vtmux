name = "new_session_size_past_maximum"
size = [80, 24]
# new-session takes -x/-y up to USHRT_MAX (cmd-new-session.c:224, 240) and
# keeps them in the session's default-size (274-280), but the window is made
# at most WINDOW_MAXIMUM (spawn.c:192, default_window_size, resize.c:331-338).
# vtmux made a 10001-column pane: on the alternate screen at another size, its
# primary screen was past what a snapshot may carry, and a row-form upgrade
# killed the server (crates/vtmux/tests/upgrade.rs). The alternate screen's
# exit here brings the primary back from 10000 columns.
steps = [
  { run = ["new", "-d", "-s", "init", "-n", "w", "-x", "80", "-y", "8", "cat", "-"] },
  { run = ["set", "-g", "status", "off"] },
  { run = ["new", "-d", "-s", "wide", "-n", "w", "-x", "10001", "-y", "4", "sh", "-c", "printf 'left'; printf '\\033[?1049hvim'; tmux wait-for -S wide-p0; tmux wait-for wide-go1; printf '\\033[?1049l'; tmux wait-for -S wide-p1; exec cat -"] },
  { wait_for = "wide-p0" },
  { run = ["display", "-p", "-t", "wide:", "#{window_width}x#{window_height} #{pane_width}x#{pane_height} #{alternate_on}"] },
  { run = ["show", "-t", "wide", "default-size"] },
  { run = ["resize-window", "-t", "wide", "-x", "40", "-y", "3"] },
  { run = ["display", "-p", "-t", "wide:", "#{window_width}x#{window_height} #{pane_width}x#{pane_height} #{alternate_on}"] },
  { run = ["wait-for", "-S", "wide-go1"] },
  { wait_for = "wide-p1" },
  { run = ["display", "-p", "-t", "wide:", "#{window_width}x#{window_height} #{cursor_x},#{cursor_y} #{alternate_on}"] },
  { run = ["capture-pane", "-p", "-t", "wide:"] },
  { run = ["new", "-d", "-s", "tall", "-n", "w", "-x", "3", "-y", "65535", "cat", "-"] },
  { run = ["display", "-p", "-t", "tall:", "#{window_width}x#{window_height} #{pane_width}x#{pane_height}"] },
  { run = ["show", "-t", "tall", "default-size"] },
  { run = ["new", "-d", "-s", "over", "-x", "65536", "-y", "3", "cat", "-"] },
  { run = ["ls", "-F", "#{session_name}"] },
]
