name = "clock_large"
size = [80, 24]
steps = [
  { run = ["new", "-d", "-s", "a", "-n", "w", "-x", "80", "-y", "24", "cat"] },
  { run = ["set", "-g", "status", "off"] },
  { run = ["set", "-w", "clock-mode-colour", "red"] },
  { attach = { session = "a" } },
  { run = ["set", "-w", "clock-mode-style", "12"] },
  { run = ["clock-mode", "-t", "a"] },
  { run = ["display", "-p", "-t", "a", "[#{pane_mode}] [#{pane_in_mode}]"] },
  { screen = {} },
  { run = ["send-keys", "-t", "a", "x"] },
  { settle = { react = true } },
  { run = ["display", "-p", "-t", "a", "[#{pane_mode}] [#{pane_in_mode}]"] },
  { run = ["set", "-w", "clock-mode-style", "24"] },
  { run = ["clock-mode", "-t", "a"] },
  { run = ["display", "-p", "-t", "a", "[#{pane_mode}] [#{pane_in_mode}]"] },
  { screen = {} },
  { run = ["send-keys", "-t", "a", "x"] },
  { settle = { react = true } },
  { run = ["display", "-p", "-t", "a", "[#{pane_mode}] [#{pane_in_mode}]"] },
  { run = ["set", "-w", "clock-mode-style", "12-with-seconds"] },
  { run = ["clock-mode", "-t", "a"] },
  { run = ["display", "-p", "-t", "a", "[#{pane_mode}] [#{pane_in_mode}]"] },
  { screen = {} },
  { run = ["send-keys", "-t", "a", "x"] },
  { settle = { react = true } },
  { run = ["display", "-p", "-t", "a", "[#{pane_mode}] [#{pane_in_mode}]"] },
  { run = ["set", "-w", "clock-mode-style", "24-with-seconds"] },
  { run = ["clock-mode", "-t", "a"] },
  { run = ["display", "-p", "-t", "a", "[#{pane_mode}] [#{pane_in_mode}]"] },
  { screen = {} },
  { run = ["send-keys", "-t", "a", "x"] },
  { settle = { react = true } },
  { run = ["display", "-p", "-t", "a", "[#{pane_mode}] [#{pane_in_mode}]"] },
  { run = ["set", "-w", "clock-mode-style", "24"] },
  { run = ["clock-mode", "-t", "a"] },
  { settle = { react = true } },
  { resize = [20, 5] },
  { settle = { react = true } },
  { screen = {} },
  { resize = [80, 24] },
  { settle = { react = true } },
  { screen = {} },
  { run = ["send-keys", "-t", "a", "Enter"] },
  { settle = { react = true } },
  { run = ["display", "-p", "-t", "a", "[#{pane_mode}]"] },
]
