name = "alerts_status"
size = [60, 6]
steps = [
  { run = ["new", "-d", "-s", "a", "-n", "w", "-x", "60", "-y", "6", "cat", "-"] },
  { run = ["select-pane", "-t", "a:0", "-T", "t"] },
  { run = ["neww", "-d", "-n", "x", "sh", "-c", "while read x; do printf x; done"] },
  { run = ["neww", "-d", "-n", "y", "sh", "-c", "while read x; do printf '\\007'; done"] },
  { run = ["set", "-g", "status-right", "R"] },
  { run = ["set", "-g", "monitor-activity", "on"] },
  { run = ["set", "-g", "window-status-activity-style", "fg=red"] },
  { run = ["set", "-g", "window-status-bell-style", "fg=blue"] },
  { attach = { session = "a" } },
  { run = ["send-keys", "-t", "a:1", "Enter"] },
  { run = ["send-keys", "-t", "a:2", "Enter"] },
  { screen = {} },
  { run = ["lsw", "-F", "#{window_index}#{window_flags}"] },
  { run = ["select-window", "-t", "a:1"] },
  # The switch redraws the client: wait for that output (README, *Races
  # under load*), or a slow host shows the old window.
  { settle = { react = true } },
  { screen = {} },
  { run = ["lsw", "-F", "#{window_index}#{window_flags}"] },
  { run = ["send-keys", "-t", "a:2", "Enter"] },
  { screen = {} },
  { run = ["next-window", "-a"] },
  { settle = { react = true } },
  { screen = {} },
  { run = ["lsw", "-F", "#{window_index}#{window_flags}"] },
]
