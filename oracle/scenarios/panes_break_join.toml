name = "panes_break_join"
steps = [
  { run = ["new", "-d", "-s", "a", "-n", "w", "-x", "80", "-y", "24", "cat"] },
  { run = ["new", "-d", "-s", "b", "-n", "bw", "-x", "80", "-y", "24", "cat"] },
  { run = ["splitw", "-t", "a", "-d", "cat"] },
  { run = ["splitw", "-t", "a", "-d", "cat"] },
  { run = ["breakp", "-t", "a:0", "-s", "a:0.1"] },
  { run = ["breakp", "-d", "-s", "a:0.1", "-t", "a:5", "-n", "five", "-P"] },
  { run = ["breakp", "-s", "a:5", "-t", "a:7", "-P", "-F", "#{window_id} #{pane_id} #{window_index}"] },
  { run = ["breakp", "-s", "a:7", "-t", "b", "-n", "moved"] },
  { run = ["breakp", "-s", "b:0", "-t", "b:0"] },
  { run = ["breakp", "-s", "a:7", "-t", "b:3", "-n", "moved"] },
  { run = ["lsw", "-a", "-F", "#{session_name}:#{window_index} #{window_id} #{window_name} [#{window_flags}] #{window_panes} #{automatic-rename}"] },
  { run = ["joinp", "-s", "a:0", "-t", "a:0"] },
  { run = ["joinp", "-h", "-b", "-d", "-l", "10", "-s", "b:3", "-t", "a:0.0"] },
  { run = ["movep", "-f", "-s", "a:0.0", "-t", "a:0.1"] },
  { run = ["movep", "-l", "abc", "-s", "a:0.0", "-t", "a:0.1"] },
  { run = ["movep", "-X", "3", "-t", "a:0.0"] },
  { run = ["lsp", "-a", "-F", "#{session_name}:#{window_index}.#{pane_index} #{pane_id} #{pane_active}#{pane_last} #{pane_width}x#{pane_height} #{pane_left},#{pane_top}"] },
  { run = ["joinp", "-d", "-s", "b:0", "-t", "a:0.1"] },
  { run = ["ls", "-F", "#{session_name} #{session_windows}"] },
  { run = ["display", "-p", "-t", "a:0", "#{window_layout}"] },
  { run = ["respawnp", "-t", "a:0.0"] },
  { run = ["respawnp", "-k", "-t", "a:0.0", "exec cat"] },
  { run = ["display", "-p", "-t", "a:0.0", "#{pane_id} #{pane_start_command}"] },
]
