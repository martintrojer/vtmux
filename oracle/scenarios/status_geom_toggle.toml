name = "status_geom_toggle"
size = [40, 8]
steps = [
  { run = ["new", "-d", "-s", "a", "-n", "w", "sh", "-c", "printf '$ '; while read l; do eval \"$l\"; printf '$ '; done"] },
  { run = ["select-pane", "-t", "a", "-T", "t"] },
  { attach = { session = "a" } },
  { screen = {} },
  { run = ["display", "-p", "-t", "a", "#{window_height} #{pane_height}"] },
  { run = ["set", "-g", "status", "off"] },
  { settle = { react = true } },
  { screen = {} },
  { run = ["display", "-p", "-t", "a", "#{window_height} #{pane_height}"] },
  { keys = "stty size\r" },
  { settle = {} },
  { screen = {} },
  { run = ["set", "-g", "status", "on"] },
  { settle = { react = true } },
  { screen = {} },
  { run = ["display", "-p", "-t", "a", "#{window_height} #{pane_height}"] },
  { run = ["set", "-t", "a", "status-format[0]", ""] },
  { settle = { react = true } },
  { screen = {} },
  { run = ["set", "-u", "-t", "a", "status-format[0]"] },
  { settle = { react = true } },
  { screen = {} },
]
