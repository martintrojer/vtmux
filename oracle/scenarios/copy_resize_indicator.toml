name = "copy_resize_indicator"
size = [40, 10]
# The position indicator after a client shrinks and grows back in copy mode
# (task low_position_indicator_after_a_width). copy_resize scrolls before
# its screens after a resize; this one looks at once, also at a pane on
# the right of a split.
steps = [
  { run = ["new", "-d", "-s", "a", "-n", "w", "-x", "40", "-y", "9", "sh", "-c", "i=1; while [ $i -le 30 ]; do echo line$i; i=$((i+1)); done; tmux wait-for -S ready; exec cat"] },
  { wait_for = "ready" },
  { run = ["select-pane", "-t", "%0", "-T", "t"] },
  { run = ["set", "-g", "status-right", "x"] },
  { run = ["set", "-g", "copy-mode-position-format", "#[align=right]X#{e|+:#{history_size},1000000}Y[#{scroll_position}/#{history_size}]"] },
  { attach = { session = "a" } },
  { run = ["copy-mode", "-t", "a"] },
  { run = ["send-keys", "-t", "a", "-X", "page-up"] },
  { run = ["send-keys", "-t", "a", "-X", "cursor-up"] },
  { settle = { react = true } },
  { screen = {} },
  { resize = [30, 8] },
  { screen = {} },
  { resize = [40, 10] },
  { screen = {} },
  { run = ["display", "-p", "-t", "%0", "[#{scroll_position}] [#{copy_cursor_x},#{copy_cursor_y}]"] },
  { resize = [25, 10] },
  { screen = {} },
  { resize = [40, 10] },
  { screen = {} },
  { run = ["send-keys", "-t", "%0", "-X", "scroll-up"] },
  { settle = { react = true } },
  { screen = {} },
  { run = ["send-keys", "-t", "%0", "-X", "cancel"] },
  { run = ["splitw", "-d", "-h", "-t", "%0", "sh", "-c", "i=1; while [ $i -le 30 ]; do echo r$i; i=$((i+1)); done; tmux wait-for -S right; exec cat"] },
  { wait_for = "right" },
  { run = ["select-pane", "-t", "%1", "-T", "t"] },
  { run = ["copy-mode", "-t", "%1"] },
  { run = ["send-keys", "-t", "%1", "-X", "page-up"] },
  { settle = { react = true } },
  { screen = {} },
  { resize = [30, 8] },
  { screen = {} },
  { resize = [40, 10] },
  { screen = {} },
]
