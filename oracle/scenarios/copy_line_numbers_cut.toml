# Line numbers beside the cursor's row and a selection set before the
# gutter changed. A wide character or TAB that the gutter cuts at the
# text's edge is written as grid_default_cell (window_copy_write_one,
# window-copy.c:5242), so copy-mode-current-line-style does not reach it.
# line-numbers-on keeps the selection's screen columns and clipx until the
# next window_copy_set_selection, and the gutter is selected as
# screen_check_selection says (screen_write_cell). Two steps are D-010:
# tmux's mode screen keeps a row's selection from its last write, and
# writes the blanks the gutter left as spaces.
name = "copy_line_numbers_cut"
size = [40, 10]
steps = [
  { run = ["new", "-d", "-s", "a", "-n", "w", "-x", "40", "-y", "9", "sh", "-c", "echo top; echo 'xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx世界'; printf 'abcdefghijklmnopqrstuvwxyz012345678\\tz\\n'; echo short; echo 'a b  c'; tmux wait-for -S ready; exec cat"] },
  { wait_for = "ready" },
  { run = ["select-pane", "-t", "%0", "-T", "t"] },
  { run = ["set", "-g", "status-right", ""] },
  { run = ["set", "-g", "copy-mode-position-format", "#[align=right][#{copy_position}/#{copy_position_limit}]"] },
  { run = ["set", "-g", "copy-mode-current-line-style", "underscore"] },
  { attach = { session = "a" } },
  { run = ["copy-mode", "-t", "a"] },
  { run = ["send-keys", "-t", "a", "-X", "line-numbers-on"] },
  { run = ["send-keys", "-t", "a", "-X", "history-top"] },
  { run = ["send-keys", "-t", "a", "-X", "cursor-down"] },
  { settle = { react = true } },
  # The wide character cut at the edge: a default cell.
  { screen = {} },
  { run = ["send-keys", "-t", "a", "-X", "cursor-down"] },
  { settle = { react = true } },
  # The TAB cut at the edge: a default cell.
  { screen = {} },
  { run = ["set", "-g", "copy-mode-current-line-style", "bg=red,bold"] },
  { run = ["send-keys", "-t", "a", "-X", "cursor-up"] },
  { settle = { react = true } },
  { screen = {} },
  { run = ["send-keys", "-t", "a", "-X", "line-numbers-off"] },
  { run = ["set", "-g", "copy-mode-current-line-style", "underscore,fg=green"] },
  { run = ["send-keys", "-t", "a", "-X", "-N", "2", "cursor-down"] },
  { run = ["send-keys", "-t", "a", "-X", "set-mark"] },
  { run = ["send-keys", "-t", "a", "-X", "cursor-right"] },
  { run = ["send-keys", "-t", "a", "-X", "begin-selection"] },
  { run = ["send-keys", "-t", "a", "-X", "cursor-down"] },
  { settle = { react = true } },
  { run = ["display", "-p", "-t", "a", "[#{selection_start_x},#{selection_start_y}] [#{selection_end_x},#{selection_end_y}] [#{copy_cursor_x},#{copy_cursor_y}]"] },
  # D-010: tmux wrote the blanks line-numbers-off left in the gutter as
  # spaces, so the row under the cursor's ends on a reset.
  { divergence = { id = "D-010", expect = { kind = "screen", rows = ["top                                \\e[30m\\e[43m[0/0]", "\\e[39m\\e[49mxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx世界", "abcdefghijklmnopqrstuvwxyz012345678    z", "\\e[33m\\e[40ms\\e[30m\\e[43mhort", "a\\e[4m\\e[32m\\e[49m b  c", "", "", "", "", "\\e[0m\\e[30m\\e[42m[a] \\e[4m0:w*\\e[0m\\e[42m"], cursor = [1, 4] } } },
  { screen = {} },
  # The selection was set without numbers (clipx 0): the gutter's cells
  # in it are selected.
  { run = ["send-keys", "-t", "a", "-X", "line-numbers-on"] },
  { settle = { react = true } },
  { screen = {} },
  { run = ["send-keys", "-t", "a", "-X", "cursor-right"] },
  { settle = { react = true } },
  # D-010: the move redraws only the cursor's row, so tmux keeps the old
  # selection on the row above.
  { divergence = { id = "D-010", expect = { kind = "screen", rows = ["\\e[2m\\e[37m  0 \\e[0mtop                            \\e[30m\\e[43m[0/0]", "\\e[2m\\e[37m\\e[49m  1 \\e[0mxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx", "\\e[2m\\e[37m  2 \\e[0mabcdefghijklmnopqrstuvwxyz012345678", "\\e[2m\\e[37m  3 \\e[0m\\e[33m\\e[40ms\\e[30m\\e[43mhort", "\\e[33m\\e[49m  4 \\e[30m\\e[43ma \\e[4m\\e[32m\\e[49mb  c", "\\e[0;2m\\e[37m  5 \\e[0m", "\\e[2m\\e[37m  6 \\e[0m", "\\e[2m\\e[37m  7 \\e[0m", "\\e[2m\\e[37m  8 \\e[0m", "\\e[30m\\e[42m[a] \\e[4m0:w*\\e[0m\\e[42m"], cursor = [6, 4] } } },
  { screen = {} },
  { run = ["send-keys", "-t", "a", "-X", "copy-selection-and-cancel"] },
  { run = ["show-buffer"] },
]
