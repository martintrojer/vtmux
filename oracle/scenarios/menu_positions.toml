# display-menu -x/-y (cmd_display_menu_get_menu_pos): positions are in the
# window, -y is the bottom line, both are kept inside the window. The
# default centre; numbers; P and R from the target pane; S and W on the
# status line; formats with popup_* variables; out-of-range numbers
# clamped; L at the last menu's position; M from the mouse event a
# MouseDown1Pane binding opened it with (a press, no release, so the menu
# stays; it has no starting choice then). Status at the top moves S and W.
# An item whose command is another `display-menu -xL -yL` (as the default
# pane menu's Move items are) opens it at the first one's corner.
name = "menu_positions"
size = [40, 12]
steps = [
  { run = ["new", "-d", "-s", "a", "-n", "w", "-x", "40", "-y", "11", "cat", "-"] },
  { run = ["set", "-g", "status-right", "R"] },
  { run = ["set", "-s", "escape-time", "0"] },
  { run = ["select-pane", "-t", "a", "-T", "p0"] },
  { run = ["neww", "-d", "-t", "a:1", "-n", "x", "cat", "-"] },
  { run = ["select-pane", "-t", "a:1.0", "-T", "p2"] },
  { run = ["splitw", "-h", "-t", "a:0", "cat", "-"] },
  { run = ["select-pane", "-t", "a:0.1", "-T", "p1"] },
  { attach = { session = "a" } },
  { settle = { quiet_ms = 1000 } },
  { run = ["display-menu", "One", "1", "", "Two", "2", ""] },
  { settle = { react = true } },
  { screen = {} },
  { run = ["display-menu", "-x", "3", "-y", "6", "One", "1", "", "Two", "2", ""] },
  { settle = { react = true } },
  { screen = {} },
  { run = ["display-menu", "-x", "P", "-y", "P", "One", "1", "", "Two", "2", ""] },
  { settle = { react = true } },
  { screen = {} },
  { run = ["display-menu", "-x", "R", "-y", "P", "-t", "a:0.0", "One", "1", "", "Two", "2", ""] },
  { settle = { react = true } },
  { screen = {} },
  { run = ["display-menu", "-x", "W", "-y", "S", "One", "1", "", "Two", "2", ""] },
  { settle = { react = true } },
  { screen = {} },
  { run = ["display-menu", "-x", "C", "-y", "W", "One", "1", "", "Two", "2", ""] },
  { settle = { react = true } },
  { screen = {} },
  { run = ["display-menu", "-x", "100", "-y", "-5", "One", "1", "", "Two", "2", ""] },
  { settle = { react = true } },
  { screen = {} },
  { run = ["display-menu", "-x", "#{e|+:#{popup_centre_x},3}", "-y", "#{popup_pane_top}", "One", "1", "", "Two", "2", ""] },
  { settle = { react = true } },
  { screen = {} },
  { run = ["display-menu", "-x", "L", "-y", "L", "Three", "3", "", "Four", "4", "", "Five", "5", ""] },
  { settle = { react = true } },
  { screen = {} },
  { keys = "q" },
  { settle = {} },
  { run = ["set", "-g", "status-position", "top"] },
  { settle = { react = true } },
  { run = ["display-menu", "-x", "W", "-y", "W", "One", "1", "", "Two", "2", ""] },
  { settle = { react = true } },
  { screen = {} },
  { run = ["display-menu", "-x", "P", "-y", "S", "One", "1", "", "Two", "2", ""] },
  { settle = { react = true } },
  { screen = {} },
  { keys = "q" },
  { settle = {} },
  { run = ["set", "-g", "status-position", "bottom"] },
  { run = ["set", "-g", "mouse", "on"] },
  { run = ["bind", "-n", "MouseDown1Pane", "display-menu", "-x", "M", "-y", "M", "-T", "#{mouse_x},#{mouse_y}", "One", "1", "set -g @c one", "Two", "2", "set -g @c two"] },
  { settle = { react = true } },
  { keys = "\u001b[<0;8;4M" },
  { screen = {} },
  { keys = "\u001b[B" },
  { screen = {} },
  { keys = "\r" },
  { screen = {} },
  { run = ["show", "-gv", "@c"] },
  { keys = "\u001b[<0;38;10M" },
  { screen = {} },
  { keys = "\u001b" },
  { screen = {} },
  { run = ["set", "-g", "mouse", "off"] },
  { run = ["bind", "-n", "M-n", "display-menu", "-x", "5", "-y", "9", "-T", "Outer", "Sub", "s", "display-menu -xL -yL -T Inner 'Deep item' d 'set -g @c deep'", "Other", "o", ""] },
  { keys = "\u001bn" },
  { screen = {} },
  { keys = "s" },
  { screen = {} },
  { keys = "d" },
  { screen = {} },
  { run = ["show", "-gv", "@c"] },
]
