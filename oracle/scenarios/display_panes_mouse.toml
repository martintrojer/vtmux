# display-panes with the mouse (window-panes.c window_panes_get_target,
# window_panes_find_pane): a MouseDown1Pane on a pane's box runs the
# command on that pane (selects it, or the -d template) and leaves the
# mode; a click on a border, a right click or the wheel keep it; with -N
# the mouse is ignored like keys. The boxes are where the mode drew them:
# scaled down on a small client, a floating pane's box over the tiled ones.
name = "display_panes_mouse"
size = [40, 12]
steps = [
  { run = ["new", "-d", "-s", "a", "-n", "w", "-x", "40", "-y", "11", "cat", "-"] },
  { run = ["select-pane", "-t", "a:0.0", "-T", "t"] },
  { run = ["splitw", "-h", "-t", "a", "cat", "-"] },
  { run = ["select-pane", "-t", "a:0.1", "-T", "t"] },
  { run = ["set", "-g", "status-right", ""] },
  { run = ["splitw", "-v", "-t", "a:0.1", "cat", "-"] },
  { run = ["select-pane", "-t", "a:0.2", "-T", "t"] },
  { attach = { session = "a" } },
  { screen = {  } },
  { run = ["display-panes", "-t", "a", "-d", "0", "set -g @r %%"] },
  { screen = {  } },
  { keys = "\u001b[<0;30;9M\u001b[<0;30;9m" },
  { screen = {  } },
  { run = ["display", "-p", "-t", "a", "#{pane_id}#{pane_in_mode}#{pane_mode}|#{window_zoomed_flag}|#{@r}"] },
  { run = ["display-panes", "-t", "a", "-d", "0"] },
  { screen = {  } },
  { keys = "\u001b[<0;21;4M\u001b[<0;21;4m" },
  { screen = {  } },
  { run = ["display", "-p", "-t", "a", "#{pane_id}#{pane_in_mode}#{pane_mode}|#{window_zoomed_flag}|#{@r}"] },
  { keys = "\u001b[<2;5;4M\u001b[<2;5;4m" },
  { screen = {  } },
  { run = ["display", "-p", "-t", "a", "#{pane_id}#{pane_in_mode}#{pane_mode}|#{window_zoomed_flag}|#{@r}"] },
  { keys = "\u001b[<64;5;4M" },
  { screen = {  } },
  { run = ["display", "-p", "-t", "a", "#{pane_id}#{pane_in_mode}#{pane_mode}|#{window_zoomed_flag}|#{@r}"] },
  { keys = "\u001b[<0;30;2M\u001b[<0;30;2m" },
  { screen = {  } },
  { run = ["display", "-p", "-t", "a", "#{pane_id}#{pane_in_mode}#{pane_mode}|#{window_zoomed_flag}|#{@r}"] },
  { run = ["display-panes", "-N", "-t", "a", "-d", "0"] },
  { screen = {  } },
  { keys = "\u001b[<0;5;4M\u001b[<0;5;4m" },
  { screen = {  } },
  { run = ["display", "-p", "-t", "a", "#{pane_id}#{pane_in_mode}#{pane_mode}|#{window_zoomed_flag}|#{@r}"] },
  { keys = "\u001b" },
  { screen = {  } },
  { run = ["display", "-p", "-t", "a", "#{pane_id}#{pane_in_mode}#{pane_mode}|#{window_zoomed_flag}|#{@r}"] },
  { resize = [20, 8] },
  { screen = {  } },
  { run = ["display-panes", "-t", "a", "-d", "0"] },
  { screen = {  } },
  { keys = "\u001b[<0;3;3M\u001b[<0;3;3m" },
  { screen = {  } },
  { run = ["display", "-p", "-t", "a", "#{pane_id}#{pane_in_mode}#{pane_mode}|#{window_zoomed_flag}|#{@r}"] },
  { resize = [40, 12] },
  { screen = {  } },
  { run = ["new-pane", "-d", "-t", "a:0.0", "-x", "15", "-y", "6", "-X", "5", "-Y", "2", "cat", "-"] },
  { run = ["select-pane", "-t", "a:0.3", "-T", "t"] },
  { run = ["display-panes", "-t", "a", "-d", "0"] },
  { screen = {  } },
  { keys = "\u001b[<0;12;5M\u001b[<0;12;5m" },
  { screen = {  } },
  { run = ["display", "-p", "-t", "a", "#{pane_id}#{pane_in_mode}#{pane_mode}|#{window_zoomed_flag}|#{@r}"] },
]
