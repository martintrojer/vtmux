name = "copy_pipe_buffers"
size = [40, 8]
# copy-pipe* and the buffer store from vi copy mode (window-copy.c
# window_copy_copy_pipe, window_copy_copy_buffer, window_copy_do_copy_end;
# paste.c). The pipe command gets the selection on stdin, writes it to a file
# and signals through `tmux wait-for`; the file, show-buffer and list-buffers
# show what was copied. copy-pipe clears the selection but stays in the mode,
# -and-cancel leaves it, -no-clear keeps the selection, -P adds no buffer,
# `pipe*` adds none at all, a command prefix argument is typed first, line
# variants take -N, `copy-command` is the default command, a missing command
# with no copy-command is an error. Then keys typed at the client: a vi-table
# binding of copy-pipe-and-cancel, Enter (copy-selection-and-cancel) and `A`
# (append-selection-and-cancel). OSC 52 bytes stay in attach.rs.
steps = [
  { run = ["new", "-d", "-s", "a", "-n", "w", "-x", "30", "-y", "6", "sh", "-c", "printf 'alpha beta\\ngamma delta\\nthird line\\n'; echo last; tmux wait-for -S ready; exec cat"] },
  { wait_for = "ready" },
  { run = ["set", "-g", "status-right", "", ";", "set", "-g", "set-clipboard", "off", ";", "set", "-g", "mode-keys", "vi"] },
  { run = ["select-pane", "-t", "a", "-T", "t"] },
  { attach = { session = "a" } },
  { run = ["copy-mode", "-t", "a"] },
  { run = ["send-keys", "-t", "a", "-X", "history-top"] },
  { run = ["send-keys", "-t", "a", "-X", "start-of-line"] },
  { run = ["send-keys", "-t", "a", "-X", "begin-selection"] },
  { run = ["send-keys", "-t", "a", "-X", "-N", "4", "cursor-right"] },
  { run = ["send-keys", "-t", "a", "-X", "copy-pipe", "cat > o1; tmux wait-for -S p1"] },
  { wait_for = "p1" },
  { run = ["run-shell", "cat -v o1"] },
  { run = ["display", "-p", "-t", "a", "[#{pane_in_mode}] [#{selection_present}] [#{copy_cursor_x},#{copy_cursor_y}]"] },
  { run = ["list-buffers", "-F", "#{buffer_name} #{buffer_size} #{buffer_sample}"] },
