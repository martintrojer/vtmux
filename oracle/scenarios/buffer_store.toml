name = "buffer_store"
size = [80, 24]
# Paste store: automatic names, -b/-a/-n, eviction at buffer-limit, list
# orders and errors, buffer_* formats, capture-pane into a buffer.
steps = [
  { run = ["new", "-d", "-s", "a", "-x", "20", "-y", "3", "sh", "-c", "printf 'hello\\nworld\\n'; tmux wait-for -S ready; exec cat"] },
  { wait_for = "ready" },
  { run = ["set-buffer", "one"] },
  { run = ["set-buffer", "two"] },
  { run = ["list-buffers"] },
  { run = ["set-buffer", "-a", "!"] },
  { run = ["list-buffers", "-F", "#{buffer_name}=#{buffer_sample} #{buffer_size}"] },
  { run = ["delete-buffer"] },
  { run = ["set-buffer", ""] },
  { run = ["list-buffers", "-F", "#{buffer_name}"] },
  { run = ["set-buffer", "-b", "named", "abc"] },
  { run = ["set-buffer", "-b", "named", "xyz"] },
  { run = ["set-buffer", "-a", "-b", "named", "123"] },
  { run = ["show-buffer", "-b", "named"] },
  { run = ["set-buffer", "-b", "named", "-n", "other"] },
  { run = ["set-buffer", "-b", "nosuch", "-n", "foo"] },
  { run = ["set-buffer", "-b", "other"] },
  { run = ["set-buffer", "-n", "x", "-b", "other", "-n", ""] },
  { run = ["set-buffer", "-b", "other", "-n", "buffer1"] },
  { run = ["list-buffers", "-F", "#{buffer_name}"] },
  { run = ["set-buffer", "-b", "", "x"] },
  { run = ["set-buffer", "-b", "a\tb", "x"] },
  { run = ["set-buffer", "-b", "a b", "x\ny\\z\u0001\t"] },
  { run = ["list-buffers"] },
  { run = ["list-buffers", "-O", "name"] },
  { run = ["list-buffers", "-O", "size"] },
  { run = ["list-buffers", "-O", "SIZE", "-r"] },
  { run = ["list-buffers", "-O", "creation"] },
  { run = ["list-buffers", "-O", "creation", "-r"] },
  { run = ["list-buffers", "-O", "order", "-r"] },
  { run = ["list-buffers", "-r"] },
  { run = ["list-buffers", "-O", "activity"] },
  { run = ["list-buffers", "-O", "bogus"] },
  { run = ["list-buffers", "-f", "#{==:#{buffer_name},a b}", "-F", "#{buffer_name}"] },
  { run = ["display-message", "-p", "#{buffer_name} #{buffer_size} #{buffer_sample}"] },
  { run = ["show-buffer"] },
  { run = ["delete-buffer", "-b", "buffer1"] },
  { run = ["delete-buffer", "-b", "buffer1"] },
  { run = ["show-buffer", "-b", "nosuch"] },
  { run = ["set-option", "-g", "buffer-limit", "3"] },
  { run = ["set-buffer", "-b", "keepme", "precious"] },
  { run = ["set-buffer", "a1"] },
  { run = ["set-buffer", "a2"] },
  { run = ["set-buffer", "a3"] },
  { run = ["set-buffer", "a4"] },
  { run = ["list-buffers", "-F", "#{buffer_name}=#{buffer_sample}"] },
  { run = ["set-option", "-g", "buffer-limit", "1"] },
  { run = ["set-buffer", "z"] },
  { run = ["list-buffers", "-F", "#{buffer_name}"] },
  { run = ["set-option", "-g", "buffer-limit", "50"] },
  { run = ["capture-pane", "-t", "%0"] },
  { run = ["capture-pane", "-b", "cap", "-t", "%0", "-S", "0", "-E", "1"] },
  { run = ["list-buffers", "-F", "#{buffer_name} #{buffer_size}"] },
  { run = ["capture-pane", "-b", "", "-t", "%0"] },
  { run = ["capture-pane", "-p", "-b", "nope", "-t", "%0"] },
  { run = ["show-buffer", "-b", "cap"] },
  { run = ["delete-buffer"] },
  { run = ["delete-buffer"] },
  { run = ["delete-buffer"] },
  { run = ["delete-buffer"] },
  { run = ["list-buffers"] },
]
