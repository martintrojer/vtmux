name = "ich_to_line_end"
size = [20, 6]
# ICH (CSI n @) reaching the end of the line. tmux clamps the count to the
# columns left (screen-write.c screen_write_insertcharacter), and
# grid_view_insert_cells (grid-view.c) then moves `sx - px - nx` cells: none,
# so grid_move_cells (grid.c) returns before it clears anything and tmux's
# grid keeps the line. The attached client of a full-width pane gets the ICH
# itself (tty.c tty_cmd_insertcharacter) and clears the rest of the line, as
# xterm does; a redraw and a capture show the grid. A pane that is not full
# width is drawn from the grid at once (tty_draw_pane). vtmux keeps
# libghostty-vt's ICH, xterm's (D-075).
steps = [
  { run = ["new", "-d", "-s", "init", "-n", "w", "-x", "20", "-y", "5", "cat", "-"] },
  { run = ["set", "-g", "status", "off"] },
  # full: abcdefgh, then ICH 30 at column 2 of a full-width pane
  { run = ["new", "-d", "-s", "full", "-n", "w", "-x", "20", "-y", "5", "sh", "-c", "printf 'abcdefgh'; tmux wait-for -S fulla; tmux wait-for fullb; printf '\\033[1;3H\\033[30@\\033[2;1H'; tmux wait-for -S fullc; exec cat"] },
  { wait_for = "fulla" },
  { attach = { session = "full", id = "full" } },
  { run = ["wait-for", "-S", "fullb"] },
  { wait_for = "fullc" },
  { settle = { react = true } },
  { screen = { id = "full" } },
  { divergence = { id = "D-075", expect = { kind = "cli", stdout = "ab\n\n\n\n\n\n", stderr = "", exit = 0 } } },
  { run = ["capture-pane", "-p", "-t", "full:"] },
  { run = ["refresh-client"] },
  { settle = { react = true } },
  { divergence = { id = "D-075", expect = { kind = "screen", rows = ["ab", "", "", "", "", ""], cursor = [0, 1] } } },
  { screen = { id = "full" } },
  # last: ICH at the last column clears that cell (grid_view_insert_cells: px >= sx - 1)
  { run = ["new", "-d", "-s", "last", "-n", "w", "-x", "20", "-y", "5", "sh", "-c", "printf 'abcdefghijklmnopqrst\\033[1;20H\\033[5@\\033[2;1H'; tmux wait-for -S last; exec cat"] },
  { wait_for = "last" },
  { run = ["capture-pane", "-p", "-t", "last:"] },
  # part: ICH 3 at column 2 moves the rest right and drops what passes the end
  { run = ["new", "-d", "-s", "part", "-n", "w", "-x", "20", "-y", "5", "sh", "-c", "printf 'abcdefghijklmnopqrst\\033[1;3H\\033[3@\\033[2;1H'; tmux wait-for -S part; exec cat"] },
  { wait_for = "part" },
  { run = ["capture-pane", "-p", "-t", "part:"] },
  # exact: ICH of exactly the columns left (18 at column 2)
  { run = ["new", "-d", "-s", "exact", "-n", "w", "-x", "20", "-y", "5", "sh", "-c", "printf 'abcdefgh\\033[1;3H\\033[18@\\033[2;1H'; tmux wait-for -S exact; exec cat"] },
  { wait_for = "exact" },
  { divergence = { id = "D-075", expect = { kind = "cli", stdout = "ab\n\n\n\n\n", stderr = "", exit = 0 } } },
  { run = ["capture-pane", "-p", "-t", "exact:"] },
  # split: the same in the left pane of two, which tmux draws from its grid at once
  { run = ["new", "-d", "-s", "split", "-n", "w", "-x", "20", "-y", "5", "sh", "-c", "printf 'abcdefgh'; tmux wait-for -S splita; tmux wait-for splitb; printf '\\033[1;3H\\033[8@\\033[2;1H'; tmux wait-for -S splitc; exec cat"] },
  { wait_for = "splita" },
  { run = ["splitw", "-d", "-h", "-l", "9", "-t", "split:", "cat", "-"] },
  { attach = { session = "split", id = "split" } },
  { run = ["wait-for", "-S", "splitb"] },
  { wait_for = "splitc" },
  { settle = { react = true } },
  { divergence = { id = "D-075", expect = { kind = "screen", rows = ["ab        \\e[32m│\\e[39m", "          \\e[32m│\\e[39m", "          \\e[32m│\\e[39m", "          \\e[32m│\\e[39m", "          \\e[37m│\\e[39m", "          \\e[37m│\\e[39m"], cursor = [0, 1] } } },
  { screen = { id = "split" } },
]
