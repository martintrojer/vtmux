name = "panes_mode_timeout_cli"
size = [60, 20]
steps = [
  { run = ["new", "-d", "-s", "a", "-n", "w", "-x", "60", "-y", "19", "cat"] },
  { run = ["splitw", "-h", "-t", "a", "cat"] },
  { run = ["new-window", "-d", "-t", "a", "-n", "x", "cat"] },
  { run = ["splitw", "-v", "-t", "a:x", "cat"] },
  { run = ["splitw", "-v", "-t", "a:x", "cat"] },
  { run = ["display-panes", "-d", "x", "-t", "%0"] },
  { run = ["display-panes", "-d", "-1", "-t", "%0"] },
  { run = ["display-panes", "-d", "99999999999", "-t", "%0"] },
  { run = ["display-panes", "-d", "", "-t", "%0"] },
  { run = ["setw", "-g", "display-panes-time", "0"] },
  { run = ["setw", "-g", "display-panes-time", "400"] },
  { run = ["display-panes", "-t", "%0"] },
  { run = ["display", "-p", "-t", "%0", "[#{pane_mode}] #{pane_in_mode} #{window_zoomed_flag}"] },
  { run = ["run-shell", "while [ \"$(tmux display -p -t %0 '##{pane_mode}')\" = panes-mode ]; do sleep 0.05; done"] },
  { run = ["display", "-p", "-t", "%0", "[#{pane_mode}] #{pane_in_mode} #{window_zoomed_flag}"] },
  { run = ["display-panes", "-d", "300", "-t", "%0"] },
  { run = ["run-shell", "while [ \"$(tmux display -p -t %0 '##{pane_mode}')\" = panes-mode ]; do sleep 0.05; done"] },
  { run = ["display", "-p", "-t", "%0", "[#{pane_mode}] #{pane_in_mode} #{window_zoomed_flag}"] },
  { run = ["display-panes", "-d", "300", "-Z", "-t", "%0"] },
  { run = ["run-shell", "while [ \"$(tmux display -p -t %0 '##{pane_mode}')\" = panes-mode ]; do sleep 0.05; done"] },
  { run = ["display", "-p", "-t", "%0", "[#{pane_mode}] #{pane_in_mode} #{window_zoomed_flag}"] },
  { run = ["display-panes", "-d", "0", "-t", "%0"] },
  { run = ["send-keys", "-t", "%0", "q"] },
  { run = ["send-keys", "-t", "%0", "-X", "cancel"] },
  { run = ["send-keys", "-t", "%0", "-N", "3", "x"] },
  { run = ["display", "-p", "-t", "%0", "[#{pane_mode}] #{pane_in_mode} #{window_zoomed_flag}"] },
  { run = ["display-panes", "-d", "0", "-t", "%0"] },
  { run = ["display", "-p", "-t", "%0", "[#{pane_mode}] #{pane_in_mode}"] },
  { run = ["copy-mode", "-t", "%0"] },
  { run = ["display", "-p", "-t", "%0", "[#{pane_mode}] #{pane_in_mode}"] },
  { run = ["display-panes", "-d", "0", "-t", "%0"] },
  { run = ["display", "-p", "-t", "%0", "[#{pane_mode}] #{pane_in_mode}"] },
  { run = ["copy-mode", "-q", "-t", "%0"] },
  { run = ["display", "-p", "-t", "%0", "[#{pane_mode}] #{pane_in_mode} #{window_zoomed_flag}"] },
  { run = ["display-panes", "-d", "0", "-t", "%0"] },
  { run = ["clock-mode", "-t", "%0"] },
  { run = ["display", "-p", "-t", "%0", "[#{pane_mode}] #{pane_in_mode} #{window_zoomed_flag}"] },
  { run = ["send-keys", "-t", "%0", "-X", "cancel"] },
  { run = ["display-panes", "-d", "0", "-k", "-t", "%1"] },
  { run = ["display", "-p", "-t", "%1", "[#{pane_mode}] #{pane_in_mode} #{window_zoomed_flag}"] },
  { run = ["kill-pane", "-t", "%1"] },
  { run = ["list-panes", "-a", "-F", "#{pane_id} [#{pane_mode}] #{window_zoomed_flag}"] },
  { run = ["display-panes", "-d", "0", "-s", "a:x", "-t", "%0"] },
  { run = ["display", "-p", "-t", "%0", "[#{pane_mode}] #{pane_in_mode} #{window_zoomed_flag}"] },
  { run = ["display-panes", "-d", "0", "-Z", "-t", "%0"] },
  { run = ["resizep", "-Z", "-t", "%0"] },
  { run = ["list-panes", "-a", "-F", "#{pane_id} [#{pane_mode}] #{window_zoomed_flag} #{pane_width}x#{pane_height} #{pane_unzoomed_width}x#{pane_unzoomed_height}"] },
  { run = ["display-panes", "-d", "0", "-t", "%0"] },
  { run = ["respawn-pane", "-k", "-t", "%0", "cat"] },
  { run = ["list-panes", "-a", "-F", "#{pane_id} [#{pane_mode}] #{window_zoomed_flag}"] },
  { run = ["show", "-gv", "display-panes-format"] },
  { run = ["show", "-gv", "display-panes-border-style"] },
  { run = ["show", "-gv", "display-panes-colour"] },
  { run = ["display-panes", "-d", "0", "-t", "%0", "x", "y"] },
  { run = ["display-panes", "-d", "0", "-t", "nonexistent"] },
]
