name = "term_ncurses_terminals"
size = [40, 6]
steps = [
  # D-007: terminals from ncurses 6.6's database, which older hosts lack (`oracle/terminfo`).
  { run = ["new", "-d", "-s", "a", "-n", "w", "-x", "40", "-y", "5", "sh", "-c", "printf '\\033[1mb\\033[0m \\033[3mi\\033[0m \\033[4mu\\033[0m \\033[9ms\\033[0m \\033[4:3mcurly\\033[0m \\033[38;5;200mA\\033[0m \\033[38;2;10;20;30mB\\033[0m \\033[91;101mC\\033[0m\\n'; tmux wait-for -S ready; exec cat -"] },
  { wait_for = "ready" },
  { run = ["set", "-g", "status-right", ""] },
  { run = ["select-pane", "-t", "a", "-T", "p"] },
  { attach = { session = "a", id = "wezterm", term = "wezterm" } },
  { screen = { id = "wezterm" } },
  { run = ["lsc", "-F", "#{client_termname}|#{client_termfeatures}|#{client_colours}|#{Ic:smcup}|#{Ic:kmous}|#{Ic:Smulx}|#{Ic:setrgbf}|#{Ic:Ss}|#{Ic:Ms}|#{Ic:Sync}"] },
  { keys_to = { id = "wezterm", keys = "\u0002d" } },
  { settle = {} },
  { attach = { session = "a", id = "foot", term = "foot" } },
  { screen = { id = "foot" } },
  { run = ["lsc", "-F", "#{client_termname}|#{client_termfeatures}|#{client_colours}|#{Ic:smcup}|#{Ic:kmous}|#{Ic:Smulx}|#{Ic:setrgbf}|#{Ic:Ss}|#{Ic:Ms}|#{Ic:Sync}"] },
  { keys_to = { id = "foot", keys = "\u0002d" } },
  { settle = {} },
  { attach = { session = "a", id = "foot-direct", term = "foot-direct" } },
  { screen = { id = "foot-direct" } },
  { run = ["lsc", "-F", "#{client_termname}|#{client_termfeatures}|#{client_colours}|#{Ic:smcup}|#{Ic:kmous}|#{Ic:Smulx}|#{Ic:setrgbf}|#{Ic:Ss}|#{Ic:Ms}|#{Ic:Sync}"] },
  { keys_to = { id = "foot-direct", keys = "\u0002d" } },
  { settle = {} },
  { attach = { session = "a", id = "contour", term = "contour" } },
  { screen = { id = "contour" } },
  { run = ["lsc", "-F", "#{client_termname}|#{client_termfeatures}|#{client_colours}|#{Ic:smcup}|#{Ic:kmous}|#{Ic:Smulx}|#{Ic:setrgbf}|#{Ic:Ss}|#{Ic:Ms}|#{Ic:Sync}"] },
  { keys_to = { id = "contour", keys = "\u0002d" } },
  { settle = {} },
  { attach = { session = "a", id = "rio", term = "rio" } },
  { screen = { id = "rio" } },
  { run = ["lsc", "-F", "#{client_termname}|#{client_termfeatures}|#{client_colours}|#{Ic:smcup}|#{Ic:kmous}|#{Ic:Smulx}|#{Ic:setrgbf}|#{Ic:Ss}|#{Ic:Ms}|#{Ic:Sync}"] },
  { keys_to = { id = "rio", keys = "\u0002d" } },
  { settle = {} },
]
