name = "panes_mode_keeps_drawing_resize_swap"
size = [60, 20]
steps = [
  { run = ["new", "-d", "-s", "a", "-n", "w", "-x", "60", "-y", "19", "cat"] },
  { run = ["set", "-g", "status-right", ""] },
  { run = ["splitw", "-h", "-t", "a", "cat"] },
  { run = ["splitw", "-v", "-t", "%1", "cat"] },
  { attach = { session = "a" } },
  { run = ["display-panes", "-d", "0", "-Z", "-t", "%0"] },
  { settle = { react = true } },
  { screen = {} },
  { run = ["resize-pane", "-t", "%2", "-y", "3"] },
  { settle = { react = true } },
  { screen = {} },
  { run = ["swap-pane", "-s", "%1", "-t", "%2"] },
  { settle = { react = true } },
  { screen = {} },
  { keys = "1" },
  { settle = { react = true } },
  { run = ["display", "-p", "-t", "a", "#{pane_id} #{pane_mode} #{window_zoomed_flag}"] },
  { screen = {} },
]
