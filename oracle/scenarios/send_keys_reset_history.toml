name = "send_keys_reset_history"
size = [30, 7]
# send-keys -R (cmd-send-keys.c:236-240, input_reset(1) and
# screen_write_reset): with scroll-on-clear on, the screen's used rows go
# into history and the old history stays; with it off they are erased. An
# alternate screen stays up (capture -a still has the primary screen). The
# program prints each input line's text as escapes (`printf %b`).
steps = [
  { run = ["new", "-d", "-s", "a", "-x", "30", "-y", "6", "sh", "-c", "stty -echo; i=1; while [ $i -le 9 ]; do echo l$i; i=$((i+1)); done; printf '\\033[1;33mbold'; tmux wait-for -S ready; while read -r l; do printf \"$l\"; tmux wait-for -S fed; done"] },
  { wait_for = "ready" },
  { run = ["set", "-g", "status-right", "x"] },
  { run = ["select-pane", "-t", "%0", "-T", "t"] },
  { attach = { session = "a" } },
  { screen = {} },
  { run = ["display", "-p", "#{history_size} #{alternate_on} #{cursor_x},#{cursor_y}"] },
  { run = ["send-keys", "-R", "-t", "%0"] },
  { settle = { react = true } },
  { screen = {} },
  { run = ["display", "-p", "#{history_size} #{alternate_on} #{cursor_x},#{cursor_y}"] },
  { run = ["capturep", "-pe", "-S", "-", "-E", "-"] },
  { feed = { pane = "%0", bytes = "\\033[32mgreen\\nmore\r" } },
  { wait_for = "fed" },
  { run = ["capturep", "-p"] },
  { run = ["set", "-p", "-t", "%0", "scroll-on-clear", "off"] },
  { run = ["send-keys", "-R", "-t", "%0"] },
  { settle = { react = true } },
  { run = ["display", "-p", "#{history_size} #{cursor_x},#{cursor_y}"] },
  { run = ["capturep", "-p", "-S", "-", "-E", "-"] },
  { run = ["set", "-pu", "-t", "%0", "scroll-on-clear"] },
  { feed = { pane = "%0", bytes = "main\\n\\033[?1049h\\033[31malt text\\033[5;5Hx\r" } },
  { wait_for = "fed" },
  { settle = { react = true } },
  { screen = {} },
  { run = ["send-keys", "-R", "-t", "%0"] },
  { settle = { react = true } },
  { screen = {} },
  { run = ["display", "-p", "#{history_size} #{alternate_on} #{cursor_x},#{cursor_y}"] },
  { run = ["capturep", "-pa"] },
  { feed = { pane = "%0", bytes = "\\033[?1049l\r" } },
  { wait_for = "fed" },
  { settle = { react = true } },
  { screen = {} },
  { run = ["display", "-p", "#{history_size} #{alternate_on}"] },
]
