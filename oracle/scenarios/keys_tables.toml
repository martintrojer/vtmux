name = "keys_tables"
steps = [
  { run = ["new", "-d", "-s", "a", "-n", "w", "cat"] },
  { run = ["new", "-d", "-s", "b", "-n", "w", "cat"] },
  { run = ["bind", "-n", "M-x", "select-window", "-t", ":9"] },
  { run = ["bind", "-n", "M-y", "display", "-p", "hello"] },
  { run = ["bind", "-N", "rep", "-r", "R", "display", "-p", "rep"] },
  { run = ["bind", "-T", "mine", "z", "display", "-p", "mine-z"] },
  { run = ["set", "-g", "prefix2", "C-a"] },
  { run = ["lsk", "-T", "mine"] },
  { run = ["lsk", "-N", "R"] },
  { control = { argv = ["attach", "-t", "a"], id = "c1" } },
  { control_send = { id = "c1", line = "send-keys -K M-x" } },
  { control_wait = { id = "c1", until = "%error" } },
  { control_send = { id = "c1", line = "send-keys -K M-y" } },
  { control_wait = { id = "c1", until = "%end" } },
  { control_send = { id = "c1", line = "display -p '#{client_key_table} #{client_prefix}'" } },
  { control_wait = { id = "c1", until = "%end" } },
  { control_send = { id = "c1", line = "send-keys -K C-b R" } },
  { control_wait = { id = "c1", until = "%end" } },
  { control_send = { id = "c1", line = "display -p '#{client_key_table} #{client_prefix}'" } },
  { control_wait = { id = "c1", until = "%end" } },
  { control_send = { id = "c1", line = "send-keys -K R z" } },
  { control_wait = { id = "c1", until = "%end" } },
  { control_send = { id = "c1", line = "send-keys -K C-a Escape" } },
  { control_wait = { id = "c1", until = "%end" } },
  { control_send = { id = "c1", line = "display -p '#{client_key_table} #{client_prefix}'" } },
  { control_wait = { id = "c1", until = "%end" } },
  { control_send = { id = "c1", line = "switch-client -T mine" } },
  { control_wait = { id = "c1", until = "%end" } },
  { control_send = { id = "c1", line = "send-keys -K z" } },
  { control_wait = { id = "c1", until = "%end" } },
  { control_send = { id = "c1", line = "switch-client -T nope" } },
  { control_wait = { id = "c1", until = "%error" } },
  { control_send = { id = "c1", line = "switch-client -t b" } },
  { control_wait = { id = "c1", until = "%end" } },
  { control_send = { id = "c1", line = "display -p '#{client_session} #{client_last_session}'" } },
  { control_wait = { id = "c1", until = "%end" } },
  { control_send = { id = "c1", line = "switch-client -l" } },
  { control_wait = { id = "c1", until = "%end" } },
  { control_send = { id = "c1", line = "switch-client -n" } },
  { control_wait = { id = "c1", until = "%end" } },
  { control_send = { id = "c1", line = "display -p '#{client_session} #{client_last_session}'" } },
  { control_wait = { id = "c1", until = "%end" } },
  { control_close = { id = "c1" } },
  { run = ["unbind", "-a", "-T", "mine"] },
  { run = ["lsk", "-T", "mine"] },
  { run = ["unbind", "-q", "-T", "mine", "z"] },
  { run = ["switch-client", "-T", "prefix"] },
]
