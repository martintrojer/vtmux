name = "winlink_move"
steps = [
  { run = ["new", "-d", "-s", "a", "-n", "w0", "-x", "80", "-y", "24", "cat"] },
  { run = ["neww", "-d", "-t", "a:1", "-n", "w1", "cat"] },
  { run = ["neww", "-d", "-t", "a:2", "-n", "w2", "cat"] },
  { run = ["new", "-d", "-s", "b", "-n", "b0", "-x", "80", "-y", "24", "cat"] },
  { run = ["movew", "-s", "a:1", "-t", "b:5"] },
  { run = ["lsw", "-a", "-F", "#{session_name}:#{window_index} #{window_id} #{window_name} [#{window_flags}] #{window_panes}"] },
  { run = ["ls", "-F", "#{session_name} #{session_windows} #{session_many_attached}"] },
  { run = ["movew", "-s", "a:1", "-t", "b:5"] },
  { run = ["movew", "-s", "b:5", "-t", "b:5"] },
  { run = ["movew", "-s", "a:2", "-t", "b:5"] },
  { run = ["movew", "-k", "-s", "a:2", "-t", "b:5"] },
  { run = ["lsw", "-a", "-F", "#{session_name}:#{window_index} #{window_id} #{window_name} [#{window_flags}] #{window_panes}"] },
  { run = ["display", "-p", "-t", "b", "#{session_name}:#{window_index} #{window_id}"] },
  { run = ["movew", "-d", "-s", "b:5", "-t", "a:7"] },
  { run = ["lsw", "-a", "-F", "#{session_name}:#{window_index} #{window_id} #{window_name} [#{window_flags}] #{window_panes}"] },
  { run = ["movew", "-s", "a:7", "-t", "a:3"] },
  { run = ["lsw", "-a", "-F", "#{session_name}:#{window_index} #{window_id} #{window_name} [#{window_flags}] #{window_panes}"] },
  { run = ["movew", "-a", "-s", "a:3", "-t", "a:0"] },
  { run = ["lsw", "-a", "-F", "#{session_name}:#{window_index} #{window_id} #{window_name} [#{window_flags}] #{window_panes}"] },
  { run = ["movew", "-b", "-s", "a:1", "-t", "a:0"] },
  { run = ["lsw", "-a", "-F", "#{session_name}:#{window_index} #{window_id} #{window_name} [#{window_flags}] #{window_panes}"] },
  { run = ["movew", "-s", "a:0", "-t", "9"] },
  { run = ["lsw", "-a", "-F", "#{session_name}:#{window_index} #{window_id} #{window_name} [#{window_flags}] #{window_panes}"] },
  { run = ["movew", "-s", "a:9", "-t", "a:+1"] },
  { run = ["lsw", "-a", "-F", "#{session_name}:#{window_index} #{window_id} #{window_name} [#{window_flags}] #{window_panes}"] },
  { run = ["movew", "-s", "a:0", "-t", "nosuch:3"] },
  { run = ["movew", "-s", "nosuch:0", "-t", "a:3"] },
  { run = ["set", "-g", "renumber-windows", "on"] },
  { run = ["neww", "-d", "-t", "a:8", "-n", "w8", "cat"] },
  { run = ["neww", "-d", "-t", "a:9", "-n", "w9", "cat"] },
  { run = ["movew", "-s", "a:3", "-t", "b:4"] },
  { run = ["lsw", "-a", "-F", "#{session_name}:#{window_index} #{window_id} #{window_name} [#{window_flags}] #{window_panes}"] },
  { run = ["movew", "-d", "-s", "a:9", "-t", "b:1"] },
  { run = ["lsw", "-a", "-F", "#{session_name}:#{window_index} #{window_id} #{window_name} [#{window_flags}] #{window_panes}"] },
  { run = ["set", "-g", "renumber-windows", "off"] },
  { run = ["movew", "-r", "-t", "a"] },
  { run = ["lsw", "-a", "-F", "#{session_name}:#{window_index} #{window_id} #{window_name} [#{window_flags}] #{window_panes}"] },
  { run = ["movew", "-r", "-t", "b"] },
  { run = ["lsw", "-a", "-F", "#{session_name}:#{window_index} #{window_id} #{window_name} [#{window_flags}] #{window_panes}"] },
  { run = ["movew", "-r", "-t", "nosuch"] },
  { run = ["set", "-g", "base-index", "3"] },
  { run = ["movew", "-r", "-t", "a"] },
  { run = ["lsw", "-a", "-F", "#{session_name}:#{window_index} #{window_id} #{window_name} [#{window_flags}] #{window_panes}"] },
  { run = ["movew", "-r"] },
  { run = ["lsw", "-a", "-F", "#{session_name}:#{window_index} #{window_id} #{window_name} [#{window_flags}] #{window_panes}"] },
  { run = ["movew", "-s", "b:0", "-t", "a"] },
  { run = ["lsw", "-a", "-F", "#{session_name}:#{window_index} #{window_id} #{window_name} [#{window_flags}] #{window_panes}"] },
  { run = ["ls", "-F", "#{session_name} #{session_windows} #{session_many_attached}"] },
  { run = ["movew", "-s", "b:1", "-t", "a"] },
  { run = ["lsw", "-a", "-F", "#{session_name}:#{window_index} #{window_id} #{window_name} [#{window_flags}] #{window_panes}"] },
  { run = ["ls", "-F", "#{session_name} #{session_windows} #{session_many_attached}"] },
  { run = ["kill-server"] },
]
