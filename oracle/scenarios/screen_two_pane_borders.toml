name = "screen_two_pane_borders"
size = [40, 10]
steps = [
  { run = ["new", "-d", "-s", "a", "-n", "w", "-x", "40", "-y", "9", "cat"] },
  { run = ["splitw", "-h", "-t", "a", "cat"] },
  { run = ["select-pane", "-t", "%0", "-T", "t"] },
  { run = ["select-pane", "-t", "%1", "-T", "t"] },
  { attach = { session = "a" } },
  { screen = {} },
  { run = ["selectp", "-t", "%0"] },
  { screen = {} },
  { run = ["set", "-w", "-t", "a", "pane-border-indicators", "both"] },
  { screen = {} },
  { run = ["killp", "-t", "%1"] },
  { run = ["splitw", "-v", "-t", "a", "cat"] },
  { run = ["select-pane", "-t", "%2", "-T", "t"] },
  { screen = {} },
  { run = ["selectp", "-t", "%0"] },
  { screen = {} },
  { run = ["set", "-w", "-t", "a", "pane-border-indicators", "arrows"] },
  { screen = {} },
]
