name = "clock_small"
size = [20, 5]
steps = [
  { run = ["new", "-d", "-s", "a", "-n", "w", "-x", "20", "-y", "5", "cat"] },
  { run = ["set", "-g", "status", "off"] },
  { run = ["set", "-w", "clock-mode-colour", "red"] },
  { attach = { session = "a" } },
  { run = ["set", "-w", "clock-mode-style", "12"] },
  { run = ["clock-mode", "-t", "a"] },
  { run = ["display", "-p", "-t", "a", "[#{pane_mode}] [#{pane_in_mode}]"] },
  { screen = {} },
  { run = ["send-keys", "-t", "a", "x"] },
  { settle = { react = true } },
  { run = ["display", "-p", "-t", "a", "[#{pane_mode}] [#{pane_in_mode}]"] },
  { run = ["set", "-w", "clock-mode-style", "24"] },
  { run = ["clock-mode", "-t", "a"] },
  { run = ["display", "-p", "-t", "a", "[#{pane_mode}] [#{pane_in_mode}]"] },
  { screen = {} },
  { run = ["send-keys", "-t", "a", "x"] },
  { settle = { react = true } },
  { run = ["display", "-p", "-t", "a", "[#{pane_mode}] [#{pane_in_mode}]"] },
  { run = ["set", "-w", "clock-mode-style", "12-with-seconds"] },
  { run = ["clock-mode", "-t", "a"] },
  { run = ["display", "-p", "-t", "a", "[#{pane_mode}] [#{pane_in_mode}]"] },
  { screen = {} },
  { run = ["send-keys", "-t", "a", "x"] },
  { settle = { react = true } },
  { run = ["display", "-p", "-t", "a", "[#{pane_mode}] [#{pane_in_mode}]"] },
  { run = ["set", "-w", "clock-mode-style", "24-with-seconds"] },
  { run = ["clock-mode", "-t", "a"] },
  { run = ["display", "-p", "-t", "a", "[#{pane_mode}] [#{pane_in_mode}]"] },
  { screen = {} },
  { run = ["send-keys", "-t", "a", "x"] },
  { settle = { react = true } },
  { run = ["display", "-p", "-t", "a", "[#{pane_mode}] [#{pane_in_mode}]"] },
  { run = ["set", "-w", "clock-mode-style", "24"] },
  { run = ["set", "-w", "clock-mode-colour", "default"] },
  { run = ["clock-mode", "-t", "a"] },
  { screen = {} },
  { run = ["send-keys", "-t", "a", "x"] },
  { settle = { react = true } },
  { run = ["set", "-w", "clock-mode-colour", "colour196"] },
  { run = ["copy-mode", "-t", "a"] },
  { run = ["clock-mode", "-t", "a"] },
  { run = ["display", "-p", "-t", "a", "[#{pane_mode}] [#{pane_in_mode}]"] },
  { screen = {} },
  { run = ["send-keys", "-t", "a", "-X", "cancel"] },
  { run = ["send-keys", "-t", "a", "x"] },
  { settle = { react = true } },
  { run = ["display", "-p", "-t", "a", "[#{pane_mode}] [#{pane_in_mode}]"] },
  { run = ["send-keys", "-t", "a", "q"] },
  { settle = { react = true } },
  { run = ["display", "-p", "-t", "a", "[#{pane_mode}] [#{pane_in_mode}]"] },
  { run = ["clock-mode", "-t", "a"] },
  { run = ["clock-mode", "-t", "a"] },
  { run = ["display", "-p", "-t", "a", "[#{pane_mode}] [#{pane_in_mode}]"] },
  { run = ["send-keys", "-t", "a", "-X", "cancel"] },
  { run = ["send-keys", "-t", "a", "-N", "2", "x"] },
