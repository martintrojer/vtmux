# Word selection after begin-selection resets the start to selr, here the
# stale one the line selection left (window_copy_synchronize_cursor_end);
# tmux then redraws only the cursor's lines (WINDOW_COPY_CMD_MOVE), so no
# screen is observed until a command redraws the whole mode.
name = "copy_select_mode"
size = [40, 10]
steps = [
  { run = ["new", "-d", "-s", "a", "-n", "w", "-x", "30", "-y", "6", "sh", "-c", "printf 'alpha\\nbeta\\ngamma\\ndelta\\n'; echo 'one two-three  four'; tmux wait-for -S ready; exec cat"] },
  { wait_for = "ready" },
  { run = ["select-pane", "-t", "%0", "-T", "t"] },
  { run = ["set", "-g", "window-size", "manual"] },
  { attach = { session = "a" } },
  { run = ["copy-mode", "-t", "a"] },
  { run = ["send-keys", "-t", "a", "-X", "history-top"] },
  { run = ["send-keys", "-t", "a", "-X", "-N", "2", "cursor-right"] },
  { run = ["send-keys", "-t", "a", "-X", "begin-selection"] },
  { run = ["send-keys", "-t", "a", "-X", "cursor-down"] },
  { run = ["send-keys", "-t", "a", "-X", "-N", "2", "cursor-right"] },
  { run = ["send-keys", "-t", "a", "-X", "selection-mode", "line"] },
  { settle = { react = true } },
  { run = ["display", "-p", "-t", "a", "[#{selection_mode}] [#{selection_start_x},#{selection_start_y}-#{selection_end_x},#{selection_end_y}] [#{copy_cursor_x},#{copy_cursor_y}]"] },
  { screen = {} },
  { run = ["send-keys", "-t", "a", "-X", "copy-selection"] },
  { run = ["show-buffer"] },
  { run = ["send-keys", "-t", "a", "-X", "cancel"] },
  { run = ["copy-mode", "-t", "a"] },
  { run = ["send-keys", "-t", "a", "-X", "history-top"] },
  { run = ["send-keys", "-t", "a", "-X", "-N", "2", "cursor-down"] },
  { run = ["send-keys", "-t", "a", "-X", "-N", "2", "cursor-right"] },
  { run = ["send-keys", "-t", "a", "-X", "begin-selection"] },
  { run = ["send-keys", "-t", "a", "-X", "cursor-up"] },
  { run = ["send-keys", "-t", "a", "-X", "-N", "2", "cursor-right"] },
  { run = ["send-keys", "-t", "a", "-X", "selection-mode", "line"] },
  { run = ["send-keys", "-t", "a", "-X", "cursor-up"] },
  { settle = { react = true } },
  { run = ["display", "-p", "-t", "a", "[#{selection_mode}] [#{selection_start_x},#{selection_start_y}-#{selection_end_x},#{selection_end_y}] [#{copy_cursor_x},#{copy_cursor_y}]"] },
  { screen = {} },
  { run = ["send-keys", "-t", "a", "-X", "copy-selection"] },
  { run = ["show-buffer"] },
  { run = ["send-keys", "-t", "a", "-X", "-N", "4", "cursor-down"] },
  { run = ["send-keys", "-t", "a", "-X", "start-of-line"] },
  { run = ["send-keys", "-t", "a", "-X", "-N", "5", "cursor-right"] },
  { run = ["send-keys", "-t", "a", "-X", "begin-selection"] },
  { run = ["send-keys", "-t", "a", "-X", "selection-mode", "word"] },
  { run = ["send-keys", "-t", "a", "-X", "cursor-right"] },
  { run = ["display", "-p", "-t", "a", "[#{selection_mode}] [#{selection_start_x},#{selection_start_y}-#{selection_end_x},#{selection_end_y}] [#{copy_cursor_x},#{copy_cursor_y}]"] },
  { run = ["send-keys", "-t", "a", "-X", "-N", "6", "cursor-right"] },
  { run = ["display", "-p", "-t", "a", "[#{selection_start_x},#{selection_start_y}-#{selection_end_x},#{selection_end_y}] [#{copy_cursor_x},#{copy_cursor_y}]"] },
  { run = ["send-keys", "-t", "a", "-X", "copy-selection"] },
  { run = ["show-buffer"] },
  { run = ["send-keys", "-t", "a", "-X", "start-of-line"] },
  { run = ["send-keys", "-t", "a", "-X", "next-word"] },
  { run = ["send-keys", "-t", "a", "-X", "next-word"] },
  { run = ["display", "-p", "-t", "a", "[#{copy_cursor_x},#{copy_cursor_y}]"] },
  { run = ["send-keys", "-t", "a", "-X", "next-space"] },
  { run = ["display", "-p", "-t", "a", "[#{copy_cursor_x},#{copy_cursor_y}]"] },
  { run = ["send-keys", "-t", "a", "-X", "previous-word"] },
  { run = ["display", "-p", "-t", "a", "[#{copy_cursor_x},#{copy_cursor_y}]"] },
  { run = ["send-keys", "-t", "a", "-X", "next-word-end"] },
  { run = ["display", "-p", "-t", "a", "[#{copy_cursor_x},#{copy_cursor_y}]"] },
  { run = ["send-keys", "-t", "a", "-X", "previous-space"] },
  { run = ["display", "-p", "-t", "a", "[#{copy_cursor_x},#{copy_cursor_y}]"] },
  { run = ["setw", "-g", "mode-keys", "vi"] },
  { run = ["send-keys", "-t", "a", "-X", "next-space-end"] },
  { run = ["display", "-p", "-t", "a", "[#{copy_cursor_x},#{copy_cursor_y}]"] },
  { run = ["send-keys", "-t", "a", "-X", "select-line"] },
  { run = ["send-keys", "-t", "a", "-X", "copy-selection-and-cancel"] },
  { run = ["show-buffer"] },
  { settle = { react = true } },
  { run = ["display", "-p", "-t", "a", "#{pane_in_mode}"] },
  { screen = {} },
]
