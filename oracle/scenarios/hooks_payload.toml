name = "hooks_payload"
# What a hook's commands see. events_fire (events.c:99) adds event=<name>
# to every payload, so #{hook_event} is set and wait-for -E -v prints it.
# cmdq_merge_formats (cmd-queue.c:294-303) sets #{command} to the running
# command's name (exit_signal is per-platform, sig2name: cli.rs
# hooks_exit_signal).
# window-layout-changed fires from the layout_set_* arrangement and again at
# cmd-select-layout.c:147; for resize-pane it fires from layout_resize_layout
# (layout.c:1002) and again at cmd-resize-pane.c:187.
steps = [
  { run = ["new", "-d", "-s", "a", "-n", "w0", "-x", "80", "-y", "24", "cat"] },
  { run = ["display", "-p", "#{command}|#{hook_event}"] },
  { run = ["set-hook", "-g", "window-renamed", "set -gF @e '#{hook_event}|#{hook}|#{command}'"] },
  { run = ["set-hook", "-g", "after-rename-window", "set -gF @f '#{hook_event}|#{hook}|#{command}'"] },
  { run = ["renamew", "-t", "a:0", "x"] },
  { run = ["show", "-gv", "@e"] },
  { run = ["show", "-gv", "@f"] },
  { run = ["set-hook", "-gu", "window-renamed"] },
  { run = ["set-hook", "-gu", "after-rename-window"] },
  { run = ["set", "-g", "@log", ""] },
  { run = ["set-hook", "-g", "pane-exited", "set -agF @log '|#{hook_event}:#{hook_exit_status}:#{hook_exit_success}:#{command}'"] },
  { run = ["set-hook", "-ga", "pane-exited", "wait-for -S exited"] },
  { run = ["neww", "-d", "-n", "e", "sh -c 'exit 4'"] },
  { wait_for = "exited" },
  { run = ["show", "-gv", "@log"] },
  { run = ["set-hook", "-gu", "pane-exited"] },
  { run = ["splitw", "-t", "a:0", "cat"] },
  { run = ["set-hook", "-g", "window-layout-changed", "set -agF @n L"] },
  { run = ["set", "-g", "@n", ""] },
  { run = ["selectl", "-t", "a:0", "even-vertical"] },
  { run = ["show", "-gv", "@n"] },
  { run = ["set", "-g", "@n", ""] },
  { run = ["selectl", "-t", "a:0", "-n"] },
  { run = ["show", "-gv", "@n"] },
  { run = ["set", "-g", "@n", ""] },
  { run = ["nextl", "-t", "a:0"] },
  { run = ["show", "-gv", "@n"] },
  { run = ["set", "-g", "@n", ""] },
  { run = ["selectl", "-t", "a:0", "-E"] },
  { run = ["show", "-gv", "@n"] },
  { run = ["set", "-g", "@n", ""] },
  { run = ["selectl", "-t", "a:0", "even-horizontal"] },
  { run = ["resizep", "-t", "a:0.0", "-x", "20"] },
  { run = ["show", "-gv", "@n"] },
  { run = ["set", "-g", "@n", ""] },
  { run = ["resizep", "-t", "a:0.0", "-y", "5"] },
  { run = ["show", "-gv", "@n"] },
  { run = ["set", "-g", "@n", ""] },
  { run = ["resizep", "-t", "a:0.0", "-L", "2", "-U", "1"] },
  { run = ["show", "-gv", "@n"] },
  { run = ["set-hook", "-gu", "window-layout-changed"] },
  { run = ["new", "-d", "-s", "b", "-n", "b0", "-x", "80", "-y", "24", "cat"] },
  { control = { argv = ["attach", "-t", "b"], id = "c1" } },
  { control_send = { id = "c1", line = "wait-for -v -E window-renamed" } },
  { run = ["renamew", "-t", "a:0", "yy"] },
  { control_wait = { id = "c1", until = "%end" } },
  { control_send = { id = "c1", line = "selectl -t b:0 even-vertical" } },
  { control_wait = { id = "c1", until = "%end" } },
  { control_send = { id = "c1", line = "splitw -t b:0 cat" } },
  { control_wait = { id = "c1", until = "%end" } },
  { control_send = { id = "c1", line = "selectl -t b:0 even-vertical" } },
  { control_wait = { id = "c1", until = "%end" } },
  { control_close = { id = "c1" } },
  { run = ["kill-server"] },
]
