name = "winlink_rename"
steps = [
  { run = ["new", "-d", "-s", "a", "-n", "w0", "-x", "80", "-y", "24", "cat"] },
  { run = ["new", "-d", "-s", "b", "-n", "b0", "-x", "80", "-y", "24", "cat"] },
  { run = ["ls", "-F", "#{session_id} #{session_name} #{session_windows}"] },
  { run = ["rename", "-t", "a", "x"] },
  { run = ["ls", "-F", "#{session_id} #{session_name} #{session_windows}"] },
  { run = ["rename", "-t", "x", "x"] },
  { run = ["rename", "-t", "x", "b"] },
  { run = ["rename", "-t", "a", "z"] },
  { run = ["rename", "-t", "nosuch", "z"] },
  { run = ["rename", "-t", "x", "bad\ttab"] },
  { run = ["rename", "-t", "x", "ab c"] },
  { run = ["ls", "-F", "#{session_id} #{session_name} #{session_windows}"] },
  { run = ["rename", "-t", "ab c", "#{session_name}2"] },
  { run = ["ls", "-F", "#{session_id} #{session_name} #{session_windows}"] },
  { run = ["rename", "-t", "$1", "by id"] },
  { run = ["ls", "-F", "#{session_id} #{session_name} #{session_windows}"] },
  { run = ["rename", "-t", "=b", "exact"] },
  { run = ["ls", "-F", "#{session_id} #{session_name} #{session_windows}"] },
  { run = ["rename", "zz"] },
  { run = ["ls", "-F", "#{session_id} #{session_name} #{session_windows}"] },
  { run = ["rename"] },
  { run = ["rename", "-t", "exact", "1", "2"] },
  { run = ["display", "-p", "-t", "exact", "#{session_name}"] },
  { run = ["has", "-t", "exact"] },
  { run = ["has", "-t", "b"] },
  { run = ["lsw", "-a", "-F", "#{session_name}:#{window_index} #{window_id} #{window_name}"] },
  { run = ["kill-server"] },
]
