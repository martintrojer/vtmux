name = "extended_keys_send"
# send-keys of modified keys into panes whose program asked for modifyOtherKeys
# none/1/2 (input.c:1527-1559), under extended-keys off/on/always and both
# extended-keys-format values (input-keys.c:424-473, 544-568, 674-707): what
# the pane reads, one line per round, and #{pane_key_mode} after the request
# (format.c format_cb_pane_key_mode). Each extended-keys value respawns the
# panes (screen_reinit) so the program asks again under it. A pane waits for
# the reply to a DSR sent after its mode request, so the request has been
# parsed when it signals. It then reads a line, shows it through cat -v and
# signals, so no round races the capture. `LC_ALL=C cat -v`: BSD cat prints a
# multibyte character as it is in a UTF-8 locale, GNU cat in M- notation in
# any.
steps = [
  { run = ["set", "-g", "extended-keys", "on", ";", "new", "-d", "-s", "a", "-n", "w0", "-x", "200", "-y", "8", "sh", "-c", "stty raw -echo opost onlcr; printf '\\033[5n'; dd bs=1 count=4 of=/dev/null 2>/dev/null; tmux wait-for -S rdy; while IFS= read -r l; do printf '%s\\n' \"$l\" | LC_ALL=C cat -v; tmux wait-for -S got; done"] },
  { wait_for = "rdy" },
  { run = ["neww", "-d", "-n", "w1", "sh", "-c", "stty raw -echo opost onlcr; printf '\\033[>4;1m\\033[5n'; dd bs=1 count=4 of=/dev/null 2>/dev/null; tmux wait-for -S rdy; while IFS= read -r l; do printf '%s\\n' \"$l\" | LC_ALL=C cat -v; tmux wait-for -S got; done"] },
  { wait_for = "rdy" },
  { run = ["neww", "-d", "-n", "w2", "sh", "-c", "stty raw -echo opost onlcr; printf '\\033[>4;2m\\033[5n'; dd bs=1 count=4 of=/dev/null 2>/dev/null; tmux wait-for -S rdy; while IFS= read -r l; do printf '%s\\n' \"$l\" | LC_ALL=C cat -v; tmux wait-for -S got; done"] },
  { wait_for = "rdy" },
  { run = ["set", "-g", "status-right", ""] },
  { run = ["set", "-g", "extended-keys", "off"] },
  { run = ["respawn-pane", "-k", "-t", "a:w0"] },
  { wait_for = "rdy" },
  { run = ["display", "-p", "-t", "a:w0", "off #{pane_key_mode}"] },
  { run = ["respawn-pane", "-k", "-t", "a:w1"] },
  { wait_for = "rdy" },
  { run = ["display", "-p", "-t", "a:w1", "off #{pane_key_mode}"] },
  { run = ["respawn-pane", "-k", "-t", "a:w2"] },
  { wait_for = "rdy" },
  { run = ["display", "-p", "-t", "a:w2", "off #{pane_key_mode}"] },
  { run = ["set", "-g", "extended-keys-format", "xterm"] },
  { run = ["send-keys", "-t", "a:w0", "-l", "off/xterm/vt: "] },
  { run = ["send-keys", "-t", "a:w0", "C-a", "Space", "S-a", "Space", "C-S-a", "Space", "M-a", "Space", "S-Enter", "Space", "C-Enter", "Space", "C-Tab", "Space", "BTab", "Space", "S-Tab", "Space", "C-1", "Space", "C-é", "Space", "C-BSpace", "Space", "C-Escape", "Space", "C-i", "Space", "C-[", "Space", "C-M-S-x", "Space", "S-Up", "Space", "M-BTab", "Space", ";", "send-keys", "-t", "a:w0", "-H", "0a"] },
  { wait_for = "got" },
