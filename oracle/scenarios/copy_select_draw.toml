name = "copy_select_draw"
size = [40, 10]
steps = [
  { run = ["new", "-d", "-s", "a", "-n", "w", "-x", "40", "-y", "9", "sh", "-c", "i=1; while [ $i -le 12 ]; do echo line$i; i=$((i+1)); done; printf '\\033[1;31mred bold\\033[m plain \\033[4munder\\033[m end\\n'; echo 'abc世界def ghi'; echo 'short'; echo 'a much longer line of text'; tmux wait-for -S ready; exec cat"] },
  { wait_for = "ready" },
  { run = ["select-pane", "-t", "%0", "-T", "t"] },
  { run = ["setw", "-g", "mode-keys", "vi"] },
  { run = ["set", "-g", "copy-mode-position-format", "#[align=right][#{copy_position}/#{copy_position_limit}]"] },
  { attach = { session = "a" } },
  { settle = {} },
  { run = ["copy-mode", "-t", "a"] },
  { run = ["send-keys", "-t", "a", "-X", "-N", "4", "cursor-up"] },
  { run = ["send-keys", "-t", "a", "-X", "start-of-line"] },
  { run = ["send-keys", "-t", "a", "-X", "-N", "2", "cursor-right"] },
  { run = ["send-keys", "-t", "a", "-X", "begin-selection"] },
  { run = ["send-keys", "-t", "a", "-X", "-N", "2", "cursor-down"] },
  { run = ["send-keys", "-t", "a", "-X", "-N", "2", "cursor-right"] },
  { settle = { react = true } },
  { run = ["display", "-p", "-t", "a", "[#{selection_present}#{selection_active}] [#{selection_start_x},#{selection_start_y}] [#{selection_end_x},#{selection_end_y}] [#{copy_cursor_x},#{copy_cursor_y}]"] },
  { screen = {} },
  { run = ["send-keys", "-t", "a", "-X", "rectangle-toggle"] },
  { run = ["send-keys", "-t", "a", "-X", "cursor-down"] },
  { settle = { react = true } },
  { screen = {} },
  { run = ["send-keys", "-t", "a", "-X", "end-of-line"] },
  { settle = { react = true } },
  { run = ["display", "-p", "-t", "a", "[#{rectangle_toggle}] [#{copy_cursor_x},#{copy_cursor_y}]"] },
  { screen = {} },
  { run = ["send-keys", "-t", "a", "-X", "copy-selection-no-clear"] },
  { run = ["show-buffer"] },
  { run = ["send-keys", "-t", "a", "-X", "rectangle-off"] },
  { run = ["send-keys", "-t", "a", "-X", "other-end"] },
  { settle = { react = true } },
  { screen = {} },
  { run = ["send-keys", "-t", "a", "-X", "-N", "6", "cursor-up"] },
  { settle = { react = true } },
  { run = ["display", "-p", "-t", "a", "[#{scroll_position}] [#{selection_start_x},#{selection_start_y}] [#{selection_end_x},#{selection_end_y}]"] },
  { screen = {} },
  { run = ["send-keys", "-t", "a", "-X", "-N", "3", "scroll-up"] },
  { settle = { react = true } },
  { run = ["display", "-p", "-t", "a", "[#{scroll_position}] [#{selection_active}] [#{copy_cursor_x},#{copy_cursor_y}]"] },
  { screen = {} },
  { run = ["send-keys", "-t", "a", "-X", "-N", "3", "scroll-down"] },
  { run = ["send-keys", "-t", "a", "-X", "select-line"] },
  { settle = { react = true } },
  { screen = {} },
  { run = ["send-keys", "-t", "a", "-X", "cursor-down"] },
  { settle = { react = true } },
  { screen = {} },
  { run = ["set", "-g", "copy-mode-selection-style", "fg=green,underscore"] },
  { run = ["send-keys", "-t", "a", "-X", "select-word"] },
  { settle = { react = true } },
  { screen = {} },
  { run = ["set", "-g", "mode-style", "bg=blue"] },
  { run = ["set", "-gu", "copy-mode-selection-style"] },
  { run = ["send-keys", "-t", "a", "-X", "history-bottom"] },
  { run = ["send-keys", "-t", "a", "-X", "cursor-up"] },
  { run = ["send-keys", "-t", "a", "-X", "begin-selection"] },
  { run = ["send-keys", "-t", "a", "-X", "-N", "3", "cursor-up"] },
  { settle = { react = true } },
  { screen = {} },
  { run = ["send-keys", "-t", "a", "-X", "clear-selection"] },
  { settle = { react = true } },
  { screen = {} },
  { run = ["display", "-p", "-t", "a", "[#{selection_present}] [#{selection_mode}]"] },
]
