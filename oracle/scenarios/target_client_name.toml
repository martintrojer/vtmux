# A target's session part may name an attached client, by name or tty
# (with or without /dev/): its session (cmd-find.c cmd_find_get_session,
# 284-289). display-panes -t <client> shows the panes in the client's
# session (cmd-choose-tree.c: the target is a pane, CMD_FIND_PANE).
name = "target_client_name"
size = [60, 20]
steps = [
  { run = ["new", "-d", "-s", "a", "-n", "w", "-x", "60", "-y", "19", "cat", "-"] },
  { run = ["new", "-d", "-s", "b", "-n", "v", "-x", "60", "-y", "19", "cat", "-"] },
  { run = ["splitw", "-h", "-t", "b", "cat", "-"] },
  { run = ["set", "-g", "status-right", "R"] },
  { run = ["select-pane", "-t", "%0", "-T", "t0"] },
  { run = ["select-pane", "-t", "%1", "-T", "t1"] },
  { run = ["select-pane", "-t", "%2", "-T", "t2"] },
  { attach = { session = "b" } },
  { run = ["run-shell", "c=$(tmux lsc -F '##{client_tty}'); tmux display -p -t \"$c\" '##{session_name} ##{pane_id}'; tmux display -p -t \"${c#/dev/}:\" '##{session_name} ##{window_name}'; tmux display -p -t \"$c:.0\" '##{pane_id}'"] },
  { run = ["display", "-p", "-t", "nonexistent", "#{session_name}"] },
  { run = ["run-shell", "tmux display-panes -d 0 -t \"$(tmux lsc -F '##{client_tty}')\""] },
  { run = ["list-panes", "-a", "-F", "#{pane_id} [#{pane_mode}]"] },
  { screen = {} },
]
