# find-window: the default C+N+T filter matching a window name, pane
# content (#{C:}) and a pane title; -C, -N, -T alone; -i; -r and -r -i; a
# string that matches nothing; -Z zooming and unzooming; and the default
# prefix f binding through its prompt.
name = "find_window"
size = [60, 16]
steps = [
  { run = ["new", "-d", "-s", "aaa", "-n", "base", "-x", "60", "-y", "15", "exec cat"] },
  { run = ["set", "-g", "status-right", "R"] },
  { run = ["splitw", "-d", "-t", "aaa:0", "sh", "-c", "printf 'OtherBody\\n'; exec cat"] },
  { run = ["neww", "-d", "-t", "aaa:1", "-n", "NameNeedle", "exec cat"] },
  { run = ["neww", "-d", "-t", "aaa:2", "-n", "body", "sh", "-c", "printf 'BodyNeedle here\\n'; tmux wait-for -S ready; exec cat"] },
  { run = ["neww", "-d", "-t", "aaa:3", "-n", "titled", "exec cat"] },
  { run = ["select-pane", "-t", "%0", "-T", "t0"] },
  { run = ["select-pane", "-t", "%1", "-T", "t1"] },
  { run = ["select-pane", "-t", "%2", "-T", "t2"] },
  { run = ["select-pane", "-t", "%3", "-T", "t3"] },
  { run = ["select-pane", "-t", "%4", "-T", "TitleNeedle"] },
  { wait_for = "ready" },
  { attach = { session = "aaa" } },
  { screen = {} },
  # Default: content, name and title. Each of the three on its own.
  { run = ["find-window", "-t", "aaa:0.0", "Needle"] },
  { settle = { react = true } },
  { screen = {} },
  { keys = "q" },
  { settle = { react = true } },
  { run = ["find-window", "-t", "aaa:0.0", "NameNeedle"] },
  { settle = { react = true } },
  { screen = {} },
  { keys = "q" },
  { settle = { react = true } },
  { run = ["find-window", "-t", "aaa:0.0", "-C", "Needle"] },
  { settle = { react = true } },
  { screen = {} },
  { keys = "q" },
  { settle = { react = true } },
  { run = ["find-window", "-t", "aaa:0.0", "-N", "Needle"] },
  { settle = { react = true } },
  { screen = {} },
  { keys = "q" },
  { settle = { react = true } },
  { run = ["find-window", "-t", "aaa:0.0", "-T", "Needle"] },
  { settle = { react = true } },
  { screen = {} },
  { keys = "q" },
  { settle = { react = true } },
  # Case: no match without -i, a match with it.
  { run = ["find-window", "-t", "aaa:0.0", "-N", "nameneedle"] },
  { settle = { react = true } },
  { screen = {} },
  { keys = "q" },
  { settle = { react = true } },
  { run = ["find-window", "-t", "aaa:0.0", "-i", "needle"] },
  { settle = { react = true } },
  { screen = {} },
  { keys = "q" },
  { settle = { react = true } },
  # Regex: anchored (no stars added), a content regex, and -r -i.
  { run = ["find-window", "-t", "aaa:0.0", "-r", "^(Name|Title)Needle$"] },
  { settle = { react = true } },
  { screen = {} },
  { keys = "q" },
  { settle = { react = true } },
  { run = ["find-window", "-t", "aaa:0.0", "-C", "-r", "Body.*here$"] },
  { settle = { react = true } },
  { screen = {} },
  { keys = "q" },
  { settle = { react = true } },
  { run = ["find-window", "-t", "aaa:0.0", "-ri", "^b.dy"] },
  { settle = { react = true } },
  { screen = {} },
  { keys = "q" },
  { settle = { react = true } },
  # No match: an empty tree.
  { run = ["find-window", "-t", "aaa:0.0", "nosuchthing"] },
  { settle = { react = true } },
  { screen = {} },
  { run = ["display", "-p", "-t", "aaa:0.0", "#{pane_mode}"] },
  { keys = "q" },
  { settle = { react = true } },
  # -Z zooms the target pane and the mode unzooms it on exit.
  { run = ["find-window", "-Z", "-t", "aaa:0.0", "-N", "base"] },
  { settle = { react = true } },
  { run = ["display", "-p", "-t", "aaa:0", "#{window_zoomed_flag}"] },
  { screen = {} },
  { keys = "q" },
  { settle = { react = true } },
  { run = ["display", "-p", "-t", "aaa:0", "#{window_zoomed_flag}"] },
  # Prefix f: command-prompt { find-window -Z -- '%%' }.
  { keys = "\u0002f" },
  { settle = {} },
  { screen = {} },
  { keys = "Other\r" },
  { settle = {} },
  { screen = {} },
  { keys = "\r" },
  { settle = {} },
  { run = ["display", "-p", "-t", "aaa:", "#{window_index}.#{pane_index} #{window_zoomed_flag}"] },
  { screen = {} },
]
