# Jumps (grid_reader_cursor_jump*), marks (set-mark, jump-to-mark
# swapping the cursor and the mark, drawn in copy-mode-mark-style),
# matching brackets in both key modes and paragraphs.
name = "copy_search_jumps"
size = [40, 10]
steps = [
  { run = ["new", "-d", "-s", "a", "-n", "w", "-x", "40", "-y", "9", "sh", "-c", "printf 'abc foo(bar) baz bb\\nline two\\nf(a [b {c} d] e)x\\n\\npara two\\nmore\\n\\n\\nlast 世界 世x\\n'; i=0; while [ $i -lt 6 ]; do echo tail$i; i=$((i+1)); done; tmux wait-for -S ready; exec cat"] },
  { wait_for = "ready" },
  { run = ["select-pane", "-t", "%0", "-T", "t"] },
  { run = ["set", "-g", "copy-mode-position-format", "#[align=right][#{copy_position}/#{copy_position_limit}]#{?search_timed_out, (timed out),#{?search_count, (#{search_count}#{?search_count_partial,+,} results),}}"] },
  { attach = { session = "a" } },
  { run = ["copy-mode", "-t", "a"] },
  { run = ["send-keys", "-t", "a", "-X", "history-top"] },
  { run = ["send-keys", "-t", "a", "-X", "jump-forward", "b"] },
  { run = ["display", "-p", "-t", "a", "[#{copy_cursor_x},#{copy_cursor_y}] [#{scroll_position}]"] },
  { run = ["send-keys", "-t", "a", "-X", "jump-again"] },
  { run = ["display", "-p", "-t", "a", "[#{copy_cursor_x},#{copy_cursor_y}] [#{scroll_position}]"] },
  { run = ["send-keys", "-t", "a", "-X", "jump-reverse"] },
  { run = ["display", "-p", "-t", "a", "[#{copy_cursor_x},#{copy_cursor_y}] [#{scroll_position}]"] },
  { run = ["send-keys", "-t", "a", "-X", "jump-to-forward", ")"] },
  { run = ["display", "-p", "-t", "a", "[#{copy_cursor_x},#{copy_cursor_y}] [#{scroll_position}]"] },
  { run = ["send-keys", "-t", "a", "-X", "jump-to-backward", "("] },
  { run = ["display", "-p", "-t", "a", "[#{copy_cursor_x},#{copy_cursor_y}] [#{scroll_position}]"] },
  { run = ["send-keys", "-t", "a", "-X", "jump-backward", "f"] },
  { run = ["display", "-p", "-t", "a", "[#{copy_cursor_x},#{copy_cursor_y}] [#{scroll_position}]"] },
  { run = ["send-keys", "-t", "a", "-N", "2", "-X", "jump-again"] },
  { run = ["display", "-p", "-t", "a", "[#{copy_cursor_x},#{copy_cursor_y}] [#{scroll_position}]"] },
  { run = ["send-keys", "-t", "a", "-X", "jump-forward", "q"] },
  { run = ["display", "-p", "-t", "a", "[#{copy_cursor_x},#{copy_cursor_y}] [#{scroll_position}]"] },
  { run = ["send-keys", "-t", "a", "-X", "set-mark"] },
  { run = ["display", "-p", "-t", "a", "[#{copy_cursor_x},#{copy_cursor_y}] [#{scroll_position}]"] },
  { run = ["send-keys", "-t", "a", "-N", "2", "-X", "cursor-down"] },
  { run = ["display", "-p", "-t", "a", "[#{copy_cursor_x},#{copy_cursor_y}] [#{scroll_position}]"] },
  { run = ["send-keys", "-t", "a", "-X", "next-matching-bracket"] },
  { run = ["display", "-p", "-t", "a", "[#{copy_cursor_x},#{copy_cursor_y}] [#{scroll_position}]"] },
  { run = ["send-keys", "-t", "a", "-X", "next-matching-bracket"] },
  { run = ["display", "-p", "-t", "a", "[#{copy_cursor_x},#{copy_cursor_y}] [#{scroll_position}]"] },
  { run = ["send-keys", "-t", "a", "-X", "previous-matching-bracket"] },
  { run = ["display", "-p", "-t", "a", "[#{copy_cursor_x},#{copy_cursor_y}] [#{scroll_position}]"] },
  { run = ["send-keys", "-t", "a", "-X", "jump-to-mark"] },
  { run = ["display", "-p", "-t", "a", "[#{copy_cursor_x},#{copy_cursor_y}] [#{scroll_position}]"] },
  { run = ["send-keys", "-t", "a", "-X", "jump-to-mark"] },
  { run = ["display", "-p", "-t", "a", "[#{copy_cursor_x},#{copy_cursor_y}] [#{scroll_position}]"] },
  { run = ["send-keys", "-t", "a", "-X", "history-top"] },
  { run = ["display", "-p", "-t", "a", "[#{copy_cursor_x},#{copy_cursor_y}] [#{scroll_position}]"] },
  { run = ["send-keys", "-t", "a", "-X", "next-paragraph"] },
  { run = ["display", "-p", "-t", "a", "[#{copy_cursor_x},#{copy_cursor_y}] [#{scroll_position}]"] },
  { run = ["send-keys", "-t", "a", "-X", "next-paragraph"] },
  { run = ["display", "-p", "-t", "a", "[#{copy_cursor_x},#{copy_cursor_y}] [#{scroll_position}]"] },
  { run = ["send-keys", "-t", "a", "-X", "next-paragraph"] },
  { run = ["display", "-p", "-t", "a", "[#{copy_cursor_x},#{copy_cursor_y}] [#{scroll_position}]"] },
  { run = ["send-keys", "-t", "a", "-X", "previous-paragraph"] },
  { run = ["display", "-p", "-t", "a", "[#{copy_cursor_x},#{copy_cursor_y}] [#{scroll_position}]"] },
  { run = ["send-keys", "-t", "a", "-N", "2", "-X", "previous-paragraph"] },
  { run = ["display", "-p", "-t", "a", "[#{copy_cursor_x},#{copy_cursor_y}] [#{scroll_position}]"] },
  { run = ["send-keys", "-t", "a", "-X", "start-of-line"] },
  { run = ["display", "-p", "-t", "a", "[#{copy_cursor_x},#{copy_cursor_y}] [#{scroll_position}]"] },
  { run = ["send-keys", "-t", "a", "-X", "next-matching-bracket"] },
  { run = ["display", "-p", "-t", "a", "[#{copy_cursor_x},#{copy_cursor_y}] [#{scroll_position}]"] },
  { run = ["send-keys", "-t", "a", "-X", "jump-forward", "世"] },
  { run = ["display", "-p", "-t", "a", "[#{copy_cursor_x},#{copy_cursor_y}] [#{scroll_position}]"] },
  { run = ["send-keys", "-t", "a", "-X", "jump-again"] },
  { run = ["display", "-p", "-t", "a", "[#{copy_cursor_x},#{copy_cursor_y}] [#{scroll_position}]"] },
  { screen = {} },
  { run = ["setw", "-g", "mode-keys", "vi"] },
  { run = ["send-keys", "-t", "a", "-X", "history-top"] },
  { run = ["send-keys", "-t", "a", "-N", "2", "-X", "cursor-down"] },
  { run = ["send-keys", "-t", "a", "-X", "end-of-line"] },
  { run = ["send-keys", "-t", "a", "-X", "next-matching-bracket"] },
  { run = ["display", "-p", "-t", "a", "[#{copy_cursor_x},#{copy_cursor_y}] [#{scroll_position}]"] },
  { run = ["send-keys", "-t", "a", "-X", "start-of-line"] },
  { run = ["send-keys", "-t", "a", "-X", "next-matching-bracket"] },
  { run = ["display", "-p", "-t", "a", "[#{copy_cursor_x},#{copy_cursor_y}] [#{scroll_position}]"] },
  { run = ["send-keys", "-t", "a", "-X", "next-matching-bracket"] },
  { run = ["display", "-p", "-t", "a", "[#{copy_cursor_x},#{copy_cursor_y}] [#{scroll_position}]"] },
  { run = ["send-keys", "-t", "a", "-X", "previous-matching-bracket"] },
  { run = ["display", "-p", "-t", "a", "[#{copy_cursor_x},#{copy_cursor_y}] [#{scroll_position}]"] },
  { run = ["send-keys", "-t", "a", "-X", "history-top"] },
  { run = ["send-keys", "-t", "a", "-X", "jump-to-forward", "c"] },
  { run = ["display", "-p", "-t", "a", "[#{copy_cursor_x},#{copy_cursor_y}] [#{scroll_position}]"] },
  { run = ["send-keys", "-t", "a", "-X", "jump-to-backward", "a"] },
  { run = ["display", "-p", "-t", "a", "[#{copy_cursor_x},#{copy_cursor_y}] [#{scroll_position}]"] },
  { run = ["send-keys", "-t", "a", "-X", "jump-to-forward", "o"] },
  { run = ["display", "-p", "-t", "a", "[#{copy_cursor_x},#{copy_cursor_y}] [#{scroll_position}]"] },
  { run = ["send-keys", "-t", "a", "-X", "jump-again"] },
  { run = ["display", "-p", "-t", "a", "[#{copy_cursor_x},#{copy_cursor_y}] [#{scroll_position}]"] },
  { run = ["send-keys", "-t", "a", "-X", "jump-reverse"] },
  { run = ["display", "-p", "-t", "a", "[#{copy_cursor_x},#{copy_cursor_y}] [#{scroll_position}]"] },
  { run = ["send-keys", "-t", "a", "-X", "set-mark"] },
  { run = ["send-keys", "-t", "a", "-X", "history-bottom"] },
  { screen = {} },
  { run = ["send-keys", "-t", "a", "-X", "jump-to-mark"] },
  { run = ["display", "-p", "-t", "a", "[#{copy_cursor_x},#{copy_cursor_y}] [#{scroll_position}]"] },
  { screen = {} },
  { run = ["send-keys", "-t", "a", "-X", "cancel"] },
]
