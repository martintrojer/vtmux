# Tab in a command prompt (prompt.c prompt_replace_complete,
# prompt_complete): the word at the cursor completes when it is the first
# word of a command-type prompt. One match (or a longer common prefix)
# replaces the word; several matches with nothing to add are listed after
# the line, underlined, until the next key; command-alias names count;
# later words, search prompts and vi command mode do not complete.
name = "prompt_complete"
size = [60, 6]
steps = [
  { run = ["new", "-d", "-s", "a", "-n", "w", "-x", "60", "-y", "5", "cat"] },
  { run = ["set", "-g", "status-right", "R"] },
  { run = ["set", "-s", "command-alias[10]", "zzz=display-message"] },
  { run = ["set", "-s", "command-alias[11]", "zzy=display-message"] },
  { run = ["bind", "-n", "M-s", "command-prompt", "-T", "search", "-p", "s"] },
  { attach = { session = "a" } },
  { keys = "\u0002:" },
  { settle = {} },
  { keys = "new-w\t" },
  { screen = {} },
  { keys = "\u0015ne\t" },
  { screen = {} },
  { keys = "\t" },
  { screen = {} },
  { keys = "x" },
  { screen = {} },
  { keys = "\u0015spl\t" },
  { screen = {} },
  { keys = "\u0015zz\t" },
  { screen = {} },
  { keys = "\u0015zzz\t" },
  { screen = {} },
  { keys = "\u0015qqq\t" },
  { screen = {} },
  { keys = "\u0015set -g sta\t" },
  { screen = {} },
  { keys = "\u0015new-w foo\u0001\u0006\u0006\t" },
  { screen = {} },
  { keys = "\u0015  ne\t" },
  { screen = {} },
  { keys = "\u0015ne\u0002\t" },
  { screen = {} },
  { keys = "\u0015new-session-and-a-label-long-enough-that-the-list-is-cut\u0001\u007f" },
  { screen = {} },
  { keys = "\u0015new-\t" },
  { screen = {} },
  { keys = "\u0003" },
  { keys = "\u001bs" },
  { settle = {} },
  { keys = "new-w\t" },
  { screen = {} },
  { keys = "\u001b" },
  { settle = {} },
  { run = ["set", "-g", "status-keys", "vi"] },
  { keys = "\u0002:" },
  { settle = {} },
  { keys = "new-w\t" },
  { screen = {} },
  { keys = "\u001b\u0015" },
  { screen = {} },
  { keys = "\u001bnew\u001b\t" },
  { screen = {} },
  { keys = "\u0003" },
]
