  { screen = {} },
  { run = ["display-popup", "-C"] },
  { settle = { react = true } },
  { keys = "\u001bq" },
  { wait_for = "ready" },
  { keys = "\u001b[<0;4;6M" },
  { keys = "\u001b[<32;5;7M" },
