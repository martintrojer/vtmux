# The mouse over a popup (popup.c popup_key_cb, popup_handle_drag): a
# press inside goes to the job in the encoding it asked for (SGR here,
# input_key_get_mouse) at its own position; outside it is used up; a drag
# that starts on the border with the left button moves the popup, kept
# inside the terminal; with Meta it moves from anywhere inside; a drag
# with the right button from the border sizes it (not below 3x3 inside a
# border, so the job's terminal follows); a plain right press on the left
# or top border is used up. A borderless popup (-B) moves and sizes only
# with Meta, here grown (a narrowed popup reflows in vtmux, D-044). A job
# that asked for no mouse gets nothing. The job starts a line at each
# ESC, so how its reads split the reports does not show.
name = "popup_mouse"
size = [60, 20]
steps = [
  { run = ["new", "-d", "-s", "a", "-n", "w", "-x", "60", "-y", "19", "cat", "-"] },
  { run = ["set", "-g", "status-right", "R"] },
  { run = ["set", "-s", "escape-time", "0"] },
  { run = ["select-pane", "-t", "a", "-T", "p0"] },
  { run = ["bind", "-n", "M-p", "display-popup", "-w", "50", "-h", "8", "-x", "2", "-y", "9", "stty -icanon -echo min 1; printf '\\033[?1000h\\033[?1006h'; tmux wait-for -S ready; while :; do dd bs=64 count=1 2>/dev/null | tr '\\033' '\\n'; done"] },
  { run = ["bind", "-n", "M-q", "display-popup", "-B", "-w", "40", "-h", "5", "-x", "2", "-y", "9", "stty -icanon -echo min 1; printf '\\033[?1002h\\033[?1006h'; tmux wait-for -S ready; while :; do dd bs=64 count=1 2>/dev/null | tr '\\033' '\\n'; done"] },
  { attach = { session = "a" } },
  { keys = "\u001bp" },
  { wait_for = "ready" },
  { keys = "\u001b[<0;6;5M\u001b[<0;6;5m" },
  { screen = {} },
  { keys = "\u001b[<0;58;15M\u001b[<0;58;15m" },
  { screen = {} },
  { keys = "\u001b[<0;10;2M" },
  { keys = "\u001b[<32;11;2M" },
  { keys = "\u001b[<32;20;6M" },
  { screen = {} },
  { keys = "\u001b[<0;20;6m" },
  { screen = {} },
