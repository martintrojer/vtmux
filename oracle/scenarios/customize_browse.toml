# customize-mode browsing: the sections; the Server Options expanded (l) with the preview of a key, an array, a string that expands with its colour EXAMPLE, a number with a unit, a choice and its values; paging; collapsing (h, M--); an array option's items (status-format); a user option (its expansion); a pane-local value with its window and global values (-f); a session option set locally (its global value); the session environment's removed variables; a key table with a binding's Command, Note and Repeat lines and their previews (-F); the help screen; v; the filter (f) and c; -Z -N and q.
name = "customize_browse"
size = [80, 24]
steps = [
  { run = ["new", "-d", "-s", "aaa", "-n", "w0", "-x", "80", "-y", "23", "exec cat"] },
  { run = ["set", "-g", "status-right", "R"] },
  { run = ["select-pane", "-t", "%0", "-T", "t0"] },
  { run = ["set", "-g", "@user", "#{session_name} here"] },
  { run = ["set", "-g", "remain-on-exit-format", "G #{pane_index}"] },
  { run = ["setw", "-t", "aaa:0", "remain-on-exit-format", "W"] },
  { run = ["set", "-p", "-t", "%0", "remain-on-exit-format", "P"] },
  { run = ["set", "-t", "aaa", "display-time", "1500"] },
  { attach = { session = "aaa" } },
  { screen = {} },
  { run = ["customize-mode", "-t", "aaa:0.0"] },
  { settle = { react = true } },
  { screen = {} },
  { run = ["display", "-p", "-t", "aaa:0.0", "#{pane_in_mode} #{pane_mode}"] },
  { keys = "l" },
  { screen = {} },
  { keys = "j" },
