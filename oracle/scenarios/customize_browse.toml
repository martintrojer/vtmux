  { run = ["customize-mode", "-t", "aaa:0.0", "-f", "#{||:#{==:#{option_name},remain-on-exit-format},#{==:#{option_name},display-time}}"] },
  { settle = { react = true } },
  { screen = {} },
  { keys = "jl" },
  { screen = {} },
