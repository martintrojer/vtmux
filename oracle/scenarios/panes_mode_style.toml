name = "panes_mode_style"
size = [60, 20]
steps = [
  { run = ["new", "-d", "-s", "a", "-n", "w", "-x", "60", "-y", "19", "cat"] },
  { run = ["set", "-g", "status-right", ""] },
  { run = ["splitw", "-h", "-t", "a", "cat"] },
  { run = ["splitw", "-v", "-t", "%1", "cat"] },
  { attach = { session = "a" } },
  { run = ["setw", "-g", "display-panes-colour", "green"] },
  { run = ["setw", "-g", "display-panes-active-colour", "#ff8800"] },
  { run = ["setw", "-g", "display-panes-border-style", "fg=red,bg=blue,bold"] },
  { run = ["setw", "-g", "display-panes-format", "#[align=left]#{pane_id}:#{pane_index}#[align=right]#{pane_width}x#{pane_height}"] },
  { run = ["display-panes", "-d", "0", "-t", "%0"] },
  { settle = { react = true } },
  { screen = {} },
  { keys = "q" },
  { settle = { react = true } },
  { run = ["setw", "-g", "display-panes-format", ""] },
  { run = ["display-panes", "-d", "0", "-t", "%0"] },
  { settle = { react = true } },
  { screen = {} },
  { keys = "q" },
  { settle = { react = true } },
  { run = ["setw", "-gu", "display-panes-colour"] },
  { run = ["setw", "-gu", "display-panes-active-colour"] },
  { run = ["setw", "-gu", "display-panes-border-style"] },
  { run = ["setw", "-gu", "display-panes-format"] },
  { run = ["setw", "-g", "display-panes-colour", "colour99"] },
  { run = ["setw", "-g", "pane-border-format", "#{pane_index}"] },
  { run = ["set", "-w", "-t", "a", "pane-border-status", "top"] },
  { settle = { react = true } },
  { run = ["display-panes", "-d", "0", "-t", "%0"] },
  { settle = { react = true } },
  { screen = {} },
  { keys = "q" },
  { settle = { react = true } },
  { run = ["set", "-w", "-t", "a", "pane-border-status", "bottom"] },
  { settle = { react = true } },
  { run = ["display-panes", "-d", "0", "-t", "%0"] },
  { settle = { react = true } },
  { screen = {} },
  { keys = "q" },
  { settle = { react = true } },
  { run = ["display-panes", "-d", "0", "-Z", "-t", "%0"] },
  { settle = { react = true } },
  { screen = {} },
  { keys = "q" },
  { settle = { react = true } },
]
