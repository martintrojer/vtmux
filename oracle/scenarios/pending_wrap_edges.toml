name = "pending_wrap_edges"
size = [20, 5]
# A cursor past the last column (tmux's cx == screen_size_x, Ghostty's
# pending wrap; 20 characters on 20 columns): what each sequence does to
# it, seen by #{cursor_x} after the sequence and where an X printed next
# lands. tmux leaves cx past the column unless the sequence moves the
# cursor itself; restoring a saved cursor puts it on the last column. Plus
# IL/DL keeping the column and REP stopping at the end of the line without
# a pending wrap, and BS reverse-wrapping onto a wrapped line.
steps = [
  # bs: BS goes back to the last column (screen_write_backspace: cx - 1)
  { run = ["new", "-d", "-s", "bs", "-n", "w", "-x", "20", "-y", "5", "sh", "-c", "printf 'abcdefghijklmnopqrst\\b'; tmux wait-for -S bsa; tmux wait-for bsb; printf X; tmux wait-for -S bsc; exec cat"] },
  { wait_for = "bsa" },
  { run = ["display", "-p", "-t", "bs:", "#{history_size} #{cursor_x},#{cursor_y}"] },
  { run = ["wait-for", "-S", "bsb"] },
  { wait_for = "bsc" },
  { run = ["display", "-p", "-t", "bs:", "#{history_size} #{cursor_x},#{cursor_y}"] },
  { run = ["capture-pane", "-p", "-S", "-", "-t", "bs:"] },
  # cub: CUB 1 likewise
  { run = ["new", "-d", "-s", "cub", "-n", "w", "-x", "20", "-y", "5", "sh", "-c", "printf 'abcdefghijklmnopqrst\\033[D'; tmux wait-for -S cuba; tmux wait-for cubb; printf X; tmux wait-for -S cubc; exec cat"] },
  { wait_for = "cuba" },
  { run = ["display", "-p", "-t", "cub:", "#{history_size} #{cursor_x},#{cursor_y}"] },
  { run = ["wait-for", "-S", "cubb"] },
  { wait_for = "cubc" },
  { run = ["display", "-p", "-t", "cub:", "#{history_size} #{cursor_x},#{cursor_y}"] },
  { run = ["capture-pane", "-p", "-S", "-", "-t", "cub:"] },
  # cub3: CUB 3 from cx 20 (screen_write_cursorleft)
  { run = ["new", "-d", "-s", "cub3", "-n", "w", "-x", "20", "-y", "5", "sh", "-c", "printf 'abcdefghijklmnopqrst\\033[3D'; tmux wait-for -S cub3a; tmux wait-for cub3b; printf X; tmux wait-for -S cub3c; exec cat"] },
  { wait_for = "cub3a" },
  { run = ["display", "-p", "-t", "cub3:", "#{history_size} #{cursor_x},#{cursor_y}"] },
  { run = ["wait-for", "-S", "cub3b"] },
  { wait_for = "cub3c" },
  { run = ["display", "-p", "-t", "cub3:", "#{history_size} #{cursor_x},#{cursor_y}"] },
  { run = ["capture-pane", "-p", "-S", "-", "-t", "cub3:"] },
  # ech: ECH has no cells to erase and leaves the cursor (screen_write_clearcharacter)
  { run = ["new", "-d", "-s", "ech", "-n", "w", "-x", "20", "-y", "5", "sh", "-c", "printf 'abcdefghijklmnopqrst\\033[X'; tmux wait-for -S echa; tmux wait-for echb; printf X; tmux wait-for -S echc; exec cat"] },
  { wait_for = "echa" },
  { run = ["display", "-p", "-t", "ech:", "#{history_size} #{cursor_x},#{cursor_y}"] },
  { run = ["wait-for", "-S", "echb"] },
  { wait_for = "echc" },
  { run = ["display", "-p", "-t", "ech:", "#{history_size} #{cursor_x},#{cursor_y}"] },
  { run = ["capture-pane", "-p", "-S", "-", "-t", "ech:"] },
  # dch: DCH likewise (screen_write_deletecharacter)
  { run = ["new", "-d", "-s", "dch", "-n", "w", "-x", "20", "-y", "5", "sh", "-c", "printf 'abcdefghijklmnopqrst\\033[P'; tmux wait-for -S dcha; tmux wait-for dchb; printf X; tmux wait-for -S dchc; exec cat"] },
  { wait_for = "dcha" },
  { run = ["display", "-p", "-t", "dch:", "#{history_size} #{cursor_x},#{cursor_y}"] },
  { run = ["wait-for", "-S", "dchb"] },
  { wait_for = "dchc" },
  { run = ["display", "-p", "-t", "dch:", "#{history_size} #{cursor_x},#{cursor_y}"] },
  { run = ["capture-pane", "-p", "-S", "-", "-t", "dch:"] },
  # ich: ICH likewise (screen_write_insertcharacter)
  { run = ["new", "-d", "-s", "ich", "-n", "w", "-x", "20", "-y", "5", "sh", "-c", "printf 'abcdefghijklmnopqrst\\033[@'; tmux wait-for -S icha; tmux wait-for ichb; printf X; tmux wait-for -S ichc; exec cat"] },
  { wait_for = "icha" },
  { run = ["display", "-p", "-t", "ich:", "#{history_size} #{cursor_x},#{cursor_y}"] },
  { run = ["wait-for", "-S", "ichb"] },
  { wait_for = "ichc" },
  { run = ["display", "-p", "-t", "ich:", "#{history_size} #{cursor_x},#{cursor_y}"] },
  { run = ["capture-pane", "-p", "-S", "-", "-t", "ich:"] },
  # el1: EL 1 clears the line, the cursor stays past it (screen_write_clearstartofline)
  { run = ["new", "-d", "-s", "el1", "-n", "w", "-x", "20", "-y", "5", "sh", "-c", "printf 'abcdefghijklmnopqrst\\033[1K'; tmux wait-for -S el1a; tmux wait-for el1b; printf X; tmux wait-for -S el1c; exec cat"] },
  { wait_for = "el1a" },
  { run = ["display", "-p", "-t", "el1:", "#{history_size} #{cursor_x},#{cursor_y}"] },
  { run = ["wait-for", "-S", "el1b"] },
  { wait_for = "el1c" },
  { run = ["display", "-p", "-t", "el1:", "#{history_size} #{cursor_x},#{cursor_y}"] },
  { run = ["capture-pane", "-p", "-S", "-", "-t", "el1:"] },
  # el2: EL 2 likewise (screen_write_clearline)
  { run = ["new", "-d", "-s", "el2", "-n", "w", "-x", "20", "-y", "5", "sh", "-c", "printf 'abcdefghijklmnopqrst\\033[2K'; tmux wait-for -S el2a; tmux wait-for el2b; printf X; tmux wait-for -S el2c; exec cat"] },
  { wait_for = "el2a" },
  { run = ["display", "-p", "-t", "el2:", "#{history_size} #{cursor_x},#{cursor_y}"] },
  { run = ["wait-for", "-S", "el2b"] },
  { wait_for = "el2c" },
  { run = ["display", "-p", "-t", "el2:", "#{history_size} #{cursor_x},#{cursor_y}"] },
  { run = ["capture-pane", "-p", "-S", "-", "-t", "el2:"] },
  # ed1: ED 1 likewise (screen_write_clearstartofscreen)
  { run = ["new", "-d", "-s", "ed1", "-n", "w", "-x", "20", "-y", "5", "sh", "-c", "printf 'abcdefghijklmnopqrst\\033[1J'; tmux wait-for -S ed1a; tmux wait-for ed1b; printf X; tmux wait-for -S ed1c; exec cat"] },
  { wait_for = "ed1a" },
  { run = ["display", "-p", "-t", "ed1:", "#{history_size} #{cursor_x},#{cursor_y}"] },
  { run = ["wait-for", "-S", "ed1b"] },
  { wait_for = "ed1c" },
  { run = ["display", "-p", "-t", "ed1:", "#{history_size} #{cursor_x},#{cursor_y}"] },
  { run = ["capture-pane", "-p", "-S", "-", "-t", "ed1:"] },
  # ed2: ED 2 under scroll-on-clear: into history, the cursor stays (screen_write_clearscreen)
  { run = ["new", "-d", "-s", "ed2", "-n", "w", "-x", "20", "-y", "5", "sh", "-c", "printf 'abcdefghijklmnopqrst\\033[2J'; tmux wait-for -S ed2a; tmux wait-for ed2b; printf X; tmux wait-for -S ed2c; exec cat"] },
  { wait_for = "ed2a" },
  { run = ["display", "-p", "-t", "ed2:", "#{history_size} #{cursor_x},#{cursor_y}"] },
  { run = ["wait-for", "-S", "ed2b"] },
  { wait_for = "ed2c" },
  { run = ["display", "-p", "-t", "ed2:", "#{history_size} #{cursor_x},#{cursor_y}"] },
  { run = ["capture-pane", "-p", "-S", "-", "-t", "ed2:"] },
  # decrc: DECRC puts a saved column past the last on the last (input_restore_state, screen_write_cursormove)
  { run = ["new", "-d", "-s", "decrc", "-n", "w", "-x", "20", "-y", "5", "sh", "-c", "printf 'abcdefghijklmnopqrst\\0337\\r\\n\\0338'; tmux wait-for -S decrca; tmux wait-for decrcb; printf X; tmux wait-for -S decrcc; exec cat"] },
  { wait_for = "decrca" },
  { run = ["display", "-p", "-t", "decrc:", "#{history_size} #{cursor_x},#{cursor_y}"] },
  { run = ["wait-for", "-S", "decrcb"] },
  { wait_for = "decrcc" },
  { run = ["display", "-p", "-t", "decrc:", "#{history_size} #{cursor_x},#{cursor_y}"] },
  { run = ["capture-pane", "-p", "-S", "-", "-t", "decrc:"] },
  # alt: leaving ?1049 restores the cursor the same way (screen_alternate_off)
  { run = ["new", "-d", "-s", "alt", "-n", "w", "-x", "20", "-y", "5", "sh", "-c", "printf 'abcdefghijklmnopqrst\\033[?1049h\\033[?1049l'; tmux wait-for -S alta; tmux wait-for altb; printf X; tmux wait-for -S altc; exec cat"] },
  { wait_for = "alta" },
  { run = ["display", "-p", "-t", "alt:", "#{history_size} #{cursor_x},#{cursor_y}"] },
  { run = ["wait-for", "-S", "altb"] },
  { wait_for = "altc" },
  { run = ["display", "-p", "-t", "alt:", "#{history_size} #{cursor_x},#{cursor_y}"] },
  { run = ["capture-pane", "-p", "-S", "-", "-t", "alt:"] },
  # cbt: CBT starts from the last column (INPUT_CSI_CBT)
  { run = ["new", "-d", "-s", "cbt", "-n", "w", "-x", "20", "-y", "5", "sh", "-c", "printf 'abcdefghijklmnopqrst\\033[Z'; tmux wait-for -S cbta; tmux wait-for cbtb; printf X; tmux wait-for -S cbtc; exec cat"] },
  { wait_for = "cbta" },
  { run = ["display", "-p", "-t", "cbt:", "#{history_size} #{cursor_x},#{cursor_y}"] },
  { run = ["wait-for", "-S", "cbtb"] },
  { wait_for = "cbtc" },
  { run = ["display", "-p", "-t", "cbt:", "#{history_size} #{cursor_x},#{cursor_y}"] },
  { run = ["capture-pane", "-p", "-S", "-", "-t", "cbt:"] },
  # ind: IND moves down and keeps cx (screen_write_linefeed)
  { run = ["new", "-d", "-s", "ind", "-n", "w", "-x", "20", "-y", "5", "sh", "-c", "printf '\\r\\nabcdefghijklmnopqrst\\033D'; tmux wait-for -S inda; tmux wait-for indb; printf X; tmux wait-for -S indc; exec cat"] },
  { wait_for = "inda" },
  { run = ["display", "-p", "-t", "ind:", "#{history_size} #{cursor_x},#{cursor_y}"] },
  { run = ["wait-for", "-S", "indb"] },
  { wait_for = "indc" },
  { run = ["display", "-p", "-t", "ind:", "#{history_size} #{cursor_x},#{cursor_y}"] },
  { run = ["capture-pane", "-p", "-S", "-", "-t", "ind:"] },
  # ri: RI moves up and keeps cx (screen_write_reverseindex)
  { run = ["new", "-d", "-s", "ri", "-n", "w", "-x", "20", "-y", "5", "sh", "-c", "printf '\\r\\nabcdefghijklmnopqrst\\033M'; tmux wait-for -S ria; tmux wait-for rib; printf X; tmux wait-for -S ric; exec cat"] },
  { wait_for = "ria" },
  { run = ["display", "-p", "-t", "ri:", "#{history_size} #{cursor_x},#{cursor_y}"] },
  { run = ["wait-for", "-S", "rib"] },
  { wait_for = "ric" },
  { run = ["display", "-p", "-t", "ri:", "#{history_size} #{cursor_x},#{cursor_y}"] },
  { run = ["capture-pane", "-p", "-S", "-", "-t", "ri:"] },
  # vpa: VPA moves the row only (screen_write_cursormove with px -1)
  { run = ["new", "-d", "-s", "vpa", "-n", "w", "-x", "20", "-y", "5", "sh", "-c", "printf '\\r\\nabcdefghijklmnopqrst\\033[1d'; tmux wait-for -S vpaa; tmux wait-for vpab; printf X; tmux wait-for -S vpac; exec cat"] },
  { wait_for = "vpaa" },
  { run = ["display", "-p", "-t", "vpa:", "#{history_size} #{cursor_x},#{cursor_y}"] },
  { run = ["wait-for", "-S", "vpab"] },
  { wait_for = "vpac" },
  { run = ["display", "-p", "-t", "vpa:", "#{history_size} #{cursor_x},#{cursor_y}"] },
  { run = ["capture-pane", "-p", "-S", "-", "-t", "vpa:"] },
  # il: IL keeps the cursor (screen_write_insertline)
  { run = ["new", "-d", "-s", "il", "-n", "w", "-x", "20", "-y", "5", "sh", "-c", "printf '\\r\\nabcdefghijklmnopqrst\\033[L'; tmux wait-for -S ila; tmux wait-for ilb; printf X; tmux wait-for -S ilc; exec cat"] },
  { wait_for = "ila" },
  { run = ["display", "-p", "-t", "il:", "#{history_size} #{cursor_x},#{cursor_y}"] },
  { run = ["wait-for", "-S", "ilb"] },
  { wait_for = "ilc" },
  { run = ["display", "-p", "-t", "il:", "#{history_size} #{cursor_x},#{cursor_y}"] },
  { run = ["capture-pane", "-p", "-S", "-", "-t", "il:"] },
  # dl: DL keeps the cursor (screen_write_deleteline)
  { run = ["new", "-d", "-s", "dl", "-n", "w", "-x", "20", "-y", "5", "sh", "-c", "printf '\\r\\nabcdefghijklmnopqrst\\033[M'; tmux wait-for -S dla; tmux wait-for dlb; printf X; tmux wait-for -S dlc; exec cat"] },
  { wait_for = "dla" },
  { run = ["display", "-p", "-t", "dl:", "#{history_size} #{cursor_x},#{cursor_y}"] },
  { run = ["wait-for", "-S", "dlb"] },
  { wait_for = "dlc" },
  { run = ["display", "-p", "-t", "dl:", "#{history_size} #{cursor_x},#{cursor_y}"] },
  { run = ["capture-pane", "-p", "-S", "-", "-t", "dl:"] },
  # rep: REP repeats up to the end of the line, so nothing (INPUT_CSI_REP)
  { run = ["new", "-d", "-s", "rep", "-n", "w", "-x", "20", "-y", "5", "sh", "-c", "printf '\\r\\nabcdefghijklmnopqrst\\033[5b'; tmux wait-for -S repa; tmux wait-for repb; printf X; tmux wait-for -S repc; exec cat"] },
  { wait_for = "repa" },
  { run = ["display", "-p", "-t", "rep:", "#{history_size} #{cursor_x},#{cursor_y}"] },
  { run = ["wait-for", "-S", "repb"] },
  { wait_for = "repc" },
  { run = ["display", "-p", "-t", "rep:", "#{history_size} #{cursor_x},#{cursor_y}"] },
  { run = ["capture-pane", "-p", "-S", "-", "-t", "rep:"] },
  # ilcol: IL keeps the column without a pending wrap too
  { run = ["new", "-d", "-s", "ilcol", "-n", "w", "-x", "20", "-y", "5", "sh", "-c", "printf 'abc\\033[L'; tmux wait-for -S ilcola; tmux wait-for ilcolb; printf X; tmux wait-for -S ilcolc; exec cat"] },
  { wait_for = "ilcola" },
  { run = ["display", "-p", "-t", "ilcol:", "#{history_size} #{cursor_x},#{cursor_y}"] },
  { run = ["wait-for", "-S", "ilcolb"] },
  { wait_for = "ilcolc" },
  { run = ["display", "-p", "-t", "ilcol:", "#{history_size} #{cursor_x},#{cursor_y}"] },
  { run = ["capture-pane", "-p", "-S", "-", "-t", "ilcol:"] },
  # dlcol: and DL
  { run = ["new", "-d", "-s", "dlcol", "-n", "w", "-x", "20", "-y", "5", "sh", "-c", "printf 'abc\\r\\ndef\\033[M'; tmux wait-for -S dlcola; tmux wait-for dlcolb; printf X; tmux wait-for -S dlcolc; exec cat"] },
  { wait_for = "dlcola" },
  { run = ["display", "-p", "-t", "dlcol:", "#{history_size} #{cursor_x},#{cursor_y}"] },
  { run = ["wait-for", "-S", "dlcolb"] },
  { wait_for = "dlcolc" },
  { run = ["display", "-p", "-t", "dlcol:", "#{history_size} #{cursor_x},#{cursor_y}"] },
  { run = ["capture-pane", "-p", "-S", "-", "-t", "dlcol:"] },
  # repcut: REP stops at the end of the line
  { run = ["new", "-d", "-s", "repcut", "-n", "w", "-x", "20", "-y", "5", "sh", "-c", "printf 'abcdefghijklmnopq\\033[5b'; tmux wait-for -S repcuta; tmux wait-for repcutb; printf X; tmux wait-for -S repcutc; exec cat"] },
  { wait_for = "repcuta" },
  { run = ["display", "-p", "-t", "repcut:", "#{history_size} #{cursor_x},#{cursor_y}"] },
  { run = ["wait-for", "-S", "repcutb"] },
  { wait_for = "repcutc" },
  { run = ["display", "-p", "-t", "repcut:", "#{history_size} #{cursor_x},#{cursor_y}"] },
  { run = ["capture-pane", "-p", "-S", "-", "-t", "repcut:"] },
  # bsup: BS at the first column of a continuation goes to the end of the line above
  { run = ["new", "-d", "-s", "bsup", "-n", "w", "-x", "20", "-y", "5", "sh", "-c", "printf 'abcdefghijklmnopqrstuv\\r\\b\\b'; tmux wait-for -S bsupa; tmux wait-for bsupb; printf X; tmux wait-for -S bsupc; exec cat"] },
  { wait_for = "bsupa" },
  { run = ["display", "-p", "-t", "bsup:", "#{history_size} #{cursor_x},#{cursor_y}"] },
  { run = ["wait-for", "-S", "bsupb"] },
  { wait_for = "bsupc" },
  { run = ["display", "-p", "-t", "bsup:", "#{history_size} #{cursor_x},#{cursor_y}"] },
  { run = ["capture-pane", "-p", "-S", "-", "-t", "bsup:"] },
]
