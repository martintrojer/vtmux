# Pane prompts (command-prompt -P, window.c window_pane_set_prompt) from
# the default copy-mode-vi bindings (key-bindings.c:665-710): drawn on the
# pane's last row (screen-redraw.c redraw_draw_pane_prompt) with the
# status line left alone, the cursor at the edit point
# (server-client.c server_client_prompt_cursor), keys routed to the pane
# prompt (server-client.c:1837-1857). / and ? search, f F t T jump, :
# goto line, and the 1-9 repeat counts (-N: a non-digit accepts and goes
# on to the copy-mode-vi table).
name = "prompt_pane_vi"
size = [40, 8]
steps = [
  { run = ["new", "-d", "-s", "a", "-n", "w", "-x", "40", "-y", "7", "sh", "-c", "i=1; while [ $i -le 12 ]; do echo \"line$i foo bar\"; i=$((i+1)); done; tmux wait-for -S ready; exec cat"] },
  { wait_for = "ready" },
  { run = ["select-pane", "-t", "%0", "-T", "t"] },
  { run = ["set", "-g", "status-right", "R"] },
  { run = ["setw", "-g", "mode-keys", "vi"] },
  { run = ["set", "-g", "copy-mode-position-format", "#[align=right][#{copy_position}/#{copy_position_limit}]#{?search_count, (#{search_count} results),}"] },
  { attach = { session = "a" } },
  { run = ["copy-mode", "-t", "a"] },
  { settle = { react = true } },
  { keys = "/" },
  { screen = {} },
  { keys = "line1" },
  { screen = {} },
  { keys = "\r" },
  { screen = {} },
  { run = ["display", "-p", "-t", "a", "[#{copy_cursor_x},#{copy_cursor_y}] [#{pane_search_string}]"] },
  { keys = "?" },
  { settle = {} },
  { keys = "foo\r" },
  { screen = {} },
  { run = ["display", "-p", "-t", "a", "[#{copy_cursor_x},#{copy_cursor_y}]"] },
  { keys = "0f" },
  { screen = {} },
  { keys = "b" },
  { screen = {} },
  { run = ["display", "-p", "-t", "a", "[#{copy_cursor_x},#{copy_cursor_y}]"] },
  { keys = "F" },
  { settle = {} },
  { keys = "f" },
  { settle = {} },
  { run = ["display", "-p", "-t", "a", "[#{copy_cursor_x},#{copy_cursor_y}]"] },
  { keys = "t" },
  { settle = {} },
  { keys = "r" },
  { settle = {} },
  { run = ["display", "-p", "-t", "a", "[#{copy_cursor_x},#{copy_cursor_y}]"] },
  { keys = "T" },
  { settle = {} },
  { keys = "l" },
  { settle = {} },
  { run = ["display", "-p", "-t", "a", "[#{copy_cursor_x},#{copy_cursor_y}]"] },
  { keys = ":" },
  { screen = {} },
  { keys = "3\r" },
  { screen = {} },
  { run = ["display", "-p", "-t", "a", "[#{copy_cursor_x},#{copy_cursor_y}] [#{scroll_position}]"] },
  { keys = "2" },
  { screen = {} },
  { keys = "1" },
  { screen = {} },
  { keys = "k" },
  { screen = {} },
  { run = ["display", "-p", "-t", "a", "[#{copy_cursor_x},#{copy_cursor_y}] [#{scroll_position}]"] },
  { keys = "4" },
  { settle = {} },
  { keys = "\u007f" },
  { screen = {} },
  { keys = "\u001b" },
  { screen = {} },
  { keys = "/" },
  { settle = {} },
  { keys = "ab" },
  { settle = {} },
  { keys = "\u001b" },
  { screen = {} },
  { keys = "h" },
  { screen = {} },
  { keys = "q" },
  { screen = {} },
  { run = ["show-prompt-history", "-T", "search"] },
  { run = ["show-prompt-history", "-T", "command"] },
]
