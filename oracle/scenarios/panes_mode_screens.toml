name = "panes_mode_screens"
size = [60, 20]
steps = [
  { run = ["new", "-d", "-s", "a", "-n", "w", "-x", "60", "-y", "19", "cat"] },
  { run = ["set", "-g", "status-right", ""] },
  { run = ["send-keys", "-t", "%0", "-l", "alpha"] },
  { attach = { session = "a" } },
  { run = ["display-panes", "-d", "0", "-t", "a"] },
  { settle = { react = true } },
  { screen = {} },
  { run = ["display", "-p", "-t", "a", "#{pane_mode} #{window_zoomed_flag} #{pane_in_mode}"] },
  { keys = "q" },
  { settle = { react = true } },
  { run = ["display", "-p", "-t", "a", "#{pane_mode} #{window_zoomed_flag} #{pane_in_mode}"] },
  { run = ["splitw", "-h", "-t", "a", "cat"] },
  { run = ["send-keys", "-t", "%1", "-l", "bravo"] },
  { run = ["display-panes", "-d", "0", "-t", "a"] },
  { settle = { react = true } },
  { screen = {} },
  { run = ["display", "-p", "-t", "a", "#{pane_mode} #{window_zoomed_flag}"] },
  { keys = "\u001b" },
  { settle = { react = true } },
  { run = ["display", "-p", "-t", "a", "#{pane_mode} #{window_zoomed_flag}"] },
  { run = ["splitw", "-v", "-t", "%1", "cat"] },
  { run = ["send-keys", "-t", "%2", "-l", "charlie"] },
  { run = ["display-panes", "-d", "0", "-t", "a"] },
  { settle = { react = true } },
  { screen = {} },
  { keys = "q" },
  { settle = { react = true } },
  { run = ["splitw", "-v", "-t", "%0", "cat"] },
  { run = ["display-panes", "-d", "0", "-t", "a"] },
  { settle = { react = true } },
  { screen = {} },
  { keys = "q" },
  { settle = { react = true } },
]
