name = "link_uri_vis"
# tmux keeps an OSC 8 link's URI and id through utf8_stravis with
# VIS_OCTAL|VIS_CSTYLE (hyperlinks.c hyperlinks_put): capture-pane -e and
# #{copy_cursor_hyperlink} show a backslash doubled and DEL in octal; UTF-8 is
# kept. Found by scripts/emu_fuzz.py.
steps = [
  { run = ["new", "-d", "-s", "a", "-n", "w", "-x", "20", "-y", "3", "sh", "-c", "printf '\\033]8;id=i\\\\d;a\\\\b\\177c\\303\\251\\033\\\\x\\033]8;;\\033\\\\\\015'; tmux wait-for -S ready; exec cat"] },
  { wait_for = "ready" },
  { run = ["capture-pane", "-p", "-e", "-t", "a:"] },
  { run = ["copy-mode", "-t", "a:"] },
  { run = ["display", "-p", "-t", "a:", "#{copy_cursor_x},#{copy_cursor_y} #{copy_cursor_hyperlink}"] },
]
