# previous-prompt/next-prompt [-o] (window_copy_cursor_prompt) after the
# bytes zsh 5.9 really writes: PROMPT_SP, then `CR ED 0` before each
# prompt (zle_refresh). An ED that clears a whole line empties it, OSC 133
# flags and data with it (grid_clear -> grid_clear_lines, grid.c:725-736),
# so a C with no output is gone once the next prompt shows, and so is an A
# printed in precmd, before the ED (session b), except the first, whose
# ED at the top left scrolls its line into history (scroll-on-clear). EL
# keeps a line's OSC 133 flags (screen_write_clearline,
# screen-write.c:1618-1650); ED 1 to the last column, ECH over the whole
# line and ED 2 do not (sessions e1-e4, capture-pane -F).
name = "copy_prompts_zsh_redraw"
steps = [
  { run = ["new", "-d", "-s", "a", "-n", "w", "-x", "40", "-y", "7", "sh", "-c", "sp() { printf '%%%39s\\r \\r' ''; }; c() { printf '%s\\r\\n\\033]133;C\\007' \"$1\"; }; p() { sp; printf '\\r\\033[J\\033]133;A\\007%% '; }; p; c 'echo a'; printf 'a\\r\\n'; p; c true; p; c 'seq 3'; printf '1\\r\\n2\\r\\n3\\r\\n'; p; c false; p; tmux wait-for -S ready; exec cat"] },
  { wait_for = "ready" },
  { run = ["capture-pane", "-p", "-F", "-S", "-", "-t", "a"] },
  { run = ["copy-mode", "-t", "a"] },
  { run = ["send-keys", "-t", "a", "-X", "previous-prompt"] },
  { run = ["display", "-p", "-t", "a", "[#{copy_cursor_x},#{copy_cursor_y}] [#{scroll_position}] [#{copy_cursor_line}]"] },
  { run = ["send-keys", "-t", "a", "-X", "previous-prompt"] },
