name = "client_switch_attached"
size = [40, 6]
steps = [
  { run = ["new", "-d", "-s", "a", "-n", "w", "-x", "40", "-y", "6", "sh", "-c", "printf 'in-a '; exec cat"] },
  { run = ["new", "-d", "-s", "b", "-n", "w", "-x", "40", "-y", "6", "sh", "-c", "printf 'in-b '; exec cat"] },
  { run = ["select-pane", "-t", "a", "-T", "t"] },
  { run = ["select-pane", "-t", "b", "-T", "t"] },
  { run = ["set", "-g", "status-right", "R"] },
  { attach = { session = "a" } },
  { screen = {} },
  # A switch redraws the client after the command returns: wait for that
  # output (README, *Races under load*).
  { run = ["switch-client", "-t", "b"] },
  { settle = { react = true } },
  { screen = {} },
  { run = ["switch-client", "-c", "no-such-client", "-t", "a"] },
  { run = ["switch-client", "-F", "-t", "a"] },
  { settle = { react = true } },
  { screen = {} },
  { run = ["refresh-client", "-A", "%0:on"] },
  { run = ["refresh-client", "-C", "80x24"] },
  { run = ["refresh-client", "-B", "x"] },
  { run = ["refresh-client", "-S"] },
  { run = ["refresh-client"] },
  { settle = { react = true } },
  { screen = {} },
]
