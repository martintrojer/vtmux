# display-popup positions (cmd-display-menu.c:100-271): the default
# centre, numbers (-y is the bottom line), R and P from the target pane,
# S on the status line, W at the window's status range, M with no mouse
# event (0) and L with no menu shown (0). Opened through binds: a CLI
# display-popup waits until the popup closes (CMD_RETURN_WAIT). `display-popup -C`
# closes each.
name = "popup_positions"
size = [40, 12]
steps = [
  { run = ["new", "-d", "-s", "a", "-n", "w", "-x", "40", "-y", "11", "cat"] },
  { run = ["set", "-g", "status-right", "R"] },
  { run = ["set", "-s", "escape-time", "0"] },
  { run = ["splitw", "-h", "-t", "a", "cat"] },
  { run = ["bind", "-n", "M-a", "display-popup", "-w", "10", "-h", "4", "printf C; exec cat"] },
  { run = ["bind", "-n", "M-b", "display-popup", "-w", "10", "-h", "4", "-x", "3", "-y", "7", "printf N; exec cat"] },
  { run = ["bind", "-n", "M-c", "display-popup", "-w", "10", "-h", "4", "-x", "R", "-y", "P", "printf RP; exec cat"] },
  { run = ["bind", "-n", "M-d", "display-popup", "-w", "10", "-h", "4", "-x", "P", "-y", "S", "printf PS; exec cat"] },
  { run = ["bind", "-n", "M-e", "display-popup", "-w", "10", "-h", "4", "-x", "W", "-y", "W", "printf WW; exec cat"] },
  { run = ["bind", "-n", "M-f", "display-popup", "-w", "10", "-h", "4", "-x", "M", "-y", "L", "printf ML; exec cat"] },
  { run = ["bind", "-n", "M-g", "display-popup", "-w", "50%", "-h", "50%", "-x", "100", "-y", "-5", "printf CLAMP; exec cat"] },
  { run = ["bind", "-n", "M-h", "display-popup", "-w", "10", "-h", "4", "-x", "#{e|+:#{popup_centre_x},1}", "-y", "#{popup_height}", "printf F; exec cat"] },
  { attach = { session = "a" } },
  { keys = "\u001ba" },
  { screen = {} },
  { run = ["display-popup", "-C"] },
  { settle = { react = true } },
  { screen = {} },
  { keys = "\u001bb" },
  { screen = {} },
  { run = ["display-popup", "-C"] },
  { settle = { react = true } },
  { keys = "\u001bc" },
  { screen = {} },
  { run = ["display-popup", "-C"] },
  { settle = { react = true } },
  { keys = "\u001bd" },
  { screen = {} },
  { run = ["display-popup", "-C"] },
  { settle = { react = true } },
  { keys = "\u001be" },
  { screen = {} },
  { run = ["display-popup", "-C"] },
  { settle = { react = true } },
  { keys = "\u001bf" },
  { screen = {} },
  { run = ["display-popup", "-C"] },
  { settle = { react = true } },
  { keys = "\u001bg" },
  { screen = {} },
  { run = ["display-popup", "-C"] },
  { settle = { react = true } },
  { keys = "\u001bh" },
  { screen = {} },
  { run = ["display-popup", "-C"] },
  { settle = { react = true } },
  { screen = {} },
]
