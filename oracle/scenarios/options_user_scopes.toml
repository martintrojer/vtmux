name = "options_user_scopes"
steps = [
  { run = ["new", "-d", "-s", "a", "cat"] },
  { run = ["set-option", "-s", "@x", "server"] },
  { run = ["set", "-g", "@x", "global session"] },
  { run = ["setw", "-g", "@x", "global window"] },
  { run = ["set", "-t", "a", "@x", "session"] },
  { run = ["set", "-w", "-t", "@0", "@x", "window"] },
  { run = ["set", "-p", "-t", "%0", "@x", "pane"] },
  { run = ["show", "-s", "@x"] },
  { run = ["show", "-g", "@x"] },
  { run = ["showw", "-g", "@x"] },
  { run = ["show", "-t", "a", "@x"] },
  { run = ["show", "-w", "-t", "@0", "@x"] },
  { run = ["show", "-p", "-t", "%0", "@x"] },
  { run = ["display", "-p", "#{@x}"] },
  { run = ["set", "-su", "@x"] },
  { run = ["display", "-p", "#{@x}"] },
  { run = ["set", "-pu", "-t", "%0", "@x"] },
  { run = ["display", "-p", "#{@x}"] },
  { run = ["set", "-wu", "-t", "@0", "@x"] },
  { run = ["show", "-pA", "-t", "%0", "@x"] },
  { run = ["display", "-p", "#{@x}"] },
]
