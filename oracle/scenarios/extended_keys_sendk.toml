name = "extended_keys_sendk"
size = [120, 8]
# send-keys -K (cmd-send-keys.c:75-90): keys go through the attached client's
# key handling as if typed: root bindings (also for keys only a modifier
# apart), the prefix table with a repeating binding, and a window's bindings
# under each key mode; -K with no client does nothing. A key that reaches a
# pane carries KEYC_SENT, which input_key does not strip, so tmux loses most
# of them: D-020, vtmux delivers them, annotated where a pane is observed.
# The pane reads a line, shows it through cat -v and signals; `LC_ALL=C cat -v`: BSD cat prints a
# multibyte character as it is in a UTF-8 locale, GNU cat in M- notation in
# any.
steps = [
  { run = ["set", "-g", "extended-keys", "on", ";", "set", "-g", "status-right", "", ";", "new", "-d", "-s", "a", "-n", "w0", "-x", "120", "-y", "7", "sh", "-c", "stty raw -echo opost onlcr; printf '\\033[5n'; dd bs=1 count=4 of=/dev/null 2>/dev/null; tmux wait-for -S rdy; while IFS= read -r l; do printf '%s\\n' \"$l\" | LC_ALL=C cat -v; tmux wait-for -S got; done"] },
  { wait_for = "rdy" },
  { run = ["select-pane", "-t", "a:w0", "-T", "tw0"] },
  { run = ["neww", "-d", "-n", "w1", "sh", "-c", "stty raw -echo opost onlcr; printf '\\033[>4;1m\\033[5n'; dd bs=1 count=4 of=/dev/null 2>/dev/null; tmux wait-for -S rdy; while IFS= read -r l; do printf '%s\\n' \"$l\" | LC_ALL=C cat -v; tmux wait-for -S got; done"] },
  { wait_for = "rdy" },
  { run = ["select-pane", "-t", "a:w1", "-T", "tw1"] },
  { run = ["neww", "-d", "-n", "w2", "sh", "-c", "stty raw -echo opost onlcr; printf '\\033[>4;2m\\033[5n'; dd bs=1 count=4 of=/dev/null 2>/dev/null; tmux wait-for -S rdy; while IFS= read -r l; do printf '%s\\n' \"$l\" | LC_ALL=C cat -v; tmux wait-for -S got; done"] },
  { wait_for = "rdy" },
  { run = ["select-pane", "-t", "a:w2", "-T", "tw2"] },
  { run = ["send-keys", "-K", "-t", "a:w0", "x"] },
  { run = ["bind", "-n", "F5", "set", "-ga", "@k", "F5,"] },
  { run = ["bind", "-n", "C-S-Left", "set", "-ga", "@k", "CSLeft,"] },
  { run = ["bind", "-n", "C-a", "set", "-ga", "@k", "Ca,"] },
  { run = ["bind", "-n", "M-a", "set", "-ga", "@k", "Ma,"] },
  { run = ["bind", "-n", "C-M-S-x", "set", "-ga", "@k", "CMSx,"] },
  { run = ["bind", "-n", "BTab", "set", "-ga", "@k", "BTab,"] },
  { run = ["bind", "-n", "C-Enter", "set", "-ga", "@k", "CEnter,"] },
  { run = ["bind", "-n", "S-Up", "set", "-ga", "@k", "SUp,"] },
  { run = ["bind", "-r", "-T", "prefix", "H", "set", "-ga", "@k", "H,"] },
  { run = ["bind", "-T", "prefix", "C-S-a", "set", "-ga", "@k", "PCSa,"] },
  { run = ["set", "-g", "@k", ""] },
  { attach = { session = "a" } },
  { run = ["selectw", "-t", "a:w0"] },
  { settle = { react = true } },
  { run = ["send-keys", "-K", "-t", "a:w0", "F5", "C-S-Left", "C-a", "M-a", "C-M-S-x", "BTab", "C-Enter", "S-Up", "C-b", "H", "H", "C-S-a", "C-b", "C-S-a"] },
  { run = ["send-keys", "-K", "-t", "a:w0", "-N", "2", "F5"] },
  { run = ["show", "-gv", "@k"] },
  { run = ["set", "-g", "@k", ""] },
  { run = ["send-keys", "-t", "a:w0", "-H", "0a"] },
  { wait_for = "got" },
  { run = ["selectw", "-t", "a:w1"] },
  { settle = { react = true } },
  { run = ["send-keys", "-K", "-t", "a:w1", "F5", "C-S-Left", "C-a", "M-a", "C-M-S-x", "BTab", "C-Enter", "S-Up", "C-b", "H", "H", "C-S-a", "C-b", "C-S-a"] },
  { run = ["send-keys", "-K", "-t", "a:w1", "-N", "2", "F5"] },
  { run = ["show", "-gv", "@k"] },
  { run = ["set", "-g", "@k", ""] },
  { run = ["send-keys", "-t", "a:w1", "-H", "0a"] },
  { wait_for = "got" },
  { run = ["selectw", "-t", "a:w2"] },
  { settle = { react = true } },
  { run = ["send-keys", "-K", "-t", "a:w2", "F5", "C-S-Left", "C-a", "M-a", "C-M-S-x", "BTab", "C-Enter", "S-Up", "C-b", "H", "H", "C-S-a", "C-b", "C-S-a"] },
  { run = ["send-keys", "-K", "-t", "a:w2", "-N", "2", "F5"] },
  { run = ["show", "-gv", "@k"] },
  { run = ["set", "-g", "@k", ""] },
  { run = ["send-keys", "-t", "a:w2", "-H", "0a"] },
  { wait_for = "got" },
  { run = ["unbind", "-a", "-n"] },
  { run = ["selectw", "-t", "a:w0"] },
  { run = ["send-keys", "-K", "-t", "a:w0", "a", "Tab", "Space", "BTab", "Space", "C-a", "Space", "S-Up", "Space", "M-a", "Space", "C-Enter", "Space", "A", "Space", "é"] },
  { run = ["send-keys", "-t", "a:w0", "-H", "0a"] },
  { wait_for = "got" },
  { divergence = { id = "D-020", expect = { kind = "cli", stdout = "^A\na\t ^[[Z ^A ^[[1;2A ^[a ^M A M-CM-)\n\n\n", stderr = "", exit = 0 } } },
  { run = ["capture-pane", "-p", "-S", "0", "-E", "3", "-t", "a:w0"] },
  { run = ["selectw", "-t", "a:w1"] },
  { run = ["send-keys", "-K", "-t", "a:w1", "a", "Tab", "Space", "BTab", "Space", "C-a", "Space", "S-Up", "Space", "M-a", "Space", "C-Enter", "Space", "A", "Space", "é"] },
  { run = ["send-keys", "-t", "a:w1", "-H", "0a"] },
  { wait_for = "got" },
  { divergence = { id = "D-020", expect = { kind = "cli", stdout = "^A\na\t ^[[Z ^A ^[[1;2A ^[a ^[[27;5;13~ A M-CM-)\n\n\n", stderr = "", exit = 0 } } },
  { run = ["capture-pane", "-p", "-S", "0", "-E", "3", "-t", "a:w1"] },
  { run = ["selectw", "-t", "a:w2"] },
  { run = ["send-keys", "-K", "-t", "a:w2", "a", "Tab", "Space", "BTab", "Space", "C-a", "Space", "S-Up", "Space", "M-a", "Space", "C-Enter", "Space", "A", "Space", "é"] },
  { run = ["send-keys", "-t", "a:w2", "-H", "0a"] },
  { wait_for = "got" },
  { divergence = { id = "D-020", expect = { kind = "cli", stdout = "^[[27;6;97~\na\t ^[[27;2;9~ ^[[27;5;97~ ^[[1;2A ^[[27;3;97~ ^[[27;5;13~ A M-CM-)\n\n\n", stderr = "", exit = 0 } } },
  { run = ["capture-pane", "-p", "-S", "0", "-E", "3", "-t", "a:w2"] },
  { run = ["lsw", "-F", "#{window_name}"] },
]
