name = "status_msg_timer"
size = [40, 6]
steps = [
  { run = ["new", "-d", "-s", "a", "-n", "w", "cat"] },
  { run = ["select-pane", "-t", "a", "-T", "t"] },
  { run = ["set", "-g", "status-right", "R"] },
  { attach = { session = "a" } },
  { screen = {} },
  # status.c:372-379: a -d 0 message does not re-arm c->message_timer, and
  # status_message_clear leaves it running, so the earlier timer clears it.
  { run = ["display-message", "-d", "2400", "-t", "a", "first"] },
  { run = ["display-message", "-d", "0", "-t", "a", "second"] },
  { settle = { react = true } },
  { screen = {} },
  { settle = { quiet_ms = 3300 } },
  { screen = {} },
  # The same after a key cleared the first message.
  { run = ["display-message", "-d", "4500", "-t", "a", "first"] },
  { keys = "k" },
  { screen = {} },
  { run = ["display-message", "-d", "0", "-t", "a", "second"] },
  { settle = { react = true } },
  { screen = {} },
  { settle = { quiet_ms = 5400 } },
  { screen = {} },
  # A later timed message re-arms the timer.
  { run = ["display-message", "-d", "1500", "-t", "a", "first"] },
  { run = ["display-message", "-d", "4500", "-t", "a", "third"] },
  { settle = { quiet_ms = 2400 } },
  { screen = {} },
  { settle = { quiet_ms = 3600 } },
  { screen = {} },
]
