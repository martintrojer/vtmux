# choose-buffer flags: -Z zooming and unzooming, -F and -f with a filter that matches and one that matches nothing, -K, -N twice (the big preview), a template of our own with %%, -k killing the pane on exit, search (C-s, n), -O with an unknown order, choose-buffer again while in buffer mode.
name = "choose_buffer_flags"
size = [60, 16]
steps = [
  { run = ["new", "-d", "-s", "aaa", "-n", "w0", "-x", "60", "-y", "15", "exec cat"] },
  { run = ["set", "-g", "status-right", "R"] },
  { run = ["splitw", "-d", "-t", "aaa:0", "exec cat"] },
  { run = ["select-pane", "-t", "%0", "-T", "t0"] },
  { run = ["select-pane", "-t", "%1", "-T", "t1"] },
  { run = ["set-buffer", "-b", "alpha", "apple\npie"] },
  { run = ["set-buffer", "-b", "beta", "banana"] },
  { run = ["set-buffer", "-b", "gamma", "cherry pie"] },
  { attach = { session = "aaa" } },
  { screen = {} },
  { run = ["choose-buffer", "-Z", "-t", "aaa:0.0", "-F", "#{buffer_name}"] },
  { settle = { react = true } },
  { run = ["display", "-p", "#{window_zoomed_flag}"] },
  { screen = {} },
  { keys = "q" },
  { settle = { react = true } },
  { run = ["display", "-p", "#{window_zoomed_flag}"] },
  { run = ["choose-buffer", "-t", "aaa:0.0", "-F", "[#{buffer_size}]", "-f", "#{m:*pie*,#{buffer_sample}}"] },
  { settle = { react = true } },
  { screen = {} },
  { keys = "q" },
  { settle = { react = true } },
  { run = ["choose-buffer", "-t", "aaa:0.0", "-f", "#{==:#{buffer_name},none}", "-F", "#{buffer_name}"] },
  { settle = { react = true } },
  { screen = {} },
  { keys = "c" },
  { screen = {} },
  { keys = "f" },
  { keys = "#{==:#{buffer_name},beta}\r" },
  { screen = {} },
  { keys = "q" },
  { settle = { react = true } },
  { run = ["choose-buffer", "-t", "aaa:0.0", "-NN", "-O", "name", "-K", "#{?#{e|<:#{line},2},#{a:#{e|+:120,#{line}}},}", "-F", "#{buffer_name}"] },
  { settle = { react = true } },
  { screen = {} },
  { run = ["choose-buffer", "-t", "aaa:0.0"] },
  { settle = { react = true } },
  { screen = {} },
  { keys = "\u0013" },
  { keys = "an\r" },
  { screen = {} },
  { keys = "n" },
  { screen = {} },
  { keys = "y" },
  { settle = { react = true } },
  { run = ["display", "-p", "-t", "aaa:0.0", "#{pane_in_mode}"] },
  { screen = {} },
  { run = ["choose-buffer", "-t", "aaa:0.0", "-N", "-O", "name", "set -g @chose '%%'"] },
  { settle = { react = true } },
  { keys = "jj\r" },
  { settle = {} },
  { run = ["show", "-gv", "@chose"] },
  { run = ["choose-buffer", "-t", "aaa:0.0", "-O", "bogus"] },
  { run = ["choose-buffer", "-Nk", "-t", "aaa:0.1"] },
  { settle = { react = true } },
  { run = ["display", "-p", "-t", "aaa:0.1", "#{pane_mode}"] },
  { run = ["send-keys", "-t", "aaa:0.1", "q"] },
  { settle = { react = true } },
  { run = ["list-panes", "-t", "aaa:0", "-F", "#{pane_id}"] },
  { screen = {} },
]
