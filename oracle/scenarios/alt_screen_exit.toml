  { run = ["display", "-p", "-t", "s47:", "#{history_size} #{cursor_x},#{cursor_y} #{alternate_on}"] },
  { run = ["capture-pane", "-p", "-S", "-", "-t", "s47:"] },
  { run = ["new", "-d", "-s", "s1047", "-n", "w", "-x", "80", "-y", "50", "sh", "-c", "i=10; while [ $i -lt 70 ]; do printf '%sxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx\\015\\012' $i; i=$((i+1)); done; printf '\\033[?1047h\\033[H\\033[2Jvim'; tmux wait-for -S s1047-p0; tmux wait-for s1047-go1; printf '\\033[?1047l'; tmux wait-for -S s1047-p1; exec cat -"] },
  { wait_for = "s1047-p0" },
  { run = ["display", "-p", "-t", "s1047:", "#{history_size} #{cursor_x},#{cursor_y} #{alternate_on}"] },
