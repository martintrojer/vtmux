name = "alt_screen_exit"
size = [80, 24]
# The end of an alternate screen resizes the primary screen once, from the size
# it had to the pane's, with history on (screen.c screen_alternate_off): tmux
# left it alone meanwhile (GRID_HISTORY off; window.c window_pane_resize resizes
# only the alternate grid). screen_resize_y then deletes the rows under the
# cursor before it pushes any into history, so the cursor it resizes with
# counts: ?1049l's saved one, the alternate screen's after ?47l and ?1047l
# (back at the saved size first: a cursor past the last row ends on it).
# Ghostty resized the primary at every resize, with its own cursor, so rows
# under the alternate cursor went into history (s47: tmux 11, was 41), a
# taller screen left the cursor where the alternate one had it (b47bot), and a
# narrower one kept its column on an empty line (b47botn: tmux 0, was 3).
# mid*: the cursor mid-screen before ?1049h. pend47: a cursor past the last
# column goes to the end of its line; tmux keeps it past the narrower
# alternate screen's width meanwhile (D-038).
steps = [
  { run = ["new", "-d", "-s", "init", "-n", "w", "-x", "80", "-y", "8", "cat", "-"] },
  { run = ["set", "-g", "status", "off"] },
  # s47, s1047, s1049: 50 rows, the alternate screen at 20, back to 60
  { run = ["new", "-d", "-s", "s47", "-n", "w", "-x", "80", "-y", "50", "sh", "-c", "i=10; while [ $i -lt 70 ]; do printf '%sxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx\\015\\012' $i; i=$((i+1)); done; printf '\\033[?47h\\033[H\\033[2Jvim'; tmux wait-for -S s47-p0; tmux wait-for s47-go1; printf '\\033[?47l'; tmux wait-for -S s47-p1; exec cat -"] },
  { wait_for = "s47-p0" },
  { run = ["display", "-p", "-t", "s47:", "#{history_size} #{cursor_x},#{cursor_y} #{alternate_on}"] },
  { run = ["resize-window", "-t", "s47", "-y", "20"] },
  { run = ["display", "-p", "-t", "s47:", "#{history_size} #{cursor_x},#{cursor_y} #{alternate_on}"] },
  { run = ["wait-for", "-S", "s47-go1"] },
  { wait_for = "s47-p1" },
  { run = ["display", "-p", "-t", "s47:", "#{history_size} #{cursor_x},#{cursor_y} #{alternate_on}"] },
