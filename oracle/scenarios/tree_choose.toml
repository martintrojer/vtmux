# choose-tree choosing: Enter runs the default template (switch-client -Zt with the target), a shortcut key chooses its line, a template of our own with %%, a template that does not parse showing its error, J and K swapping windows, H going back to the starting pane.
name = "tree_choose"
size = [60, 16]
steps = [
  { run = ["new", "-d", "-s", "aaa", "-n", "w0", "-x", "60", "-y", "15", "cat"] },
  { run = ["set", "-g", "status-right", "R"] },
  { run = ["neww", "-d", "-t", "aaa:1", "-n", "w1", "cat"] },
  { run = ["splitw", "-d", "-t", "aaa:1", "cat"] },
  { run = ["new", "-d", "-s", "bbb", "-n", "x0", "-x", "60", "-y", "15", "cat"] },
  { run = ["neww", "-d", "-t", "bbb:1", "-n", "x1", "cat"] },
  { run = ["new", "-d", "-s", "ccc", "-n", "y0", "-x", "60", "-y", "15", "cat"] },
  { run = ["select-pane", "-t", "%0", "-T", "t0"] },
  { run = ["select-pane", "-t", "%1", "-T", "t1"] },
  { run = ["select-pane", "-t", "%2", "-T", "t2"] },
  { run = ["select-pane", "-t", "%3", "-T", "t3"] },
  { run = ["select-pane", "-t", "%4", "-T", "t4"] },
  { run = ["select-pane", "-t", "%5", "-T", "t5"] },
  { attach = { session = "aaa" } },
  { screen = {} },
  { run = ["choose-tree", "-t", "aaa:0.0", "-N"] },
  { settle = { react = true } },
  { keys = "G\r" },
  { screen = {} },
  { run = ["display", "-p", "#{client_session}"] },
  { run = ["switch-client", "-t", "aaa"] },
  { settle = { react = true } },
  { run = ["choose-tree", "-Nw", "-t", "aaa:0"] },
  { settle = { react = true } },
  { keys = "2" },
  { screen = {} },
  { run = ["display", "-p", "#{client_session}:#{window_index}"] },
  { run = ["switch-client", "-t", "aaa:0"] },
  { settle = { react = true } },
  { run = ["choose-tree", "-N", "-t", "aaa:0", "set -g @chose '%%'"] },
  { settle = { react = true } },
  { keys = "jjjj\r" },
  { settle = {} },
  { run = ["show", "-gv", "@chose"] },
  { run = ["choose-tree", "-N", "-t", "aaa:0", "set -g @x '%%"] },
  { settle = { react = true } },
  { keys = "\r" },
  { screen = {} },
  { run = ["choose-tree", "-N", "-t", "aaa:0"] },
  { settle = { react = true } },
  { keys = "jjjJ" },
  { screen = {} },
  { keys = "K" },
  { screen = {} },
  { keys = "jJ" },
  { screen = {} },
  { run = ["list-windows", "-t", "aaa", "-F", "#{window_index} #{window_name}"] },
  { keys = "GH" },
  { screen = {} },
]
