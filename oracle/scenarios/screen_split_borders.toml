name = "screen_split_borders"
size = [40, 10]
steps = [
  { run = ["new", "-d", "-s", "a", "-n", "w", "-x", "40", "-y", "9", "cat"] },
  { run = ["splitw", "-h", "-t", "a", "cat"] },
  { run = ["splitw", "-v", "-t", "a", "cat"] },
  { run = ["splitw", "-v", "-t", "%0", "cat"] },
  { run = ["select-pane", "-t", "%0", "-T", "t"] },
  { run = ["select-pane", "-t", "%1", "-T", "t"] },
  { run = ["select-pane", "-t", "%2", "-T", "t"] },
  { run = ["select-pane", "-t", "%3", "-T", "t"] },
  { run = ["send-keys", "-t", "%0", "-l", "zero"] },
  { run = ["send-keys", "-t", "%2", "-l", "two"] },
  { attach = { session = "a" } },
  { screen = {} },
  { run = ["set", "-w", "-t", "a", "pane-border-lines", "double"] },
  { screen = {} },
  { run = ["set", "-w", "-t", "a", "pane-border-lines", "heavy"] },
  { screen = {} },
  { run = ["set", "-w", "-t", "a", "pane-border-lines", "simple"] },
  { screen = {} },
  { run = ["set", "-w", "-t", "a", "pane-border-lines", "number"] },
  { screen = {} },
  { run = ["set", "-w", "-t", "a", "pane-border-lines", "spaces"] },
  { screen = {} },
  { run = ["set", "-w", "-t", "a", "pane-border-lines", "none"] },
  { screen = {} },
  { run = ["set", "-w", "-t", "a", "pane-border-lines", "single"] },
  { screen = {} },
  { run = ["set", "-w", "-t", "a", "pane-border-indicators", "off"] },
  { screen = {} },
  { run = ["set", "-w", "-t", "a", "pane-border-indicators", "arrows"] },
  { screen = {} },
  { run = ["set", "-w", "-t", "a", "pane-border-indicators", "both"] },
  { screen = {} },
  { run = ["set", "-w", "-t", "a", "pane-border-indicators", "colour"] },
  { screen = {} },
  { run = ["set", "-w", "-t", "a", "pane-border-indicators", "both"] },
  { run = ["set", "-w", "-t", "a", "pane-border-style", "fg=blue,bg=yellow"] },
  { run = ["set", "-w", "-t", "a", "pane-active-border-style", "fg=red,bold"] },
  { screen = {} },
  { run = ["selectp", "-t", "%0"] },
  { screen = {} },
  { run = ["selectp", "-t", "%3"] },
  { screen = {} },
]
