name = "env_commands"
steps = [
  { run = ["new", "-d", "-s", "main", "cat"] },
  { run = ["setenv", "FOO", "bar"] },
  { run = ["showenv", "FOO"] },
  { run = ["setenv", "-g", "GVAR", "gval"] },
  { run = ["showenv", "-g", "GVAR"] },
  { run = ["showenv", "-g", "FOO"] },
  { run = ["setenv", "ESC", "a$b`c\"d\\e"] },
  { run = ["showenv", "-s", "ESC"] },
  { run = ["setenv", "-F", "EXP", "#{session_name}"] },
  { run = ["showenv", "EXP"] },
  { run = ["setenv", "-h", "SECRET", "s3cr"] },
  { run = ["showenv", "SECRET"] },
  { run = ["showenv", "-h", "SECRET"] },
  { run = ["setenv", "-r", "FOO"] },
  { run = ["showenv", "FOO"] },
  { run = ["showenv", "-s", "FOO"] },
  { run = ["setenv", "-u", "FOO"] },
  { run = ["showenv", "FOO"] },
  { run = ["setenv", "", "x"] },
  { run = ["setenv", "A=B", "x"] },
  { run = ["setenv", "-u", "FOO", "val"] },
  { run = ["setenv", "-r", "FOO", "val"] },
  { run = ["setenv", "NOVAL"] },
  { run = ["showenv", "-t", "nosuch", "FOO"] },
  { run = ["setenv", "-t", "nosuch", "FOO", "bar"] },
  { run = ["showenv", "-t", "main"] },
]
