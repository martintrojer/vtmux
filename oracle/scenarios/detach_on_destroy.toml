# server_destroy_session (server-fn.c:486-527): where detach-on-destroy sends the clients of a killed session. previous and next by name, wrapping; off to the most recently active other session; no-detached to the most recently active session with no client; on detaches. client-session-changed fires before session-closed. A group killed whole (kill-session -g) moves a client through each member to a session outside the group.
name = "detach_on_destroy"
size = [40, 6]
steps = [
  { run = ["new", "-d", "-s", "a", "-n", "w", "-x", "40", "-y", "5", "exec cat"] },
  { run = ["set", "-g", "status-right", "R"] },
  { run = ["new", "-d", "-s", "b", "-n", "w", "-x", "40", "-y", "5", "exec cat"] },
  { run = ["new", "-d", "-s", "c", "-n", "w", "-x", "40", "-y", "5", "exec cat"] },
  { run = ["new", "-d", "-s", "d", "-n", "w", "-x", "40", "-y", "5", "exec cat"] },
  { run = ["new", "-d", "-s", "e", "-n", "w", "-x", "40", "-y", "5", "exec cat"] },
  { attach = { session = "c" } },
  { attach = { session = "a", id = "b" } },
  { settle = {} },
  { run = ["set", "-g", "@log", ""] },
  { run = ["set-hook", "-g", "client-session-changed", "set -gaF @log '[chg #{hook_session_name}]'"] },
  { run = ["set-hook", "-g", "session-closed", "set -gaF @log '[cl #{hook_session_name}]'"] },
  { run = ["set", "-g", "detach-on-destroy", "previous"] },
  { run = ["kill-session", "-t", "c"] },
  { settle = { react = true } },
  { run = ["lsc", "-F", "#{client_session}"] },
  { run = ["show", "-gv", "@log"] },
  { run = ["set", "-g", "@log", ""] },
  { run = ["set", "-g", "detach-on-destroy", "next"] },
  { run = ["kill-session", "-t", "a"] },
  { settle = { react = true } },
  { run = ["lsc", "-F", "#{client_session}"] },
  { run = ["show", "-gv", "@log"] },
  { run = ["set", "-g", "@log", ""] },
  { run = ["set", "-g", "detach-on-destroy", "no-detached"] },
  { keys_to = { id = "b", keys = "\u0002:" } },
  { settle = {} },
  { keys_to = { id = "b", keys = "switch-client -t e\r" } },
  { settle = { react = true } },
  { run = ["lsc", "-F", "#{client_session}"] },
  { run = ["kill-session", "-t", "b"] },
  { settle = { react = true } },
  { run = ["lsc", "-F", "#{client_session}"] },
  { run = ["show", "-gv", "@log"] },
  { run = ["new", "-d", "-s", "x", "-n", "w", "-x", "40", "-y", "5", "exec cat"] },
  { run = ["new", "-d", "-t", "x", "-s", "y"] },
  { run = ["new", "-d", "-t", "x", "-s", "z"] },
  { run = ["set", "-g", "@log", ""] },
  { run = ["set", "-g", "detach-on-destroy", "off"] },
  { keys_to = { id = "b", keys = "\u0002:" } },
  { settle = {} },
  { keys_to = { id = "b", keys = "switch-client -t y\r" } },
  { settle = { react = true } },
  { run = ["lsc", "-F", "#{client_session}"] },
  { run = ["kill-session", "-g", "-t", "y"] },
  { settle = { react = true } },
  { run = ["lsc", "-F", "#{client_session}"] },
  { run = ["show", "-gv", "@log"] },
  { run = ["ls", "-F", "#{session_name}"] },
  { run = ["set", "-g", "@log", ""] },
  { run = ["set", "-g", "detach-on-destroy", "on"] },
  { run = ["kill-session", "-t", "e"] },
  { settle = { react = true } },
  { run = ["lsc", "-F", "#{client_session}"] },
  { run = ["show", "-gv", "@log"] },
  { run = ["kill-server"] },
]
