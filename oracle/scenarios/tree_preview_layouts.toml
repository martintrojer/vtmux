# choose-tree preview (window-tree.c:517-915, mode-tree.c:960-1035) at 80x30: a session's windows and a window's panes side by side with their labels, the < and > columns when more are off a side, < and > scrolling (clamped, reset by moving), a pane's screen around its cursor (colour, a wide character), v cycling off/big/normal.
name = "tree_preview_layouts"
size = [80, 30]
steps = [
  { run = ["new", "-d", "-s", "aaa", "-n", "w0", "-x", "80", "-y", "29", 'printf zero\\n; exec cat'] },
  { run = ["set", "-g", "status-right", "R"] },
  { run = ["neww", "-d", "-t", "aaa:1", "-n", "w1", 'printf one\\n; exec cat'] },
  { run = ["splitw", "-d", "-t", "aaa:1", "printf \"\\033[31mred\\033[0m\\n\"; exec cat"] },
