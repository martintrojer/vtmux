  { run = ["splitw", "-d", "-t", "aaa:2", "exec cat"] },
  { run = ["splitw", "-d", "-h", "-t", "aaa:2", "printf \"wide \\344\\270\\226\\n\"; exec cat"] },
  { run = ["neww", "-d", "-t", "aaa:3", "-n", "w3", "exec cat"] },
  { run = ["splitw", "-d", "-t", "aaa:3", "exec cat"] },
