# choose-tree list (mode-tree.c, window-tree.c) with the preview off: the rows and their prefixes, moving, tagging (a typed t moves down), tag all and none, O and r re-sorting, collapse and expand of one item and of all, the help screen, q leaving the mode.
name = "tree_list"
size = [60, 16]
steps = [
  { run = ["new", "-d", "-s", "aaa", "-n", "w0", "-x", "60", "-y", "15", "exec cat"] },
  { run = ["set", "-g", "status-right", "R"] },
  { run = ["neww", "-d", "-t", "aaa:1", "-n", "w1", "exec cat"] },
  { run = ["splitw", "-d", "-t", "aaa:1", "exec cat"] },
  { run = ["new", "-d", "-s", "bbb", "-n", "x0", "-x", "60", "-y", "15", "exec cat"] },
  { run = ["neww", "-d", "-t", "bbb:1", "-n", "x1", "exec cat"] },
  { run = ["new", "-d", "-s", "ccc", "-n", "y0", "-x", "60", "-y", "15", "exec cat"] },
  { run = ["select-pane", "-t", "%0", "-T", "t0"] },
  { run = ["select-pane", "-t", "%1", "-T", "t1"] },
  { run = ["select-pane", "-t", "%2", "-T", "t2"] },
  { run = ["select-pane", "-t", "%3", "-T", "t3"] },
  { run = ["select-pane", "-t", "%4", "-T", "t4"] },
  { run = ["select-pane", "-t", "%5", "-T", "t5"] },
  { attach = { session = "aaa" } },
  { screen = {} },
  { run = ["choose-tree", "-t", "aaa:0.0", "-N"] },
  { settle = { react = true } },
  { screen = {} },
  { run = ["display", "-p", "#{pane_mode}"] },
  { keys = "jjt" },
  { screen = {} },
  { keys = "\u0014" },
  { screen = {} },
  { keys = "TO" },
  { screen = {} },
  { keys = "r" },
  { screen = {} },
  { keys = "rOOO" },
  { screen = {} },
  { keys = "gjh" },
  { screen = {} },
  { keys = "l" },
  { screen = {} },
  { keys = "\u001b-" },
  { screen = {} },
  { keys = "\u001b+G" },
  { screen = {} },
  { keys = "\u001bOP" },
  { screen = {} },
  { keys = "j" },
  { screen = {} },
  { keys = "q" },
  { settle = { react = true } },
  { screen = {} },
  { run = ["display", "-p", "#{pane_mode}"] },
]
