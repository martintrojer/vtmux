name = "alt_screen_saved_no_history"
size = [80, 24]
# capture-pane -a once the alternate screen has gone, in a pane without
# history: screen_alternate_off frees saved_grid as it leaves (screen.c), so
# cmd_capture_pane_history says "no alternate screen" (cmd-capture-pane.c),
# as with history. While it is up, -a reads the saved primary screen.
steps = [
  { run = ["new", "-d", "-s", "init", "-n", "w", "cat", "-"] },
  { run = ["set", "-g", "history-limit", "0"] },
  { run = ["new", "-d", "-s", "nh", "-n", "w", "-x", "40", "-y", "6", "sh", "-c", "printf 'primary\\015\\012'; printf '\\033[?1049hALT'; tmux wait-for -S nh-p0; tmux wait-for nh-go1; printf '\\033[?1049lchanged'; tmux wait-for -S nh-p1; exec cat -"] },
  { wait_for = "nh-p0" },
  { run = ["display", "-p", "-t", "nh:", "#{history_size} #{alternate_on}"] },
  { run = ["capture-pane", "-p", "-a", "-t", "nh:"] },
  { run = ["wait-for", "-S", "nh-go1"] },
  { wait_for = "nh-p1" },
  { run = ["display", "-p", "-t", "nh:", "#{history_size} #{alternate_on}"] },
  { run = ["capture-pane", "-p", "-a", "-t", "nh:"] },
  { run = ["capture-pane", "-p", "-a", "-q", "-t", "nh:"] },
  { run = ["capture-pane", "-p", "-t", "nh:"] },
]
