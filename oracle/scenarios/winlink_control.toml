name = "winlink_control"
steps = [
  { run = ["new", "-d", "-s", "a", "-n", "w0", "-x", "80", "-y", "24", "cat"] },
  { run = ["neww", "-d", "-t", "a:1", "-n", "w1", "cat"] },
  { run = ["new", "-d", "-s", "b", "-n", "b0", "-x", "80", "-y", "24", "cat"] },
  { control = { argv = ["attach", "-t", "b"], id = "c1" } },
  { control_send = { id = "c1", line = "linkw -d -s a:1 -t b:5" } },
  { control_wait = { id = "c1", until = "%end" } },
  { control_send = { id = "c1", line = "rename-window -t b:5 shared" } },
  { control_wait = { id = "c1", until = "%end" } },
  { control_send = { id = "c1", line = "rename-session -t a alpha" } },
  { control_wait = { id = "c1", until = "%end" } },
  { control_send = { id = "c1", line = "unlinkw -t b:5" } },
  { control_wait = { id = "c1", until = "%end" } },
  { control_send = { id = "c1", line = "movew -d -s alpha:1 -t b:7" } },
  { control_wait = { id = "c1", until = "%end" } },
  { control_send = { id = "c1", line = "swapw -s alpha:0 -t b:7" } },
  { control_wait = { id = "c1", until = "%end" } },
  { control_send = { id = "c1", line = "unlinkw -k -t alpha:0" } },
  { control_wait = { id = "c1", until = "%end" } },
  { control_close = { id = "c1" } },
  { run = ["lsw", "-a", "-F", "#{session_name}:#{window_index} #{window_id} #{window_name}"] },
  { run = ["kill-server"] },
]
