# The editor choose-buffer's `e` opens (spawn.c spawn_editor, spawn_editor_finish; window-buffer.c window_buffer_start_edit): `editor file` runs in a modal floating pane nine tenths of the window, centred, put after the whole layout (layout_floating_pane with no pane: a top-bottom node over the old root) and kept above a zoomed pane (SPAWN_FLOATOVERZOOM): it is listed, active and modal while it runs, and the mode shows WAITING FOR EDITOR with its pid. When it exits 0 the file is the buffer's new data, the pane goes (remain-on-exit off), the pane active before it is active again and the zoom stays. A killed editor changes nothing. The editor signals `opened`, waits for `go`, then appends `-new` to the file.
name = "editor_modal_pane"
size = [80, 24]
steps = [
  { run = ["new", "-d", "-s", "a", "-n", "w", "-x", "80", "-y", "23", "cat", "-"] },
  { run = ["set", "-g", "status-right", "R"] },
  { run = ["set", "-g", "automatic-rename", "off"] },
  { run = ["select-pane", "-t", "%0", "-T", "t0"] },
  { run = ["splitw", "-h", "-t", "%0", "cat", "-"] },
  { run = ["select-pane", "-t", "%1", "-T", "t1"] },
  { run = ["set", "-g", "editor", "sh -c 'printf EDITING; tmux wait-for -S opened; tmux wait-for go; printf \"%s\\n\" \"$(cat \"$1\")-new\" >\"$1\"' x"] },
  { run = ["set-buffer", "-b", "b1", "one"] },
  { run = ["select-pane", "-t", "%0"] },
  { run = ["resize-pane", "-Z", "-t", "%0"] },
  { attach = { session = "a" } },
  { run = ["choose-buffer", "-t", "%0", "-F", "#{buffer_name}=#{buffer_sample}"] },
  { settle = { react = true } },
  { screen = {} },
  { keys = "e" },
  { wait_for = "opened" },
  { settle = { react = true } },
  { screen = {} },
  { run = ["list-panes", "-t", "a", "-F", "#{pane_id} f#{pane_floating_flag} m#{pane_modal_flag} a#{pane_active} z#{pane_z} #{pane_flags} #{pane_width}x#{pane_height} #{pane_left},#{pane_top}"] },
  { run = ["display", "-p", "-t", "a", "#{window_panes} #{window_modal_pane} #{window_zoomed_flag} #{window_flags} #{pane_id}"] },
  { run = ["display", "-p", "-t", "a", "#{window_layout}"] },
  { run = ["display", "-p", "-t", "a", "#{window_visible_layout}"] },
  { run = ["wait-for", "-S", "go"] },
  { settle = { react = true } },
  { screen = {} },
  { run = ["show-buffer", "-b", "b1"] },
  { run = ["display", "-p", "-t", "a", "#{window_panes} [#{window_modal_pane}] #{window_zoomed_flag} #{pane_id} #{pane_in_mode}"] },
  { run = ["display", "-p", "-t", "a", "#{window_layout}"] },
  { keys = "e" },
  { wait_for = "opened" },
  { settle = { react = true } },
  { run = ["display", "-p", "-t", "a", "#{window_panes} #{window_modal_pane}"] },
  { run = ["kill-pane", "-t", "%3"] },
  { settle = { react = true } },
  { screen = {} },
  { run = ["show-buffer", "-b", "b1"] },
  { run = ["display", "-p", "-t", "a", "#{window_panes} [#{window_modal_pane}] #{window_zoomed_flag} #{pane_id} #{pane_in_mode}"] },
  { run = ["wait-for", "-S", "go"] },
]
