# choose-tree i (window_tree_draw_info): the session, window and pane information in the preview, the view name in the title, sections apart by a line crossing the column, the column line down the rest; 20 columns wide, so the values (PIDs, ttys, times, whose widths vary) are cut off and only the labels show. i again goes back to the preview.
name = "tree_preview_info"
size = [20, 40]
steps = [
  { run = ["new", "-d", "-s", "aaa", "-n", "w0", "-x", "20", "-y", "39", 'printf zero\\n; exec cat'] },
  { run = ["set", "-g", "status-right", "R"] },
  { run = ["neww", "-d", "-t", "aaa:1", "-n", "w1", 'printf one\\n; exec cat'] },
  { run = ["splitw", "-d", "-t", "aaa:1", "printf \"\\033[31mred\\033[0m\\n\"; exec cat"] },
  { run = ["neww", "-d", "-t", "aaa:2", "-n", "w2", "exec cat"] },
  { run = ["splitw", "-d", "-t", "aaa:2", "exec cat"] },
  { run = ["splitw", "-d", "-h", "-t", "aaa:2", "printf \"wide \\344\\270\\226\\n\"; exec cat"] },
  { run = ["neww", "-d", "-t", "aaa:3", "-n", "w3", "exec cat"] },
  { run = ["splitw", "-d", "-t", "aaa:3", "exec cat"] },
  { run = ["splitw", "-d", "-t", "aaa:3", "exec cat"] },
  { run = ["splitw", "-d", "-t", "aaa:3", 'printf four\\n; exec cat'] },
  { run = ["new", "-d", "-s", "bbb", "-n", "x0", "-x", "20", "-y", "39", "exec cat"] },
  { run = ["neww", "-d", "-t", "bbb:1", "-n", "x1", 'printf xone\\n; exec cat'] },
  { run = ["neww", "-d", "-t", "bbb:2", "-n", "x2", 'printf xtwo\\n; exec cat'] },
  { run = ["neww", "-d", "-t", "bbb:3", "-n", "x3", "exec cat"] },
  { run = ["neww", "-d", "-t", "bbb:4", "-n", "x4", "exec cat"] },
  { run = ["select-window", "-t", "bbb:2"] },
  { run = ["new", "-d", "-s", "ccc", "-n", "y0", "-x", "20", "-y", "39", "exec cat"] },
  { run = ["select-pane", "-t", "%0", "-T", "t0", ";", "select-pane", "-t", "%1", "-T", "t1", ";", "select-pane", "-t", "%2", "-T", "t2", ";", "select-pane", "-t", "%3", "-T", "t3", ";", "select-pane", "-t", "%4", "-T", "t4", ";", "select-pane", "-t", "%5", "-T", "t5", ";", "select-pane", "-t", "%6", "-T", "t6", ";", "select-pane", "-t", "%7", "-T", "t7", ";", "select-pane", "-t", "%8", "-T", "t8", ";", "select-pane", "-t", "%9", "-T", "t9", ";", "select-pane", "-t", "%10", "-T", "t10", ";", "select-pane", "-t", "%11", "-T", "t11", ";", "select-pane", "-t", "%12", "-T", "t12", ";", "select-pane", "-t", "%13", "-T", "t13", ";", "select-pane", "-t", "%14", "-T", "t14", ";", "select-pane", "-t", "%15", "-T", "t15"] },
  { attach = { session = "aaa" } },
  { screen = {} },
  { run = ["choose-tree", "-t", "aaa:0.0"] },
  { settle = { react = true } },
  { keys = "gi" },
  { screen = {} },
  { keys = "j" },
  { screen = {} },
  { keys = "j" },
  { screen = {} },
  { keys = "jjjjj" },
  { screen = {} },
  { resize = [20, 24] },
  { settle = { react = true } },
  { screen = {} },
  { keys = "i" },
  { screen = {} },
]
