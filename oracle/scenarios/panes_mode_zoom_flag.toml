name = "panes_mode_zoom_flag"
size = [60, 20]
steps = [
  { run = ["new", "-d", "-s", "a", "-n", "w", "-x", "60", "-y", "19", "sh", "-c", "printf 'top\\nsecond line\\n'; tmux wait-for -S ready; exec cat"] },
  { wait_for = "ready" },
  { run = ["set", "-g", "status-right", ""] },
  { run = ["splitw", "-h", "-t", "a", "cat"] },
  { run = ["splitw", "-v", "-t", "%1", "cat"] },
  { run = ["send-keys", "-t", "%1", "-l", "bravo"] },
  { run = ["send-keys", "-t", "%2", "-l", "charlie"] },
  { attach = { session = "a" } },
  { run = ["display-panes", "-Z", "-d", "0", "-t", "%1"] },
  { settle = { react = true } },
  { screen = {} },
  { run = ["display", "-p", "-t", "a", "#{pane_mode} #{window_zoomed_flag}"] },
  { keys = "q" },
  { settle = { react = true } },
  { run = ["display", "-p", "-t", "a", "#{pane_mode} #{window_zoomed_flag}"] },
  { run = ["resizep", "-Z", "-t", "%2"] },
  { settle = { react = true } },
  { run = ["display-panes", "-d", "0", "-t", "%2"] },
  { settle = { react = true } },
  { screen = {} },
  { run = ["display", "-p", "-t", "a", "#{pane_mode} #{window_zoomed_flag}"] },
  { keys = "q" },
  { settle = { react = true } },
  { run = ["display", "-p", "-t", "a", "#{pane_mode} #{window_zoomed_flag}"] },
  { run = ["display-panes", "-Z", "-d", "0", "-t", "%2"] },
  { settle = { react = true } },
  { screen = {} },
  { keys = "q" },
  { settle = { react = true } },
  { run = ["display", "-p", "-t", "a", "#{pane_mode} #{window_zoomed_flag}"] },
]
