name = "focus_hook_move_window_attached_kill"
# focus_hook_move_window_attached with move-window -k onto b's current
# window, which is linked into a as well: the hook's stale state falls
# back to the best client's current pane, the moved %0 at b:0.
size = [80, 24]
steps = [
  { run = ["new", "-d", "-s", "a", "-n", "w0", "-x", "80", "-y", "24", "sh", "-c", "stty echo echoctl; printf '\\033[?1004h'; tmux wait-for -S p0; exec cat -"] },
  { wait_for = "p0" },
  { run = ["new", "-d", "-s", "b", "-n", "w2", "sh", "-c", "stty echo echoctl; printf '\\033[?1004h'; tmux wait-for -S p1; exec cat -"] },
  { wait_for = "p1" },
  { run = ["linkw", "-d", "-s", "b:0", "-t", "a:1"] },
  { run = ["set", "-g", "status-right", "x"] },
  { run = ["set", "-g", "focus-events", "on"] },
  { run = ["set", "-g", "@log", ""] },
  { attach = { session = "b" } },
  { attach = { session = "a", id = "ca" } },
  { run = ["detach-client", "-s", "a"] },
  { settle = {} },
  { run = ["set-hook", "-t", "a", "pane-focus-in", "set -p @m yes; set -agF @log '|#{hook}:#{session_name}:#{window_index}.#{pane_id}/#{hook_pane}'"] },
  { run = ["move-window", "-k", "-s", "a:0", "-t", "b:0"] },
  { run = ["show", "-gv", "@log"] },
  { run = ["lsp", "-a", "-F", "#{session_name}:#{window_index}.#{pane_id}=#{@m}"] },
  { run = ["kill-server"] },
]
