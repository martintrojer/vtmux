# The mark, search matches and a TAB beside the line numbers: the mark's
# cell and the matches are columns of the text (window_copy_update_style
# takes grid columns), the selection screen columns; with line numbers on
# every redraw goes through the mode's screen (window_copy_redraw_lines,
# PANE_REDRAW).
name = "copy_line_numbers_marks"
size = [40, 10]
steps = [
  { run = ["new", "-d", "-s", "a", "-n", "w", "-x", "40", "-y", "9", "sh", "-c", "i=1; while [ $i -le 6 ]; do echo \"line$i foo bar foo\"; i=$((i+1)); done; printf 'abcdefghijklmnopqrstuvwxyz0123456\\tz\\n'; echo short; echo end; tmux wait-for -S ready; exec cat"] },
  { wait_for = "ready" },
  { run = ["select-pane", "-t", "%0", "-T", "t"] },
  { run = ["set", "-g", "status-right", ""] },
  { run = ["set", "-g", "copy-mode-position-format", "#[align=right][#{copy_position}/#{copy_position_limit}]#{?search_count, (#{search_count}),}"] },
  { run = ["set", "-g", "copy-mode-line-numbers", "relative"] },
  { attach = { session = "a" } },
  { run = ["copy-mode", "-t", "a"] },
  { settle = { react = true } },
  { run = ["display", "-p", "-t", "a", "[#{copy_line_numbers}] [#{copy_cursor_x},#{copy_cursor_y}]"] },
  { screen = {} },
  { run = ["send-keys", "-t", "a", "-X", "-N", "2", "cursor-up"] },
  { run = ["send-keys", "-t", "a", "-X", "end-of-line"] },
  { run = ["send-keys", "-t", "a", "-X", "set-mark"] },
  { run = ["send-keys", "-t", "a", "-X", "cursor-up"] },
  { settle = { react = true } },
  { screen = {} },
  { run = ["send-keys", "-t", "a", "-X", "search-backward", "foo"] },
  { settle = { react = true } },
  { run = ["display", "-p", "-t", "a", "[#{search_count}] [#{copy_cursor_x},#{copy_cursor_y}]"] },
  { screen = {} },
  { run = ["send-keys", "-t", "a", "-X", "begin-selection"] },
  { run = ["send-keys", "-t", "a", "-X", "-N", "2", "cursor-down"] },
  { settle = { react = true } },
  { screen = {} },
  { run = ["send-keys", "-t", "a", "-X", "copy-selection-and-cancel"] },
  { run = ["show-buffer"] },
]
