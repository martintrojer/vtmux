# kill-server with attached, suspended and control clients (server.c server_send_exit): the clients are walked in order; a suspended client is lost at once and its %client-detached reaches the control clients after it in the list (k), and every other client is marked exiting first, so k does not hear the attached client before it leave.
name = "kill_server_control_notify"
size = [40, 6]
steps = [
  { run = ["new", "-d", "-s", "a", "-n", "w", "-x", "40", "-y", "5", "cat", "-"] },
  { run = ["set", "-g", "status-right", "R"] },
  { run = ["select-pane", "-t", "a", "-T", "p"] },
  { attach = { session = "a" } },
  { attach = { session = "a", id = "c2" } },
  { control = { argv = ["attach", "-t", "a"], id = "k" } },
  { keys_to = { id = "c2", keys = "\u0002\u001a" } },
  { settle = {} },
  { run = ["lsc", "-F", "#{client_flags}"] },
  { run = ["kill-server"] },
  { wait_screen = { has = ["[server exited]"] } },
  { screen = {} },
  { control_close = { id = "k" } },
]
