name = "alerts_flags"
steps = [
  { run = ["new", "-d", "-s", "a", "-n", "w", "-x", "80", "-y", "24", "cat"] },
  { run = ["neww", "-d", "-n", "x", "sh", "-c", "while read x; do printf x; done"] },
  { run = ["neww", "-d", "-n", "y", "sh", "-c", "while read x; do printf '\\007'; done"] },
  { run = ["set", "-g", "monitor-activity", "on"] },
  { run = ["send-keys", "-t", "a:1", "Enter"] },
  { run = ["send-keys", "-t", "a:2", "Enter"] },
  { run = ["send-keys", "-t", "a:0", "Enter"] },
  { settle = {} },
  { run = ["lsw", "-F", "#{window_index} [#{window_activity_flag}#{window_bell_flag}#{window_silence_flag}] #{window_flags} (#{session_alert}) (#{session_alerts}) #{session_activity_flag}#{session_bell_flag}#{session_silence_flag}"] },
  { run = ["display", "-p", "-t", "a:1", "[#{window_activity_flag}][#{window_bell_flag}][#{window_flags}][#{window_raw_flags}]"] },
  { run = ["next-window", "-a"] },
  { run = ["display", "-p", "#{window_index}"] },
  { run = ["lsw", "-F", "#{window_index} [#{window_activity_flag}#{window_bell_flag}#{window_silence_flag}] #{window_flags} (#{session_alert}) (#{session_alerts}) #{session_activity_flag}#{session_bell_flag}#{session_silence_flag}"] },
  { run = ["previous-window", "-a"] },
  { run = ["display", "-p", "#{window_index}"] },
  { run = ["kill-session", "-C"] },
  { run = ["lsw", "-F", "#{window_index} [#{window_activity_flag}#{window_bell_flag}#{window_silence_flag}] #{window_flags} (#{session_alert}) (#{session_alerts}) #{session_activity_flag}#{session_bell_flag}#{session_silence_flag}"] },
  { run = ["next-window", "-a"] },
  { run = ["set", "-g", "monitor-bell", "off"] },
  { run = ["send-keys", "-t", "a:2", "Enter"] },
  { settle = {} },
  { run = ["lsw", "-F", "#{window_index} [#{window_activity_flag}#{window_bell_flag}#{window_silence_flag}] #{window_flags} (#{session_alert}) (#{session_alerts}) #{session_activity_flag}#{session_bell_flag}#{session_silence_flag}"] },
]
