# choose-buffer `e` (window-buffer.c window_buffer_start_edit, window_buffer_edit_close_cb; spawn.c spawn_editor): the current buffer goes to `editor file`; once the editor exits 0 the file is the buffer's new data, less a newline the editor added to a buffer that did not end in one (a buffer that did keeps its own). The editor here signals `opened`, waits for `go`, then appends `-new` to the file. q sent to the pane while the editor runs ends the mode, and the edit is then dropped (spawn_cancel_editor). vtmux draws the editor in a popup, tmux in a modal floating pane (D-028), so no screen is taken while it runs: only the mode before and after.
name = "choose_buffer_edit"
size = [80, 24]
steps = [
  { run = ["new", "-d", "-s", "a", "-n", "w", "-x", "80", "-y", "23", "cat -"] },
  { run = ["set", "-g", "status-right", "R"] },
  { run = ["set", "-g", "automatic-rename", "off"] },
  { run = ["select-pane", "-t", "%0", "-T", "t0"] },
  { run = ["set", "-g", "editor", "sh -c 'tmux wait-for -S opened; tmux wait-for go; printf \"%s\\n\" \"$(cat \"$1\")-new\" >\"$1\"' x"] },
  { run = ["set-buffer", "-b", "nl", "has newline\n"] },
  { run = ["set-buffer", "-b", "plain", "no newline"] },
  { attach = { session = "a" } },
  { screen = {} },
  { run = ["choose-buffer", "-t", "a:0.0", "-O", "name", "-F", "#{buffer_name}=#{buffer_sample}"] },
  { settle = { react = true } },
  { screen = {} },
  { keys = "j" },
  { keys = "e" },
  { wait_for = "opened" },
  { run = ["wait-for", "-S", "go"] },
  { settle = { react = true } },
  { screen = {} },
  { run = ["show-buffer", "-b", "plain"] },
  { keys = "k" },
  { keys = "e" },
  { wait_for = "opened" },
  { run = ["wait-for", "-S", "go"] },
  { settle = { react = true } },
  { screen = {} },
  { run = ["show-buffer", "-b", "nl"] },
  { run = ["display", "-p", "-t", "a:0.0", "#{pane_in_mode}"] },
  { keys = "e" },
  { wait_for = "opened" },
  { run = ["send-keys", "-t", "a:0.0", "j"] },
  { run = ["send-keys", "-t", "a:0.0", "q"] },
  { run = ["display", "-p", "-t", "a:0.0", "#{pane_in_mode}"] },
  { run = ["wait-for", "-S", "go"] },
  { settle = { react = true } },
  { run = ["show-buffer", "-b", "nl"] },
  { run = ["list-buffers", "-F", "#{buffer_name}"] },
  { screen = {} },
]
