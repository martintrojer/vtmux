name = "status_msg_alerts"
size = [40, 6]
steps = [
  { run = ["new", "-d", "-s", "a", "-n", "w", "cat"] },
  { run = ["neww", "-d", "-t", "a", "-n", "x", "sh", "-c", "while read x; do printf '\\007'; done"] },
  { run = ["select-pane", "-t", "a:0", "-T", "t"] },
  { run = ["set", "-g", "status-right", "R"] },
  { run = ["set", "-g", "display-time", "1500"] },
  { run = ["setw", "-g", "monitor-activity", "on"] },
  { run = ["set", "-g", "visual-activity", "on"] },
  { attach = { session = "a" } },
  { screen = {} },
  { settle = { quiet_ms = 3500 } },
  { screen = {} },
  { run = ["setw", "-g", "monitor-activity", "off"] },
  { run = ["set", "-g", "visual-bell", "on"] },
  { run = ["send-keys", "-t", "a:1", "Enter"] },
  { settle = { react = true } },
  { screen = {} },
  { settle = { quiet_ms = 3500 } },
  { screen = {} },
  { run = ["set", "-g", "visual-bell", "both"] },
  { run = ["display-message", "-t", "a", "x"] },
  { run = ["send-keys", "-t", "a:1", "Enter"] },
  { settle = { react = true } },
  { screen = {} },
  { run = ["select-window", "-t", "a:1"] },
  { run = ["send-keys", "-t", "a:1", "Enter"] },
  { settle = { react = true } },
  { screen = {} },
]
