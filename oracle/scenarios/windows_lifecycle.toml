name = "windows_lifecycle"
steps = [
  { run = ["new", "-d", "-s", "a", "-n", "w0", "-x", "80", "-y", "24", "cat"] },
  { run = ["last"] },
  { run = ["last", "-a"] },
  { run = ["neww", "-d", "-n", "w1", "cat"] },
  { run = ["neww", "-n", "w2", "-P", "cat"] },
  { run = ["neww", "-d", "-n", "w3", "-P", "-F", "#{window_id} #{window_index}", "cat"] },
  { run = ["lsw"] },
  { run = ["lsw", "-a"] },
  { run = ["last"] },
  { run = ["lsw", "-F", "#{window_index} #{window_name} [#{window_flags}] #{window_active}#{window_last_flag}#{window_start_flag}#{window_end_flag} #{session_windows}"] },
  { run = ["next"] },
  { run = ["next"] },
  { run = ["prev"] },
  { run = ["display", "-p", "#{window_index}"] },
  { run = ["next", "-a"] },
  { run = ["prev", "-a"] },
  { run = ["selectw", "-T", "-t", ":w2"] },
  { run = ["display", "-p", "#{window_index}"] },
  { run = ["display", "-p", "-t", "{last}", "#{window_name}"] },
  { run = ["splitw", "-d", "-t", ":w1", "cat"] },
  { run = ["resizep", "-Z", "-t", ":w1"] },
  { run = ["lsw", "-F", "#{window_index} [#{window_flags}] #{window_zoomed_flag}"] },
  { run = ["neww", "-t", "1", "cat"] },
  { run = ["neww", "-d", "-t", "a:1.0", "cat"] },
  { run = ["neww", "-d", "-t", "a:9", "-n", "x", "cat"] },
  { run = ["neww", "-d", "-k", "-t", "a:9", "-n", "y", "cat"] },
  { run = ["neww", "-d", "-t", "a:+1", "-n", "z", "cat"] },
  { run = ["renamew", "-t", ":y", "y#{window_index}"] },
  { run = ["show", "-w", "-t", ":y9", "automatic-rename"] },
  { run = ["lsw", "-F", "#{window_index} #{window_id} #{window_name} [#{window_flags}]"] },
  { run = ["lsw", "-O", "name", "-r", "-F", "#{window_name}"] },
  { run = ["killw", "-f", "x"] },
  { run = ["killw"] },
  { run = ["killw", "-t", ":!"] },
  { run = ["lsw", "-F", "#{window_index} #{window_name} [#{window_flags}]"] },
  { run = ["set", "renumber-windows", "on"] },
  { run = ["set", "base-index", "1"] },
  { run = ["killw", "-t", ":w1"] },
  { run = ["lsw", "-F", "#{window_index} #{window_name} [#{window_flags}]"] },
  { run = ["neww", "-d", "-b", "-t", "1", "-n", "first", "cat"] },
  { run = ["neww", "-d", "-a", "-t", "1", "-n", "second", "cat"] },
  { run = ["lsw", "-F", "#{window_index} #{window_name} [#{window_flags}]"] },
  { run = ["killw", "-a", "-f", "#{==:#{window_name},second}"] },
  { run = ["lsw", "-F", "#{window_index} #{window_name} [#{window_flags}]"] },
  { run = ["killw", "-a"] },
  { run = ["lsw", "-F", "#{window_index} #{window_name} [#{window_flags}]"] },
]
