# Menu styles (menu.c menu_reapply_styles, screen_write_menu): the
# window's menu-style, menu-selected-style, menu-border-style and
# menu-border-lines, set as a config would, re-read at every draw; -s, -H
# and -S over their colours only; -b for the lines (each choice, padded
# and none still paint the box); a styled -T title; disabled items dim
# with no key; -C picks the starting item (wrapping past disabled ones,
# past separators, `-` for none); -O menus open like any other (keys
# never land on a disabled item). Errors: a bad -b, -C or a missing key.
# Names that expand empty are dropped, a leading `-` from a format
# disables.
# Items too wide for the client are trimmed with `>`. A window resize
# moves the menu back inside (menu_resize).
name = "menu_styles"
size = [40, 14]
steps = [
  { run = ["new", "-d", "-s", "a", "-n", "w", "-x", "40", "-y", "13", "cat"] },
  { run = ["set", "-g", "status-right", "R"] },
  { run = ["set", "-s", "escape-time", "0"] },
  { run = ["select-pane", "-t", "a", "-T", "p0"] },
  { run = ["setw", "-g", "menu-style", "fg=colour250,bg=colour235"] },
  { run = ["setw", "-g", "menu-selected-style", "fg=colour16,bg=colour220,bold"] },
  { attach = { session = "a" } },
  { settle = { quiet_ms = 500 } },
  { run = ["display-menu", "-T", "#[fg=red]Menu", "-x", "2", "-y", "8", "-C", "1", "Alpha item", "a", "", "-Beta item", "b", "", "", "", "", "Gamma item", "g", ""] },
  { settle = { react = true } },
  { screen = {} },
  { run = ["setw", "menu-border-style", "fg=colour45,bg=colour235"] },
  { run = ["setw", "menu-style", "fg=colour196,bg=colour22"] },
  { run = ["refresh-client"] },
  { settle = { react = true } },
  { screen = {} },
  { keys = "q" },
  { settle = {} },
  { run = ["setw", "-u", "menu-style"] },
  { run = ["setw", "-u", "menu-border-style"] },
  { run = ["display-menu", "-s", "fg=blue,bg=white,italics", "-H", "fg=white,bg=blue", "-S", "fg=green", "-C", "-", "-x", "2", "-y", "8", "One", "1", "", "Two", "2", ""] },
  { settle = { react = true } },
  { screen = {} },
  { keys = "\u001b[A" },
  { screen = {} },
  { keys = "q" },
  { settle = {} },
  { run = ["display-menu", "-b", "double", "-x", "0", "-y", "6", "-C", "9", "One", "1", "", "", "", "", "Two", "2", ""] },
  { settle = { react = true } },
  { screen = {} },
  { run = ["display-menu", "-b", "heavy", "-x", "14", "-y", "6", "One", "1", "", "", "", "", "Two", "2", ""] },
  { settle = { react = true } },
  { screen = {} },
  { run = ["display-menu", "-b", "rounded", "-x", "28", "-y", "6", "One", "1", "", "", "", "", "Two", "2", ""] },
  { settle = { react = true } },
  { screen = {} },
  { run = ["display-menu", "-b", "simple", "-x", "0", "-y", "12", "One", "1", "", "", "", "", "Two", "2", ""] },
  { settle = { react = true } },
  { screen = {} },
  { run = ["display-menu", "-b", "padded", "-x", "14", "-y", "12", "One", "1", "", "", "", "", "Two", "2", ""] },
  { settle = { react = true } },
  { screen = {} },
  { run = ["display-menu", "-b", "none", "-T", "Title", "-x", "28", "-y", "12", "One", "1", "", "", "", "", "Two", "2", ""] },
  { settle = { react = true } },
  { screen = {} },
  { run = ["display-menu", "-b", "bogus", "One", "1", ""] },
  { run = ["setw", "menu-border-lines", "heavy"] },
  { run = ["display-menu", "-x", "2", "-y", "8", "One", "1", ""] },
  { settle = { react = true } },
  { screen = {} },
  { run = ["setw", "-u", "menu-border-lines"] },
  { run = ["display-menu", "-O", "-x", "2", "-y", "8", "-C", "0", "One", "1", "set -g @c one", "-Off", "o", "", "Two", "2", "set -g @c two"] },
  { settle = { react = true } },
  { keys = "\u001b[B" },
  { screen = {} },
  { run = ["display-menu", "-O", "-x", "2", "-y", "8", "-C", "1", "One", "1", "set -g @c one", "", "", "", "Two", "2", "set -g @c two"] },
  { settle = { react = true } },
  { screen = {} },
  { run = ["display-menu", "-x", "2", "-y", "8", "This item is much wider than the window, much wider", "t", "", "Short", "s", ""] },
  { settle = { react = true } },
  { screen = {} },
  { keys = "q" },
  { settle = {} },
  { run = ["set", "-g", "window-size", "manual"] },
  { run = ["display-menu", "-x", "30", "-y", "12", "One", "1", "", "Two", "2", ""] },
  { settle = { react = true } },
  { screen = {} },
  { run = ["resize-window", "-t", "a", "-x", "20", "-y", "6"] },
  { settle = { react = true } },
  { screen = {} },
  { run = ["display-menu", "-C", "x", "One", "1", ""] },
  { run = ["display-menu", "One", "1"] },
  { run = ["display-menu", "-T", "#{=3:session_name}x", "-x", "0", "-y", "3", "#{?#{==:1,1},,-}Yes", "y", "", "#{?#{==:1,0},No,}", "n", ""] },
  { settle = { react = true } },
  { screen = {} },
]
