name = "screen_two_pane_status_spaces"
size = [40, 10]
steps = [
  { run = ["new", "-d", "-s", "a", "-n", "w", "-x", "40", "-y", "9", "cat"] },
  { run = ["splitw", "-v", "-t", "%0", "cat"] },
  { run = ["select-pane", "-t", "%0", "-T", "t"] },
  { run = ["select-pane", "-t", "%1", "-T", "t"] },
  { attach = { session = "a" } },
  { screen = {} },
  { run = ["set", "-w", "-t", "a", "pane-border-indicators", "both"] },
  { run = ["selectp", "-t", "%0"] },
  { settle = { react = true } },
  { screen = {} },
  { run = ["set", "-w", "-t", "a", "pane-border-status", "top"] },
  { settle = { react = true } },
  { screen = {} },
  { run = ["set", "-w", "-t", "a", "pane-border-status", "bottom"] },
  { run = ["selectp", "-t", "%1"] },
  { settle = { react = true } },
  { screen = {} },
  { run = ["set", "-w", "-t", "a", "pane-border-lines", "spaces"] },
  { settle = { react = true } },
  { screen = {} },
  { run = ["set", "-w", "-t", "a", "pane-border-status", "off"] },
  { run = ["set", "-w", "-t", "a", "pane-border-lines", "simple"] },
  { run = ["splitw", "-h", "-f", "-b", "-t", "%0", "cat"] },
  { run = ["select-pane", "-t", "%2", "-T", "t"] },
  { settle = { react = true } },
  { screen = {} },
  { run = ["killp", "-t", "%1"] },
  { settle = { react = true } },
  { screen = {} },
  { run = ["killp", "-t", "%2"] },
  { settle = { react = true } },
  { screen = {} },
]
