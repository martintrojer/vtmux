name = "copy_clone"
size = [40, 10]
steps = [
  { run = ["new", "-d", "-s", "z", "cat"] },
  { run = ["set", "-g", "history-limit", "30"] },
  { run = ["set", "-g", "copy-mode-position-format", "#[align=right][#{copy_position}/#{copy_position_limit}]"] },
  { run = ["set", "-g", "automatic-rename-format", "#{?pane_in_mode,[tmux],plain}"] },
  { run = ["new", "-d", "-s", "a", "-x", "40", "-y", "9", "sh", "-c", "i=1; while [ $i -le 60 ]; do echo line$i; i=$((i+1)); done; printf 'x%.0s' $(seq 1 39); printf '世界\\n'; printf '%038d世\\n' 0; tmux wait-for -S ready; tmux wait-for go; seq 1 3000 | sed 's/^/more/'; tmux wait-for -S done; exec cat"] },
  { wait_for = "ready" },
  { run = ["select-pane", "-t", "%1", "-T", "t"] },
  { attach = { session = "a" } },
  { settle = { quiet_ms = 1500 } },
  { run = ["display", "-p", "-t", "a", "#{window_name}"] },
  { run = ["copy-mode", "-t", "a"] },
  { settle = { quiet_ms = 1500 } },
  { run = ["display", "-p", "-t", "a", "#{window_name}"] },
  { screen = {} },
  { run = ["send-keys", "-t", "a", "-X", "cursor-up"] },
  { settle = { react = true } },
  { screen = {} },
  { run = ["send-keys", "-t", "a", "-X", "cursor-up"] },
  { settle = { react = true } },
  { screen = {} },
  { run = ["send-keys", "-t", "a", "-X", "history-top"] },
  { run = ["display", "-p", "-t", "a", "[#{scroll_position}] [#{copy_cursor_x},#{copy_cursor_y}] [#{copy_position}/#{copy_position_limit}] [#{copy_cursor_line}] [#{e|>:#{top_line_time},0}]"] },
  { run = ["wait-for", "-S", "go"] },
  { wait_for = "done" },
  { run = ["display", "-p", "-t", "a", "[#{scroll_position}] [#{copy_cursor_x},#{copy_cursor_y}] [#{copy_position}/#{copy_position_limit}] [#{copy_cursor_line}] [#{copy_cursor_word}]"] },
  { run = ["send-keys", "-t", "a", "-X", "page-down"] },
  { settle = { react = true } },
  { run = ["display", "-p", "-t", "a", "[#{scroll_position}] [#{copy_cursor_x},#{copy_cursor_y}] [#{copy_position}/#{copy_position_limit}] [#{copy_cursor_line}]"] },
  { screen = {} },
  { run = ["send-keys", "-t", "a", "-X", "cancel"] },
  { settle = { quiet_ms = 1500 } },
  { run = ["display", "-p", "-t", "a", "#{window_name}"] },
  { run = ["splitw", "-d", "-t", "a", "-l", "4", "cat"] },
  { run = ["copy-mode", "-s", "%1", "-t", "%2"] },
  { run = ["send-keys", "-t", "%2", "-X", "history-top"] },
  { run = ["display", "-p", "-t", "%2", "[#{e|>:#{top_line_time},0}] [#{copy_position}/#{copy_position_limit}] [#{copy_cursor_line}]"] },
]
