# The wheel during a mouse drag in copy mode (window-copy.c
# window_copy_cmd_scroll_up, window_copy_cmd_scroll_down): with a selection
# and no drag the wheel only scrolls the view, the selection keeps its text;
# while the client's button is held (mouse_drag_flag) the cursor moves and
# the dragged end follows it. Emacs then vi keys, wheel up then down.
name = "copy_wheel_drag"
size = [40, 12]
steps = [
  { run = ["new", "-d", "-s", "a", "-n", "w", "-x", "40", "-y", "11", "sh", "-c", "i=1; while [ $i -le 40 ]; do echo \"word$i foo.bar baz-q x\"; i=$((i+1)); done; tmux wait-for -S ready; exec cat -"] },
  { wait_for = "ready" },
  { run = ["select-pane", "-t", "%0", "-T", "t"] },
  { run = ["set", "-g", "status-right", "R", ";", "set", "-g", "mouse", "on", ";", "set", "-g", "set-clipboard", "off", ";", "set", "-g", "copy-mode-position-format", "#[align=right][#{copy_position}/#{copy_position_limit}]"] },
  { attach = { session = "a" } },
  { keys = "\u001b[<64;5;5M\u001b[<64;5;5M" },
  { screen = {} },
  { keys = "\u001b[<0;3;4M\u001b[<32;6;4M\u001b[<32;12;6M" },
  { screen = {} },
  { keys = "\u001b[<64;12;6M" },
  { screen = {} },
  { run = ["display", "-p", "-t", "a", "#{scroll_position} #{copy_cursor_x},#{copy_cursor_y} #{selection_start_x},#{selection_start_y} #{selection_end_x},#{selection_end_y}"] },
  { keys = "\u001b[<65;12;6M\u001b[<65;12;6M" },
  { screen = {} },
  { run = ["display", "-p", "-t", "a", "#{scroll_position} #{copy_cursor_x},#{copy_cursor_y} #{selection_start_x},#{selection_start_y} #{selection_end_x},#{selection_end_y}"] },
  { keys = "\u001b[<0;12;6m" },
  { screen = {} },
  { run = ["show-buffer"] },
  { run = ["setw", "-g", "mode-keys", "vi"] },
  { keys = "\u001b[<64;5;5M\u001b[<64;5;5M" },
  { keys = "\u001b[<0;3;4M\u001b[<32;6;4M\u001b[<32;12;6M" },
  { keys = "\u001b[<64;12;6M" },
  { screen = {} },
  { run = ["display", "-p", "-t", "a", "#{scroll_position} #{copy_cursor_x},#{copy_cursor_y} #{selection_start_x},#{selection_start_y} #{selection_end_x},#{selection_end_y}"] },
  { keys = "\u001b[<0;12;6m" },
  { screen = {} },
  { run = ["show-buffer"] },
  { run = ["display", "-p", "-t", "a", "#{pane_in_mode}"] },
  { run = ["copy-mode", "-t", "a"] },
  { run = ["send-keys", "-t", "a", "-X", "-N", "8", "cursor-up"] },
  { run = ["send-keys", "-t", "a", "-X", "begin-selection"] },
  { run = ["send-keys", "-t", "a", "-X", "cursor-down"] },
  { keys = "\u001b[<64;12;6M" },
  { screen = {} },
  { run = ["display", "-p", "-t", "a", "#{scroll_position} #{copy_cursor_x},#{copy_cursor_y} #{selection_start_x},#{selection_start_y} #{selection_end_x},#{selection_end_y}"] },
]
