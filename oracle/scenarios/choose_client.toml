# choose-client with one and two attached clients (the second attached through the runner's attach id): -O creation, -F, the preview of each client's pane and status line (the client is 40 wide, too narrow for the box title, which shows the tty name), O and r, -f, -Z, -N, d detaching the selected client, Enter (detach-client -t) detaching the chosen one, the mode ending with the last client, and no mode with no clients. The selection style is pinned: the selected row is filled to the edge after the tty name, whose length varies.
name = "choose_client"
size = [40, 24]
steps = [
  { run = ["new", "-d", "-s", "aaa", "-n", "w0", "-x", "40", "-y", "23", "exec cat"] },
  { run = ["new", "-d", "-s", "bbb", "-n", "x0", "-x", "40", "-y", "23", "exec cat"] },
  { run = ["set", "-g", "status-right", "R"] },
  { run = ["set", "-g", "tree-mode-selection-style", "bold"] },
  { run = ["splitw", "-d", "-t", "aaa:0", "exec cat"] },
  { run = ["select-pane", "-t", "%0", "-T", "t0"] },
  { run = ["select-pane", "-t", "%1", "-T", "t1"] },
  { run = ["select-pane", "-t", "%2", "-T", "t2"] },
  { attach = { session = "aaa" } },
  { screen = {} },
  { run = ["choose-client", "-t", "aaa:0.0", "-O", "creation", "-F", "#{client_session}/#{client_width}"] },
  { settle = { react = true } },
  { screen = {} },
  { keys = "q" },
  { settle = { react = true } },
  { feed = { pane = "%1", bytes = "x0 text" } },
  { attach = { session = "bbb", id = "b" } },
  { screen = { id = "b" } },
  { run = ["choose-client", "-Z", "-t", "aaa:0.0", "-O", "creation", "-F", "#{client_session}"] },
  { settle = { react = true } },
  { run = ["display", "-p", "#{window_zoomed_flag}"] },
  { screen = {} },
  { keys = "j" },
  { screen = {} },
  { keys = "r" },
  { screen = {} },
  { keys = "O" },
  { screen = {} },
  { keys = "v" },
  { screen = {} },
  { keys = "q" },
  { settle = { react = true } },
  { run = ["display", "-p", "#{window_zoomed_flag}"] },
  { run = ["choose-client", "-N", "-O", "creation", "-t", "aaa:0.0", "-F", "[#{client_session}]", "-f", "#{==:#{client_session},bbb}"] },
  { settle = { react = true } },
  { screen = {} },
  { keys = "q" },
  { settle = { react = true } },
  { run = ["choose-client", "-N", "-O", "creation", "-t", "aaa:0.0", "-F", "[#{client_session}]", "-f", "#{==:#{client_session},none}"] },
  { settle = { react = true } },
  { screen = {} },
  { keys = "q" },
  { settle = { react = true } },
  { run = ["choose-client", "-t", "aaa:0.0", "-O", "creation", "-F", "#{client_session}"] },
  { settle = { react = true } },
  { keys = "jd" },
  { screen = {} },
  { screen = { id = "b" } },
  { run = ["list-clients", "-F", "#{client_session}"] },
  { run = ["display", "-p", "-t", "aaa:0.0", "#{pane_in_mode}"] },
  { keys = "\r" },
  { screen = {} },
  { run = ["list-clients", "-F", "#{client_session}"] },
  { run = ["display", "-p", "-t", "aaa:0.0", "#{pane_in_mode}"] },
  { run = ["choose-client", "-t", "aaa:0.0"] },
  { run = ["display", "-p", "-t", "aaa:0.0", "#{pane_in_mode}"] },
]
