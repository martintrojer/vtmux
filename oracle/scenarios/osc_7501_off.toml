# D34 off (spec, *Protocol extensions (D28)*): with `vtmux-program-status` at
# its default, OSC 7501 is an OSC tmux 3.8 does not know (input.c
# `input_exit_osc` ignores it). The pane title is pinned first. The
# program then sends a query and a report, then DSR 5, and prints what it
# reads back through `cat -v`: only the 4 bytes of the DSR's answer, where an
# answer to the query would come first. The `pane_program_*` formats are
# checked while the report is the last record sent, then a clear and a second
# DSR follow and the formats and title are checked again. The screen shows the
# text around the sequences as it was.
name = "osc_7501_off"
size = [60, 6]
steps = [
  { run = ["set", "-g", "status-right", "", ";", "new", "-d", "-s", "a", "-n", "w", "-x", "60", "-y", "5", "sh", "-c", "stty raw -echo opost onlcr; tmux wait-for go; printf 'a\\033]7501;?\\033\\\\b\\033]7501;id=x:state=working:kind=build:progress=50:app=app:title=T:message=M\\007c\\033[5n'; dd bs=1 count=4 2>/dev/null | LC_ALL=C cat -v; printf '|'; tmux wait-for -S rdy; tmux wait-for clr; printf 'd\\033]7501;id=x:state=clear\\033\\\\e\\033[5n'; dd bs=1 count=4 2>/dev/null | LC_ALL=C cat -v; printf '|'; tmux wait-for -S done; exec cat"] },
  { run = ["select-pane", "-t", "%0", "-T", "t"] },
  { run = ["wait-for", "-S", "go"] },
  { wait_for = "rdy" },
  { run = ["display", "-p", "-t", "%0", "[#{pane_program_state}][#{pane_program_kind}][#{pane_program_progress}][#{pane_program_app}][#{pane_program_title}][#{pane_program_message}][#{pane_title}]"] },
  { run = ["wait-for", "-S", "clr"] },
  { wait_for = "done" },
  { run = ["display", "-p", "-t", "%0", "[#{pane_program_state}][#{pane_program_kind}][#{pane_program_progress}][#{pane_program_app}][#{pane_program_title}][#{pane_program_message}][#{pane_title}]"] },
  { run = ["set", "-s", "-q", "vtmux-pane-program-status", "display -p x"] },
  { attach = { session = "a" } },
  { screen = {} },
  { run = ["capture-pane", "-p", "-t", "a"] },
]
