name = "upgrade_step"
size = [40, 8]
# The `upgrade` step (live-upgrade spec, *Tests*): vtmux moves onto its own
# binary in place (the frozen `UpgradeRequest`, as `vtmux-upgrade -b`
# asks), the reference tmux skips it, and everything observed after it is
# what tmux shows with no upgrade at all: the attached client's screen
# (pane history, a wrapped styled line, a status-line message, copy mode),
# the pane's formats and the control client's whole stream (no notification
# from the re-attach, %output once each).
steps = [
  { run = ["new", "-d", "-s", "a", "-n", "w", "-x", "40", "-y", "7", "sh", "-c", "i=1; while [ $i -le 30 ]; do echo line$i; i=$((i+1)); done; printf '\\033[1;31mred\\033[m and a line longer than forty columns'; tmux wait-for -S ready; exec cat"] },
  { wait_for = "ready" },
  { run = ["select-pane", "-t", "%0", "-T", "t"] },
  { run = ["set", "-g", "status-right", "R"] },
  { run = ["set", "-g", "copy-mode-position-format", "#[align=right][#{copy_position}/#{copy_position_limit}]"] },
  { control = { argv = ["attach", "-t", "a"], id = "c1" } },
  { attach = { session = "a" } },
  { screen = {} },
  { upgrade = {} },
  { screen = {} },
  { run = ["display", "-p", "-t", "%0", "#{history_size} #{cursor_x},#{cursor_y} #{pane_title} #{window_name} #{session_attached}"] },
  { run = ["capture-pane", "-p", "-e", "-S", "-4", "-t", "%0"] },
  { keys = "typed\r" },
  { screen = {} },
  { upgrade = {} },
  { screen = {} },
  { run = ["copy-mode", "-t", "%0"] },
  { run = ["send-keys", "-t", "%0", "-X", "page-up"] },
  { settle = { react = true } },
  { upgrade = {} },
  { screen = {} },
  { run = ["display", "-p", "-t", "%0", "#{pane_mode} #{scroll_position} #{copy_cursor_x},#{copy_cursor_y}"] },
  { run = ["send-keys", "-t", "%0", "-X", "cancel"] },
  { run = ["set", "-g", "message-style", "bg=blue,width=10"] },
  { run = ["display-message", "-d", "0", "-t", "a", "msg"] },
  { settle = { react = true } },
  { upgrade = {} },
  { screen = {} },
  { control_send = { id = "c1", line = "display -p hello" } },
  { control_wait = { id = "c1", until = "%end" } },
  { control_close = { id = "c1" } },
]
