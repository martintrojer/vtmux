name = "panes_mode_copy_over_stack"
size = [60, 20]
steps = [
  { run = ["new", "-d", "-s", "a", "-n", "w", "-x", "60", "-y", "19", "cat"] },
  { run = ["set", "-g", "status-right", ""] },
  { run = ["splitw", "-h", "-t", "a", "cat"] },
  { attach = { session = "a" } },
  { run = ["set", "-g", "@log", ""] },
  { run = ["set-hook", "-g", "pane-mode-changed", "set -ag @log '[#{pane_id}:#{pane_mode}]'"] },
  { run = ["copy-mode", "-t", "%0"] },
  { settle = { react = true } },
  { run = ["display-panes", "-d", "0", "-t", "%0"] },
  { settle = { react = true } },
  { screen = {} },
  { run = ["display", "-p", "-t", "a", "#{pane_id} #{pane_mode} #{window_zoomed_flag} #{pane_in_mode}"] },
  { run = ["send-keys", "-t", "%0", "-X", "cancel"] },
  { keys = "q" },
  { settle = { react = true } },
  { run = ["display", "-p", "-t", "a", "#{pane_id} #{pane_mode} #{window_zoomed_flag} #{pane_in_mode}"] },
  { run = ["display-panes", "-d", "0", "-t", "%0"] },
  { settle = { react = true } },
  { run = ["copy-mode", "-t", "%0"] },
  { settle = { react = true } },
  { run = ["display", "-p", "-t", "a", "#{pane_id} #{pane_mode} #{window_zoomed_flag} #{pane_in_mode}"] },
  { screen = {} },
  { keys = "q" },
  { settle = { react = true } },
  { run = ["display", "-p", "-t", "a", "#{pane_id} #{pane_mode} #{window_zoomed_flag} #{pane_in_mode}"] },
  { run = ["display-panes", "-d", "0", "-t", "%0"] },
  { settle = { react = true } },
  { run = ["clock-mode", "-t", "%0"] },
  { settle = { react = true } },
  { run = ["display", "-p", "-t", "a", "#{pane_id} #{pane_mode} #{window_zoomed_flag} #{pane_in_mode}"] },
  { screen = {} },
  { keys = "x" },
  { settle = { react = true } },
  { run = ["display", "-p", "-t", "a", "#{pane_id} #{pane_mode} #{window_zoomed_flag} #{pane_in_mode}"] },
  { run = ["display-panes", "-d", "0", "-t", "%0"] },
  { settle = { react = true } },
  { run = ["display-panes", "-d", "0", "-t", "%0"] },
  { run = ["display-panes", "-d", "0", "-t", "%1"] },
  { settle = { react = true } },
  { run = ["display", "-p", "-t", "%1", "#{pane_id} #{pane_mode} #{window_zoomed_flag} #{pane_in_mode}"] },
  { screen = {} },
  { run = ["copy-mode", "-t", "%0"] },
  { settle = { react = true } },
  { run = ["show", "-gv", "@log"] },
  { run = ["send-keys", "-t", "%0", "-X", "cancel"] },
  { run = ["send-keys", "-t", "%0", "x"] },
  { settle = { react = true } },
  { run = ["display", "-p", "-t", "a", "#{pane_id} #{pane_mode} #{window_zoomed_flag} #{pane_in_mode}"] },
  { keys = "q" },
  { settle = { react = true } },
  { run = ["show", "-gv", "@log"] },
  { run = ["display", "-p", "-t", "a", "#{pane_id} #{pane_mode} #{window_zoomed_flag} #{pane_in_mode}"] },
  { run = ["display", "-p", "-t", "%1", "#{pane_id} #{pane_mode} #{window_zoomed_flag} #{pane_in_mode}"] },
]
