# choose-tree prompts on the mode screen (mode_tree_set_prompt), in message-style. 80 columns: at 60 tmux 3.8's tty output drops the styled trailing space of a 15-column label ("Kill window 0? "), whatever the prompt: C-s search with n and N, the f filter prompt prefilled when opened again and c clearing it, x refused with n and accepted with y, X for tagged items (not the mode's own pane: killing it from X crashes tmux 3.8), -y accepting at once, : running a command for each tagged item.
name = "tree_prompts"
size = [80, 16]
steps = [
  { run = ["new", "-d", "-s", "aaa", "-n", "w0", "-x", "60", "-y", "15", "cat"] },
  { run = ["set", "-g", "status-right", "R"] },
  { run = ["neww", "-d", "-t", "aaa:1", "-n", "w1", "cat"] },
  { run = ["splitw", "-d", "-t", "aaa:1", "cat"] },
  { run = ["new", "-d", "-s", "bbb", "-n", "x0", "-x", "60", "-y", "15", "cat"] },
  { run = ["neww", "-d", "-t", "bbb:1", "-n", "x1", "cat"] },
  { run = ["new", "-d", "-s", "ccc", "-n", "y0", "-x", "60", "-y", "15", "cat"] },
  { run = ["select-pane", "-t", "%0", "-T", "t0"] },
  { run = ["select-pane", "-t", "%1", "-T", "t1"] },
  { run = ["select-pane", "-t", "%2", "-T", "t2"] },
  { run = ["select-pane", "-t", "%3", "-T", "t3"] },
  { run = ["select-pane", "-t", "%4", "-T", "t4"] },
  { run = ["select-pane", "-t", "%5", "-T", "t5"] },
  { run = ["set", "-g", "message-style", "bg=yellow,fg=black"] },
  { attach = { session = "aaa" } },
  { screen = {} },
  { run = ["choose-tree", "-t", "aaa:0.0", "-N"] },
  { settle = { react = true } },
  { keys = "\u0013" },
  { screen = {} },
  { keys = "x1" },
  { screen = {} },
  { keys = "\r" },
  { screen = {} },
  { keys = "n" },
  { screen = {} },
  { keys = "N" },
  { screen = {} },
  { keys = "f" },
  { screen = {} },
  { keys = "#{==:#{window_name},x1}\r" },
  { screen = {} },
  { keys = "f" },
  { screen = {} },
  { keys = "\u0007" },
  { keys = "c" },
  { screen = {} },
  { keys = "Gx" },
  { screen = {} },
  { keys = "n" },
  { screen = {} },
  { keys = "x" },
  { settle = {} },
  { keys = "y" },
  { screen = {} },
  { run = ["list-sessions", "-F", "#{session_name} #{session_windows}"] },
  { keys = "gjjjjtGt" },
  { keys = "X" },
  { screen = {} },
  { keys = "y" },
  { screen = {} },
  { run = ["list-windows", "-a", "-F", "#{session_name}:#{window_index} #{window_name}"] },
  { keys = "gjt" },
  { keys = ":" },
  { screen = {} },
  { keys = "rename-window -t '%%' r%%\r" },
  { screen = {} },
  { keys = "q" },
  { settle = { react = true } },
  { run = ["list-windows", "-a", "-F", "#{session_name}:#{window_index} #{window_name}"] },
  { run = ["choose-tree", "-t", "aaa:0.0", "-N", "-y"] },
  { settle = { react = true } },
  { keys = "Gx" },
  { screen = {} },
  { run = ["list-sessions", "-F", "#{session_name}"] },
]
