name = "border_style_cache"
size = [40, 10]
# window_pane_get_border_style (window-border.c:151-177): a pane's border
# style is expanded once and kept until a redraw that draws the borders or
# the status (CLIENT_REDRAWWINDOW, CLIENT_REDRAWBORDERS, CLIENT_REDRAWSTATUS;
# redraw_draw, screen-redraw.c:1726-1731). Pane output that moves the
# cursor redraws only the pane, so a style reading #{cursor_y} stays as it
# was; refresh-client, an option change (options_push_changes redraws every
# client), select-pane and a mode change (server_redraw_window_borders)
# expand it again.
steps = [
  { run = ["new", "-d", "-s", "a", "-n", "w", "-x", "40", "-y", "9", "cat", "-"] },
  { run = ["splitw", "-h", "-t", "a", "cat", "-"] },
  { run = ["select-pane", "-t", "%0", "-T", "t"] },
  { run = ["select-pane", "-t", "%1", "-T", "t"] },
  { run = ["set", "-g", "status-right", "x"] },
  { run = ["set", "-g", "status-interval", "0"] },
  { run = ["set", "-g", "pane-border-style", "fg=#{?#{@c},red,blue}"] },
  { run = ["set", "-g", "pane-active-border-style", "fg=#{?pane_in_mode,cyan,#{?#{e|>=:#{cursor_y},2},green,#{?#{@c},magenta,yellow}}}"] },
  { attach = { session = "a" } },
  { screen = {} },
  # The line and cat's copy of it: the cursor moves to row 2, the border
  # stays.
  { keys = "abc\r" },
  { settle = {} },
  { screen = {} },
  { run = ["refresh-client"] },
  { settle = { react = true } },
  { screen = {} },
  { run = ["set", "-g", "@c", "1"] },
  { settle = { react = true } },
  { screen = {} },
  { run = ["selectp", "-t", "%0"] },
  { settle = { react = true } },
  { screen = {} },
  { keys = "xyz\r" },
  { settle = {} },
  { screen = {} },
  { run = ["copy-mode", "-t", "%0"] },
  { settle = { react = true } },
  { screen = {} },
  { run = ["send", "-t", "%0", "-X", "cancel"] },
  { settle = { react = true } },
  { screen = {} },
  { run = ["selectp", "-t", "%1"] },
  { settle = { react = true } },
  { screen = {} },
]
