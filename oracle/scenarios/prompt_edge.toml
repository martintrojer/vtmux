# Prompt labels wider than the row (the cursor stays pending wrap past the
# last column, tty.c tty_cursor:2468), styled and wide labels, a template
# with `;` and %% twice, C-v quoting, emacs word keys and C-t at the
# edges, and message-format alignment around the prompt.
name = "prompt_edge"
size = [30, 6]
steps = [
  { run = ["new", "-d", "-s", "a", "-n", "w", "-x", "30", "-y", "5", "cat"] },
  { run = ["bind", "-n", "M-a", "command-prompt", "-p", "this is a very long prompt label that overflows", "set -g @a '%%'"] },
  { run = ["bind", "-n", "M-b", "command-prompt", "-p", "#[fg=red]red#[default] #{window_name}", "set -g @b '%%'"] },
  { run = ["bind", "-n", "M-c", "command-prompt", "-p", "c", "set -g @c '%%'", ";", "set", "-g", "@after", "%%"] },
  { run = ["bind", "-n", "M-d", "command-prompt", "-p", "日本語ラベル", "set -g @d '%%'"] },
  { attach = { session = "a" } },
  { settle = {} },
  { keys = "\u001ba" },
  { screen = {} },
  { keys = "xyz" },
  { screen = {} },
  { keys = "\r" },
  { settle = {} },
  { run = ["show", "-gv", "@a"] },
  { keys = "\u001bb" },
  { screen = {} },
  { keys = "v\r" },
  { settle = {} },
  { keys = "\u001bc" },
  { settle = {} },
  { run = ["show", "-gqv", "@after"] },
  { keys = "hi\r" },
  { settle = {} },
  { run = ["show", "-gqv", "@after"] },
  { run = ["show", "-gqv", "@c"] },
  { keys = "\u001bd" },
  { screen = {} },
  { keys = "語x" },
  { screen = {} },
  { keys = "\u0003" },
  { keys = "\u0002:" },
  { settle = {} },
  { keys = "\u0016\u0001\u0016\u001b" },
  { settle = { quiet_ms = 700 } },
  { screen = {} },
  { keys = "\u0016" },
  { screen = {} },
  { keys = "\u0002\u0002" },
  { screen = {} },
  { keys = "\u0016" },
  { screen = {} },
  { keys = "z" },
  { screen = {} },
  { keys = "\u0015a-b.c d" },
  { keys = "\u0017" },
  { screen = {} },
  { keys = "\u0017" },
  { screen = {} },
  { keys = "\u0017" },
  { screen = {} },
  { keys = "\u0001" },
  { settle = {} },
  { keys = "\u001bf" },
  { screen = {} },
  { keys = "\u001bf" },
  { screen = {} },
  { keys = "\u0014" },
  { screen = {} },
  { keys = "\u0001\u0014" },
  { screen = {} },
  { keys = "\u0006\u007f" },
  { screen = {} },
  { keys = "\u0005\u0014" },
  { screen = {} },
  { keys = "\u0003" },
  { run = ["set", "-g", "message-format", "#[align=right]#{message}"] },
  { keys = "\u0002:" },
  { screen = {} },
  { keys = "abc" },
  { screen = {} },
  { keys = "\u0003" },
  { run = ["set", "-g", "message-format", ">> #{message} <<"] },
  { keys = "\u0002:" },
  { screen = {} },
  { keys = "abcdefghijklmnopqrstuvwxyz0123456789" },
  { screen = {} },
  { keys = "\u0001" },
  { screen = {} },
  { keys = "\u0003" },
]
