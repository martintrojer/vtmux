name = "csi_zero_count"
size = [20, 6]
# A CSI whose count is an explicit 0 counts as 1 (input.c input_get with
# minval 1 for IL, DL, ICH, DCH, ECH, SU, SD, CUU..CUB, CNL, CPL, CHA, HPA,
# HPR, VPA, VPR, CBT, REP; CUP's too). Each case seeds six rows, moves the
# cursor, sends the sequence with a 0 count and dumps history size, cursor
# and grid (history included). IL and DL run with no scroll region and with
# the cursor in, above and below one (screen_write_insertline,
# screen_write_deleteline); the _one cases are the same with an explicit 1.
# The ed2_ cases are ED 2 under scroll-on-clear after a background colour
# touched the 24-row grid below its text: grid_view_clear_history scrolls
# only the lines with cells used (a partial erase leaves cellused as it
# was; ICH and DCH raise it to the cells they moved).
steps = [
  # il_plain
  { run = ["new", "-d", "-s", "il_plain", "-n", "w", "-x", "20", "-y", "6", "sh", "-c", "printf '\\033[2J\\033[HABCDEFGHIJKLMNOPQRS\\r\\nBCDEFGHIJKLMNOPQRST\\r\\nCDEFGHIJKLMNOPQRSTA\\r\\nDEFGHIJKLMNOPQRSTAB\\r\\nEFGHIJKLMNOPQRSTABC\\r\\nFGHIJKLMNOPQRSTABCD\\033[3;6H\\033[0L'; tmux wait-for -S zil_plain; exec cat"] },
  { wait_for = "zil_plain" },
  { run = ["display", "-p", "-t", "il_plain:", "#{history_size} #{cursor_x},#{cursor_y}", ";", "capture-pane", "-p", "-S", "-", "-t", "il_plain:"] },
