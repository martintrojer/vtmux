name = "alt_screen_cursor_slots"
size = [80, 24]
# tmux's screen switches (input.c, screen.c screen_alternate_on/off): every
# mode clears the alternate screen as it comes up and keeps the cursor; only
# ?1049h saves the cursor and pen, in a slot of its own (saved_cx, saved_cy,
# saved_cell: #{alternate_saved_x}, #{alternate_saved_y}, UINT_MAX before any),
# and ?1049l restores them even off the alternate screen or from an earlier
# one, never the charsets. ?1049h on an alternate screen already up saves
# nothing. DECSC's slot is the input context's, so both screens share it.
# Ghostty kept DECSC's slot per screen, used it for ?1049, and did not clear
# ?47's screen. RIS (screen_write_reset) keeps the slot; respawn-pane
# (screen_reinit) drops it.
steps = [
  { run = ["new", "-d", "-s", "init", "-n", "w", "-x", "80", "-y", "8", "cat", "-"] },
  { run = ["set", "-g", "status", "off"] },
  { run = ["new", "-d", "-s", "m49h47l", "-n", "w", "-x", "80", "-y", "10", "sh", "-c", "i=10; while [ $i -lt 40 ]; do printf '%sxxxxxxxxxx\\015\\012' $i; i=$((i+1)); done; printf '\\033[5;6H\\033[?1049h\\033[2;4Habc'; tmux wait-for -S m49h47l-p0; tmux wait-for m49h47l-go1; printf '\\033[?47l'; tmux wait-for -S m49h47l-p1; tmux wait-for m49h47l-go2; printf '\\033[8;2H\\033[?1049l'; tmux wait-for -S m49h47l-p2; exec cat -"] },
  { wait_for = "m49h47l-p0" },
  { run = ["display", "-p", "-t", "m49h47l:", "#{alternate_saved_x},#{alternate_saved_y} #{cursor_x},#{cursor_y} #{alternate_on}"] },
  { run = ["wait-for", "-S", "m49h47l-go1"] },
  { wait_for = "m49h47l-p1" },
  { run = ["display", "-p", "-t", "m49h47l:", "#{alternate_saved_x},#{alternate_saved_y} #{cursor_x},#{cursor_y} #{alternate_on}"] },
  { run = ["capture-pane", "-p", "-S", "-", "-t", "m49h47l:"] },
  { run = ["wait-for", "-S", "m49h47l-go2"] },
  { wait_for = "m49h47l-p2" },
  { run = ["display", "-p", "-t", "m49h47l:", "#{alternate_saved_x},#{alternate_saved_y} #{cursor_x},#{cursor_y} #{alternate_on}"] },
  { run = ["capture-pane", "-p", "-S", "-", "-t", "m49h47l:"] },
  { run = ["new", "-d", "-s", "m47h49l", "-n", "w", "-x", "80", "-y", "10", "sh", "-c", "i=10; while [ $i -lt 40 ]; do printf '%sxxxxxxxxxx\\015\\012' $i; i=$((i+1)); done; printf '\\033[5;6H\\033[?47h\\033[2;4Habc'; tmux wait-for -S m47h49l-p0; tmux wait-for m47h49l-go1; printf '\\033[?1049l'; tmux wait-for -S m47h49l-p1; exec cat -"] },
  { wait_for = "m47h49l-p0" },
  { run = ["display", "-p", "-t", "m47h49l:", "#{alternate_saved_x},#{alternate_saved_y} #{cursor_x},#{cursor_y} #{alternate_on}"] },
  { run = ["wait-for", "-S", "m47h49l-go1"] },
  { wait_for = "m47h49l-p1" },
  { run = ["display", "-p", "-t", "m47h49l:", "#{alternate_saved_x},#{alternate_saved_y} #{cursor_x},#{cursor_y} #{alternate_on}"] },
  { run = ["capture-pane", "-p", "-S", "-", "-t", "m47h49l:"] },
  { run = ["new", "-d", "-s", "m49twice", "-n", "w", "-x", "80", "-y", "10", "sh", "-c", "i=10; while [ $i -lt 40 ]; do printf '%sxxxxxxxxxx\\015\\012' $i; i=$((i+1)); done; printf '\\033[5;6H\\033[?1049h\\033[2;4Habc\\033[?1049l'; tmux wait-for -S m49twice-p0; tmux wait-for m49twice-go1; printf '\\033[7;2H\\033[?47h\\033[3;3Hx'; tmux wait-for -S m49twice-p1; tmux wait-for m49twice-go2; printf '\\033[?1049l'; tmux wait-for -S m49twice-p2; exec cat -"] },
  { wait_for = "m49twice-p0" },
  { run = ["display", "-p", "-t", "m49twice:", "#{alternate_saved_x},#{alternate_saved_y} #{cursor_x},#{cursor_y} #{alternate_on}"] },
  { run = ["wait-for", "-S", "m49twice-go1"] },
  { wait_for = "m49twice-p1" },
  { run = ["display", "-p", "-t", "m49twice:", "#{alternate_saved_x},#{alternate_saved_y} #{cursor_x},#{cursor_y} #{alternate_on}"] },
  { run = ["wait-for", "-S", "m49twice-go2"] },
  { wait_for = "m49twice-p2" },
  { run = ["display", "-p", "-t", "m49twice:", "#{alternate_saved_x},#{alternate_saved_y} #{cursor_x},#{cursor_y} #{alternate_on}"] },
  { run = ["capture-pane", "-p", "-S", "-", "-t", "m49twice:"] },
  { run = ["new", "-d", "-s", "twice", "-n", "w", "-x", "80", "-y", "10", "sh", "-c", "i=10; while [ $i -lt 40 ]; do printf '%sxxxxxxxxxx\\015\\012' $i; i=$((i+1)); done; printf '\\033[?47h\\033[3;3H\\033[?1049h\\033[5;5H'; tmux wait-for -S twice-p0; tmux wait-for twice-go1; printf '\\033[?1049l'; tmux wait-for -S twice-p1; exec cat -"] },
  { wait_for = "twice-p0" },
  { run = ["display", "-p", "-t", "twice:", "#{alternate_saved_x},#{alternate_saved_y} #{cursor_x},#{cursor_y} #{alternate_on}"] },
  { run = ["wait-for", "-S", "twice-go1"] },
  { wait_for = "twice-p1" },
  { run = ["display", "-p", "-t", "twice:", "#{alternate_saved_x},#{alternate_saved_y} #{cursor_x},#{cursor_y} #{alternate_on}"] },
  { run = ["new", "-d", "-s", "l49prim", "-n", "w", "-x", "80", "-y", "10", "sh", "-c", "i=10; while [ $i -lt 40 ]; do printf '%sxxxxxxxxxx\\015\\012' $i; i=$((i+1)); done; printf '\\033[5;5H\\033[?1049h\\033[?1049l\\033[2;2H\\0337\\033[1;1H\\033[?1049l'; tmux wait-for -S l49prim-p0; exec cat -"] },
  { wait_for = "l49prim-p0" },
  { run = ["display", "-p", "-t", "l49prim:", "#{alternate_saved_x},#{alternate_saved_y} #{cursor_x},#{cursor_y} #{alternate_on}"] },
  { run = ["new", "-d", "-s", "l49none", "-n", "w", "-x", "80", "-y", "10", "sh", "-c", "i=10; while [ $i -lt 40 ]; do printf '%sxxxxxxxxxx\\015\\012' $i; i=$((i+1)); done; printf '\\033[5;5H\\033[?1049l'; tmux wait-for -S l49none-p0; exec cat -"] },
  { wait_for = "l49none-p0" },
  { run = ["display", "-p", "-t", "l49none:", "#{alternate_saved_x},#{alternate_saved_y} #{cursor_x},#{cursor_y} #{alternate_on}"] },
  # DECSC and DECRC across the screens
  { run = ["new", "-d", "-s", "decsc", "-n", "w", "-x", "80", "-y", "10", "sh", "-c", "i=10; while [ $i -lt 40 ]; do printf '%sxxxxxxxxxx\\015\\012' $i; i=$((i+1)); done; printf '\\033[3;3H\\0337\\033[5;6H\\033[?1049h\\033[2;4Habc\\033[?1049l\\0338'; tmux wait-for -S decsc-p0; exec cat -"] },
  { wait_for = "decsc-p0" },
  { run = ["display", "-p", "-t", "decsc:", "#{alternate_saved_x},#{alternate_saved_y} #{cursor_x},#{cursor_y} #{alternate_on}"] },
  { run = ["capture-pane", "-p", "-S", "-", "-t", "decsc:"] },
  { run = ["new", "-d", "-s", "decscalt", "-n", "w", "-x", "80", "-y", "10", "sh", "-c", "i=10; while [ $i -lt 40 ]; do printf '%sxxxxxxxxxx\\015\\012' $i; i=$((i+1)); done; printf '\\033[3;3H\\0337\\033[?1049h\\033[6;6H\\0338'; tmux wait-for -S decscalt-p0; tmux wait-for decscalt-go1; printf '\\033[?1049l'; tmux wait-for -S decscalt-p1; exec cat -"] },
  { wait_for = "decscalt-p0" },
  { run = ["display", "-p", "-t", "decscalt:", "#{alternate_saved_x},#{alternate_saved_y} #{cursor_x},#{cursor_y} #{alternate_on}"] },
  { run = ["wait-for", "-S", "decscalt-go1"] },
  { wait_for = "decscalt-p1" },
  { run = ["display", "-p", "-t", "decscalt:", "#{alternate_saved_x},#{alternate_saved_y} #{cursor_x},#{cursor_y} #{alternate_on}"] },
  { run = ["new", "-d", "-s", "decscalt2", "-n", "w", "-x", "80", "-y", "10", "sh", "-c", "i=10; while [ $i -lt 40 ]; do printf '%sxxxxxxxxxx\\015\\012' $i; i=$((i+1)); done; printf '\\033[?1049h\\033[6;6H\\0337\\033[?1049l\\033[2;2H\\0338'; tmux wait-for -S decscalt2-p0; exec cat -"] },
  { wait_for = "decscalt2-p0" },
  { run = ["display", "-p", "-t", "decscalt2:", "#{alternate_saved_x},#{alternate_saved_y} #{cursor_x},#{cursor_y} #{alternate_on}"] },
  # each alternate screen comes up blank
  { run = ["new", "-d", "-s", "again47", "-n", "w", "-x", "80", "-y", "10", "sh", "-c", "i=10; while [ $i -lt 40 ]; do printf '%sxxxxxxxxxx\\015\\012' $i; i=$((i+1)); done; printf '\\033[?47habc\\033[?47l\\033[?47h'; tmux wait-for -S again47-p0; tmux wait-for again47-go1; printf '\\033[?47l'; tmux wait-for -S again47-p1; exec cat -"] },
  { wait_for = "again47-p0" },
  { run = ["display", "-p", "-t", "again47:", "#{alternate_saved_x},#{alternate_saved_y} #{cursor_x},#{cursor_y} #{alternate_on}"] },
  { run = ["capture-pane", "-p", "-S", "-", "-t", "again47:"] },
  { run = ["wait-for", "-S", "again47-go1"] },
  { wait_for = "again47-p1" },
  { run = ["display", "-p", "-t", "again47:", "#{alternate_saved_x},#{alternate_saved_y} #{cursor_x},#{cursor_y} #{alternate_on}"] },
  { run = ["new", "-d", "-s", "again1049", "-n", "w", "-x", "80", "-y", "10", "sh", "-c", "i=10; while [ $i -lt 40 ]; do printf '%sxxxxxxxxxx\\015\\012' $i; i=$((i+1)); done; printf '\\033[?1049habc\\033[?1049l\\033[?47h'; tmux wait-for -S again1049-p0; tmux wait-for again1049-go1; printf '\\033[?47l'; tmux wait-for -S again1049-p1; exec cat -"] },
  { wait_for = "again1049-p0" },
  { run = ["display", "-p", "-t", "again1049:", "#{alternate_saved_x},#{alternate_saved_y} #{cursor_x},#{cursor_y} #{alternate_on}"] },
  { run = ["capture-pane", "-p", "-S", "-", "-t", "again1049:"] },
  { run = ["wait-for", "-S", "again1049-go1"] },
  { wait_for = "again1049-p1" },
  { run = ["display", "-p", "-t", "again1049:", "#{alternate_saved_x},#{alternate_saved_y} #{cursor_x},#{cursor_y} #{alternate_on}"] },
  # the pen and the charsets
  { run = ["new", "-d", "-s", "pen", "-n", "w", "-x", "80", "-y", "10", "sh", "-c", "printf '\\033[H\\033[2J\\033[31m\\033[?1049h\\033[32m\\033[?1049lX\\033[m'; tmux wait-for -S pen-p0; exec cat -"] },
  { wait_for = "pen-p0" },
  { run = ["display", "-p", "-t", "pen:", "#{alternate_saved_x},#{alternate_saved_y} #{cursor_x},#{cursor_y} #{alternate_on}"] },
  { run = ["capture-pane", "-p", "-e", "-t", "pen:"] },
  { run = ["new", "-d", "-s", "acs", "-n", "w", "-x", "80", "-y", "10", "sh", "-c", "printf '\\033[H\\033[2J\\033(0\\033[?1049h\\033(B\\033[?1049lq'; tmux wait-for -S acs-p0; exec cat -"] },
  { wait_for = "acs-p0" },
  { run = ["display", "-p", "-t", "acs:", "#{alternate_saved_x},#{alternate_saved_y} #{cursor_x},#{cursor_y} #{alternate_on}"] },
  { run = ["capture-pane", "-p", "-S", "-", "-t", "acs:"] },
  { run = ["new", "-d", "-s", "pwrap", "-n", "w", "-x", "80", "-y", "10", "sh", "-c", "printf '\\033[H\\033[2Jyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyy\\033[?1049h'; tmux wait-for -S pwrap-p0; tmux wait-for pwrap-go1; printf '\\033[?1049lZ'; tmux wait-for -S pwrap-p1; exec cat -"] },
  { wait_for = "pwrap-p0" },
  { run = ["display", "-p", "-t", "pwrap:", "#{alternate_saved_x},#{alternate_saved_y} #{cursor_x},#{cursor_y} #{alternate_on}"] },
  { run = ["wait-for", "-S", "pwrap-go1"] },
  { wait_for = "pwrap-p1" },
  { run = ["display", "-p", "-t", "pwrap:", "#{alternate_saved_x},#{alternate_saved_y} #{cursor_x},#{cursor_y} #{alternate_on}"] },
  { run = ["capture-pane", "-p", "-S", "-", "-t", "pwrap:"] },
  { run = ["new", "-d", "-s", "ris", "-n", "w", "-x", "80", "-y", "10", "sh", "-c", "printf '\\033[3;7H\\033[?1049h\\033c'; tmux wait-for -S ris-p0; tmux wait-for ris-go1; printf '\\033[?1049l'; tmux wait-for -S ris-p1; tmux wait-for ris-go2; printf '\\033[?1049l'; tmux wait-for -S ris-p2; exec cat -"] },
  { wait_for = "ris-p0" },
  { run = ["display", "-p", "-t", "ris:", "#{alternate_saved_x},#{alternate_saved_y} #{cursor_x},#{cursor_y} #{alternate_on}"] },
  { run = ["wait-for", "-S", "ris-go1"] },
  { wait_for = "ris-p1" },
  { run = ["display", "-p", "-t", "ris:", "#{alternate_saved_x},#{alternate_saved_y} #{cursor_x},#{cursor_y} #{alternate_on}"] },
  { run = ["wait-for", "-S", "ris-go2"] },
  { wait_for = "ris-p2" },
  { run = ["display", "-p", "-t", "ris:", "#{alternate_saved_x},#{alternate_saved_y} #{cursor_x},#{cursor_y} #{alternate_on}"] },
]
