# customize-mode setting options: Enter on a number opens its prompt with the value and sets it; a bad value is the client's message, capitalised; Enter toggles a flag and steps a choice; u asks first (n keeps, y unsets); s on a global session option sets it in the session, S globally, d resets both; w sets a window value of a window and pane option, s then the pane's, u unsets the pane's; Enter on Session Options adds a user option (bad names refused), Enter on it sets it; Enter on Session Hooks adds a user hook (its preview); an array item's key renamed (a), set (Enter), the array's next item (Enter on the array) and an item unset; t tags two and U unsets them; -y with C (only changed) and D resetting the tagged.
name = "customize_set"
size = [80, 24]
steps = [
  { run = ["new", "-d", "-s", "aaa", "-n", "w0", "-x", "80", "-y", "23", "exec cat"] },
  { run = ["set", "-g", "status-right", "R"] },
  { run = ["set", "-g", "display-time", "0"] },
  { run = ["select-pane", "-t", "%0", "-T", "t0"] },
  { attach = { session = "aaa" } },
  { screen = {} },
  { run = ["customize-mode", "-t", "aaa:0.0", "-f", "#{||:#{==:#{option_name},buffer-limit},#{||:#{==:#{option_name},exit-empty},#{==:#{option_name},set-clipboard}}}"] },
