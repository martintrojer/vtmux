[workspace]
resolver = "3"
members = ["crates/vtmux-core","crates/vtmux-vt","crates/vtmux-server","crates/vtmux-client","crates/vtmux-snapshot","crates/vtmux","xtask"]
# Vendored libghostty-rs (see third_party/libghostty-rs/VENDOR.md): path
# dependencies, kept out of the workspace so its lints and fmt do not apply.
exclude = ["third_party"]

[workspace.package]
version = "3.8.0-rc.1"
edition = "2024"
rust-version = "1.99.1"
license = "ISC"
repository = "https://github.com/martintrojer/vtmux"
homepage = "https://github.com/martintrojer/vtmux"
authors = ["Martin Trojer <martin.trojer@gmail.com>"]

# Every crate but xtask is published (docs/RELEASING.md, scripts/publish.sh),
# so each path dependency also names the exact version it is published at:
# the crates are one program split up, with no API promised between them.
[workspace.dependencies]
vtmux-core = { path = "crates/vtmux-core", version = "=3.8.0-rc.1" }
vtmux-vt = { path = "crates/vtmux-vt", version = "=3.8.0-rc.1" }
vtmux-server = { path = "crates/vtmux-server", version = "=3.8.0-rc.1" }
vtmux-client = { path = "crates/vtmux-client", version = "=3.8.0-rc.1" }
vtmux-snapshot = { path = "crates/vtmux-snapshot", version = "=3.8.0-rc.1" }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"

# The shipped binary (docs/PERFORMANCE.md, *Binary and build profile*):
# whole-program LTO in one codegen unit is 9% smaller stripped and 7-18% less
# server CPU on render-bound work, for about 10 s more build. LTO covers the
# Rust crates only; libghostty-vt's Zig archive links as native code, still
# ReleaseFast (its build script reads DEBUG and OPT_LEVEL, which this leaves
# alone: debug info here would set DEBUG=true and build ghostty in Debug).
# panic stays unwind: a live upgrade's resume and its dry run catch a panic
# to switch back or refuse (server/resume.rs `guarded`), where abort would
# close every pane's PTY.
[profile.release]
lto = "fat"
codegen-units = 1
strip = true

# vtmux-ghostty-vt-sys (libghostty-vt-sys) builds ghostty in Zig Debug mode
# when DEBUG is set, and that parses ~5 KB/s: too slow for any PTY test that
# floods a pane. The override gives its build script DEBUG=false,
# OPT_LEVEL=3 -> ReleaseFast.
[profile.dev.package.vtmux-ghostty-vt-sys]
opt-level = 3
debug = false

# Snapshot tests hash and compress every damaged copy of a stream.
[profile.dev.package.blake3]
opt-level = 3

[profile.dev.package.lz4_flex]
opt-level = 3

# The backreference long-text test takes ~8 s in a debug build, ~1 s optimised.
[profile.dev.package.vtmux-core]
opt-level = 2

# The terminal-state round trips (vtmux-vt's state_roundtrip, vtmux-server's
# snapshot_term) capture and export every pane of the oracle corpus many
# times: 21 s and 27 s in a debug build, 7 s and 17 s at opt-level 1.
[profile.dev.package.vtmux-vt]
opt-level = 1
