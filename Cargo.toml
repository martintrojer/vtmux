[workspace]
resolver = "3"
members = ["crates/vtmux-core","crates/vtmux-vt","crates/vtmux-server","crates/vtmux-client","crates/vtmux","xtask"]
# Vendored libghostty-rs (see third_party/libghostty-rs/VENDOR.md): path
# dependencies, kept out of the workspace so its lints and fmt do not apply.
exclude = ["third_party"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99.1"
license = "ISC"
publish = false

[workspace.dependencies]
vtmux-core = { path = "crates/vtmux-core" }
vtmux-vt = { path = "crates/vtmux-vt" }
vtmux-server = { path = "crates/vtmux-server" }
vtmux-client = { path = "crates/vtmux-client" }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"

# libghostty-vt-sys builds ghostty in Zig Debug mode when DEBUG is set, and
# that parses ~5 KB/s: too slow for any PTY test that floods a pane. The
# override gives its build script DEBUG=false, OPT_LEVEL=3 -> ReleaseFast.
[profile.dev.package.libghostty-vt-sys]
opt-level = 3
debug = false

# The backreference long-text test takes ~8 s in a debug build, ~1 s optimised.
[profile.dev.package.vtmux-core]
opt-level = 2
