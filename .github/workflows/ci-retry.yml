name: ci-retry
# GitHub's macOS arm64 runners run out at busy times: a macOS job then waits
# ~15 min and ends `cancelled` with no runner and the annotation "The job was
# not acquired by Runner of type hosted even after multiple attempts" (main
# 3682ca7, runs 41854335963 to 41871887523; a manual rerun the next morning
# got a runner at once). Nothing on main cancels a main run otherwise (one
# concurrency group per commit), so such jobs are re-run, up to three times,
# each after the run completes again: all at once (`rerun-failed-jobs`) when
# no other job failed but the gates' results (`check`, `check-macos`, which
# fail because a stage did), else one at a time, so a real failure is never
# re-run. Re-running a job re-runs the jobs that need it (the gate's result).
# Re-runs made with GITHUB_TOKEN start no new workflow_run event, so this job
# waits for them itself.
# workflow_run fires only for this file as it is on the default branch. The
# `branches` filter matches the head branch name only, so a fork's `main`
# passes it too: the job runs only for runs of this repository's own
# commits. A manual re-run of a ci run completes it again and fires a second
# event for the same run; one concurrency group per run queues that instance
# behind the first instead of letting both re-run the same job.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
permissions:
  actions: write
  checks: read
concurrency:
  group: ci-retry-${{ github.event.workflow_run.id }}
  cancel-in-progress: false
jobs:
  rerun-unacquired:
    if: >-
      github.event.workflow_run.conclusion != 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Re-run jobs no runner picked up
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          for try in 1 2 3; do
            while [ "$(gh api "repos/$REPO/actions/runs/$RUN" --jq .status)" != completed ]; do
              sleep 60
            done
            attempt=$(gh api "repos/$REPO/actions/runs/$RUN" --jq .run_attempt)
            jobs="repos/$REPO/actions/runs/$RUN/attempts/$attempt/jobs?per_page=100"
            unacquired=""
            for id in $(gh api "$jobs" \
                --jq '.jobs[] | select(.conclusion == "cancelled" and (.runner_name // "") == "") | .id'); do
              if gh api "repos/$REPO/check-runs/$id/annotations" --jq '.[].message' |
                  grep -q 'not acquired by Runner'; then
                unacquired="$unacquired $id"
              fi
            done
            if [ -z "$unacquired" ]; then
              echo "attempt $attempt: no job left waiting for a runner"
              exit 0
            fi
            others=""
            for id in $(gh api "$jobs" \
                --jq '.jobs[] | select(.conclusion != "success" and .conclusion != "skipped" and .conclusion != "neutral" and .name != "check" and .name != "check-macos") | .id'); do
              case "$unacquired " in *" $id "*) ;; *) others="$others $id" ;; esac
            done
            if [ -z "$others" ]; then
              echo "attempt $attempt: jobs$unacquired got no runner; re-run $try of 3, all at once"
              gh api -X POST "repos/$REPO/actions/runs/$RUN/rerun-failed-jobs" >/dev/null
            else
              job=${unacquired# }
              job=${job%% *}
              echo "attempt $attempt: jobs$unacquired got no runner and jobs$others failed; re-run $try of 3 of job $job alone"
              gh api -X POST "repos/$REPO/actions/jobs/$job/rerun" >/dev/null
            fi
            sleep 30
          done
