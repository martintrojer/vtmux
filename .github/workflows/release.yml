name: release
# A tag `v<version>` builds the release tarballs and publishes them as a
# GitHub release (assets named by Rust target triple, as ramble's, so
# `mise use -g github:martintrojer/vtmux` installs it: mise's github backend
# scores the triple's libc, so a glibc host gets the gnu tarball and a musl
# one (Alpine) the musl tarball; `[matching=musl]` picks the static one on
# a glibc older than the gnu build's).
#
# To cut one (D25: the version is the tmux release it is tested against):
# set `version` in Cargo.toml (3.8.0-beta.1 displays as 3.8-beta1), add its
# `## 3.8-beta1` section to CHANGELOG.md and the release page's short text
# to docs/release-notes/3.8-beta1.md (without it the CHANGELOG section is the
# text), try `scripts/release-tarball.sh x86_64-unknown-linux-gnu v3.8-beta1`
# locally, then push the tag `v3.8-beta1`. The build
# fails when the tag is not `v` + what `vtmux -V` prints.
# crates.io is a separate step: docs/RELEASING.md.
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          # 22.04: the oldest glibc GitHub builds on (2.35), so the binary runs
          # on more distributions than one built on ubuntu-latest.
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
          # Static (musl, linked by `zig cc`): runs on any Linux of the CPU,
          # whatever its glibc (EL9's 2.34, Debian 11's 2.31) or none (Alpine).
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-22.04-arm
          # Zig 0.17 (the ghostty pin's) targets macOS 15+, as ci.yml's macOS job.
          - target: aarch64-apple-darwin
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          reference-tmux: "false"
          rust-cache: "false"
          targets: ${{ matrix.target }}
      # vtmux-ghostty-vt-sys's build script downloads the pinned libghostty-vt release,
      # applies the vendored patches and builds it with Zig (ReleaseFast,
      # baseline CPU).
      - name: Build and package
        id: package
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: |
          tarball=$(bash scripts/release-tarball.sh "$TARGET" "$TAG" | tail -1)
          echo "tarball=$tarball" >>"$GITHUB_OUTPUT"
          {
            echo "### $TARGET"
            echo '```'
            cat "$tarball.sha256"
            ls -l "$tarball"
            case $TARGET in
            *-linux-gnu) echo "needs glibc $(objdump -T target/release/vtmux | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)" ;;
            *-linux-musl) file "target/$TARGET/release/vtmux" ;;
            esac
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: vtmux-${{ matrix.target }}
          path: |
            ${{ steps.package.outputs.tarball }}
            ${{ steps.package.outputs.tarball }}.sha256
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version=${TAG#v}
          cd dist
          cat ./*.sha256 >SHA256SUMS
          sha256sum -c SHA256SUMS
          # The release notes: docs/release-notes/<version>.md (short, written
          # for the release page) when the release commit has one, else the
          # tag's CHANGELOG.md section.
          if [ -f "../docs/release-notes/$version.md" ]; then
            cp "../docs/release-notes/$version.md" notes.md
          else
            awk -v h="## $version" '$0 == h || index($0, h " ") == 1 { on = 1; next } on && /^## / { exit } on' \
              ../CHANGELOG.md >notes.md
          fi
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "no release notes for $version: docs/release-notes/$version.md or a CHANGELOG.md section" >&2
            exit 1
          fi
          # Not a draft and not a prerelease: mise's github backend installs
          # the latest published release.
          gh release create "$TAG" --verify-tag \
            --title "vtmux $version" --notes-file notes.md \
            ./*.tar.gz SHA256SUMS
