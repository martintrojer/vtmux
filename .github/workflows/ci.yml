name: ci
on:
  push:
    # m1 always points at a commit main already has: don't build it twice.
    branches-ignore: [m1]
  pull_request:
# A newer push to a worker branch supersedes its running check; every
# push to main is checked to the end.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  check:
    strategy:
      matrix:
        # macos-15: Zig 0.17 (needed by the ghostty pin in third_party/libghostty-rs)
        # targets macOS 15+ and its own binary needs macOS 15 to run.
        os: [ubuntu-latest, macos-15]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    # A hung test must fail the job, not hold the runner for six hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Reference tmux 3.8 build dependencies
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update
            sudo apt-get install -y libevent-dev libncurses-dev bison
          else
            brew install libevent ncurses pkg-config utf8proc jemalloc
          fi
      - name: Reference tmux 3.8 cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/vtmux/tmux-3.8
          # Keyed on the pinned tarball sha256 (xtask/src/ref_tmux.rs) and the runner.
          key: ref-tmux-${{ runner.os }}-${{ runner.arch }}-e79c699c7e949dccd0a4a125e17b8d1261e311b16979dbc8eb34542f3966d82e
      - run: cargo xtask ref-tmux
      - name: Gate (full check.sh)
        run: bash scripts/check.sh
