name: ci
on:
  push:
    # m1 always points at a commit main already has: don't build it twice.
    branches-ignore: [m1]
  pull_request:
  # Weekly perf-smoke only (the check job skips scheduled runs).
  schedule:
    - cron: "17 4 * * 1"
# A newer push to a worker branch supersedes its running check. main gets
# a group per commit: a concurrency group holds one pending run and cancels
# the rest even without cancel-in-progress, and every main commit is checked.
concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true
jobs:
  # Linux: the full gate on every push. This is what the merge waits on.
  check:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    # A hung test must fail the job, not hold the runner for six hours.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Gate (full check.sh)
        run: bash scripts/check.sh

  # macOS: the same gate, but GitHub's macOS runners take ~28 min against
  # Linux's ~18, so it runs only where it pays: main (after the merge, not
  # in its way), pull requests, and the weekly schedule. Worker branches
  # skip it. A red macOS run on main is fixed on main like any other.
  # A run no macOS runner picked up (GitHub capacity) is re-run by
  # ci-retry.yml.
  # macos-15: Zig 0.17 (needed by the ghostty pin in third_party/libghostty-rs)
  # targets macOS 15+ and its own binary needs macOS 15 to run.
  check-macos:
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request' || github.event_name == 'schedule'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Gate (full check.sh)
        run: bash scripts/check.sh

  # Performance regression guard (docs/PERFORMANCE.md, "Regression guard"): never blocks, not
  # part of check.sh. The table goes to the job summary; the result JSON is the artifact to
  # copy to perf/baseline.json when a change is intentional.
  perf-smoke:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the staleness check walks git history
      - uses: ./.github/actions/setup
      - name: Smoke run
        run: python3 scripts/bench.py --smoke
        env:
          OUT: ${{ github.workspace }}/target/bench/smoke.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-smoke
          path: target/bench/smoke.json
