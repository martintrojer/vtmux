name: ci
on: [push, pull_request]
jobs:
  check:
    strategy:
      matrix:
        # macos-15: Zig 0.17 (needed by the ghostty pin in third_party/libghostty-rs)
        # targets macOS 15+ and its own binary needs macOS 15 to run.
        os: [ubuntu-latest, macos-15]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    # A hung test must fail the job, not hold the runner for six hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Reference tmux 3.8 build dependencies
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update
            sudo apt-get install -y libevent-dev libncurses-dev bison
          else
            brew install libevent ncurses pkg-config utf8proc jemalloc
          fi
      - name: Reference tmux 3.8 cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/vtmux/tmux-3.8
          # Keyed on the pinned tarball sha256 (xtask/src/ref_tmux.rs) and the runner.
          key: ref-tmux-${{ runner.os }}-${{ runner.arch }}-e79c699c7e949dccd0a4a125e17b8d1261e311b16979dbc8eb34542f3966d82e
      - run: cargo xtask ref-tmux
      - name: Gate (Linux; full check.sh)
        if: runner.os == 'Linux'
        run: bash scripts/check.sh
      # macOS is supported second (AGENTS.md). It must build, lint and pass the
      # unit tests; the suites that compare with tmux 3.8 (cli, attach, regress,
      # oracle) still have macOS-specific gaps (task macos_attach_parity), so
      # they run but do not fail the job until that lands.
      - name: Gate (macOS; build, lint, unit tests)
        if: runner.os == 'macOS'
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace --lib --bins
      - name: Reference comparison suites (macOS; informational)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          cargo test -p vtmux --test cli --test attach
          cargo xtask regress && cargo xtask oracle replay
