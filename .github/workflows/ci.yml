name: ci
on: [push, pull_request]
jobs:
  check:
    strategy:
      matrix:
        # macos-14, not macos-latest: Zig 0.15.2 (pinned by libghostty-vt 0.2.2)
        # cannot link against the macOS 26 SDK (__availability_version_check).
        os: [ubuntu-latest, macos-14]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: bash scripts/check.sh
