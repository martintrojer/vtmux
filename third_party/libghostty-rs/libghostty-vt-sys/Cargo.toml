# vtmux's fork of libghostty-vt-sys 0.2.2 (VENDOR.md): published under its
# own name, as the upstream crate pins another Ghostty and has none of
# vtmux's patches. The library keeps upstream's name, so `libghostty_vt_sys`
# is what code imports. Its version follows vtmux's (the workspace's
# `version`; `xtask`'s `publish_manifests` test checks they agree).
[package]
name = "vtmux-ghostty-vt-sys"
version = "3.8.0-rc.1"
edition = "2024"
rust-version = "1.90"
build = "build.rs"
links = "ghostty-vt"
description = "Raw FFI bindings to Ghostty's libghostty-vt, built from a pinned libghostty-vt release with vtmux's patches (vtmux's fork of libghostty-vt-sys)"
readme = "README.md"
# Upstream libghostty-rs is MIT OR Apache-2.0, taken here under MIT; Ghostty,
# which the build script downloads, patches and links in, is MIT.
license = "MIT"
repository = "https://github.com/martintrojer/vtmux"
keywords = ["ghostty", "terminal", "vt", "ffi", "vtmux"]
categories = ["external-ffi-bindings"]
include = [
    "/build.rs",
    "/src/**",
    "/tools/**",
    "/patches/*.patch",
    "/README.md",
    "/LICENSE",
    "/LICENSE-ghostty",
]

# docs.rs has no Zig and no network: the build script skips the native build
# when DOCS_RS is set, and the checked-in bindings are enough for rustdoc.
[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[features]
bindgen-tool = [
    "dep:bindgen",
    "dep:libc",
    "dep:heck",
]
default = ["vendored"]
kitty-graphics = []
link-dynamic = []
pkg-config = ["dep:pkg-config"]
vendored = []

[lib]
name = "libghostty_vt_sys"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "gen-bindings"
path = "tools/gen_bindings.rs"
required-features = ["bindgen-tool"]

[dependencies.bindgen]
version = "0.72.1"
optional = true

[dependencies.heck]
version = "0.5"
optional = true

[dependencies.libc]
version = "0.2"
optional = true

[build-dependencies.pkg-config]
version = "0.3"
optional = true
