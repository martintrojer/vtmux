# vtmux's fork of libghostty-vt 0.2.2 (VENDOR.md), published under its own
# name over `vtmux-ghostty-vt-sys`. The library keeps upstream's name, so
# `libghostty_vt` is what code imports. Its version follows vtmux's.
[package]
name = "vtmux-ghostty-vt"
version = "3.8.0-beta.3"
edition = "2024"
rust-version = "1.90"
description = "Safe Rust API over Ghostty's libghostty-vt terminal emulator, with vtmux's additions (vtmux's fork of libghostty-vt)"
readme = "README.md"
# Upstream libghostty-rs is MIT OR Apache-2.0, taken here under MIT.
license = "MIT"
repository = "https://github.com/martintrojer/vtmux"
keywords = ["ghostty", "terminal", "vt", "emulator", "vtmux"]
categories = ["api-bindings", "command-line-interface"]
include = ["/src/**", "/README.md", "/LICENSE"]

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu"]

[features]
allocator_api = ["dep:allocator-api2"]
default = ["kitty-graphics"]
kitty-graphics = ["libghostty-vt-sys/kitty-graphics"]
link-dynamic = ["libghostty-vt-sys/link-dynamic"]
log = ["dep:log"]
png = ["dep:png"]
tracing = ["dep:tracing"]

[lib]
name = "libghostty_vt"
path = "src/lib.rs"

[dependencies.allocator-api2]
version = "0.4.0"
optional = true

[dependencies.bitflags]
version = "2.11.0"

[dependencies.int-enum]
version = "1.2.0"

[dependencies.libghostty-vt-sys]
package = "vtmux-ghostty-vt-sys"
version = "=3.8.0-beta.3"
path = "../libghostty-vt-sys"

[dependencies.log]
version = "0.4.29"
optional = true

[dependencies.png]
version = "0.18.1"
optional = true

[dependencies.tracing]
version = "0.1.44"
optional = true
