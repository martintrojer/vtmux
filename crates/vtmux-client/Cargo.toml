[package]
name = "vtmux-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "vtmux's attached client. Internal to vtmux, no stable API: install `vtmux`."
keywords = ["tmux", "terminal", "multiplexer", "vtmux"]
categories = ["command-line-utilities"]
# What builds the crate: no tests, fixtures, examples or oracle traces.
include = ["/src/**/*.rs", "/LICENSE"]

[dependencies]
vtmux-core.workspace = true
rustix = { version = "1", features = ["std", "termios", "fs", "event", "process"] }
mio = { version = "1", features = ["os-poll", "os-ext"] }
signal-hook = "0.3"
signal-hook-mio = { version = "0.2", features = ["support-v1_0"] }

[lints]
workspace = true
