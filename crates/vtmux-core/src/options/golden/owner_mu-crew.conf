# mu-crew.conf -- tmux wiring for mu, murmur and mule.
#
#   source-file ~/path/to/mu-crew-dotfiles/tmux/mu-crew.conf
#
# Stack wiring only: binds, hooks, and formats you place yourself. No theme,
# and status-right is yours. Add the pill with #{E:@mu_crew_pill}.
#
# Keys (under the prefix). Set before sourcing to move one, or to "none" to
# leave it unbound:
#   @mu_crew_key_pick       a    murmur picker popup
#   @mu_crew_key_sidepanel  C-m  murmur side panel toggle
#   @mu_crew_key_dash       G    toggle the murmur dash
#   @mu_crew_key_workstream u    mu workstream <-> workspace picker
#   @mu_crew_key_session_pick s  tsesh session picker   } forwarded to tsesh's
#   @mu_crew_key_session_last g  tsesh last session     } @tsesh_key_*; tsesh
#   @mu_crew_key_session_root T  tsesh session at cwd   } binds them
#
# Parts. Each is on by default; set its flag to "off" before sourcing to skip
# it. Sourcing again with a part off removes what that part set:
#   @mu_crew_hooks         focus hooks (murmur clear)
#   @mu_crew_keys          a / C-m / G / u
#   @mu_crew_session_keys  forwarding to tsesh's @tsesh_key_*
#   @mu_crew_pane_border   pane-border-format
#   @mu_crew_probes        poller probes; "none" runs no poller
# The formats (pill, glyphs, @mu_crew_host_color) need no flag: they do nothing
# until you place them.

set -gF @mu_crew_dir "#{d:current_file}"

# ---------------------------------------------------------------------------
# Focus hooks: looking at an agent acknowledges its done/blocked state.
# ---------------------------------------------------------------------------
# Without these a badge never clears. Indexed so they add to your own hooks
# instead of replacing them. after-select-pane, not pane-focus-in: tmux has no
# pane-focus-in hook, and set-hook accepts an unknown name silently.
#
# murmur is a Node start, so the hooks run it only when a badge is showing:
# the focused pane, its window or its session is done, blocked, error or
# crashed. Window and session count too because clear also drops orphan badges
# (a state row whose pane is gone) that only those levels show. The cost: a
# badge anywhere in the session, or on a sibling pane in the window, still
# starts murmur on every focus there. Known gap: if murmur wrote a state but
# failed to publish it to tmux, no option shows it and focus does not clear
# it; murmur's next publish repairs that.
%hidden MU_CREW_ATTN="#{||:#{m/r:^(done|blocked|error|crashed)$,#{@murmur_pane_state}},#{||:#{m/r:^(done|blocked|error|crashed)$,#{@murmur_window_state}},#{m/r:^(done|blocked|error|crashed)$,#{@murmur_session_state}}}}"
%hidden MU_CREW_CLEAR="run-shell -b 'command -v murmur >/dev/null 2>&1 && murmur clear --pane #{pane_id}'"
if -F "#{!=:#{@mu_crew_hooks},off}" {
  set-hook -g after-select-pane[42]      "if -F '$MU_CREW_ATTN' \"$MU_CREW_CLEAR\""
  set-hook -g after-select-window[42]    "if -F '$MU_CREW_ATTN' \"$MU_CREW_CLEAR\""
  set-hook -g client-session-changed[42] "if -F '$MU_CREW_ATTN' \"$MU_CREW_CLEAR\""
} {
  set-hook -gu after-select-pane[42]
  set-hook -gu after-select-window[42]
  set-hook -gu client-session-changed[42]
}

# ---------------------------------------------------------------------------
# Keys
# ---------------------------------------------------------------------------
if -F "#{==:#{@mu_crew_key_pick},}" "set -g @mu_crew_key_pick a"
if -F "#{==:#{@mu_crew_key_sidepanel},}" "set -g @mu_crew_key_sidepanel C-m"
if -F "#{==:#{@mu_crew_key_dash},}" "set -g @mu_crew_key_dash G"
if -F "#{==:#{@mu_crew_key_workstream},}" "set -g @mu_crew_key_workstream u"

# tsesh (mu-crew/tmux-session-picker) binds its own keys from @tsesh_key_*.
# Forward ours so one set of options configures the stack; tsesh does the
# binding, so nothing is bound twice. Source this file before TPM runs.
# With @mu_crew_session_keys off, tsesh's own options are left alone.
if -F "#{!=:#{@mu_crew_session_keys},off}" {
  if -F "#{==:#{@mu_crew_key_session_pick},}" "set -g @mu_crew_key_session_pick s"
  if -F "#{==:#{@mu_crew_key_session_last},}" "set -g @mu_crew_key_session_last g"
  if -F "#{==:#{@mu_crew_key_session_root},}" "set -g @mu_crew_key_session_root T"
  set -gF @tsesh_key_pick "#{s/^none$//:@mu_crew_key_session_pick}"
  set -gF @tsesh_key_last "#{s/^none$//:@mu_crew_key_session_last}"
  set -gF @tsesh_key_root "#{s/^none$//:@mu_crew_key_session_root}"
}

# ---------------------------------------------------------------------------
# State glyphs
# ---------------------------------------------------------------------------
# murmur publishes these options (see murmur ARCHITECTURE.md):
#   @murmur_session_state  session   strongest state across its panes
#   @murmur_window_state   window    strongest state across its panes
#   @murmur_pane_state     pane      that pane's own state, idle included
#   @murmur_count_<state>  global    this host's counts, unset at zero
# States are crashed, error, blocked, done, working, waiting, idle. `error`
# is a run whose last turn failed (provider error, retries exhausted).
# `waiting` is a stopped agent with mu delegates still out.
#
# The chains set no background: tmux carries the caller's #[bg=...] into an
# #{E:...} re-expansion, so each format supplies its own.
#
# THEME BEGIN: mu-crew-glyphs
# Defaults need a Nerd Font (https://www.nerdfonts.com); they are the glyphs
# murmur's own dash uses, so an agent looks the same everywhere. No Nerd Font?
# `set -g @mu_crew_ascii 1` before sourcing picks plain ASCII instead. To
# change one glyph or colour, set its option after sourcing.
set -g @mu_crew_c_crashed "#f38ba8"
set -g @mu_crew_c_error "#eba0ac"
set -g @mu_crew_c_blocked "#fab387"
set -g @mu_crew_c_done "#94e2d5"
set -g @mu_crew_c_working "#a6adc8"
set -g @mu_crew_c_waiting "#74c7ec"
set -g @mu_crew_c_idle "#6c7086"
set -g @mu_crew_c_mem "#a6adc8"
set -g @mu_crew_c_cpu "#a6adc8"
set -g @mu_crew_c_uptime "#6c7086"
set -g @mu_crew_g_crashed ""
set -g @mu_crew_g_error ""
set -g @mu_crew_g_blocked ""
set -g @mu_crew_g_done ""
set -g @mu_crew_g_working ""
set -g @mu_crew_g_waiting ""
set -g @mu_crew_g_idle ""
set -g @mu_crew_g_crew ""
set -g @mu_crew_g_agent "󰚩"
if -F "#{==:#{@mu_crew_ascii},1}" {
  set -g @mu_crew_g_crashed "x"
  set -g @mu_crew_g_error "e"
  set -g @mu_crew_g_blocked "!"
  set -g @mu_crew_g_done "+"
  set -g @mu_crew_g_working ">"
  set -g @mu_crew_g_waiting "~"
  set -g @mu_crew_g_idle "-"
  set -g @mu_crew_g_crew "c"
  set -g @mu_crew_g_agent "ai"
}
# THEME END: mu-crew-glyphs

# One glyph for a window: " <glyph>", or nothing. An agent window with no
# news shows the idle glyph (@murmur_window_has_agent).
set -g @mu_crew_window_glyph "#{?#{==:#{@murmur_window_state},crashed}, #[fg=#{@mu_crew_c_crashed}]#[bold]#{@mu_crew_g_crashed}#[nobold],#{?#{==:#{@murmur_window_state},error}, #[fg=#{@mu_crew_c_error}]#[bold]#{@mu_crew_g_error}#[nobold],#{?#{==:#{@murmur_window_state},blocked}, #[fg=#{@mu_crew_c_blocked}]#{@mu_crew_g_blocked},#{?#{==:#{@murmur_window_state},done}, #[fg=#{@mu_crew_c_done}]#{@mu_crew_g_done},#{?#{==:#{@murmur_window_state},working}, #{@mu_crew_g_working},#{?#{==:#{@murmur_window_state},waiting}, #[fg=#{@mu_crew_c_waiting}]#{@mu_crew_g_waiting},#{?#{@murmur_window_has_agent}, #[fg=#{@mu_crew_c_idle}]#{@mu_crew_g_idle},}}}}}}}"

# One glyph for a pane border: " · <glyph>", or nothing.
set -g @mu_crew_pane_glyph "#{?#{==:#{@murmur_pane_state},crashed}, · #[fg=#{@mu_crew_c_crashed}]#[bold]#{@mu_crew_g_crashed}#[nobold],#{?#{==:#{@murmur_pane_state},error}, · #[fg=#{@mu_crew_c_error}]#[bold]#{@mu_crew_g_error}#[nobold],#{?#{==:#{@murmur_pane_state},blocked}, · #[fg=#{@mu_crew_c_blocked}]#{@mu_crew_g_blocked},#{?#{==:#{@murmur_pane_state},done}, · #[fg=#{@mu_crew_c_done}]#{@mu_crew_g_done},#{?#{==:#{@murmur_pane_state},working}, · #{@mu_crew_g_working},#{?#{==:#{@murmur_pane_state},waiting}, · #[fg=#{@mu_crew_c_waiting}]#{@mu_crew_g_waiting},#{?#{==:#{@murmur_pane_state},idle}, · #{@mu_crew_g_idle},}}}}}}}"

# ---------------------------------------------------------------------------
# Pane titles
# ---------------------------------------------------------------------------
# mu sets each agent pane's title to the agent name plus its tasks, and turns
# the top border on; murmur owns the live state. To keep your own
# pane-border-format, set @mu_crew_pane_border off before sourcing and add
# #{E:@mu_crew_pane_glyph} to it yourself. Turning it off after it was on
# resets the format only if it is still ours.
# @mu_crew_border_set marks that the current format is ours; comparing the
# format itself would expand it.
if -F "#{!=:#{@mu_crew_pane_border},off}" {
  set -g pane-border-format " #{pane_title}#{E:@mu_crew_pane_glyph} "
  set -g @mu_crew_border_set 1
} {
  if -F "#{==:#{@mu_crew_border_set},1}" {
    set -gu pane-border-format
    set -gu @mu_crew_border_set
  }
}

# ---------------------------------------------------------------------------
# Agent pill
# ---------------------------------------------------------------------------
# Counts per state: this host's from murmur (@murmur_count_*), plus remote
# peers' from the poller (@mu_crew_remote_*). Pure format: no process runs on
# a status redraw. Use it in your own status line:
#   set -ag status-right '#{E:@mu_crew_pill}'
set -g @mu_crew_n_crashed "#{e|+:#{@murmur_count_crashed},#{@mu_crew_remote_crashed}}"
set -g @mu_crew_n_error "#{e|+:#{@murmur_count_error},#{@mu_crew_remote_error}}"
set -g @mu_crew_n_blocked "#{e|+:#{@murmur_count_blocked},#{@mu_crew_remote_blocked}}"
set -g @mu_crew_n_done "#{e|+:#{@murmur_count_done},#{@mu_crew_remote_done}}"
set -g @mu_crew_n_working "#{e|+:#{@murmur_count_working},#{@mu_crew_remote_working}}"
set -g @mu_crew_n_waiting "#{e|+:#{@murmur_count_waiting},#{@mu_crew_remote_waiting}}"
set -g @mu_crew_n_idle "#{e|+:#{@murmur_count_idle},#{@mu_crew_remote_idle}}"
set -g @mu_crew_n_crew "#{e|+:#{@murmur_count_crew},#{@mu_crew_remote_crew}}"
set -g @mu_crew_n_any "#{e|+:#{e|+:#{e|+:#{e|+:#{E:@mu_crew_n_crashed},#{E:@mu_crew_n_error}},#{E:@mu_crew_n_blocked}},#{e|+:#{E:@mu_crew_n_done},#{E:@mu_crew_n_working}}},#{e|+:#{e|+:#{E:@mu_crew_n_waiting},#{E:@mu_crew_n_idle}},#{E:@mu_crew_n_crew}}}"

# One run per state: "<count><glyph>" in the state's colour, most urgent first.
set -g @mu_crew_pill "#{?#{e|>:#{E:@mu_crew_n_any},0}, #[fg=#{@mu_crew_c_working}]#{@mu_crew_g_agent}\
#{?#{e|>:#{E:@mu_crew_n_crashed},0}, #[fg=#{@mu_crew_c_crashed}]#[bold]#{E:@mu_crew_n_crashed}#{@mu_crew_g_crashed}#[nobold],}\
#{?#{e|>:#{E:@mu_crew_n_error},0}, #[fg=#{@mu_crew_c_error}]#[bold]#{E:@mu_crew_n_error}#{@mu_crew_g_error}#[nobold],}\
#{?#{e|>:#{E:@mu_crew_n_blocked},0}, #[fg=#{@mu_crew_c_blocked}]#{E:@mu_crew_n_blocked}#{@mu_crew_g_blocked},}\
#{?#{e|>:#{E:@mu_crew_n_done},0}, #[fg=#{@mu_crew_c_done}]#{E:@mu_crew_n_done}#{@mu_crew_g_done},}\
#{?#{e|>:#{E:@mu_crew_n_working},0}, #[fg=#{@mu_crew_c_working}]#{E:@mu_crew_n_working}#{@mu_crew_g_working},}\
#{?#{e|>:#{E:@mu_crew_n_waiting},0}, #[fg=#{@mu_crew_c_waiting}]#{E:@mu_crew_n_waiting}#{@mu_crew_g_waiting},}\
#{?#{e|>:#{E:@mu_crew_n_idle},0}, #[fg=#{@mu_crew_c_idle}]#{E:@mu_crew_n_idle}#{@mu_crew_g_idle},}\
#{?#{e|>:#{E:@mu_crew_n_crew},0}, #[fg=#{@mu_crew_c_idle}]#{E:@mu_crew_n_crew}#{@mu_crew_g_crew},} #[default],}"

# ---------------------------------------------------------------------------
# Host color
# ---------------------------------------------------------------------------
# This host's accent, as murmur colors it in the dash, side panel, picker and
# notifications: crc32 of the short hostname over eight Catppuccin accents.
# Computed once here, so a status line can paint the host in it without a
# #(...) on every redraw. Empty without python3.

# ---------------------------------------------------------------------------
# Poller
# ---------------------------------------------------------------------------
# Set @mu_crew_probes before sourcing. The default keeps existing installs on
# remote murmur counts only; "none" runs no poller. The other probes publish
# values for these formats.
if -F "#{==:#{@mu_crew_probes},}" "set -g @mu_crew_probes murmur_remote"
if -F "#{==:#{@mu_crew_mem_min},}" "set -g @mu_crew_mem_min 0"
if -F "#{==:#{@mu_crew_cpu_min},}" "set -g @mu_crew_cpu_min 0"
if -F "#{==:#{@mu_crew_uptime_min},}" "set -g @mu_crew_uptime_min 0"
set -g @mu_crew_mem_pill "#{?#{e|>:#{E:@mu_crew_mem},#{E:@mu_crew_mem_min}}, #[fg=#{@mu_crew_c_mem}]MEM #{@mu_crew_mem_text},}"
set -g @mu_crew_cpu_pill "#{?#{e|>:#{E:@mu_crew_cpu},#{E:@mu_crew_cpu_min}}, #[fg=#{@mu_crew_c_cpu}]CPU #{@mu_crew_cpu_text},}"
set -g @mu_crew_uptime "#{?#{e|>:#{E:@mu_crew_uptime_value},#{E:@mu_crew_uptime_min}}, #[fg=#{@mu_crew_c_uptime}]↑ #{@mu_crew_uptime_text},}"

# One background loop per tmux server writes enabled probe options. A stopped
# murmur_remote probe does not stop memory, CPU, or uptime probes.
