[package]
name = "vtmux-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "vtmux's server: sessions, panes, PTYs, control mode, the compositor, live upgrade. Internal to vtmux, no stable API: install `vtmux`."
keywords = ["tmux", "terminal", "multiplexer", "vtmux"]
categories = ["command-line-utilities"]
# What builds the crate: no tests, fixtures, examples or oracle traces.
include = ["/src/**/*.rs", "/LICENSE"]

[dependencies]
libc = "0.2"
mio = { version = "1", features = ["os-poll", "os-ext", "net"] }
rustix = { version = "1", features = ["std", "process", "termios", "fs", "pty", "system", "net", "event"] }
signal-hook = "0.3"
signal-hook-mio = { version = "0.2", features = ["support-v1_0"] }
unicode-width = "0.2"
vtmux-core.workspace = true
vtmux-vt.workspace = true
vtmux-snapshot.workspace = true

[lints]
workspace = true
