[package]
name = "vtmux-snapshot"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "vtmux's live-upgrade and persistence format. Internal to vtmux, no stable API: install `vtmux`."
keywords = ["tmux", "terminal", "multiplexer", "vtmux"]
categories = ["command-line-utilities"]
# What builds the crate: no tests, fixtures, examples or oracle traces.
include = ["/src/**/*.rs", "/LICENSE"]

[dependencies]
# Pure-Rust LZ4 block format; the safe codec keeps unsafe out of the format.
lz4_flex = { version = "0.11", default-features = false, features = ["std", "safe-encode", "safe-decode"] }
# Content hashes naming history pages (chunks/<hash>, D27 decision 20).
# `pure`: no C or assembly to build; Rust SIMD intrinsics still apply.
blake3 = { version = "1", default-features = false, features = ["std", "pure"] }

[lints]
workspace = true
