<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680" width="800" height="680" role="img" aria-labelledby="t d">
  <title id="t">vtmux at a glance</title>
  <desc id="d">Your terminal talks to a vtmux client over its pty. The client talks to the vtmux server over a Unix socket. The server decodes input, holds the model, and composes frames from panes; each pane is a libghostty-vt terminal connected to a program over a pty.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
    <style>
      text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
      .title { font-size: 16px; font-weight: 600; }
      .sub { font-size: 13px; fill: #57606a; }
      .label { font-size: 12.5px; fill: #57606a; }
      .box { stroke-width: 1.5; }
      .line { stroke: #57606a; stroke-width: 1.5; fill: none; }
    </style>
  </defs>

  <rect x="0" y="0" width="800" height="680" rx="12" fill="#ffffff"/>

  <!-- terminal -->
  <rect class="box" x="250" y="24" width="300" height="60" rx="8" fill="#eef2ff" stroke="#6366f1"/>
  <text class="title" x="400" y="50" text-anchor="middle">Your terminal</text>
  <text class="sub" x="400" y="71" text-anchor="middle">Ghostty, foot, iTerm2, …</text>

  <!-- terminal <-> client -->
  <line class="line" x1="370" y1="134" x2="370" y2="86" marker-end="url(#arrow)"/>
  <line class="line" x1="430" y1="86" x2="430" y2="134" marker-end="url(#arrow)"/>
  <text class="label" x="358" y="114" text-anchor="end">keys, mouse</text>
  <text class="label" x="442" y="114">finished frames</text>

  <!-- client -->
  <rect class="box" x="250" y="136" width="300" height="60" rx="8" fill="#ecfdf5" stroke="#10b981"/>
  <text class="title" x="400" y="162" text-anchor="middle">vtmux client</text>
  <text class="sub" x="400" y="183" text-anchor="middle">forwards input, writes frames</text>

  <!-- client <-> server -->
  <line class="line" x1="400" y1="200" x2="400" y2="244" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text class="label" x="414" y="227">Unix socket</text>

  <!-- server -->
  <rect class="box" x="40" y="248" width="720" height="262" rx="10" fill="#fff7ed" stroke="#f59e0b"/>
  <text class="title" x="62" y="276">vtmux server</text>
  <text class="sub" x="62" y="296">one thread, one event loop</text>

  <rect class="box" x="60" y="312" width="210" height="62" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text class="title" x="165" y="337" text-anchor="middle">Input</text>
  <text class="sub" x="165" y="358" text-anchor="middle">keys, bindings, commands</text>

  <rect class="box" x="295" y="312" width="210" height="62" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text class="title" x="400" y="337" text-anchor="middle">Model</text>
  <text class="sub" x="400" y="358" text-anchor="middle">sessions, windows, panes</text>

  <rect class="box" x="530" y="312" width="210" height="62" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text class="title" x="635" y="337" text-anchor="middle">Compositor</text>
  <text class="sub" x="635" y="358" text-anchor="middle">compose, diff, encode</text>

  <!-- input -> pane, pane -> compositor -->
  <line class="line" x1="165" y1="376" x2="165" y2="424" marker-end="url(#arrow)"/>
  <text class="label" x="177" y="404">keys</text>
  <line class="line" x1="635" y1="424" x2="635" y2="376" marker-end="url(#arrow)"/>
  <text class="label" x="647" y="404">reads grids</text>

  <!-- panes -->
  <rect class="box" x="60" y="426" width="210" height="62" rx="8" fill="#f1f5f9" stroke="#64748b"/>
  <text class="title" x="165" y="451" text-anchor="middle">pane %0</text>
  <text class="sub" x="165" y="472" text-anchor="middle">libghostty-vt terminal</text>

  <rect class="box" x="295" y="426" width="210" height="62" rx="8" fill="#f1f5f9" stroke="#64748b"/>
  <text class="title" x="400" y="451" text-anchor="middle">pane %1</text>
  <text class="sub" x="400" y="472" text-anchor="middle">libghostty-vt terminal</text>

  <rect class="box" x="530" y="426" width="210" height="62" rx="8" fill="#f1f5f9" stroke="#64748b"/>
  <text class="title" x="635" y="451" text-anchor="middle">pane %2</text>
  <text class="sub" x="635" y="472" text-anchor="middle">libghostty-vt terminal</text>

  <!-- ptys -->
  <line class="line" x1="165" y1="490" x2="165" y2="566" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line class="line" x1="400" y1="490" x2="400" y2="566" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line class="line" x1="635" y1="490" x2="635" y2="566" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text class="label" x="177" y="542">pty</text>
  <text class="label" x="412" y="542">pty</text>
  <text class="label" x="647" y="542">pty</text>

  <!-- programs -->
  <rect class="box" x="60" y="568" width="210" height="48" rx="8" fill="#f8fafc" stroke="#d0d7de"/>
  <text class="title" x="165" y="598" text-anchor="middle">shell</text>
  <rect class="box" x="295" y="568" width="210" height="48" rx="8" fill="#f8fafc" stroke="#d0d7de"/>
  <text class="title" x="400" y="598" text-anchor="middle">nvim</text>
  <rect class="box" x="530" y="568" width="210" height="48" rx="8" fill="#f8fafc" stroke="#d0d7de"/>
  <text class="title" x="635" y="598" text-anchor="middle">shell</text>

  <text class="label" x="400" y="650" text-anchor="middle">Programs see TERM=tmux-256color and TMUX, and a tmux on PATH that reaches this server.</text>
</svg>
